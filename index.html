<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C1014">
<title>로직 프로 트레이너</title>
<style>
:root{
  --ink:#0C1014; --panel:#161C23; --panel2:#11161C; --line:#2A343F; --line2:#3A4653;
  --acc:#E8A33D; --acc2:#5AC8D8; --txt:#EDF1F5; --mut:#93A1B0; --dim:#68788A;
  --ok:#67C98A; --no:#E8646F;
  --lcd:#FFCF6B; --lcd-bg:#1A1206;
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--ink);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:17px;line-height:1.62;letter-spacing:-.011em;overscroll-behavior-y:none;}
body.fs1{font-size:18.5px;} body.fs2{font-size:20px;}
b,strong{font-weight:700;color:#fff;}
k{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:600;color:var(--txt);
  background:#212C38;border:1px solid var(--line2);border-bottom-width:2px;padding:.05em .45em;
  border-radius:6px;font-size:.86em;white-space:nowrap;letter-spacing:0;display:inline-block;}
v{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:600;color:var(--lcd);
  background:var(--lcd-bg);border:1px solid #4A340F;padding:.05em .4em;border-radius:6px;
  font-size:.86em;white-space:nowrap;letter-spacing:0;display:inline-block;}

#app{min-height:100%;display:flex;flex-direction:column;padding-bottom:calc(76px + var(--sb));}

/* ── 헤더: 트랜스포트 LCD ── */
header{position:sticky;top:0;z-index:30;background:#0C1014f2;backdrop-filter:blur(10px);
  border-bottom:1px solid #1C242E;padding-top:calc(var(--st) + 10px);}
.lcd{margin:0 14px 10px;background:var(--lcd-bg);border:1px solid #4A340F;border-radius:11px;
  display:flex;align-items:stretch;overflow:hidden;box-shadow:inset 0 1px 0 #ffffff10;}
.lcd .cell{flex:1;padding:8px 4px 9px;text-align:center;border-right:1px solid #3A2A0C;}
.lcd .cell:last-child{border-right:none;}
.lcd .n{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:21px;font-weight:700;
  color:var(--lcd);line-height:1.15;letter-spacing:.01em;}
.lcd .l{font-size:10px;color:#A8813C;letter-spacing:.09em;margin-top:2px;}
.bar{height:4px;background:#1B242E;margin:0 14px 10px;border-radius:4px;overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));
  border-radius:4px;transition:width .45s cubic-bezier(.4,0,.2,1);}

/* ── 본문 ── */
main{padding:16px 15px 26px;flex:1;width:100%;max-width:680px;margin:0 auto;}
.pane{display:none;} .pane.on{display:block;}

.h1{font-size:13px;letter-spacing:.11em;color:var(--acc);font-weight:700;margin-bottom:5px;}
.h2{font-size:1.42em;font-weight:800;line-height:1.34;letter-spacing:-.022em;margin-bottom:14px;}
.goal{background:linear-gradient(#1B222B,#161C23);border:1px solid var(--line);border-left:3px solid var(--acc);
  border-radius:0 12px 12px 0;padding:14px 15px;margin-bottom:18px;color:#DEE6EE;line-height:1.72;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;margin-bottom:15px;}
.ct{font-size:12px;letter-spacing:.1em;color:var(--acc2);font-weight:700;margin-bottom:11px;
  display:flex;align-items:center;gap:7px;}
.ct::before{content:"";width:14px;height:2px;background:var(--acc2);border-radius:2px;}
.card p{margin-bottom:15px;color:#D6DEE7;line-height:1.78;} .card p:last-child{margin-bottom:0;}
.card p+p{padding-top:1px;}

.step{border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:10px;background:var(--panel2);}
.step:last-child{margin-bottom:0;}
.step .sn{font-weight:700;color:#fff;margin-bottom:7px;font-size:15px;}
.step ol{list-style:none;counter-reset:s;}
.step li{counter-increment:s;position:relative;padding-left:27px;margin-bottom:9px;color:#CDD7E1;font-size:.93em;line-height:1.66;}
.step li:last-child{margin-bottom:0;}
.step li::before{content:counter(s);position:absolute;left:0;top:.15em;width:18px;height:18px;
  background:#232F3C;border-radius:5px;color:var(--acc);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;}

ul.dot{list-style:none;} ul.dot li{position:relative;padding-left:18px;margin-bottom:11px;color:#D6DEE7;line-height:1.72;}
ul.dot li:last-child{margin-bottom:0;}
ul.dot li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;
  background:var(--acc);border-radius:50%;}

.krow{display:flex;flex-wrap:wrap;gap:8px;}
.kitem{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:6px 10px 6px 7px;font-size:14.5px;color:#C3CDD8;}

/* 체크 */
.chk{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid #1F2831;cursor:pointer;}
.chk:last-child{border-bottom:none;}
.box{flex:0 0 auto;width:25px;height:25px;border-radius:8px;border:2px solid var(--line2);
  background:var(--panel2);position:relative;transition:.16s;margin-top:1px;}
.chk.on .box{background:var(--ok);border-color:var(--ok);}
.chk.on .box::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;
  border:solid #0C1014;border-width:0 2.6px 2.6px 0;transform:rotate(43deg);}
.chk span{flex:1;color:#D4DCE5;} .chk.on span{color:var(--dim);text-decoration:line-through;}

/* 퀴즈 */
.q{margin-bottom:16px;} .q:last-child{margin-bottom:0;}
.qq{font-weight:700;color:#fff;margin-bottom:10px;}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:11px 13px;margin-bottom:8px;color:#D4DCE5;font:inherit;font-size:16px;transition:.14s;}
.opt:active{filter:brightness(1.3);}
.opt.right{border-color:var(--ok);background:#12241A;color:#B7E9C9;}
.opt.wrong{border-color:var(--no);background:#241214;color:#F0B6BB;}
.exp{display:none;margin-top:4px;padding:11px 13px;background:#131A22;border:1px solid var(--line);
  border-left:3px solid var(--acc2);border-radius:0 10px 10px 0;font-size:15.5px;color:#BDC8D3;}
.exp.on{display:block;}

/* 이동 */
.nav{display:flex;gap:10px;margin-top:18px;}
.nav button{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  padding:14px 10px;color:var(--txt);font:inherit;font-weight:700;font-size:16px;}
.nav button:active{filter:brightness(1.35);}
.nav button.pri{background:linear-gradient(#E8A33D,#D08D28);border-color:#F0B65E;color:#1A1206;}
.nav button:disabled{opacity:.32;}

/* 과정 목록 */
.sg{margin-bottom:20px;}
.sgh{display:flex;align-items:baseline;gap:9px;margin-bottom:9px;padding-left:2px;}
.sgn{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:var(--acc);
  background:var(--lcd-bg);border:1px solid #4A340F;border-radius:5px;padding:1px 6px;}
.sgt{font-weight:800;font-size:18px;letter-spacing:-.01em;}
.sgs{font-size:13px;color:var(--dim);}
.di{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:11px 13px;margin-bottom:7px;cursor:pointer;}
.di:active{filter:brightness(1.3);}
.di.done{border-color:#2A4A38;background:#131E19;}
.dn{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,monospace;
  font-size:13px;font-weight:700;color:var(--mut);}
.di.done .dn{background:var(--ok);border-color:var(--ok);color:#0C1014;}
.di.cur .dn{background:var(--acc);border-color:var(--acc);color:#1A1206;}
.dt{flex:1;font-size:15.5px;color:#D4DCE5;line-height:1.4;}
.di.done .dt{color:var(--dim);}

/* 진도 — 채널 스트립 랙 */
.rack{display:flex;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;
  padding:16px 11px 12px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;}
.rack::-webkit-scrollbar{display:none;}
.strip{flex:0 0 30px;display:flex;flex-direction:column;align-items:center;gap:7px;}
.pct{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;color:var(--mut);}
.strip.full .pct{color:var(--ok);}
.slot{width:100%;max-width:26px;height:132px;background:#0A0E12;border:1px solid var(--line);
  border-radius:7px;position:relative;overflow:hidden;}
.slot::before{content:"";position:absolute;left:50%;top:8px;bottom:8px;width:3px;margin-left:-1.5px;
  background:#1C242E;border-radius:3px;}
.fill{position:absolute;left:0;right:0;bottom:0;height:0;
  background:linear-gradient(#E8A33D33,#E8A33D11);transition:height .5s cubic-bezier(.4,0,.2,1);}
.cap{position:absolute;left:2px;right:2px;height:13px;bottom:0;background:linear-gradient(#3E4C5A,#232F3C);
  border:1px solid #4E5E6E;border-radius:3px;transition:bottom .5s cubic-bezier(.4,0,.2,1);
  box-shadow:0 1px 3px #00000060;}
.cap::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:2px;background:var(--acc);border-radius:2px;}
.strip.full .cap::after{background:var(--ok);}
.strip.full .fill{background:linear-gradient(#67C98A33,#67C98A11);}
.sl{font-size:10px;color:var(--dim);text-align:center;line-height:1.25;height:24px;overflow:hidden;}
.sno{font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;color:var(--mut);}

.stat{display:flex;gap:10px;margin-bottom:16px;}
.stat div{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center;}
.stat .n{font-family:ui-monospace,Menlo,monospace;font-size:25px;font-weight:800;color:var(--acc);line-height:1.1;}
.stat .l{font-size:11px;color:var(--dim);letter-spacing:.05em;margin-top:3px;}

/* 단축키 · 사전 */
.srch{width:100%;background:var(--panel2);border:1px solid var(--line2);border-radius:11px;
  padding:12px 14px;color:var(--txt);font:inherit;font-size:16px;margin-bottom:14px;}
.srch:focus{outline:none;border-color:var(--acc);}
.grow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid #1B232C;}
.grow:last-child{border-bottom:none;}
.grow k{flex:0 0 auto;min-width:78px;text-align:center;}
.grow span{flex:1;color:#C3CDD8;font-size:15.5px;}
.gl{font-weight:700;color:#fff;margin-bottom:3px;}
.gd{color:#B4C0CB;font-size:15.5px;}
.gitem{padding:11px 0;border-bottom:1px solid #1B232C;}
.gitem:last-child{border-bottom:none;}
.empty{text-align:center;color:var(--dim);padding:34px 0;font-size:15px;}

t{color:#fff;border-bottom:1px dashed #5AC8D899;cursor:pointer;}
t:active{background:#5AC8D826;}
.tmi{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #1B232C;align-items:baseline;}
.tmi:last-child{border-bottom:none;}
.tmw{flex:0 0 auto;color:var(--acc2);font-weight:700;font-size:.94em;}
.tmd{flex:1;color:#C6D1DC;font-size:.92em;line-height:1.65;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--panel);
  border-top:1px solid var(--line2);border-radius:18px 18px 0 0;padding:20px 20px calc(24px + var(--sb));
  transform:translateY(105%);transition:transform .26s cubic-bezier(.3,0,.2,1);box-shadow:0 -8px 30px #00000070;}
.sheet.on{transform:translateY(0);}
.sheet .sw{font-size:1.16em;font-weight:800;color:#fff;margin-bottom:8px;}
.sheet .sd{color:#CBD5DF;line-height:1.75;}
.sheet .sx{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;
  background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-size:17px;line-height:1;}
.scrim{position:fixed;inset:0;z-index:55;background:#00000080;opacity:0;pointer-events:none;transition:opacity .2s;}
.scrim.on{opacity:1;pointer-events:auto;}
.fsb{flex:0 0 auto;width:38px;height:26px;border-radius:8px;background:var(--panel);
  border:1px solid var(--line2);color:var(--mut);font:inherit;font-size:13px;font-weight:700;}
.fsb:active{filter:brightness(1.4);}
.hrow{display:flex;align-items:center;gap:10px;margin:0 14px 10px;}
.hrow .bar{flex:1;margin:0;}
.nv{background:var(--lcd-bg);border:1px solid #4A340F;border-radius:8px;padding:2px 9px;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-weight:700;color:var(--lcd);font-size:15px;
  display:inline-block;}
.nw{color:#fff;font-weight:700;font-size:15px;margin-left:8px;}
.nitem{padding:13px 0;border-bottom:1px solid #1B232C;}
.nitem:last-child{border-bottom:none;}
.nf{color:#CBD5DF;margin-top:7px;font-size:15.5px;}
.nm{color:var(--mut);margin-top:5px;font-size:14.5px;padding-left:12px;border-left:2px solid #33404D;}
.nm b{color:#C9D3DD;font-weight:600;}
.tagr{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.tag{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:7px 13px;
  color:var(--mut);font:inherit;font-size:14px;}
.tag.on{background:var(--acc);border-color:var(--acc);color:#1A1206;font-weight:700;}
.mini{font-size:13.5px;color:var(--dim);margin-top:14px;text-align:center;line-height:1.6;}
.rst{margin-top:6px;background:none;border:1px solid var(--line2);border-radius:10px;padding:10px 18px;
  color:var(--no);font:inherit;font-size:14px;}
.rst:active{background:#241214;}

/* 탭바 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0C1014f5;backdrop-filter:blur(12px);
  border-top:1px solid #1C242E;display:flex;padding-bottom:var(--sb);}
nav button{flex:1;background:none;border:none;padding:9px 2px 8px;color:var(--dim);font:inherit;
  font-size:11px;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:3px;}
nav button .ic{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;}
nav button.on{color:var(--acc);}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px;}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="lcd">
    <div class="cell"><div class="n" id="lDay">01</div><div class="l">일차</div></div>
    <div class="cell"><div class="n" id="lPct">0%</div><div class="l">진도</div></div>
    <div class="cell"><div class="n" id="lStk">0</div><div class="l">연속</div></div>
    <div class="cell"><div class="n" id="lStg">1/12</div><div class="l">스테이지</div></div>
  </div>
  <div class="hrow"><div class="bar"><i id="bar"></i></div><button class="fsb" id="fsb">가</button></div>
</header>

<main>
  <section class="pane on" id="p-today"></section>
  <section class="pane" id="p-course"></section>
  <section class="pane" id="p-keys"></section>
  <section class="pane" id="p-gloss"></section>
  <section class="pane" id="p-num"></section>
  <section class="pane" id="p-prog"></section>
</main>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><button class="sx" id="sx">✕</button>
  <div class="sw" id="sw"></div><div class="sd" id="sd"></div></div>

<nav id="tabs">
  <button data-p="today" class="on"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3v18M5 8v8M19 8v8"/></svg>오늘</button>
  <button data-p="course"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>과정</button>
  <button data-p="keys"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg>단축키</button>
  <button data-p="num"><svg class="ic" viewBox="0 0 24 24"><path d="M4 15c3-9 5-9 8 0s5 9 8 0"/></svg>수치</button>
  <button data-p="gloss"><svg class="ic" viewBox="0 0 24 24"><path d="M4 5a2 2 0 012-2h13v18H6a2 2 0 01-2-2z"/><path d="M9 8h7"/></svg>사전</button>
  <button data-p="prog"><svg class="ic" viewBox="0 0 24 24"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>진도</button>
</nav>

<script>
const STAGES=[{"n":1,"t":"말부터 익힌다","sub":"용어를 모르면 아무것도 시작할 수 없다","d":[1,6]},{"n":2,"t":"시작","sub":"화면을 읽고 프로젝트를 연다","d":[7,11]},{"n":3,"t":"리전 편집","sub":"소리 덩어리를 자유롭게 다룬다","d":[12,16]},{"n":4,"t":"미디와 가상악기","sub":"음을 넣고 표정을 만든다","d":[17,24]},{"n":5,"t":"악기별 실전","sub":"악기마다 다른 문법을 익힌다","d":[25,31]},{"n":6,"t":"샘플 라이브러리","sub":"바깥 악기를 불러 쓴다","d":[32,36]},{"n":7,"t":"편곡","sub":"한 곡의 모양을 설계한다","d":[37,41]},{"n":8,"t":"오디오","sub":"실연주와 목소리를 담는다","d":[42,45]},{"n":9,"t":"믹싱","sub":"들리는 균형을 만든다","d":[46,51]},{"n":10,"t":"믹싱 심화","sub":"들리지 않던 문제를 잡는다","d":[52,54]},{"n":11,"t":"마스터링과 발매","sub":"세상에 내보낸다","d":[55,59]},{"n":12,"t":"작업 흐름","sub":"컴퓨터와 싸우지 않는다","d":[60,63]}];
const DAYS=[{"d":1,"s":1,"t":"소리를 숫자로 말하는 법","goal":"높낮이, 크기, 시간을 각각 어떤 단위로 부르는지 안다.","con":["음악을 만드는 프로그램은 소리를 세 가지 숫자로 다룬다. 높낮이, 크기, 시간이다. 이 셋의 단위를 모르면 앞으로 나오는 모든 설명이 외국어처럼 들린다. 오늘은 이 셋만 익힌다.","높낮이는 주파수로 말하고 단위는 헤르츠다. 1초에 공기가 몇 번 떨리는지를 센 숫자다. 많이 떨리면 높은 소리, 적게 떨리면 낮은 소리다. 사람이 듣는 범위는 대략 <v>20</v>헤르츠에서 <v>20000</v>헤르츠 사이다. 1000헤르츠부터는 킬로헤르츠로 줄여 쓴다. <v>2000</v>헤르츠와 <v>2</v>킬로헤르츠는 같은 말이다.","감이 잡히는 기준점 몇 개. 킥 드럼의 무게는 <v>60</v>헤르츠 부근, 사람 목소리의 중심은 <v>200</v>헤르츠에서 <v>4000</v>헤르츠 사이, 하이햇의 반짝임은 <v>8000</v>헤르츠 위에 있다. 낮은 쪽을 저역, 가운데를 중역, 높은 쪽을 고역이라고 부른다.","크기는 데시벨로 말한다. 데시벨은 절대적인 크기가 아니라 비교값이다. 그래서 항상 무엇을 기준으로 하는지가 붙는다. 컴퓨터 안에서는 최대치를 <v>0</v>으로 놓고 그 아래를 음수로 센다. 이 단위를 dBFS라고 부른다. <v>-6</v>dBFS는 최대치보다 조금 작은 상태, <v>-40</v>dBFS는 아주 작은 상태다.","데시벨은 3씩 더해도 두 배가 아니다. 대략 <v>6</v>데시벨이 늘면 진폭이 두 배, <v>10</v>데시벨이 늘면 사람 귀에 두 배쯤 크게 느껴진다. <v>1</v>데시벨 차이는 거의 못 느끼고 <v>3</v>데시벨 차이는 확실히 들린다.","시간은 밀리초로 말한다. 1밀리초는 1000분의 1초다. 사람은 <v>10</v>밀리초쯤부터 지연을 느끼기 시작한다. 앞으로 나올 시간 관련 값은 거의 전부 이 단위로 적혀 있다."],"path":[{"n":"실제로 확인해 보기","s":["아무 곡이나 열고 <k>X</k>를 눌러 믹서를 연다","각 채널의 세로 막대(미터)가 위아래로 움직이는 것을 본다. 이 눈금이 dBFS다","페이더를 내리면 숫자가 음수로 커진다. 0.0이 기준점이다"]},{"n":"주파수 눈으로 보기","s":["채널의 이펙트 자리에 <b>EQ → Channel EQ</b>를 건다","창 안의 <b>분석기</b> 버튼을 켠다","재생하면 가로축이 주파수, 세로축이 크기로 움직인다","가로축 왼쪽 끝이 20헤르츠, 오른쪽 끝이 20킬로헤르츠다"]}],"drill":["악기 소리 하나를 틀어놓고 분석기에서 어느 쪽이 움직이는지 본다. 킥, 보컬, 하이햇을 각각 확인한다.","페이더를 3데시벨, 6데시벨, 10데시벨씩 내려보며 귀로 느껴지는 차이를 비교한다.","20헤르츠에서 20킬로헤르츠까지 훑는 소리를 찾아 들어보고 어디부터 안 들리는지 확인한다."],"keys":[["X","믹서 열기"],["스페이스","재생과 정지"]],"chk":["헤르츠, 데시벨, 밀리초가 각각 무엇을 재는지 말할 수 있다","0dBFS가 최대치라는 것을 안다","저역, 중역, 고역의 대략적인 위치를 안다"],"quiz":[{"q":"소리의 높낮이를 재는 단위는?","a":["데시벨","헤르츠","밀리초","비트"],"c":1,"e":"헤르츠는 1초에 몇 번 떨리는지를 센 숫자다. 많이 떨릴수록 높은 소리다."},{"q":"컴퓨터 안에서 소리의 최대치는 몇 dBFS인가?","a":["0","100","-6","1"],"c":0,"e":"0을 꼭대기로 놓고 그 아래를 음수로 센다. 그래서 실제 값은 항상 음수다."},{"q":"2킬로헤르츠는 몇 헤르츠인가?","a":["20","200","2000","20000"],"c":2,"e":"킬로는 1000배다. 2킬로헤르츠는 2000헤르츠다."}]},{"d":2,"s":1,"t":"오디오와 미디","goal":"두 종류의 데이터가 어떻게 다른지 설명할 수 있다.","con":["음악 프로그램에서 다루는 데이터는 두 종류뿐이다. 오디오와 미디다. 이 둘의 차이를 모르면 왜 어떤 것은 고칠 수 있고 어떤 것은 못 고치는지 이해할 수 없다.","오디오는 소리 그 자체를 담은 것이다. 마이크로 녹음한 목소리, 기타 앰프 소리, 내려받은 음원 파일이 전부 오디오다. 사진에 비유하면 찍힌 사진이다. 이미 소리가 되어 있어서 음 하나만 골라 바꾸는 일이 어렵다.","미디는 소리가 아니라 지시서다. 몇 번 건반을, 언제, 얼마나 세게, 얼마나 길게 눌렀는지를 적은 기록이다. 악보에 가깝다. 소리는 없고 명령만 있다. 그래서 미디만으로는 아무 소리도 안 난다.","미디가 소리가 되려면 악기가 필요하다. 프로그램 안에 들어 있는 악기를 가상악기라고 부른다. 같은 미디를 피아노 악기에 보내면 피아노 소리, 바이올린 악기에 보내면 바이올린 소리가 난다. 지시서는 그대로고 연주자만 바뀌는 셈이다.","이 차이 때문에 작업 방식이 갈린다. 미디는 틀린 음 하나를 클릭해서 옮기면 끝난다. 오디오는 그렇게 못 한다. 대신 오디오는 사람이 실제로 연주한 미묘함이 그대로 담긴다.","판단 기준은 단순하다. 목소리와 실제 악기 연주는 오디오로, 건반으로 찍어 만드는 것은 미디로 한다."],"path":[{"n":"둘을 눈으로 구별하기","s":["트랙에 놓인 덩어리를 본다. 이 덩어리를 리전이라고 부른다","울퉁불퉁한 파도 모양이 그려져 있으면 오디오 리전이다","가로 막대들이 흩어져 있으면 미디 리전이다","색도 다르다. 로직에서 오디오는 파란 계열, 미디는 초록 계열이 기본이다"]},{"n":"미디를 다른 악기로 바꿔 보기","s":["미디 리전이 있는 트랙을 클릭해서 선택한다","<k>Y</k>를 눌러 라이브러리를 연다","다른 악기를 클릭한다","같은 자리를 다시 재생한다. 음은 같고 소리만 바뀐다"]}],"drill":["미디 트랙 하나를 만들고 아무 음이나 찍은 뒤 악기를 다섯 번 바꿔가며 들어본다.","오디오 파일 하나를 트랙에 끌어다 놓고 파형 모양을 확대해서 본다.","같은 프로젝트에 오디오 리전과 미디 리전을 나란히 놓고 생김새를 비교한다."],"keys":[["Y","라이브러리"],["스페이스","재생과 정지"]],"chk":["오디오와 미디의 차이를 한 문장으로 말할 수 있다","화면에서 둘을 구별할 수 있다","가상악기가 무엇인지 안다"],"quiz":[{"q":"미디에 담겨 있는 것은?","a":["소리 파형","건반을 누른 기록","악기 샘플","오디오 파일"],"c":1,"e":"미디는 지시서다. 어떤 건반을 언제 얼마나 세게 눌렀는지만 적혀 있다."},{"q":"미디 리전의 악기를 바꾸면?","a":["음이 바뀐다","박자가 바뀐다","소리만 바뀐다","아무 변화 없다"],"c":2,"e":"지시서는 그대로고 연주하는 악기만 바뀌기 때문이다."}]},{"d":3,"s":1,"t":"소리가 흐르는 길","goal":"소리가 어디서 나와 어디를 거쳐 스피커까지 가는지 그릴 수 있다.","con":["음악 프로그램은 결국 신호를 흘려보내는 장치다. 이 길을 머릿속에 그려두면 문제가 생겼을 때 어디를 봐야 할지 바로 알 수 있다. 소리가 안 나는 사고의 대부분은 이 길 어딘가가 끊긴 것이다.","기본 길은 이렇다. 소리가 나는 곳에서 출발해, 트랙으로 들어가고, 채널 스트립을 거쳐, 마스터로 모이고, 스피커로 나간다. 다섯 칸이다.","소리가 나는 곳은 두 가지다. 미디 트랙이면 가상악기가 소리를 만들고, 오디오 트랙이면 마이크나 오디오 파일이 소리를 준다.","채널 스트립은 그 트랙의 처리 장치가 세로로 늘어선 것이다. 위에서부터 악기, 이펙트, 센드, 팬, 페이더 순서로 지난다. 위에 놓은 것이 먼저 처리된다는 점이 중요하다. 순서를 바꾸면 결과가 달라진다.","이펙트를 거는 방법이 두 가지다. 인서트는 신호가 그 장치를 통과해서 지나가는 것이다. 원래 소리가 바뀐다. EQ와 컴프레서가 여기 들어간다. 센드는 신호를 복사해서 옆길로 보내는 것이다. 원래 소리는 그대로 가고 복사본만 처리된다. 리버브가 여기 들어간다.","센드로 보낸 신호가 도착하는 곳이 버스다. 버스는 여러 트랙이 함께 쓰는 옆길이다. 열 개 트랙이 같은 버스로 리버브를 보내면 열 개가 같은 공간에 있는 것처럼 들린다.","마지막에 모든 신호가 모이는 곳이 마스터다. 로직에서는 스테레오 아웃이라고 적혀 있다. 여기서 스피커나 헤드폰으로 나간다.","소리가 안 날 때 점검 순서. 트랙이 뮤트되어 있지 않은가, 다른 트랙이 솔로로 잡혀 있지 않은가, 페이더가 내려가 있지 않은가, 출력이 마스터로 되어 있는가, 컴퓨터의 출력 장치가 맞게 잡혀 있는가."],"path":[{"n":"채널 스트립 열어 보기","s":["트랙 하나를 클릭한다","<k>I</k>를 눌러 인스펙터를 연다","왼쪽에 세로로 긴 칸이 나타난다. 이것이 채널 스트립이다","위에서부터 악기, 오디오 이펙트, 센드, 팬, 페이더, 출력 순서로 되어 있다"]},{"n":"믹서에서 전체 보기","s":["<k>X</k>를 눌러 믹서를 연다","모든 트랙의 채널 스트립이 나란히 보인다","맨 오른쪽 <b>Stereo Out</b>이 마스터다","각 채널 아래쪽 <b>출력</b> 칸이 Stereo Out으로 되어 있는지 확인한다"]}],"drill":["믹서를 열고 트랙 하나의 신호가 어디로 가는지 위에서 아래로 손가락으로 짚어본다.","트랙 하나를 뮤트했다 풀고, 솔로했다 풀며 다른 트랙이 어떻게 되는지 관찰한다.","일부러 트랙의 출력을 다른 곳으로 바꿔 소리가 사라지는 것을 확인하고 되돌린다."],"keys":[["I","인스펙터"],["X","믹서"],["M","뮤트"],["S","솔로"]],"chk":["신호가 지나는 다섯 칸을 순서대로 말할 수 있다","인서트와 센드의 차이를 안다","소리가 안 날 때 점검 순서를 안다"],"quiz":[{"q":"원래 소리는 그대로 두고 복사본만 처리하는 방식은?","a":["인서트","센드","페이더","팬"],"c":1,"e":"센드는 신호를 복사해 옆길로 보낸다. 리버브를 이런 식으로 건다."},{"q":"모든 트랙의 소리가 마지막에 모이는 곳은?","a":["버스","인서트","마스터","라이브러리"],"c":2,"e":"로직에서는 스테레오 아웃이라고 표시된다."}]},{"d":4,"s":1,"t":"화면에서 쓰는 말","goal":"화면에 보이는 것들의 이름을 정확히 부른다.","con":["이름을 모르면 검색도 못 하고 질문도 못 한다. 오늘 나오는 열 개는 앞으로 매일 쓰는 말이다.","트랙은 가로줄 하나다. 악기 하나가 한 줄을 쓴다. 왼쪽의 이름과 버튼이 모인 부분을 트랙 헤더라고 부른다.","리전은 트랙 위에 놓인 소리 덩어리다. 이것을 옮기고 자르고 늘이는 것이 편집이다.","재생 헤드는 지금 어디를 읽고 있는지 알려주는 세로줄이다. 위쪽의 눈금 막대를 눈금자라고 부르고, 여기를 클릭하면 재생 헤드가 그 자리로 간다.","페이더는 소리 크기를 조절하는 세로 막대다. 팬은 소리를 왼쪽이나 오른쪽으로 보내는 노브다. 가운데면 양쪽에서 같이 나고, 왼쪽으로 돌리면 왼쪽 스피커에서 크게 난다.","뮤트는 그 트랙을 잠시 꺼두는 것이다. 솔로는 반대로 그 트랙만 남기고 나머지를 다 끄는 것이다. 특정 악기를 자세히 들을 때 솔로를 쓴다.","인스펙터는 지금 고른 것의 속성을 보여주는 왼쪽 패널이다. 리전을 고르면 리전 정보가, 트랙을 고르면 채널 스트립이 나온다. 고른 것이 바뀌면 내용이 통째로 바뀐다.","라이브러리는 그 트랙에 얹을 소리를 고르는 목록이다. 믹서는 모든 트랙의 채널 스트립을 한 화면에 모아 보는 창이다.","플러그인은 소리를 처리하는 작은 프로그램이다. 로직 안에 이미 많이 들어 있고 따로 사서 넣을 수도 있다. 악기 플러그인은 소리를 만들고, 이펙트 플러그인은 있는 소리를 바꾼다."],"path":[{"n":"하나씩 눌러 확인하기","s":["트랙 헤더의 <b>M</b>과 <b>S</b> 버튼을 눌러본다. 뮤트와 솔로다","<k>X</k>로 믹서를 열고 페이더와 팬 노브를 움직여 본다","<k>I</k>로 인스펙터를 열고 리전과 트랙을 번갈아 클릭하며 내용이 바뀌는 것을 본다","<k>Y</k>로 라이브러리를 열어 목록을 훑어본다"]}],"drill":["화면을 보지 않고 열 개 용어를 소리 내어 말하고, 각각이 무엇인지 한 문장으로 설명한다.","트랙 세 개를 만들고 하나씩 솔로로 들어본다.","팬을 왼쪽 끝, 가운데, 오른쪽 끝으로 옮겨가며 헤드폰으로 위치 변화를 듣는다."],"keys":[["I","인스펙터"],["Y","라이브러리"],["X","믹서"],["M","뮤트"],["S","솔로"]],"chk":["트랙, 리전, 재생 헤드를 구별한다","뮤트와 솔로의 차이를 안다","플러그인이 두 종류라는 것을 안다"],"quiz":[{"q":"고른 트랙 하나만 남기고 나머지를 끄는 기능은?","a":["뮤트","솔로","팬","페이더"],"c":1,"e":"솔로는 그것만 듣게 해준다. 뮤트는 반대로 그것만 끈다."},{"q":"트랙 위에 놓인 소리 덩어리를 무엇이라 부르나?","a":["리전","버스","패치","존"],"c":0,"e":"리전을 옮기고 자르고 늘이는 것이 편집 작업의 대부분이다."}]},{"d":5,"s":1,"t":"시간을 세는 말","goal":"마디와 박으로 위치를 말하고 격자를 이해한다.","con":["음악 프로그램은 시간을 두 가지 방식으로 센다. 하나는 시계 시간이고 다른 하나는 음악 시간이다. 작업은 거의 전부 음악 시간으로 한다.","박은 발로 까딱거리는 한 단위다. 이 박이 몇 개 모여 한 덩어리가 되는데 그 덩어리가 마디다. 4분의 4박자라면 한 마디에 박이 네 개 들어간다.","박자는 두 숫자로 쓴다. 아래 숫자는 어떤 음표를 한 박으로 셀지, 위 숫자는 그것이 한 마디에 몇 개 들어가는지를 뜻한다. 4분의 4박자는 4분음표를 한 박으로 세고 한 마디에 네 개다. 8분의 6박자는 8분음표를 한 박으로 세고 한 마디에 여섯 개다.","템포는 1분에 박이 몇 개 지나가는지다. 단위는 BPM이다. <v>120</v>BPM이면 1분에 120박, 즉 1초에 두 박이다. 숫자가 크면 빠르다.","화면 위쪽 눈금자의 숫자가 마디 번호다. 1마디부터 시작한다. 위치를 말할 때는 흔히 마디와 박을 함께 쓴다. 5마디 3박이라고 하면 다섯 번째 마디의 세 번째 박이다.","격자는 화면에 보이지 않는 눈금이다. 리전이나 음을 옮길 때 이 눈금에 달라붙는다. 이것을 스냅이라고 한다. 격자를 마디 단위로 두면 마디 단위로만 움직이고, 16분음표 단위로 두면 훨씬 잘게 움직인다.","루프는 같은 구간을 반복하는 것이다. 작업 시간의 대부분은 8마디 정도를 계속 반복해 들으며 보내게 된다."],"path":[{"n":"마디 읽기","s":["화면 위쪽 눈금자의 숫자를 본다. 이것이 마디 번호다","아무 곳이나 클릭하면 재생 헤드가 그 자리로 간다","화면 위 가운데의 숫자 표시(LCD)에서 현재 위치를 마디와 박으로 읽는다"]},{"n":"템포와 박자 바꾸기","s":["LCD의 <b>템포</b> 숫자를 두 번 클릭하고 <v>90</v>이라고 입력한다","재생해서 느려진 것을 확인한다","LCD의 <b>박자</b> 숫자를 두 번 클릭하고 <v>3</v>과 <v>4</v>를 입력한다","눈금자의 마디 간격이 좁아진 것을 본다"]},{"n":"반복 구간 만들기","s":["눈금자의 <b>위쪽 절반</b>을 왼쪽에서 오른쪽으로 드래그한다","노란 띠가 생긴다","<k>C</k>를 눌러 반복을 켜고 <k>스페이스</k>로 재생한다"]}],"drill":["템포를 60, 90, 120, 160으로 바꿔가며 같은 리듬이 얼마나 달라지는지 듣는다.","4분의 4박자와 8분의 6박자를 번갈아 설정하고 눈금자 모양을 비교한다.","1마디부터 9마디까지 반복 구간을 만들고 열 번 돌린다."],"keys":[["C","반복 켜기와 끄기"],["스페이스","재생과 정지"],["Return","처음으로"]],"chk":["마디와 박의 관계를 설명할 수 있다","BPM이 무엇인지 안다","반복 구간을 만들 수 있다"],"quiz":[{"q":"120BPM은 1초에 몇 박인가?","a":["1박","2박","4박","120박"],"c":1,"e":"1분에 120박이므로 1초에 2박이다."},{"q":"4분의 4박자에서 한 마디에 들어가는 박의 수는?","a":["2","3","4","8"],"c":2,"e":"위 숫자가 한 마디의 박 수를 뜻한다."}]},{"d":6,"s":1,"t":"장비와 파일의 말","goal":"컴퓨터로 음악을 만드는 데 필요한 것들의 이름과 역할을 안다.","con":["로직 같은 프로그램을 통틀어 DAW라고 부른다. 녹음, 편집, 믹싱을 한 곳에서 하는 작업대라는 뜻이다. 로직 외에 큐베이스, 에이블톤, 프로툴스 같은 것들이 있고 원리는 대체로 같다.","오디오 인터페이스는 컴퓨터와 소리를 주고받는 장치다. 마이크를 꽂아 컴퓨터로 넣고, 컴퓨터의 소리를 스피커로 내보낸다. 맥에는 이미 내장된 것이 있어서 없어도 시작은 할 수 있지만, 녹음을 하려면 따로 있는 편이 훨씬 낫다.","모니터는 작업용 스피커를 부르는 말이다. 감상용 스피커는 듣기 좋게 소리를 꾸미지만 모니터는 있는 그대로 들려주는 것이 목표다. 헤드폰도 같은 이유로 작업용과 감상용이 나뉜다.","플러그인은 DAW 안에 끼워 쓰는 작은 프로그램이다. 소리를 만드는 악기 플러그인과 소리를 바꾸는 이펙트 플러그인이 있다.","소리를 숫자로 바꿀 때 두 가지를 정한다. 샘플레이트는 1초를 몇 조각으로 나눠 기록할지다. <v>48</v>킬로헤르츠면 1초를 4만 8천 번 재는 것이다. 잘게 나눌수록 높은 소리까지 담긴다.","비트 심도는 한 조각의 크기를 몇 단계로 나눠 적을지다. <v>24</v>비트면 아주 잘게 나눠 적는다는 뜻이고, 그만큼 작은 소리와 큰 소리의 차이를 넓게 담을 수 있다. 작업은 <v>48</v>킬로헤르츠 <v>24</v>비트로 하는 것이 기본이다.","헤드룸은 지금 소리와 최대치 사이에 남은 여유다. 여유가 없으면 소리가 깨진다. 이 깨짐을 클리핑이라고 하고 한 번 깨지면 되돌릴 수 없다. 그래서 항상 여유를 두고 작업한다.","파일 형식도 두 갈래다. WAV와 AIFF는 압축하지 않아 크고 깨끗하다. MP3와 AAC는 압축해서 작지만 원본보다 정보가 줄어 있다. 작업은 압축하지 않은 쪽으로, 들려주기는 압축한 쪽으로 한다."],"path":[{"n":"내 장비 확인하기","s":["<b>Logic Pro → 설정 → 오디오 → 장비</b>를 연다","<b>출력 장비</b>에 지금 소리가 나가는 장치가 적혀 있다","<b>입력 장비</b>에 마이크가 연결된 장치가 적혀 있다","<b>샘플률</b>이 <v>48</v>kHz인지 확인한다"]},{"n":"헤드룸 확인하기","s":["<k>X</k>로 믹서를 연다","맨 오른쪽 <b>Stereo Out</b>의 미터를 본다","재생 중 미터 꼭대기가 빨갛게 되면 클리핑이다","숫자를 클릭하면 초기화된다"]}],"drill":["설정에서 내 컴퓨터의 출력 장치와 샘플레이트를 확인하고 적어둔다.","일부러 페이더를 크게 올려 마스터 미터를 빨갛게 만들어 보고, 소리가 어떻게 깨지는지 들은 뒤 되돌린다.","같은 곡의 WAV 파일과 MP3 파일 용량을 비교한다."],"keys":[["X","믹서"],["⌘S","저장"]],"chk":["DAW와 플러그인이 무엇인지 안다","샘플레이트와 비트 심도의 차이를 안다","클리핑이 무엇이고 왜 피해야 하는지 안다"],"quiz":[{"q":"1초를 몇 조각으로 나눠 기록할지를 정하는 값은?","a":["비트 심도","샘플레이트","헤드룸","BPM"],"c":1,"e":"샘플레이트가 시간을 나누는 조밀함이고, 비트 심도는 크기를 나누는 조밀함이다."},{"q":"소리가 최대치를 넘어 깨지는 현상은?","a":["클리핑","헤드룸","마스킹","디더"],"c":0,"e":"한 번 깨진 소리는 되돌릴 수 없다. 그래서 여유를 두고 작업한다."},{"q":"작업용 파일 형식으로 알맞은 것은?","a":["MP3","AAC","WAV","M4A"],"c":2,"e":"WAV와 AIFF는 압축하지 않아 정보가 그대로 남는다."}]},{"d":7,"s":2,"t":"프로젝트를 만들고 화면을 읽는다","goal":"로직 화면을 여섯 구역으로 나누어 이름을 말할 수 있다.","con":["로직 프로의 메인 창은 여섯 구역으로 되어 있다. 왼쪽 위부터 인스펙터, 가운데 위 컨트롤 막대, 가운데 트랙 영역, 왼쪽 트랙 헤더, 오른쪽 라이브러리와 브라우저, 아래 편집기다. 이 여섯 구역의 위치만 외워도 화면에서 길을 잃지 않는다.","인스펙터는 지금 선택한 것의 속성을 보여준다. 리전을 선택하면 리전 속성이, 트랙을 선택하면 채널 스트립이 나온다. 선택을 바꾸면 인스펙터 내용이 통째로 바뀐다는 점이 핵심이다.","프로젝트는 폴더 하나로 저장하는 것이 기본이다. 오디오 파일까지 프로젝트 안에 넣어두면 외장 디스크로 옮겨도 소리가 사라지지 않는다."],"path":[{"n":"새 프로젝트 만들기","s":["로직 프로 실행 → 프로젝트 선택창에서 <b>새로운 프로젝트</b>","왼쪽 목록에서 <b>비어 있는 프로젝트</b> 클릭 → <b>선택</b>","트랙 종류 창이 뜨면 <b>소프트웨어 악기</b> 선택 → <b>생성</b>"]},{"n":"여섯 구역 열고 닫기","s":["인스펙터: <k>I</k>","라이브러리: <k>Y</k>","편집기: <k>E</k>","믹서: <k>X</k>","스마트 컨트롤: <k>B</k>","브라우저: <k>F</k>"]},{"n":"프로젝트 폴더로 저장","s":["<b>파일 → 저장</b>","이름 입력 후 <b>프로젝트 폴더로 정리</b> 체크 확인","<b>저장</b>"]}],"drill":["빈 프로젝트를 만들고 여섯 구역을 하나씩 열었다 닫는다. 각 구역이 무엇을 보여주는지 소리 내어 말한다.","소프트웨어 악기 트랙을 3개 만든다. 트랙 헤더를 클릭할 때마다 인스펙터가 어떻게 바뀌는지 관찰한다.","프로젝트를 바탕화면에 '연습_01' 이름으로 저장하고 파인더에서 폴더 안을 열어본다."],"keys":[["I","인스펙터"],["Y","라이브러리"],["E","편집기"],["X","믹서"],["B","스마트 컨트롤"],["⌘S","저장"]],"chk":["여섯 구역 이름을 보지 않고 말할 수 있다","인스펙터가 선택에 따라 바뀌는 것을 확인했다","프로젝트 폴더 구조를 파인더에서 확인했다"],"quiz":[{"q":"리전을 선택했을 때와 트랙을 선택했을 때, 내용이 통째로 바뀌는 구역은?","a":["라이브러리","인스펙터","브라우저","컨트롤 막대"],"c":1,"e":"인스펙터는 항상 '지금 선택된 것'의 속성을 보여준다. 그래서 선택이 바뀌면 내용이 바뀐다."},{"q":"믹서를 여는 기본 단축키는?","a":["M","X","V","C"],"c":1,"e":"X가 믹서다. M은 뮤트라서 헷갈리기 쉽다."}]},{"d":8,"s":2,"t":"트랜스포트와 재생 헤드","goal":"소리를 원하는 지점에서 원하는 구간만 반복 재생할 수 있다.","con":["트랜스포트는 화면 위쪽 가운데 있는 재생 관련 버튼 묶음이다. 재생, 정지, 녹음, 되감기, 사이클 여섯 개가 핵심이고 나머지는 나중에 봐도 된다.","재생 헤드는 지금 어디를 읽고 있는지 알려주는 세로줄이다. 눈금자를 클릭하면 그 자리로 옮겨간다. 재생 중에 눈금자를 클릭하면 그 지점부터 이어서 재생한다.","사이클 구간은 눈금자 위쪽 절반을 드래그해서 만든다. 노란 띠가 생기면 그 구간만 무한 반복된다. 작업 시간의 대부분은 사이클을 켜놓고 8마디 정도를 계속 돌리며 보내게 된다.","LCD 디스플레이는 위치를 두 가지 방식으로 보여준다. 마디·박자와 시간이다. 숫자를 위아래로 드래그하면 그 위치로 바로 점프한다."],"path":[{"n":"사이클 구간 만들기","s":["눈금자 <b>위쪽 절반</b>을 드래그 → 노란 띠 생성","<k>C</k>로 사이클 켜기와 끄기","리전을 선택하고 <k>⌘U</k> → 선택한 리전 길이에 맞춰 사이클 자동 설정"]},{"n":"LCD 표시 바꾸기","s":["LCD 오른쪽 끝 작은 삼각형 클릭","<b>사용자화</b> 선택","보고 싶은 항목만 체크"]}],"drill":["Apple Loops를 하나 끌어다 놓고, 그 리전만 사이클로 잡아 10회 반복 재생한다.","눈금자를 클릭해 5마디, 9마디, 17마디로 재생 헤드를 옮기는 연습을 20회 한다.","재생 중에 눈금자를 클릭해 다른 지점으로 건너뛰어 본다."],"keys":[["스페이스","재생과 정지"],["Return","처음으로"],["C","사이클 켜기와 끄기"],["⌘U","선택 영역을 사이클로"],["R","녹음"],["Shift+Return","사이클 시작점부터 재생"]],"chk":["사이클 구간을 마디에 딱 맞춰 만들 수 있다","재생 중 다른 지점으로 이동할 수 있다","LCD에서 현재 마디를 읽을 수 있다"],"quiz":[{"q":"선택한 리전 길이에 맞춰 사이클 구간을 자동으로 잡는 단축키는?","a":["⌘U","⌘R","⌘T","⌘L"],"c":0,"e":"⌘U는 선택 영역으로 사이클(로케이터)을 설정한다. 8마디 루프를 잡을 때 매번 쓰게 된다."}]},{"d":9,"s":2,"t":"트랙 네 종류와 라이브러리","goal":"네 가지 트랙의 차이를 알고 목적에 맞는 트랙을 만든다.","con":["트랙은 네 종류다. 소프트웨어 악기는 미디 신호로 가상악기를 울린다. 오디오는 마이크와 라인 입력으로 들어온 소리 파형을 담는다. 드러머는 로직이 연주해주는 가상 드러머다. 외부 미디는 바깥 하드웨어 신디사이저를 제어한다.","초보 구간에서 실제로 쓰는 것은 소프트웨어 악기와 오디오 두 가지다. 드러머는 악기별 실전 스테이지에서 따로 다룬다.","라이브러리는 그 트랙에 얹을 소리를 고르는 곳이다. 왼쪽 열에서 큰 분류를 고르고 오른쪽 열에서 세부 음색을 고른다. 트랙을 선택한 상태에서 라이브러리 항목을 클릭하면 채널 스트립이 통째로 교체된다. 플러그인까지 같이 바뀌는 점을 알아둬야 한다.","패치와 프리셋은 다르다. 패치는 채널 스트립 전체(악기 + 이펙트 + 볼륨)이고, 프리셋은 플러그인 하나의 설정이다."],"path":[{"n":"트랙 추가","s":["<k>⌥⌘N</k> 또는 트랙 헤더 위 <b>+</b> 버튼","종류 선택 → 하단 <b>세부사항</b>을 열면 입력, 출력, 개수 지정 가능","<b>생성</b>"]},{"n":"음색 고르기","s":["트랙 헤더 클릭으로 트랙 선택","<k>Y</k>로 라이브러리 열기","왼쪽 분류 → 오른쪽 음색 클릭","위아래 화살표 키로 음색을 하나씩 넘기며 비교"]},{"n":"트랙 정리","s":["트랙 이름 더블 클릭 → 이름 변경","트랙 헤더 우클릭 → <b>트랙 색상 지정</b>","<k>⌘D</k> → 선택 트랙 복제"]}],"drill":["소프트웨어 악기 트랙 5개를 만들고 각각 피아노, 베이스, 스트링, 신스 리드, 패드 음색을 지정한다.","각 트랙의 이름을 악기명으로 바꾸고 색을 다르게 준다.","라이브러리에서 화살표 키로 피아노 음색 20개를 연달아 들어보고 마음에 드는 3개를 적어둔다."],"keys":[["⌥⌘N","새 트랙"],["⌘D","트랙 복제"],["Y","라이브러리"],["↑ ↓","라이브러리 음색 이동"],["M","뮤트"],["S","솔로"]],"chk":["네 가지 트랙 종류를 설명할 수 있다","라이브러리에서 음색을 바꿔 봤다","패치와 프리셋의 차이를 말할 수 있다"],"quiz":[{"q":"라이브러리에서 패치를 클릭하면 함께 바뀌는 것은?","a":["리전 내용","채널 스트립 전체","프로젝트 템포","트랙 순서"],"c":1,"e":"패치는 악기, 이펙트, 볼륨, 센드까지 포함한 채널 스트립 전체다."}]},{"t":"Apple Loops로 스케치한다","goal":"루프 브라우저에서 소재를 찾아 곡의 밑그림을 빠르게 그린다.","con":["로직에는 바로 쓸 수 있는 연주 소재 수만 개가 들어 있다. Apple Loops다. 아직 악기를 못 다뤄도 이것만으로 곡 형태를 만들 수 있어서, 배우는 단계에서 가장 좋은 스케치 도구다.","루프는 색으로 종류가 나뉜다. 파란 루프는 오디오다. 녹음된 소리라서 그대로 쓰거나 자르는 것까지만 된다. 초록 루프는 미디다. 악기 트랙에 놓으면 음표가 들어 있어서 피아노 롤로 열어 마음대로 고칠 수 있다. 노란 루프는 드러머 연주, 주황 루프는 패턴이다.","같은 이름의 루프가 파랑과 초록 둘 다 있는 경우가 많다. 고칠 생각이 있으면 초록을 고른다.","루프의 가장 큰 특징은 프로젝트를 따라온다는 것이다. 원래 다른 템포, 다른 조로 만들어진 루프라도 끌어다 놓으면 내 프로젝트의 템포와 조에 자동으로 맞는다. 그래서 서로 다른 루프를 겹쳐도 어긋나지 않는다.","초록 루프는 훌륭한 교재이기도 하다. 잘 만든 베이스 루프를 피아노 롤로 열어 보면, 음을 어디에 놓고 벨로시티를 어떻게 흔들었는지가 그대로 보인다. 마음에 드는 루프를 열어 관찰하는 것이 어떤 강의보다 빠를 때가 있다.","주의할 것 하나. 루프는 누구나 쓸 수 있는 소재라서 그대로 두면 남의 곡과 비슷해진다. 스케치로 쓰고, 곡이 자리 잡으면 직접 만든 것으로 바꿔 나가는 습관을 들인다."],"path":[{"n":"루프 브라우저 열고 찾기","s":["<k>O</k>를 눌러 루프 브라우저를 연다","위쪽 검색창에 악기 이름이나 느낌을 입력한다","<b>악기 · 장르 · 디스크립터</b> 버튼으로 조건을 겹쳐 거른다","목록의 루프를 클릭하면 미리 들린다. 프로젝트 재생 중에 클릭하면 박자에 맞춰 함께 들린다"]},{"n":"놓고 고치기","s":["루프를 트랙 영역의 빈 곳으로 드래그한다. 알맞은 종류의 트랙이 자동으로 생긴다","초록 루프를 더블 클릭해 피아노 롤로 연다","음과 벨로시티가 어떻게 놓였는지 관찰하고 몇 개를 직접 바꿔 본다"]},{"n":"조와 템포 확인","s":["LCD에서 템포를 크게 바꿔 본다","놓아둔 루프들이 전부 따라오는 것을 확인한다"]}],"drill":["드럼, 베이스, 코드 루프를 하나씩 골라 8마디 스케치를 만든다.","같은 스케치에서 템포를 90과 120으로 바꿔 보고 루프가 따라오는지 확인한다.","마음에 드는 초록 베이스 루프를 피아노 롤로 열어 음 배치와 벨로시티를 관찰하고, 배운 점을 한 줄 적는다."],"keys":[["O","루프 브라우저"],["P","피아노 롤"],["스페이스","재생과 정지"]],"chk":["루프 색깔별 차이를 안다","초록 루프를 열어 고쳐 봤다","루프가 템포와 조를 따라온다는 것을 확인했다"],"quiz":[{"q":"피아노 롤로 열어 음을 고칠 수 있는 루프는?","a":["파란 루프","초록 루프","모든 루프 불가능","노란 루프"],"c":1,"e":"초록 루프는 미디라서 음표가 들어 있다. 파란 루프는 오디오라 음 단위 수정이 안 된다."},{"q":"다른 템포로 만들어진 루프를 프로젝트에 놓으면?","a":["원래 템포로 재생된다","프로젝트 템포에 자동으로 맞는다","소리가 안 난다","반으로 잘린다"],"c":1,"e":"Apple Loops는 프로젝트의 템포와 조를 따라오도록 만들어져 있다."}],"d":10,"s":2},{"d":11,"s":2,"t":"저장, 백업, 프로젝트 위생","goal":"작업을 잃지 않는 저장 습관을 몸에 붙인다.","con":["로직에서 가장 흔한 사고는 크래시가 아니라 덮어쓰기다. 어제 좋았던 버전을 오늘 망친 뒤 저장해버리는 일이 실제로 자주 일어난다. 해결책은 다른 이름으로 저장을 습관화하는 것이다.","대체 저장은 로직이 자체적으로 버전을 관리해주는 기능이다. 프로젝트 안에 여러 버전이 들어가고 언제든 되돌릴 수 있다. 편곡 A안과 B안을 비교할 때 특히 유용하다.","프로젝트 정리는 안 쓰는 오디오 파일을 프로젝트에서 걷어내는 작업이다. 녹음을 많이 하면 프로젝트가 수십 기가로 불어나는데, 정리 한 번이면 크게 줄어든다.","자동 백업은 기본으로 켜져 있다. 설정에서 몇 개까지 보관할지 정할 수 있다."],"path":[{"n":"대체 저장","s":["<b>파일 → 대체 → 신규</b>","이름 입력 후 <b>확인</b>","되돌리기: <b>파일 → 대체</b> 목록에서 원하는 버전 선택"]},{"n":"자동 백업 설정","s":["<b>파일 → 프로젝트 설정 → 에셋</b>","<b>프로젝트 백업</b> 항목에서 개수 지정","권장 <v>10</v>개"]},{"n":"프로젝트 정리","s":["<b>파일 → 프로젝트 관리 → 정리</b>","<b>사용하지 않는 파일</b> 체크","목록 확인 후 <b>삭제</b>"]}],"drill":["연습 프로젝트에서 대체 버전을 3개 만들고 서로 오가며 열어본다.","자동 백업 개수를 10개로 설정한다.","프로젝트 정리를 한 번 실행해서 용량 변화를 확인한다."],"keys":[["⌘S","저장"],["⇧⌘S","다른 이름으로 저장"],["⌘Z","실행 취소"],["⇧⌘Z","다시 실행"]],"chk":["대체 저장으로 버전을 오갈 수 있다","자동 백업 개수를 설정했다","작업 시작 30초 안에 ⌘S를 누르는 습관이 생겼다"],"quiz":[{"q":"편곡 A안과 B안을 한 프로젝트 안에서 비교할 때 가장 알맞은 기능은?","a":["프로젝트 정리","대체 저장","바운스","프리즈"],"c":1,"e":"대체 저장은 한 프로젝트 안에 여러 버전을 두고 자유롭게 오갈 수 있게 해준다."}]},{"d":12,"s":3,"t":"리전 기본 조작","goal":"리전을 옮기고 자르고 붙이는 다섯 동작을 손에 익힌다.","con":["리전은 소리 덩어리다. 미디 리전은 음표 정보를, 오디오 리전은 파형을 담는다. 편곡 작업의 90퍼센트는 리전을 옮기고 자르고 늘리는 일이다.","다섯 동작만 알면 된다. 이동은 드래그, 복사는 옵션 드래그, 길이 조절은 끝을 잡고 드래그, 분할은 재생 헤드 위치에서 <k>⌘T</k>, 삭제는 <k>Delete</k>다.","리전 이름 바꾸기는 텍스트 도구를 쓴다. 트랙 이름과 리전 이름은 별개라서, 트랙 이름을 바꿔도 이미 만들어진 리전 이름은 그대로 남는다.","실수했을 때 <k>⌘Z</k>는 몇 십 단계까지 되돌아간다. 겁내지 말고 시도해도 된다."],"path":[{"n":"기본 다섯 동작","s":["이동: 리전 몸통을 잡고 드래그","복사: <k>⌥</k>를 누른 채 드래그","길이: 리전 좌우 끝 모서리를 잡고 드래그","분할: 재생 헤드를 놓고 <k>⌘T</k>","반복: <k>⌘R</k> → 횟수 입력"]},{"n":"도구 바꾸기","s":["<k>T</k>를 누르면 도구 팝업","포인터, 연필, 지우개, 텍스트, 가위, 접착제, 솔로, 뮤트, 확대","<k>T</k>를 두 번 빠르게 → 포인터로 복귀"]}],"drill":["4마디 리전 하나를 만들고 옵션 드래그로 32마디까지 복사한다.","⌘R로 8회 반복을 한 번에 만들어 본다. 드래그 복사와 시간을 비교한다.","리전을 재생 헤드 위치에서 잘라 앞뒤를 서로 바꿔 붙인다."],"keys":[["⌘T","재생 헤드에서 분할"],["⌘R","반복"],["⌥드래그","복사"],["T","도구 팝업"],["Delete","삭제"],["⌘Z","실행 취소"]],"chk":["다섯 동작을 손이 기억한다","⌘R로 반복 횟수를 지정할 수 있다","도구를 T로 빠르게 바꿀 수 있다"],"quiz":[{"q":"리전을 재생 헤드 위치에서 자르는 단축키는?","a":["⌘R","⌘T","⌘D","⌘E"],"c":1,"e":"⌘T가 분할이다. ⌘R은 반복이라 짝으로 외우면 좋다."}]},{"d":13,"s":3,"t":"스냅과 그리드","goal":"리전이 원하는 자리에 정확히 붙게 만든다.","con":["스냅은 리전을 드래그할 때 어떤 격자에 달라붙을지 정하는 규칙이다. 트랙 영역 오른쪽 위 스냅 메뉴에서 고른다.","기본값 스마트는 확대 배율에 따라 격자가 자동으로 바뀐다. 편하지만 예측이 어렵다. 정확한 작업을 할 때는 마디나 비트로 고정하는 편이 낫다.","상대값 스냅은 리전이 이미 격자에서 어긋나 있을 때 그 어긋난 정도를 유지하며 옮기는 옵션이다. 그루브를 일부러 밀어놓은 리전을 옮길 때 필수다.","<k>⌃</k>를 누른 채 드래그하면 스냅이 잠시 꺼져 아주 미세하게 옮길 수 있다."],"path":[{"n":"스냅 설정","s":["트랙 영역 오른쪽 위 <b>스냅</b> 메뉴 클릭","<b>마디 / 비트 / 디비전 / 틱 / 스마트</b> 중 선택","<b>상대값 스냅</b> 체크 여부 확인"]},{"n":"미세 이동","s":["<k>⌃</k>+드래그 → 스냅 무시","리전 선택 후 인스펙터 <b>위치</b> 값 직접 입력"]}],"drill":["스냅을 마디로 고정하고 리전 8개를 정확히 4마디 간격으로 배치한다.","스냅을 디비전으로 바꿔 16분음표 단위로 옮겨본다.","⌃ 드래그로 리전을 아주 조금만 앞으로 밀어 그루브 변화를 듣는다."],"keys":[["⌃드래그","스냅 무시 미세 이동"],["⌘←→","줌 아웃과 줌 인"],["Z","선택 영역 확대와 복귀"]],"chk":["스냅 단위를 상황에 따라 바꿀 수 있다","상대값 스냅이 무엇인지 설명할 수 있다","미세 이동으로 그루브를 바꿔봤다"],"quiz":[{"q":"일부러 그리드에서 밀어놓은 리전의 어긋난 정도를 유지하며 옮기려면?","a":["스마트 스냅","상대값 스냅","틱 스냅","스냅 끄기"],"c":1,"e":"상대값 스냅은 원래의 어긋남을 보존한 채 격자 단위로 옮긴다."}]},{"d":14,"s":3,"t":"루프와 알리아스","goal":"같은 소재를 무겁지 않게 반복시킨다.","con":["리전을 반복시키는 방법은 세 가지다. 복사, 루프, 알리아스. 셋의 성격이 다르다.","복사는 각각 독립된 리전을 만든다. 하나를 고쳐도 나머지는 그대로다. 변주를 줄 때 쓴다.","루프는 리전 오른쪽 위 모서리를 잡고 늘리면 생긴다. 원본을 고치면 반복분이 전부 따라 바뀐다. 프로젝트가 가벼워진다.","알리아스는 미디 리전의 분신이다. 원본을 고치면 모든 알리아스가 바뀌지만, 위치와 트랙은 따로 둘 수 있다. 같은 모티프를 다른 악기로 겹칠 때 유용하다.","루프를 개별 리전으로 바꿔야 편집할 수 있는 순간이 온다. 그때 루프 풀기를 쓴다."],"path":[{"n":"루프 만들고 풀기","s":["리전 <b>오른쪽 위 모서리</b>에 커서 → 고리 모양 → 드래그","풀기: 리전 우클릭 → <b>반복 → 루프를 리전으로 변환</b>"]},{"n":"알리아스 만들기","s":["미디 리전 선택","<k>⌥⇧</k>+드래그 → 알리아스 생성","원본 찾기: 알리아스 우클릭 → <b>원본 선택</b>"]}],"drill":["4마디 드럼 리전을 루프로 32마디까지 늘린 뒤, 루프를 리전으로 변환해 마지막 4마디만 다르게 고친다.","미디 코드 리전 하나를 만들고 알리아스로 다른 트랙에 겹쳐 서로 다른 음색으로 들어본다."],"keys":[["⌥⇧드래그","알리아스"],["⌘R","반복 횟수 지정"],["L","리전 루프 켜기와 끄기"]],"chk":["복사, 루프, 알리아스의 차이를 말할 수 있다","루프를 개별 리전으로 풀 수 있다","알리아스로 원본 추적을 해봤다"],"quiz":[{"q":"원본을 고치면 전부 따라 바뀌지만, 서로 다른 트랙에 놓을 수 있는 것은?","a":["복사","루프","알리아스","폴더"],"c":2,"e":"알리아스는 내용은 공유하되 위치와 트랙은 자유롭다."}]},{"d":15,"s":3,"t":"어레인지먼트 마커로 곡 구조 잡기","goal":"인트로부터 아웃트로까지 구간에 이름을 붙이고 통째로 옮긴다.","con":["어레인지먼트 마커는 곡의 구간에 이름표를 붙이는 기능이다. 인트로, 벌스, 프리코러스, 코러스, 브리지, 아웃트로처럼.","진짜 힘은 이동에 있다. 마커를 드래그하면 그 구간 안의 모든 트랙 리전이 통째로 따라 움직인다. 코러스를 앞으로 당겨보는 실험을 몇 초 만에 할 수 있다.","작곡을 시작할 때 마커부터 깔아두는 습관을 권한다. 8마디 벌스, 8마디 코러스처럼 뼈대를 먼저 세우면 소리로 채우는 일이 훨씬 빨라진다.","마커 길이는 마커 끝을 드래그해 바꾼다. 기본은 8마디다."],"path":[{"n":"어레인지먼트 트랙 켜기","s":["<k>G</k> → 글로벌 트랙 표시","글로벌 트랙 헤더 우클릭 → <b>어레인지먼트</b> 체크","어레인지먼트 트랙의 <b>+</b> 클릭 → 8마디 구간 생성"]},{"n":"이름과 길이","s":["마커 이름 클릭 → 목록에서 선택 또는 <b>이름 변경</b>","마커 오른쪽 끝 드래그 → 길이 조절","마커 드래그 → 구간 통째 이동","마커 우클릭 → <b>복제</b> 또는 <b>삭제하고 이동</b>"]}],"drill":["인트로 4 / 벌스 8 / 프리 4 / 코러스 8 / 벌스 8 / 코러스 8 / 아웃트로 4마디 구조를 마커로 만든다.","코러스 마커를 드래그해 벌스보다 앞으로 옮겨보고 곡 인상이 어떻게 달라지는지 듣는다."],"keys":[["G","글로벌 트랙"],["⌘R","선택 마커 반복"]],"chk":["마커로 곡 구조를 만들 수 있다","마커 드래그로 구간 전체가 이동하는 것을 확인했다","구조를 먼저 세우고 작업을 시작해봤다"],"quiz":[{"q":"어레인지먼트 마커를 드래그하면 함께 움직이는 것은?","a":["해당 트랙 리전만","모든 트랙의 그 구간 리전","템포만","아무것도 안 움직임"],"c":1,"e":"구간 안의 모든 트랙 리전이 함께 이동한다. 그래서 구조 실험이 빠르다."}]},{"d":16,"s":3,"t":"템포, 박자, 조표","goal":"곡의 기본 골격 세 가지를 정확히 설정하고 도중에 바꾼다.","con":["템포, 박자, 조표는 프로젝트 전체에 걸리는 값이다. 곡을 시작할 때 가장 먼저 정한다. 나중에 바꾸면 오디오 리전이 어긋날 수 있어서 초반에 정하는 편이 안전하다.","템포는 LCD의 숫자를 위아래 드래그하거나 더블 클릭 후 입력한다. 장르별 대략치는 발라드 <v>62~76</v>, 알앤비 <v>70~92</v>, 팝 <v>100~120</v>, 하우스 <v>122~128</v>, 드럼앤베이스 <v>172~176</v>다.","박자는 LCD에서 분자와 분모를 따로 바꾼다. 6/8은 분자 6, 분모 8이다. 로직은 분자가 3의 배수이고 3보다 크며 분모가 8일 때 겹박자로 인식한다.","곡 도중 템포를 바꾸려면 템포 트랙에 포인트를 찍는다. 글로벌 트랙에서 템포 트랙을 켜고 선을 클릭하면 된다.","조표는 미디 편집과 스코어 표시에 영향을 준다. 오디오에는 영향이 없다."],"path":[{"n":"기본값 설정","s":["LCD의 <b>템포</b> 숫자 더블 클릭 → 값 입력","LCD의 <b>박자</b> 숫자 더블 클릭 → 분자와 분모 입력","<k>G</k> → 글로벌 트랙 → <b>조표</b> 트랙에서 더블 클릭 → 조 선택"]},{"n":"템포 변화 넣기","s":["<k>G</k> → 글로벌 트랙 헤더 우클릭 → <b>템포</b> 체크","템포 선 위를 클릭 → 포인트 생성","포인트를 위아래 드래그 → 값 변경","두 포인트 사이 선을 곡선으로: 포인트 사이 중앙 핸들 드래그"]}],"drill":["템포 74, 박자 4/4, 조 Bb장조로 새 프로젝트를 설정한다.","6/8 프로젝트를 하나 만들고 미디로 8분음표 6개를 찍어 한 마디 그루브를 확인한다.","아웃트로 4마디 동안 템포를 100에서 84로 떨어뜨리는 리타르단도를 템포 트랙으로 만든다."],"keys":[["G","글로벌 트랙"],["⌘S","저장"]],"chk":["템포, 박자, 조표를 각각 설정할 수 있다","템포 트랙에 변화를 넣어봤다","장르별 대략 템포를 감으로 안다"],"quiz":[{"q":"6/8 박자를 설정할 때 LCD에 입력하는 값은?","a":["분자 6 분모 8","분자 8 분모 6","분자 3 분모 4","분자 12 분모 8"],"c":0,"e":"분자가 마디 안의 박 수, 분모가 한 박의 음표 길이다."},{"q":"곡 도중 템포를 서서히 늦추려면?","a":["LCD 숫자 변경","템포 트랙에 포인트 두 개","박자 변경","조표 변경"],"c":1,"e":"템포 트랙에 시작점과 끝점을 찍고 값 차이를 주면 점진적 변화가 만들어진다."}]},{"d":17,"s":4,"t":"피아노 롤 기본","goal":"건반 없이도 음을 그려 넣고 고칠 수 있다.","con":["피아노 롤은 미디 음표를 격자 위에 막대로 보여준다. 세로가 음높이, 가로가 시간이다. 왼쪽 건반 그림을 클릭하면 그 음이 소리 난다.","음을 새로 그리려면 연필 도구를 쓰거나, 포인터 상태에서 <k>⌘</k>를 누른 채 클릭한다. <k>⌘</k>를 누르면 포인터가 임시로 연필이 된다.","음 길이는 막대 오른쪽 끝을 드래그한다. 여러 음을 한꺼번에 선택하고 끝을 드래그하면 전부 같이 바뀐다.","격자 단위는 오른쪽 위 <b>디비전</b> 값이 정한다. 1/16이면 16분음표 격자다. 셋잇단은 1/8T처럼 T가 붙은 값을 고른다.","미디는 언제든 고칠 수 있다는 것이 최대 장점이다. 틀린 음 하나 때문에 다시 연주할 필요가 없다."],"path":[{"n":"피아노 롤 열기","s":["미디 리전 더블 클릭 또는 <k>P</k>","비어 있는 트랙에 리전 만들기: 트랙 영역에서 <k>⌘</k>+클릭 드래그"]},{"n":"음 그리기와 고치기","s":["<k>⌘</k>+클릭 → 음 추가","막대 오른쪽 끝 드래그 → 길이","막대 위아래 드래그 → 음높이 변경","<k>⌥</k>+드래그 → 음 복사","<k>⌘A</k> → 전체 선택"]},{"n":"격자 바꾸기","s":["피아노 롤 오른쪽 위 <b>디비전</b> 메뉴","1/4, 1/8, 1/16, 1/8T 등 선택"]}],"drill":["C장조 음계를 한 옥타브 올라갔다 내려오도록 16분음표로 그린다.","C - Am - F - G 코드를 각 마디마다 3화음으로 그린다. 모든 음의 길이를 온음표로 맞춘다.","셋잇단 격자로 바꿔 8분음표 셋잇단 프레이즈를 한 마디 그린다."],"keys":[["P","피아노 롤"],["⌘클릭","음 추가"],["⌥드래그","음 복사"],["⌘A","전체 선택"],["⌘K","뮤지컬 타이핑"]],"chk":["음을 그리고 길이를 조절할 수 있다","격자 단위를 바꿀 수 있다","코드를 세 음으로 정확히 쌓을 수 있다"],"quiz":[{"q":"포인터 상태에서 음을 추가하려면 어떤 키를 누른 채 클릭하나?","a":["⌥","⌘","⇧","⌃"],"c":1,"e":"⌘를 누르면 포인터가 임시로 연필이 된다."}]},{"t":"건반으로 연주해 녹음한다","goal":"메트로놈에 맞춰 미디를 녹음하고, 틀려도 고칠 수 있음을 몸으로 안다.","con":["음을 마우스로 그리는 법은 배웠다. 이제 건반으로 직접 쳐서 넣는다. 연주가 서툴러도 괜찮다. 미디는 녹음한 뒤 전부 고칠 수 있다는 것이 핵심이다. 완벽하게 치려고 멈추는 것보다 대충 치고 고치는 쪽이 훨씬 빠르다.","녹음 전에 두 가지를 켠다. 메트로놈은 <k>K</k>로 켜고 끈다. 이것 없이 녹음하면 나중에 격자와 어긋나서 편집이 어려워진다. 카운트인은 녹음 시작 전에 한두 마디를 미리 세어 주는 기능이다. 준비할 틈이 생긴다.","미디 키보드가 없어도 된다. <k>⌘K</k>를 누르면 컴퓨터 자판이 건반이 되는 뮤지컬 타이핑이 열린다. 연습에는 충분하다.","같은 구간을 반복하며 녹음하면 로직이 회차를 어떻게 처리할지 설정에 따라 달라진다. 테이크 폴더로 쌓으면 여러 번 친 것 중에 고를 수 있고, 병합으로 두면 겹쳐 쌓인다. 병합은 드럼을 층층이 쌓을 때 특히 좋다. 첫 바퀴에 킥, 둘째 바퀴에 스네어, 셋째 바퀴에 하이햇을 나눠 치면 된다.","로직의 자랑거리 하나가 캡처 녹음이다. 녹음 버튼을 안 눌렀는데 좋은 연주가 나왔을 때, <k>⇧R</k>을 누르면 방금 친 연주를 그대로 가져온다. 로직은 재생 중의 미디 입력을 항상 기억하고 있다. 즉흥으로 치다가 좋았던 순간을 놓치지 않게 해준다.","녹음이 끝나면 앞에서 배운 흐름 그대로다. 퀀타이즈로 박을 정리하고, 틀린 음은 피아노 롤에서 옮기고, 벨로시티를 다듬는다."],"path":[{"n":"녹음 준비","s":["<k>K</k>로 메트로놈을 켠다","<b>레코드 → 카운트인</b>에서 <v>1</v>마디 선택","소프트웨어 악기 트랙을 선택하고 건반을 눌러 소리가 나는지 확인한다","건반이 없으면 <k>⌘K</k>로 뮤지컬 타이핑"]},{"n":"녹음하고 다시 하기","s":["<k>R</k>을 누르면 카운트인 뒤 녹음이 시작된다","<k>스페이스</k>로 멈춘다","마음에 안 들면 <k>⌘Z</k>로 지우고 다시 <k>R</k>"]},{"n":"반복 녹음 방식 정하기","s":["<b>Logic Pro → 설정 → 레코딩</b>을 연다","<b>겹치는 MIDI 리전</b> 항목에서 <b>사이클 켬: 테이크 폴더 생성</b> 또는 <b>병합</b> 선택","사이클을 켜고 <k>R</k> → 구간이 반복되며 회차가 쌓인다"]},{"n":"캡처 녹음","s":["녹음하지 않은 채 재생 중에 건반을 자유롭게 친다","연주가 끝나면 <k>⇧R</k>","방금 친 것이 리전으로 나타난다"]}],"drill":["메트로놈에 맞춰 4마디 멜로디를 녹음하고, 퀀타이즈 강도 80퍼센트로 정리한 뒤 틀린 음 하나를 피아노 롤에서 고친다.","병합 모드로 사이클을 돌리며 킥, 스네어, 하이햇을 세 바퀴에 나눠 쌓는다.","녹음 버튼 없이 즉흥으로 치다가 ⇧R로 캡처해 본다."],"keys":[["K","메트로놈"],["R","녹음"],["⇧R","캡처 녹음"],["⌘K","뮤지컬 타이핑"],["C","사이클"],["⌘Z","실행 취소"]],"chk":["메트로놈과 카운트인을 켜고 녹음했다","반복 녹음의 두 방식을 구분한다","캡처 녹음을 써 봤다"],"quiz":[{"q":"녹음 버튼을 누르지 않고 친 연주를 가져오는 단축키는?","a":["⌘R","⇧R","⌥R","⌃R"],"c":1,"e":"로직은 재생 중의 미디 입력을 항상 기억한다. ⇧R로 꺼내온다."},{"q":"드럼을 킥, 스네어, 하이햇 순서로 층층이 쌓기에 알맞은 반복 녹음 방식은?","a":["테이크 폴더","병합","덮어쓰기","녹음 불가"],"c":1,"e":"병합은 회차마다 친 것을 한 리전에 겹쳐 쌓는다."}],"d":18,"s":4},{"d":19,"s":4,"t":"벨로시티와 다이내믹","goal":"기계 같은 연주를 사람 같은 연주로 바꾼다.","con":["벨로시티는 건반을 누른 세기다. 1부터 127까지고 대부분의 가상악기에서 음량과 음색이 함께 바뀐다. 세게 치면 크기만 커지는 게 아니라 밝아진다.","모두 같은 벨로시티로 찍힌 미디가 기계처럼 들리는 가장 큰 이유다. 여기만 손봐도 완성도가 크게 올라간다.","실전 값의 감각: 아주 여린 부분 <v>40~55</v>, 보통 <v>64~80</v>, 강조 <v>95~110</v>, 최강 <v>115~127</v>. 한 프레이즈 안에서 최소 20 이상 편차를 주는 것을 목표로 한다.","박의 위치에 따른 기본 규칙이 있다. 4/4에서 1박이 가장 강하고 3박이 다음, 2박과 4박이 약하다. 여기에 프레이즈의 오르내림을 겹치면 자연스러워진다.","피아노 롤에서 음을 선택하고 위아래로 드래그하면 벨로시티가 바뀐다. 색으로도 구분된다."],"path":[{"n":"벨로시티 편집","s":["피아노 롤에서 음 선택","<k>⌃</k>+드래그 위아래 → 벨로시티 변경","또는 왼쪽 아래 <b>벨로시티</b> 슬라이더 사용","여러 음 선택 후 조절 → 상대 비율 유지"]},{"n":"자동으로 흔들기","s":["리전 선택 → 인스펙터 <b>리전</b> 영역 열기","<b>벨로시티</b> 값을 +나 -로 조정 → 전체 이동","<b>MIDI 변형 → 인간미</b> → 벨로시티 무작위 편차 부여"]}],"drill":["같은 음 8개를 16분음표로 찍고 벨로시티를 전부 100으로 둔 뒤 들어본다. 그다음 1박 110, 나머지 70~85로 바꿔 다시 듣고 차이를 적는다.","피아노 4마디 프레이즈를 만들고 시작 60에서 절정 110까지 서서히 올라가는 크레셴도를 벨로시티만으로 만든다."],"keys":[["⌃드래그","벨로시티"],["⌘A","전체 선택"]],"chk":["벨로시티 편차를 20 이상 준다","박별 강약 규칙을 적용할 수 있다","크레셴도를 벨로시티로 만들 수 있다"],"quiz":[{"q":"벨로시티가 대부분의 가상악기에서 함께 바꾸는 것은?","a":["음높이","음량과 음색","길이","팬"],"c":1,"e":"세게 칠수록 크고 밝아지도록 샘플이 층으로 나뉘어 있다."},{"q":"4/4에서 일반적으로 가장 강한 박은?","a":["1박","2박","3박","4박"],"c":0,"e":"1박이 가장 강하고 3박이 그다음이다."}]},{"d":20,"s":4,"t":"퀀타이즈와 그루브","goal":"박을 맞추되 기계처럼 만들지 않는다.","con":["퀀타이즈는 음을 격자에 붙이는 기능이다. 연주가 흔들렸을 때 정리해준다. 그런데 100퍼센트 붙여버리면 생기가 사라진다.","강도 값이 핵심이다. 강도 <v>100</v>퍼센트는 격자에 완전히 붙이고, <v>70~85</v>퍼센트는 격자 쪽으로 그만큼만 당긴다. 실전에서는 80퍼센트 근처가 자연스럽다.","스윙 값은 짝수 번째 음을 뒤로 미는 비율이다. 스트레이트가 <v>50</v>, 재즈 계열 스윙이 <v>58~67</v>이다. 힙합의 그루브는 16분음표 스윙 <v>54~58</v> 정도에서 나온다.","퀀타이즈 격자는 리듬의 성격을 정한다. 1/8은 넓고 1/16은 촘촘하다. 드럼 하이햇에 1/16, 킥과 스네어에 1/8을 따로 걸기도 한다.","오디오도 퀀타이즈할 수 있다. 플렉스 타임을 켜면 된다. 오디오 스테이지의 플렉스 타임 일차에서 다룬다."],"path":[{"n":"리전 단위 퀀타이즈","s":["리전 선택","인스펙터 <b>리전</b> 영역 → <b>퀀타이즈</b> 메뉴에서 격자 선택","<b>Q-강도</b> 값을 <v>80</v>퍼센트로","<b>Q-스윙</b> 값 조절"]},{"n":"음 단위 퀀타이즈","s":["피아노 롤에서 음 선택","<k>Q</k> → 현재 설정으로 적용","되돌리기: 인스펙터 퀀타이즈를 <b>끄기</b>로"]}],"drill":["16분음표 하이햇을 손으로 찍고 일부러 어긋나게 둔 뒤, 강도 100과 80을 번갈아 적용해 차이를 듣는다.","스윙 값을 50, 56, 62, 66으로 바꿔가며 같은 하이햇을 들어보고 각각 어떤 장르 느낌인지 적는다."],"keys":[["Q","퀀타이즈 적용"],["⌘Z","되돌리기"]],"chk":["강도 값의 의미를 안다","스윙 값으로 그루브를 바꿔봤다","트랙마다 다른 격자를 적용해봤다"],"quiz":[{"q":"퀀타이즈 강도를 80퍼센트로 두면?","a":["격자에 완전히 붙는다","격자 쪽으로 80퍼센트만 당겨진다","20퍼센트만 적용된다","아무 변화 없다"],"c":1,"e":"원래 위치에서 격자까지의 거리 중 80퍼센트만 이동한다. 인간적인 흔들림이 남는다."}]},{"d":21,"s":4,"t":"스마트 컨트롤과 악기 파라미터","goal":"악기 소리를 여덟 개 노브로 빠르게 바꾼다.","con":["스마트 컨트롤은 지금 트랙의 악기와 이펙트에서 중요한 파라미터만 뽑아 여덟 개 정도로 보여주는 패널이다. 플러그인 창을 하나하나 열지 않아도 된다.","거의 모든 패치에 공통으로 있는 것은 밝기 계열, 공간 계열, 움직임 계열이다. 이름은 패치마다 다르지만 역할은 비슷하다.","스마트 컨트롤 노브는 그대로 오토메이션할 수 있다. 신스 필터가 코러스에서 열리는 효과를 쉽게 만들 수 있다.","진짜 세부 조정은 플러그인 창을 직접 연다. 채널 스트립 맨 위 악기 슬롯을 더블 클릭한다.","프리셋 비교 습관을 들이면 좋다. 플러그인 창 위쪽 화살표로 프리셋을 넘기며 듣는다."],"path":[{"n":"스마트 컨트롤 쓰기","s":["트랙 선택 → <k>B</k>","노브 드래그로 값 변경","노브 우클릭 → <b>파라미터 매핑</b>으로 무엇에 연결됐는지 확인"]},{"n":"플러그인 직접 열기","s":["<k>I</k>로 인스펙터 열기","채널 스트립 <b>악기</b> 슬롯 더블 클릭","프리셋 목록: 플러그인 창 상단 이름 부분 클릭"]}],"drill":["신스 패치를 하나 고르고 스마트 컨트롤 노브 여덟 개를 하나씩 끝까지 돌려보며 무엇이 바뀌는지 적는다.","같은 미디 프레이즈를 두고 패치만 다섯 개 바꿔 들으며 어떤 소리가 이 프레이즈에 맞는지 고른다."],"keys":[["B","스마트 컨트롤"],["I","인스펙터"]],"chk":["스마트 컨트롤로 소리를 바꿀 수 있다","플러그인 창을 직접 열 수 있다","프리셋을 비교하며 고른다"],"quiz":[{"q":"스마트 컨트롤의 목적은?","a":["믹스 밸런스 조절","중요한 파라미터만 모아 빠르게 조절","곡 구조 편집","오디오 녹음"],"c":1,"e":"패치에서 자주 만지는 파라미터만 골라 모아둔 패널이다."}]},{"d":22,"s":4,"t":"미디 컨트롤 체인지로 표정 만들기","goal":"긴 음이 죽지 않게 볼륨과 음색을 시간에 따라 움직인다.","con":["벨로시티는 음이 시작될 때 한 번만 정해진다. 그래서 긴 음은 시작 이후에 표정을 줄 수 없다. 여기서 컨트롤 체인지가 필요하다.","실전에서 쓰는 것은 두 개다. CC1 모듈레이션은 대개 음색의 세기와 밝기를, CC11 익스프레션은 음량을 시간에 따라 바꾼다. 스트링과 관악기에서 특히 중요하다.","오케스트라 계열 음원은 CC1로 다이내믹 레이어를 넘기고 CC11로 미세한 음량을 다듬는 구성이 표준이다. 두 개를 겹쳐 쓰면 자연스러운 스웰이 만들어진다.","팀파니 롤이나 스트링 크레셴도는 음을 잘게 반복해서 찍는 것이 아니라, 긴 음 하나에 CC11 상승 곡선을 그리는 방식이 훨씬 자연스럽다.","CC7 볼륨은 트랙 전체 음량이라 표정용으로는 쓰지 않는다. 믹스용으로 남겨둔다."],"path":[{"n":"피아노 롤에서 CC 그리기","s":["피아노 롤 왼쪽 아래 <b>오토메이션과 미디 표시</b> 버튼 클릭","팝업에서 <b>MIDI 컨트롤러 → 1 Modulation</b> 또는 <b>11 Expression</b>","연필 도구로 선 그리기","선 위 점을 드래그해 곡선 조절"]},{"n":"실물 노브로 녹음","s":["미디 키보드 모듈레이션 휠 연결","트랙 녹음 준비 → <k>R</k>","연주 없이 휠만 움직여도 CC가 기록됨"]}],"drill":["스트링 패치로 온음표 4개를 찍고 CC11을 30에서 100까지 올라가는 곡선으로 그려 크레셴도를 만든다.","같은 프레이즈에 CC1도 겹쳐 그려 음색이 함께 열리는지 확인한다.","CC 없이 벨로시티만 준 버전과 비교해 어느 쪽이 살아 있는지 판단한다."],"keys":[["P","피아노 롤"],["A","오토메이션"]],"chk":["CC1과 CC11의 차이를 안다","긴 음에 크레셴도를 만들 수 있다","팀파니 롤을 긴 음 하나로 처리할 수 있다"],"quiz":[{"q":"긴 음의 음량을 시간에 따라 바꿀 때 주로 쓰는 컨트롤 체인지는?","a":["CC1","CC7","CC11","CC64"],"c":2,"e":"CC11 익스프레션이 연주 표현용 음량이다. CC7은 믹스용으로 남겨둔다."},{"q":"팀파니 롤을 만드는 더 자연스러운 방법은?","a":["32분음표를 빽빽하게 찍는다","긴 음 하나에 CC11 크레셴도","벨로시티를 127로 고정","리버브를 크게"],"c":1,"e":"음원이 이미 롤 샘플을 갖고 있는 경우가 많고, 잘게 찍으면 기관총 소리가 난다."}]},{"d":23,"s":4,"t":"아티큘레이션과 키스위치","goal":"한 트랙 안에서 주법을 바꾼다.","con":["실제 악기는 주법마다 소리가 다르다. 바이올린의 활 긋기, 짧게 끊기, 떨기, 뜯기가 전부 다른 소리다. 가상악기는 이것을 아티큘레이션으로 구분한다.","주법을 바꾸는 방법은 두 가지다. 키스위치는 연주에 쓰지 않는 낮은 음역의 건반을 눌러 전환하는 방식이다. 아티큘레이션 세트는 로직이 이름표로 관리해주는 방식이다.","로직의 아티큘레이션 세트를 쓰면 피아노 롤에서 음을 선택하고 이름으로 주법을 지정할 수 있다. 낮은 건반 위치를 외울 필요가 없다.","주법이 바뀌면 음의 앞부분 길이도 달라진다. 레가토 계열은 소리가 늦게 나오는 경우가 많아서, 음을 격자보다 살짝 앞으로 당겨야 박에 맞게 들린다. 보통 <v>20~60</v>ms 정도다.","스타카토를 쓸 때는 음 길이를 실제로 짧게 만들 필요가 없다. 샘플 자체가 짧다."],"path":[{"n":"아티큘레이션 지정","s":["피아노 롤에서 음 선택","피아노 롤 인스펙터의 <b>아티큘레이션</b> 항목 클릭","목록에서 주법 선택"]},{"n":"트랙 지연 보정","s":["<k>I</k>로 인스펙터 → 트랙 영역 열기","<b>지연</b> 값에 <v>-30</v>ms 정도 입력 → 트랙 전체가 앞당겨짐"]}],"drill":["스트링 음원으로 같은 4마디를 레가토, 스타카토, 피치카토 세 가지로 만들어 비교한다.","레가토 트랙에 지연 -30ms를 걸고 드럼과 함께 들어 어느 쪽이 박에 맞는지 확인한다."],"keys":[["P","피아노 롤"],["I","인스펙터"]],"chk":["아티큘레이션을 바꿔봤다","트랙 지연으로 타이밍을 보정할 수 있다","주법에 따른 어택 차이를 들었다"],"quiz":[{"q":"레가토 계열 샘플이 박보다 늦게 들릴 때 쓰는 설정은?","a":["트랙 음량","트랙 지연","퀀타이즈 강도","벨로시티"],"c":1,"e":"트랙 지연에 음수 값을 주면 트랙 전체가 앞당겨진다."}]},{"d":24,"s":4,"t":"미디 이펙트","goal":"연주하지 않고도 움직이는 프레이즈를 만든다.","con":["미디 이펙트는 악기에 도달하기 전의 미디 신호를 가공한다. 오디오가 아니라 음표 자체를 바꾸는 것이다. 악기 슬롯 위에 별도의 슬롯이 있다.","아르페지에이터가 대표적이다. 코드를 누르고 있으면 음을 하나씩 순서대로 연주한다. 방향, 속도, 옥타브 범위, 그루브를 정할 수 있다. 신스 시퀀스와 반복 패턴을 만들 때 강력하다.","코드 트리거는 건반 하나에 코드 하나를 배정한다. 한 손가락으로 진행을 연주할 수 있어서 편곡 실험이 빨라진다.","모디파이어는 컨트롤 체인지를 다른 값으로 바꾼다. 모듈레이션 휠 신호를 익스프레션으로 보내는 식이다. 손이 하나뿐일 때 유용하다.","벨로시티 프로세서는 벨로시티를 자동으로 조정한다. 랜더마이저는 미세한 흔들림을 준다. 둘 다 기계 같은 느낌을 없애는 데 쓴다.","미디 이펙트의 결과는 리전에 기록되지 않는다. 눈에 보이는 음표와 실제 들리는 음이 다르다. 확정하고 싶으면 결과를 미디로 굳혀야 한다."],"path":[{"n":"아르페지에이터","s":["트랙 선택 → <k>I</k> 인스펙터","악기 슬롯 <b>위쪽</b>의 <b>MIDI FX</b> 슬롯 클릭 → <b>Arpeggiator</b>","<b>Direction</b>, <b>Rate</b>, <b>Octave Range</b> 조정","<b>Grid</b>와 <b>Swing</b>으로 그루브"]},{"n":"결과를 미디로 굳히기","s":["아르페지에이터가 걸린 트랙의 리전 선택","트랙 우클릭 → <b>바운스 후 대치</b> 또는 새 트랙에 재녹음","이후 피아노 롤에서 직접 편집"]}],"drill":["코드 하나를 길게 누르고 아르페지에이터의 방향과 속도를 바꿔가며 들어본다.","코드 트리거로 진행 하나를 한 손가락 연주로 만든다.","아르페지에이터 결과를 미디로 굳혀 마지막 마디만 손으로 고친다."],"keys":[["I","인스펙터"],["P","피아노 롤"]],"chk":["미디 이펙트 슬롯 위치를 안다","아르페지에이터로 패턴을 만들 수 있다","결과를 미디로 굳힐 수 있다"],"quiz":[{"q":"미디 이펙트가 처리하는 것은?","a":["오디오 신호","악기에 도달하기 전의 음표 정보","마스터 출력","샘플 파일"],"c":1,"e":"음표 자체를 바꾸므로 악기 앞단에 놓인다."}]},{"d":25,"s":5,"t":"드러머 트랙","goal":"곡에 맞는 드럼 연주를 30분 안에 완성한다.","con":["드러머는 로직이 연주해주는 가상 드러머다. 장르와 연주자를 고르고 세기와 복잡도를 조절하면 그럴듯한 드럼이 나온다. 편곡 초안 단계에서 가장 빠른 길이다.","XY 패드가 핵심이다. 가로가 단순함과 복잡함, 세로가 여림과 셈이다. 벌스는 왼쪽 아래, 코러스는 오른쪽 위로 두는 것이 기본 감각이다.","필인 노브는 마디 끝 채우기 빈도를, 스윙 노브는 그루브를 정한다. 킥과 스네어 패턴은 오른쪽에서 따로 고를 수 있다.","드러머 리전은 언제든 미디 리전으로 바꿔 직접 고칠 수 있다. 큰 틀은 드러머에게 맡기고 세부만 손보는 방식이 효율적이다.","드럼 키트는 별개다. 드러머는 연주를, 드럼 키트는 소리를 담당한다. 같은 연주에 키트만 바꿔도 장르가 달라진다."],"path":[{"n":"드러머 트랙 만들기","s":["<k>⌥⌘N</k> → <b>드러머</b> 선택 → <b>생성</b>","편집기 <k>E</k> → 왼쪽에서 <b>장르</b>와 <b>연주자</b> 선택","XY 패드에서 점 드래그","<b>필인</b>과 <b>스윙</b> 노브 조절"]},{"n":"구간마다 다르게","s":["드러머 리전을 구간별로 분할 <k>⌘T</k>","각 리전 선택 후 XY 위치를 다르게 지정","코러스는 오른쪽 위, 벌스는 왼쪽 아래"]},{"n":"미디로 변환","s":["드러머 리전 우클릭 → <b>MIDI 리전으로 변환</b>","피아노 롤에서 직접 편집"]}],"drill":["8마디 벌스와 8마디 코러스 구조에서 드러머의 XY 위치를 다르게 주고 에너지 차이를 만든다.","드럼 키트를 어쿠스틱에서 일렉트로닉으로 바꿔 같은 연주가 어떻게 달라지는지 듣는다.","드러머 리전을 미디로 변환해 코러스 마지막 마디 필인을 직접 고친다."],"keys":[["E","편집기"],["⌘T","분할"],["⌥⌘N","새 트랙"]],"chk":["XY 패드로 에너지를 조절할 수 있다","구간별로 드럼을 다르게 만들었다","미디 변환 후 직접 수정해봤다"],"quiz":[{"q":"드러머 XY 패드에서 오른쪽 위로 갈수록?","a":["단순하고 여려진다","복잡하고 세진다","템포가 빨라진다","리버브가 커진다"],"c":1,"e":"가로가 복잡도, 세로가 세기다."}]},{"d":26,"s":5,"t":"드럼을 직접 찍는다","goal":"드럼 패턴을 손으로 만들고 장르 문법을 이해한다.","con":["드럼 미디는 음높이가 악기를 뜻한다. 표준 배치에서 킥은 C1, 스네어는 D1, 클로즈 하이햇은 F#1, 오픈 하이햇은 A#1, 라이드는 D#2다. 로직 피아노 롤은 드럼 트랙에서 악기 이름을 함께 보여준다.","기본 8비트는 킥이 1박과 3박, 스네어가 2박과 4박, 하이햇이 8분음표다. 이 뼈대에서 킥을 하나씩 옮기는 것만으로 수많은 그루브가 나온다.","장르별 뼈대. 팝 록은 4분 킥에 8분 하이햇, 하우스는 4분음표 킥 네 번에 오프비트 하이햇, 힙합은 킥과 스네어가 성기고 하이햇이 16분 또는 32분으로 촘촘하다.","고스트 노트가 사람 느낌을 만든다. 스네어의 벨로시티 <v>25~45</v> 짜리 약한 타격을 16분음표 사이에 넣는다.","하이햇은 벨로시티 편차를 반드시 준다. 강 <v>95</v>, 약 <v>60</v>을 번갈아 두는 것만으로도 크게 달라진다."],"path":[{"n":"드럼 트랙 준비","s":["<k>⌥⌘N</k> → 소프트웨어 악기","<k>Y</k> 라이브러리 → <b>Drum Kit</b> 또는 <b>Electronic Drum Kit</b> 패치","<k>⌘</k>+드래그로 빈 미디 리전 생성 → <k>P</k>"]},{"n":"스텝 시퀀서로 찍기","s":["트랙 헤더 우클릭 → <b>패턴 리전 생성</b>","행마다 악기, 칸마다 스텝","각 행의 <b>스텝 비율</b>을 다르게 → 하이햇만 16분음표로"]}],"drill":["기본 8비트를 손으로 찍는다. 하이햇 벨로시티를 강약 번갈아 준다.","같은 8비트에서 킥 위치만 바꿔 네 가지 그루브를 만든다.","하우스 패턴(4분 킥, 오프비트 오픈 하이햇)과 힙합 패턴(성긴 킥, 16분 하이햇)을 각각 2마디씩 만든다."],"keys":[["P","피아노 롤"],["Q","퀀타이즈"],["⌃드래그","벨로시티"]],"chk":["킥, 스네어, 하이햇 음높이를 안다","기본 8비트를 손으로 찍을 수 있다","고스트 노트를 넣어봤다"],"quiz":[{"q":"표준 드럼 배치에서 킥의 음높이는?","a":["C1","D1","F#1","A#1"],"c":0,"e":"C1 킥, D1 스네어, F#1 클로즈 하이햇이 기본 세 자리다."},{"q":"하우스 계열 드럼의 특징은?","a":["성긴 킥과 16분 하이햇","4분음표 킥 네 번","킥 없음","셋잇단 하이햇"],"c":1,"e":"마디마다 4분음표 킥 네 번이 하우스의 뼈대다."}]},{"d":27,"s":5,"t":"베이스","goal":"곡의 바닥을 만드는 베이스 라인을 쓴다.","con":["베이스는 화성의 뿌리와 리듬의 뼈대를 동시에 맡는다. 베이스가 흔들리면 곡 전체가 흔들린다.","음역이 가장 중요하다. 실제 베이스 기타의 최저음은 E1이고 대부분의 연주는 E1에서 G3 사이에서 이루어진다. 미디로 찍을 때 무심코 한 옥타브 아래로 내려가면 소리가 뭉개진다. 베이스 트랙을 만들면 먼저 음역부터 확인한다.","기본 문법은 코드가 바뀔 때 그 코드의 근음을 치는 것이다. 여기서 시작해 5음, 옥타브, 경과음을 더한다.","리듬은 킥과 맞물릴 때 힘이 생긴다. 킥이 있는 자리에 베이스가 함께 있으면 단단하고, 어긋나면 넓게 들린다. 장르에 따라 선택한다.","로직 11의 베이스 플레이어를 쓰면 코드 진행만 주고 연주를 맡길 수 있다. 초안 잡을 때 빠르다."],"path":[{"n":"베이스 트랙","s":["<k>⌥⌘N</k> → 소프트웨어 악기","<k>Y</k> → <b>Bass</b> 분류에서 패치 선택","피아노 롤에서 <b>C2</b> 부근을 기준으로 작업"]},{"n":"베이스 플레이어","s":["<k>⌥⌘N</k> → <b>세션 플레이어</b> → <b>베이스</b>","편집기에서 스타일과 복잡도 조절","코드 트랙에 진행을 입력해 두면 그것을 따라 연주"]}],"drill":["C - Am - F - G 진행에 근음만 온음표로 찍는다. 음역이 E1~G3 안에 있는지 확인한다.","같은 진행에 킥과 완전히 맞물리는 베이스와, 킥과 어긋나는 베이스를 각각 만들어 비교한다.","근음 사이를 경과음으로 이어 걸어다니는 라인을 만든다."],"keys":[["P","피아노 롤"],["Y","라이브러리"]],"chk":["베이스 음역을 지킨다","킥과의 관계를 의식하며 쓴다","경과음을 넣을 수 있다"],"quiz":[{"q":"베이스 기타의 일반적인 최저음은?","a":["C1","E1","A0","G1"],"c":1,"e":"4현 베이스 기준 E1이다. 그 아래로 내려가면 실제 악기 소리와 멀어지고 저음이 뭉개진다."}]},{"d":28,"s":5,"t":"건반 악기","goal":"피아노와 일렉트릭 피아노를 곡의 성격에 맞게 쓴다.","con":["피아노는 화성을 다 담을 수 있어서 편하지만, 그래서 다른 악기의 자리를 뺏기 쉽다. 편곡에서는 무엇을 안 칠지가 더 중요하다.","보이싱이 소리를 결정한다. 근음을 왼손 낮은 곳에 두고 오른손에 3음과 7음을 놓으면 열려 들린다. 세 음을 좁게 뭉치면 답답해진다. C3 아래로는 두 음 이상 겹치지 않는 것이 안전하다.","페달은 CC64다. 미디로 찍을 때 페달을 넣지 않으면 소리가 짧게 끊겨 건조하다. 코드가 바뀔 때마다 페달을 뗐다 밟는다.","일렉트릭 피아노는 벨로시티에 따라 음색이 크게 변한다. 약하게 치면 부드럽고 세게 치면 종처럼 벌어진다. 그래서 벨로시티 편차가 특히 중요하다.","발라드에서는 왼손 근음과 오른손 화음 사이를 넓게 벌리고, 팝에서는 오른손 화음을 좁게 반복하는 편이 많다."],"path":[{"n":"페달 넣기","s":["피아노 롤 왼쪽 아래 <b>오토메이션과 미디 표시</b>","<b>MIDI 컨트롤러 → 64 Sustain</b>","연필로 값 <v>127</v> 구간을 그림","코드 바뀌는 지점마다 <v>0</v>으로 잠깐 떨어뜨림"]}],"drill":["C - Am - F - G를 세 가지 보이싱으로 만든다. 좁은 뭉침, 근음 분리, 3음과 7음 중심.","페달 없이 만든 뒤 CC64를 넣어 차이를 듣는다.","일렉트릭 피아노로 같은 진행을 치고 벨로시티를 50대와 100대로 나눠 음색 변화를 확인한다."],"keys":[["P","피아노 롤"],["⌃드래그","벨로시티"]],"chk":["보이싱에 따라 인상이 달라지는 것을 안다","CC64 페달을 넣을 수 있다","저음역 뭉침을 피한다"],"quiz":[{"q":"서스테인 페달의 컨트롤 체인지 번호는?","a":["CC1","CC11","CC64","CC7"],"c":2,"e":"CC64가 서스테인이다. 127이 밟음, 0이 뗌이다."}]},{"d":29,"s":5,"t":"신시사이저 기초","goal":"감산 합성 네 부분을 이해하고 소리를 직접 만든다.","con":["대부분의 신스는 같은 구조를 갖는다. 오실레이터가 원재료를 만들고, 필터가 깎고, 앰프가 음량 곡선을 정하고, LFO가 흔든다. 이 네 부분만 알면 어떤 신스든 열 수 있다.","오실레이터 파형의 성격. 톱니는 밝고 두껍다. 사각은 속이 빈 듯한 소리로 게임 음악과 베이스에 잘 맞는다. 삼각과 사인은 부드럽고 저음에 좋다. 노이즈는 바람과 타악 효과에 쓴다.","필터의 컷오프는 어디부터 깎을지, 레조넌스는 깎는 지점을 얼마나 강조할지 정한다. 컷오프를 서서히 올리는 것이 신스 사운드의 가장 흔한 움직임이다.","엔벨로프 ADSR. 어택은 소리가 최대에 도달하는 시간, 디케이는 그 뒤 떨어지는 시간, 서스테인은 유지 레벨, 릴리스는 건반을 뗀 뒤 남는 시간이다. 패드는 어택 <v>400~1200</v>ms에 릴리스 <v>800~2000</v>ms, 플럭은 어택 <v>0~5</v>ms에 짧은 디케이다.","로직에는 Retro Synth, ES2, Alchemy가 있다. Retro Synth가 구조를 보기에 가장 쉽다."],"path":[{"n":"Retro Synth 열기","s":["소프트웨어 악기 트랙 생성","인스펙터 악기 슬롯 클릭 → <b>Retro Synth</b>","상단 탭에서 <b>Analog</b> 선택","<b>Osc</b> 파형, <b>Filter</b> 컷오프와 레조넌스, <b>Amp</b> ADSR 확인"]},{"n":"패드 만들기","s":["파형 <b>톱니</b>","필터 컷오프 중간, 레조넌스 낮게","앰프 어택 <v>800</v>ms, 릴리스 <v>1500</v>ms","LFO를 필터에 약하게 연결 → 느린 움직임"]}],"drill":["Retro Synth에서 파형을 톱니, 사각, 삼각으로 바꿔가며 같은 음을 듣고 차이를 적는다.","컷오프를 완전히 닫았다가 천천히 열며 소리 변화를 듣는다.","패드 소리 하나와 플럭 소리 하나를 직접 만들어 프리셋으로 저장한다."],"keys":[["B","스마트 컨트롤"],["I","인스펙터"]],"chk":["네 부분의 역할을 설명할 수 있다","ADSR로 패드와 플럭을 구분해 만들 수 있다","프리셋을 저장했다"],"quiz":[{"q":"건반에서 손을 뗀 뒤 소리가 남는 시간을 정하는 것은?","a":["어택","디케이","서스테인","릴리스"],"c":3,"e":"릴리스다. 패드는 길게, 타악기성 소리는 짧게 둔다."},{"q":"밝고 두꺼워서 신스 리드와 패드에 많이 쓰이는 파형은?","a":["사인","삼각","톱니","노이즈"],"c":2,"e":"톱니파는 배음이 풍부해 필터로 깎을 여지가 많다."}]},{"d":30,"s":5,"t":"스트링과 오케스트라","goal":"현악 편성을 음역에 맞게 배치한다.","con":["현악 4부의 실용 음역. 바이올린 1은 G3에서 E6, 바이올린 2는 G3에서 C6, 비올라는 C3에서 E5, 첼로는 C2에서 A4, 콘트라베이스는 E1에서 G3이다. 이 범위를 벗어나면 실제 연주가 불가능해 보이거나 소리가 어색해진다.","배치의 기본은 아래를 넓게, 위를 좁게다. 첼로와 베이스는 옥타브 이상 벌리고 위쪽 화음은 좁게 쌓는다. 저음에서 3도를 겹치면 탁해진다.","긴 음을 그냥 두면 죽는다. 앞서 배운 CC11로 반드시 움직임을 준다. 온음표 하나에도 미세한 오르내림이 있어야 한다.","레가토와 스타카토를 구간에 따라 나눠 쓴다. 배경은 레가토, 리듬 강조는 스타카토나 스피카토다.","트레몰로와 피치카토는 긴장과 가벼움을 만드는 색채다. 남용하면 싸구려로 들린다."],"path":[{"n":"스트링 4트랙 만들기","s":["<k>⌥⌘N</k> → 소프트웨어 악기 → 개수 <v>4</v>","각 트랙에 <k>Y</k> 라이브러리에서 바이올린, 비올라, 첼로, 베이스 패치","트랙 이름과 색 지정","<b>트랙 스택</b>으로 묶기: 4트랙 선택 후 <k>⌘⇧D</k> → <b>서밍 스택</b>"]}],"drill":["C - Am - F - G 진행을 현악 4부로 편성한다. 각 성부가 음역 안에 있는지 확인한다.","모든 성부에 CC11 곡선을 그려 살아 있게 만든다.","같은 진행을 레가토 버전과 스타카토 버전으로 만들어 성격 차이를 듣는다."],"keys":[["⌘⇧D","트랙 스택"],["P","피아노 롤"]],"chk":["현악 4부 음역을 안다","아래는 넓게 위는 좁게 배치한다","CC11로 긴 음을 살린다"],"quiz":[{"q":"첼로의 최저음은?","a":["E1","C2","G2","C3"],"c":1,"e":"첼로는 C2부터다. 그 아래는 콘트라베이스의 영역이다."}]},{"d":31,"s":5,"t":"기타와 뜯는 악기","goal":"미디 기타를 사람이 친 것처럼 들리게 만든다.","con":["미디 기타가 가짜처럼 들리는 이유는 대개 세 가지다. 여섯 줄로 칠 수 없는 화음을 찍었거나, 스트럼이 동시에 울리거나, 벨로시티가 균일해서다.","기타는 여섯 줄이라 최대 여섯 음이다. 실제 코드 폼을 참고해서 음을 고른다. 개방현 코드는 낮은 근음과 넓은 간격이 특징이다.","스트럼은 위에서 아래로 훑기 때문에 음이 아주 조금씩 시차를 두고 울린다. 미디에서 음마다 <v>8~20</v>ms씩 어긋나게 배치하면 훨씬 그럴듯해진다. 다운 스트로크는 낮은 음부터, 업 스트로크는 높은 음부터다.","아르페지오는 음이 겹쳐 울려야 한다. 각 음의 길이를 다음 음까지 늘려 잔향을 만든다.","일렉트릭 기타는 앰프 시뮬레이터가 소리의 절반이다. 클린한 미디를 만든 뒤 Amp Designer나 Pedalboard를 얹는다."],"path":[{"n":"스트럼 시차 만들기","s":["피아노 롤에서 코드 음 전체 선택","스냅 끄고 <k>⌃</k>+드래그로 음을 하나씩 조금씩 뒤로","또는 <b>MIDI 변형 → 인간미</b>로 위치 무작위화"]},{"n":"앰프 얹기","s":["기타 트랙 채널 스트립 → 오디오 이펙트 슬롯","<b>Amp Designer</b> 선택","프리셋 목록에서 장르에 맞는 앰프 선택"]}],"drill":["기타로 C - G - Am - F를 찍되 각 코드를 6음 이하로 제한하고 스트럼 시차를 15ms씩 준다.","같은 진행을 아르페지오로 만들고 음이 겹쳐 울리도록 길이를 늘린다.","Amp Designer 프리셋을 다섯 개 바꿔가며 같은 프레이즈를 듣는다."],"keys":[["⌃드래그","미세 이동"],["P","피아노 롤"]],"chk":["6음 제한을 지킨다","스트럼 시차를 준다","앰프 시뮬레이터를 얹어봤다"],"quiz":[{"q":"미디 기타 스트럼을 자연스럽게 만드는 핵심은?","a":["모든 음을 정확히 동시에","음마다 8~20ms 시차","벨로시티 127 고정","리버브 최대"],"c":1,"e":"실제 스트럼은 피크가 줄을 차례로 훑기 때문에 미세한 시차가 생긴다."}]},{"d":32,"s":6,"t":"서드파티 플러그인 설치와 검증","goal":"바깥에서 사온 악기와 이펙트를 로직에 안전하게 들인다.","con":["맥의 로직은 오디오 유닛(AU) 형식만 읽는다. 윈도우 진영의 VST는 그대로 쓸 수 없다. 플러그인을 살 때 AU 지원 여부를 먼저 확인하는 습관이 필요하다. 대부분의 제품은 AU와 VST를 함께 제공한다.","설치되는 자리는 정해져 있다. 컴포넌트 파일이 <b>/Library/Audio/Plug-Ins/Components</b>에 들어간다. 설치 프로그램이 알아서 넣어주므로 직접 옮길 일은 드물지만, 문제가 생겼을 때 어디를 봐야 하는지는 알아둬야 한다.","로직은 실행할 때 새 플러그인을 자동으로 검사한다. 이것이 검증이다. 검증에 실패한 플러그인은 목록에 나타나지 않는다. 새 플러그인을 설치했는데 보이지 않는다면 대개 검증 실패이거나 로직을 재실행하지 않았기 때문이다.","애플 실리콘 맥에서는 플러그인이 네이티브인지 인텔용인지가 문제가 된다. 인텔용만 있는 오래된 플러그인은 로직 전체를 로제타로 실행해야 쓸 수 있고, 그러면 성능이 떨어진다. 가능하면 네이티브 버전으로 갱신한다.","플러그인을 지울 때는 컴포넌트 파일을 지우고 로직을 다시 켠다. 목록에 남아 있으면 플러그인 관리자에서 지운다."],"path":[{"n":"검증 상태 확인","s":["<b>Logic Pro → 설정 → 플러그인 관리자</b>","목록에서 제조사와 플러그인 검색","<b>호환성</b> 열에서 검증 통과 여부 확인","실패한 항목 선택 → <b>재검증</b>"]},{"n":"악기 불러오기","s":["소프트웨어 악기 트랙 선택 → <k>I</k> 인스펙터","<b>악기</b> 슬롯 클릭 → <b>AU 악기</b> → 제조사 → 플러그인","스테레오와 멀티 아웃풋 중 선택"]}],"drill":["플러그인 관리자를 열어 설치된 서드파티 목록을 확인하고 검증 실패 항목이 있는지 본다.","무료 AU 악기를 하나 설치해 로직 재실행 후 목록에 뜨는지 확인한다.","악기 슬롯에서 스테레오와 멀티 아웃풋 항목이 둘 다 보이는지 확인한다."],"keys":[["I","인스펙터"],["X","믹서"]],"chk":["로직이 AU만 읽는다는 것을 안다","플러그인 관리자에서 검증을 확인할 수 있다","설치 경로를 안다"],"quiz":[{"q":"맥용 로직이 읽는 플러그인 형식은?","a":["VST","VST3","AU","AAX"],"c":2,"e":"오디오 유닛만 지원한다. 구입 전에 AU 제공 여부를 확인해야 한다."},{"q":"새로 설치한 플러그인이 목록에 없을 때 먼저 볼 곳은?","a":["믹서","플러그인 관리자","프로젝트 설정","라이브러리"],"c":1,"e":"검증에 실패하면 목록에 나타나지 않는다. 관리자에서 재검증을 시도한다."}]},{"d":33,"s":6,"t":"샘플 라이브러리의 원리와 컨탁","goal":"샘플 악기가 어떻게 소리를 내는지 이해하고 라이브러리를 불러온다.","con":["샘플 라이브러리는 실제 악기를 녹음해 모아둔 것이다. 원리는 단순하다. 음마다, 세기마다, 주법마다 따로 녹음한 오디오 파일을 건반에 배치해두고, 연주하면 해당 파일을 재생한다.","세 가지 층으로 되어 있다. 샘플은 실제 오디오 파일이다. 매핑은 어떤 건반과 어떤 벨로시티에 어떤 샘플을 놓을지 정한 표다. 스크립트는 레가토 연결이나 주법 전환 같은 동작을 처리하는 규칙이다. 우리가 사는 제품은 이 세 층을 묶은 것이다.","벨로시티 레이어는 세기별로 다른 녹음을 쌓은 것이다. 층이 많을수록 자연스럽지만 용량이 커진다. 라운드 로빈은 같은 음을 연달아 칠 때 매번 다른 녹음을 돌려쓰는 장치다. 이것이 없으면 반복 타격이 기계처럼 들린다. 이 두 가지가 좋은 라이브러리와 아닌 것을 가른다.","컨탁은 이런 라이브러리를 돌리는 재생기다. 컨탁 자체는 그릇이고 라이브러리가 내용물이다. 무료 컨탁 플레이어로 열리는 제품이 있고 정식 컨탁이 있어야 열리는 제품이 있다. 구입 전에 어느 쪽인지 확인한다.","파일 확장자로 구분한다. 인스트루먼트 하나는 NKI, 여러 개를 묶은 멀티는 NKM이다. 플레이어 대응 제품은 컨탁의 라이브러리 목록에 나타나고, 비대응 제품은 파일 브라우저에서 NKI를 직접 찾아 연다."],"path":[{"n":"컨탁 열고 악기 로드","s":["소프트웨어 악기 트랙 → 악기 슬롯 → <b>AU 악기 → Native Instruments → Kontakt</b>","왼쪽 <b>라이브러리</b>에서 제품 선택 → 악기 클릭","비대응 제품은 <b>Files</b> 탭에서 NKI 파일 위치로 이동해 더블 클릭"]},{"n":"음원 확인","s":["건반을 눌러 매핑 범위 확인. 회색 건반은 소리 없는 구간","낮은 음역의 색이 다른 건반은 키스위치","제품 화면의 <b>Dynamics</b> 또는 <b>Expression</b> 노브가 CC1과 CC11에 연결되어 있는지 확인"]}],"drill":["샘플 라이브러리를 하나 열어 연주 가능한 음역과 키스위치 위치를 확인한다.","같은 음을 여덟 번 연속으로 쳐보고 소리가 매번 조금씩 다른지 듣는다. 라운드 로빈이 있는지 판단한다.","벨로시티를 30, 70, 110으로 나눠 쳐보고 음색이 몇 단계로 바뀌는지 센다."],"keys":[["I","인스펙터"],["P","피아노 롤"]],"chk":["샘플, 매핑, 스크립트 세 층을 설명할 수 있다","라운드 로빈이 있는지 귀로 확인할 수 있다","NKI와 NKM을 구분한다"],"quiz":[{"q":"같은 음을 연달아 칠 때 매번 다른 녹음을 돌려 쓰는 장치는?","a":["벨로시티 레이어","라운드 로빈","키스위치","레가토 스크립트"],"c":1,"e":"라운드 로빈이 없으면 연타가 복사한 것처럼 똑같이 들린다."},{"q":"컨탁에서 인스트루먼트 하나의 파일 확장자는?","a":["NKI","NKM","NKS","WAV"],"c":0,"e":"NKI가 인스트루먼트, NKM이 멀티다."}]},{"d":34,"s":6,"t":"멀티 아웃풋과 라우팅","goal":"악기 하나 안의 여러 소리를 믹서에서 따로 다룬다.","con":["샘플 악기는 하나의 인스턴스 안에 여러 악기를 담을 수 있다. 컨탁은 최대 16개까지 담긴다. 이것을 멀티팀버라고 한다. 컴퓨터 자원을 아낄 수 있지만 믹싱이 불편해진다.","기본 상태에서는 16개 악기의 소리가 하나의 채널로 합쳐 나온다. 스트링 전체에 리버브를 걸 수는 있어도 첼로에만 다르게 걸 수는 없다. 이걸 해결하는 것이 멀티 아웃풋이다.","멀티 아웃풋으로 악기를 불러오면 믹서에서 여러 채널을 뽑아낼 수 있다. 각 악기의 출력을 서로 다른 번호로 지정하면 채널이 나뉜다. 그때부터 악기마다 따로 EQ와 컴프를 걸 수 있다.","미디 쪽도 나눠야 한다. 악기마다 미디 채널 번호를 다르게 주고, 로직에서는 트랙을 여러 개 만들어 같은 악기를 가리키되 채널만 다르게 지정한다.","판단 기준. 오케스트라처럼 악기가 많고 각각 다르게 처리해야 하면 멀티 아웃풋을 쓴다. 악기 두세 개면 그냥 인스턴스를 따로 만드는 편이 단순하고 사고가 적다."],"path":[{"n":"멀티 아웃풋으로 불러오기","s":["악기 슬롯 클릭 → 플러그인 이름 옆 <b>멀티 아웃풋</b> 항목 선택","<k>X</k> 믹서 → 해당 채널 스트립 하단 <b>+</b> 버튼 클릭 → Aux 채널 생성","필요한 개수만큼 반복"]},{"n":"악기별 출력 지정","s":["플러그인 안에서 각 악기의 <b>Output</b>을 <v>st.1</v>, <v>st.2</v>처럼 다르게 지정","믹서에서 채널이 나뉘어 나오는지 확인"]},{"n":"미디 채널 나누기","s":["트랙 헤더 우클릭 → <b>기존 트랙에 트랙 생성</b>","<k>I</k> 인스펙터 → <b>MIDI 채널</b>을 <v>1</v>, <v>2</v>… 로 지정","플러그인 안 악기의 미디 채널과 맞춤"]}],"drill":["샘플 악기 하나에 세 개의 악기를 올리고 멀티 아웃풋으로 채널을 셋으로 나눈다.","각 채널에 서로 다른 리버브 양을 보내 차이를 확인한다.","같은 구성을 인스턴스 세 개로도 만들어 어느 쪽이 편한지 비교한다."],"keys":[["X","믹서"],["I","인스펙터"]],"chk":["멀티팀버와 멀티 아웃풋을 구분한다","믹서에서 Aux 채널을 뽑을 수 있다","미디 채널을 나눌 수 있다"],"quiz":[{"q":"악기 하나 안의 여러 소리를 믹서에서 따로 처리하려면?","a":["스테레오로 불러온다","멀티 아웃풋으로 불러온다","트랙을 복제한다","프리즈한다"],"c":1,"e":"멀티 아웃풋으로 불러와야 믹서에서 Aux 채널을 뽑을 수 있다."}]},{"d":35,"s":6,"t":"로직 자체 샘플러","goal":"내가 가진 오디오를 연주 가능한 악기로 만든다.","con":["로직에는 샘플러가 둘 있다. Quick Sampler는 오디오 하나를 즉시 악기로 만드는 도구다. Sampler는 여러 샘플을 직접 배치하는 본격 도구다.","Quick Sampler의 네 가지 모드. Classic은 음높이를 따라 늘려 연주한다. One Shot은 건반을 뗴도 끝까지 재생한다. Slice는 타격 지점마다 잘라 건반에 흩어 놓는다. Recorder는 바로 녹음해 받는다.","드럼 루프를 Slice 모드로 넣으면 각 타격이 건반 하나씩 배정된다. 순서를 바꿔 새 그루브를 만들 수 있다. 남의 루프를 그대로 쓰는 것보다 훨씬 자기 것이 된다.","Sampler에서는 존과 그룹을 다룬다. 존은 샘플 하나가 놓인 건반 범위와 벨로시티 범위다. 그룹은 존들을 묶어 공통 규칙을 주는 단위다. 벨로시티 레이어와 라운드 로빈을 직접 만들 수 있다.","루프 포인트를 지정하면 짧은 샘플도 길게 늘여 연주할 수 있다. 파형에서 반복 구간을 지정하는 방식이다.","현장에서 자주 쓰는 방법 하나. 마음에 드는 소리를 녹음해 Quick Sampler에 넣고 악기로 만들면, 아무도 갖고 있지 않은 음색이 생긴다."],"path":[{"n":"Quick Sampler","s":["악기 슬롯 → <b>Quick Sampler</b>","오디오 파일을 창 가운데로 드래그","상단에서 <b>Classic / One Shot / Slice / Recorder</b> 선택","<b>Pitch</b>, <b>Filter</b>, <b>Amp</b>에서 다듬기"]},{"n":"Slice로 그루브 만들기","s":["드럼 루프를 드래그 → <b>Slice</b> 모드","슬라이스 방식을 <b>Transient</b>로","<b>MIDI 드래그</b> 아이콘을 트랙으로 끌어 놓으면 원본 순서 미디 생성","피아노 롤에서 순서를 바꿔 새 그루브"]},{"n":"Sampler 매핑","s":["악기 슬롯 → <b>Sampler</b>","<b>Mapping</b> 탭 → 샘플 드래그","존의 좌우 끝을 드래그해 건반 범위 지정","<b>Zone → Velocity Range</b>로 세기 층 나누기"]}],"drill":["목소리나 주변 소리를 녹음해 Quick Sampler로 악기를 만들고 한 프레이즈 연주한다.","드럼 루프를 Slice로 잘라 미디를 뽑고 순서를 바꿔 새 패턴을 만든다.","Sampler에서 샘플 두 개를 벨로시티 범위로 나눠 배치한다."],"keys":[["I","인스펙터"],["P","피아노 롤"]],"chk":["네 가지 모드를 구분한다","Slice로 미디를 뽑아봤다","존과 그룹의 차이를 안다"],"quiz":[{"q":"드럼 루프를 타격마다 잘라 건반에 배치하는 모드는?","a":["Classic","One Shot","Slice","Recorder"],"c":2,"e":"Slice 모드는 트랜지언트 기준으로 잘라 각 조각을 건반에 배정한다."}]},{"d":36,"s":6,"t":"라이브러리 관리","goal":"용량과 속도 문제를 미리 막는다.","con":["샘플 라이브러리는 크다. 오케스트라 제품 하나가 수백 기가를 차지하는 일이 흔하다. 내장 디스크가 금방 차므로 처음부터 외장에 두는 계획이 필요하다.","저장 매체가 성능을 좌우한다. 샘플 재생은 디스크에서 실시간으로 읽는 작업이라 읽기 속도가 중요하다. 외장 SSD를 쓰고 연결은 가능한 한 빠른 단자를 쓴다. 회전식 하드디스크에 큰 라이브러리를 두면 소리가 끊긴다.","프리로드 버퍼는 각 샘플의 앞부분을 메모리에 미리 올려두는 양이다. 크게 잡으면 디스크 부담이 줄고 메모리를 많이 쓴다. 작게 잡으면 반대다. 디스크가 느리면 키우고 메모리가 부족하면 줄인다.","퍼지는 지금 연주에 쓰이지 않는 샘플을 메모리에서 걷어내는 기능이다. 큰 오케스트라 편성에서 메모리가 모자랄 때 효과가 크다. 다만 새 음을 연주하면 다시 불러와야 한다.","라이브러리를 옮길 때는 파일만 복사해서는 안 된다. 관리 프로그램에서 위치를 다시 알려줘야 한다. 그냥 옮기면 악기가 샘플을 찾지 못한다.","백업은 라이브러리 원본과 프로젝트를 따로 생각한다. 라이브러리는 다시 내려받을 수 있는 경우가 많지만, 프로젝트와 녹음 파일은 잃으면 끝이다. 프로젝트 백업이 우선이다."],"path":[{"n":"메모리 설정","s":["샘플러 플러그인의 <b>Options</b> 또는 <b>설정</b> 열기","<b>Memory</b> 항목의 프리로드 버퍼 값 조정","<b>Purge</b> 메뉴에서 사용하지 않는 샘플 제거"]},{"n":"위치 옮기기","s":["라이브러리 폴더를 외장 디스크로 복사","제조사 관리 프로그램에서 <b>위치 변경</b> 또는 <b>재지정</b>","프로그램에서 인식되는지 확인한 뒤 원본 삭제"]}],"drill":["설치된 라이브러리의 총 용량을 확인하고 남은 디스크 공간과 비교한다.","프리로드 버퍼를 키우고 줄여가며 큰 편성에서 끊김이 생기는 지점을 찾는다.","프로젝트 폴더 백업 규칙을 정해 적어둔다."],"keys":[["⌘S","저장"]],"chk":["SSD가 필요한 이유를 안다","프리로드 버퍼의 역할을 안다","라이브러리 이동 절차를 안다"],"quiz":[{"q":"샘플 재생에서 디스크 속도가 중요한 이유는?","a":["파일이 압축되어 있어서","연주 중 실시간으로 읽어오기 때문","백업이 자주 필요해서","CPU를 대신해서"],"c":1,"e":"메모리에 올린 앞부분 이후는 디스크에서 계속 읽는다. 느리면 소리가 끊긴다."}]},{"d":37,"s":7,"t":"코드와 진행","goal":"진행을 만들고 코드 트랙으로 관리한다.","con":["코드는 세 음 이상을 쌓은 것이다. 장3화음은 근음, 장3도, 완전5도. 단3화음은 근음, 단3도, 완전5도. 7화음은 여기에 7도를 얹는다.","자주 쓰는 진행 몇 개만 손에 익혀도 곡이 나온다. I - V - vi - IV, vi - IV - I - V, I - vi - IV - V, ii - V - I. 다장조로 쓰면 각각 C-G-Am-F, Am-F-C-G, C-Am-F-G, Dm-G-C다.","자리바꿈은 같은 코드의 음 순서를 바꾼 것이다. 진행할 때 각 성부가 가까운 음으로 이동하도록 자리바꿈을 고르면 부드러워진다. 이것이 성부 진행이다.","로직의 코드 트랙에 진행을 입력해두면 세션 플레이어와 아르페지에이터가 그것을 따라간다. 편곡 실험이 빨라진다.","단조는 자연단음계 기준으로 i - VI - III - VII이 흔하다. 다섯 번째 화음을 장3화음으로 바꾸면 화성단음계가 되고 긴장이 커진다."],"path":[{"n":"코드 트랙 쓰기","s":["<k>G</k> → 글로벌 트랙 헤더 우클릭 → <b>코드</b> 체크","코드 트랙 더블 클릭 → 코드 입력창","근음, 성질, 베이스음 지정"]},{"n":"미디에서 코드 만들기","s":["피아노 롤에서 근음 찍기","<k>⌥</k>+드래그로 위로 복사 후 음높이 조절","코드 전체 선택 후 위아래 드래그 → 통째 이조"]}],"drill":["네 가지 진행을 각각 4마디씩 미디로 만들어 이어 붙이고 인상 차이를 적는다.","같은 진행을 자리바꿈 없이 한 번, 성부 진행을 매끄럽게 한 번 만들어 비교한다.","코드 트랙에 진행을 입력하고 베이스 플레이어가 따라오는지 확인한다."],"keys":[["G","글로벌 트랙"],["P","피아노 롤"]],"chk":["네 가지 기본 진행을 안다","자리바꿈으로 성부 진행을 다듬을 수 있다","코드 트랙을 쓸 수 있다"],"quiz":[{"q":"C - G - Am - F는 어떤 진행인가?","a":["I - V - vi - IV","vi - IV - I - V","ii - V - I","I - IV - V - I"],"c":0,"e":"대중음악에서 가장 많이 쓰이는 진행 중 하나다."}]},{"d":38,"s":7,"t":"곡 구조 설계","goal":"4분 안에 기승전결이 들리는 구조를 만든다.","con":["대중음악의 기본 구조는 인트로 - 벌스 - 프리코러스 - 코러스 - 벌스 - 프리코러스 - 코러스 - 브리지 - 코러스 - 아웃트로다. 이 틀에서 빼고 더하면 대부분의 곡이 나온다.","마디 수의 감각. 인트로 4~8, 벌스 8~16, 프리 4~8, 코러스 8~16, 브리지 8이 일반적이다. 홀수 마디는 의도할 때만 쓴다.","에너지 곡선을 그려놓고 시작하면 좋다. 곡 전체를 100으로 볼 때 첫 코러스에서 70, 두 번째 코러스에서 85, 마지막 코러스에서 100에 닿는 식이다.","절정은 곡의 62퍼센트 지점 근처에 두면 안정적으로 들린다. 3분 30초 곡이면 2분 10초 부근이다. 앞뒤로 15퍼센트 안이면 충분히 자연스럽다.","구간 사이 전환이 곡의 완성도를 가른다. 코러스 직전 한 박을 비우거나, 드럼을 빼거나, 라이저를 넣는다."],"path":[{"n":"구조 먼저 세우기","s":["<k>G</k> → 어레인지먼트 트랙","마커를 인트로 4 / 벌스 8 / 프리 4 / 코러스 8 순으로 생성","마커 이름 지정","소리를 채우기 전에 구조부터 완성"]}],"drill":["3분 30초 목표 곡의 구조를 마커로 설계하고 총 마디 수와 예상 시간을 계산한다.","에너지 곡선을 종이에 그리고 각 구간의 트랙 수를 미리 정한다.","절정 지점이 62퍼센트 부근에 오는지 확인한다."],"keys":[["G","글로벌 트랙"],["⌘R","반복"]],"chk":["표준 구조를 외웠다","마디 수 감각이 생겼다","절정 위치를 계산할 수 있다"],"quiz":[{"q":"곡의 절정을 두기 좋은 위치는 대략?","a":["전체의 30퍼센트","전체의 50퍼센트","전체의 62퍼센트","전체의 90퍼센트"],"c":2,"e":"62퍼센트 근처가 황금분할에 해당해 안정적으로 들린다."}]},{"d":39,"s":7,"t":"음역 배치와 자리 나누기","goal":"악기들이 서로 가리지 않게 주파수 자리를 나눈다.","con":["곡이 탁하게 들리는 가장 큰 원인은 여러 악기가 같은 음역에 몰려 있기 때문이다. 믹스로 고치기 전에 편곡에서 자리를 나누는 것이 정답이다.","음역을 네 층으로 나눠 생각한다. 저역은 <v>20~200</v>Hz로 킥과 베이스, 중저역은 <v>200~800</v>Hz로 기타 코드와 왼손 피아노, 중고역은 <v>800~4000</v>Hz로 보컬과 리드, 고역은 <v>4000</v>Hz 이상으로 하이햇과 공기감이다.","저역에는 한 번에 하나만 둔다. 킥과 베이스가 같은 음역에서 싸우면 둘 다 흐려진다. 킥을 <v>60</v>Hz 부근, 베이스를 <v>90</v>Hz 부근으로 나누는 식으로 정한다.","보컬이 있는 곡이라면 중고역은 보컬의 자리다. 다른 악기의 화려한 움직임을 그 자리에서 빼면 보컬이 저절로 들린다.","같은 코드를 두 악기가 칠 때는 옥타브를 다르게 하거나 한쪽이 일부 음만 맡는다."],"path":[{"n":"음역 확인","s":["채널 스트립 이펙트 슬롯 → <b>Channel EQ</b>","분석기 버튼 켜기 → 실시간 스펙트럼 확인","여러 트랙을 하나씩 솔로로 들으며 어디에 몰려 있는지 확인"]}],"drill":["기존 프로젝트에서 트랙별 주요 음역을 표로 적는다. 겹치는 곳을 찾는다.","겹친 두 악기 중 하나를 옥타브 올리거나 음을 덜어내고 다시 듣는다.","킥과 베이스만 솔로로 듣고 서로 다른 음역에 있는지 확인한다."],"keys":[["S","솔로"],["X","믹서"]],"chk":["네 개 음역 층을 안다","저역에 하나만 두는 원칙을 지킨다","보컬 자리를 비워둔다"],"quiz":[{"q":"곡이 탁하게 들리는 가장 흔한 원인은?","a":["리버브 부족","같은 음역에 악기가 몰림","템포가 느림","트랙 수가 적음"],"c":1,"e":"편곡 단계에서 음역을 나누는 것이 근본 해결책이다."}]},{"d":40,"s":7,"t":"리듬 층 쌓기","goal":"드럼 말고도 리듬을 만드는 방법을 익힌다.","con":["그루브는 드럼만의 일이 아니다. 어떤 악기든 짧게 끊어 치면 리듬 악기가 된다.","세 층으로 생각한다. 기본 박을 잡는 층(킥과 베이스), 세분을 채우는 층(하이햇, 셰이커, 기타 커팅), 강조하는 층(스네어, 클랩, 악센트).","세분 층이 비면 곡이 느슨해진다. 하이햇 대신 셰이커나 짧은 신스 스타카토, 또는 기타 뮤트 커팅으로 채워도 된다.","오프비트가 움직임을 만든다. 박과 박 사이에 놓인 소리가 곡을 앞으로 민다. 하우스의 오프비트 오픈 하이햇, 레게의 뒷박 기타가 대표적이다.","악센트를 한 마디에 하나씩만 다르게 줘도 여덟 마디가 지루하지 않다. 8마디 중 마지막 마디를 살짝 다르게 만드는 것이 가장 쉬운 방법이다."],"path":[{"n":"세분 층 만들기","s":["새 소프트웨어 악기 트랙 → 퍼커션 패치","16분음표로 셰이커 패턴 입력","벨로시티를 강약 번갈아","<k>Q</k> 퀀타이즈 강도 <v>85</v>퍼센트, 스윙 <v>55</v>"]}],"drill":["기존 드럼 위에 셰이커 층을 하나 얹고 있고 없고를 비교한다.","기타나 신스를 짧게 끊어 오프비트에 배치해 리듬 악기로 써본다.","8마디 반복 구간에서 마지막 마디만 다르게 만든다."],"keys":[["Q","퀀타이즈"],["M","뮤트"]],"chk":["세 층 개념을 안다","세분 층을 채워봤다","오프비트로 움직임을 만들었다"],"quiz":[{"q":"곡이 느슨하게 들릴 때 보강하면 좋은 층은?","a":["기본 박 층","세분 층","강조 층","저역 층"],"c":1,"e":"16분음표 계열의 세분 층이 비면 곡이 늘어져 들린다."}]},{"d":41,"s":7,"t":"장르별 편성 레시피","goal":"장르를 정하면 어떤 트랙을 만들지 바로 떠오르게 한다.","con":["장르는 규칙이 아니라 재료 목록이다. 어떤 악기를 몇 개 쓰는지, 템포와 그루브가 어떤지, 무엇을 비워두는지가 장르를 만든다.","발라드. 템포 <v>62~76</v>. 피아노, 스트링, 베이스, 부드러운 드럼, 패드. 벌스는 피아노와 목소리만, 코러스에서 스트링과 드럼이 들어온다. 저역은 얕게.","팝. 템포 <v>100~120</v>. 드럼, 베이스, 기타 또는 신스 코드, 리드, 백보컬. 코러스에 훅이 반복된다. 세분 층이 항상 있다.","알앤비. 템포 <v>70~92</v>. 성긴 킥과 스네어, 촘촘한 하이햇, 일렉트릭 피아노, 낮은 베이스, 넓은 패드. 코드가 7화음과 9화음 중심이다.","하우스. 템포 <v>122~128</v>. 4분 킥, 오프비트 하이햇, 클랩, 베이스라인, 코드 스탭. 반복과 필터 움직임이 핵심.","록. 템포 <v>120~160</v>. 드럼, 베이스, 리듬 기타 둘, 리드 기타, 보컬. 기타 두 대를 좌우로 벌린다.","영화 음악. 템포 자유. 스트링, 목관, 금관, 타악, 피아노, 패드. 다이내믹 폭이 크고 CC11 작업이 대부분이다."],"path":[{"n":"템플릿 만들기","s":["장르별 트랙 구성을 만든 뒤 <b>파일 → 템플릿으로 저장</b>","다음부터 <b>파일 → 신규 → 나의 템플릿</b>에서 불러오기"]}],"drill":["세 가지 장르를 골라 각각 트랙 목록을 종이에 적는다. 트랙 수와 이름까지.","가장 자주 만들 장르 하나를 템플릿으로 저장한다.","같은 코드 진행을 두 장르로 편성해 얼마나 달라지는지 확인한다."],"keys":[["⌥⌘N","새 트랙"],["⌘S","저장"]],"chk":["장르별 템포 범위를 안다","템플릿을 하나 만들었다","같은 진행을 두 장르로 편성해봤다"],"quiz":[{"q":"하우스의 전형적인 템포 범위는?","a":["70~92","100~110","122~128","172~176"],"c":2,"e":"122~128 사이가 하우스의 표준 구간이다."}]},{"d":42,"s":8,"t":"오디오 녹음 세팅","goal":"잡음 없이 적정 레벨로 녹음한다.","con":["녹음 전에 확인할 것은 세 가지다. 오디오 인터페이스가 잡혀 있는지, 트랙의 입력이 맞는지, 레벨이 적정한지.","레벨의 기준은 피크 <v>-12</v>에서 <v>-6</v>dBFS다. 0에 닿으면 클립이라 되돌릴 수 없다. 여유를 크게 두는 편이 안전하다. 24비트로 녹음하면 작게 녹음해도 노이즈 문제가 없다.","버퍼 크기는 녹음할 때 작게, 믹스할 때 크게 둔다. 녹음 <v>64~128</v> 샘플, 믹스 <v>512~1024</v> 샘플이 일반적이다. 작을수록 지연이 적고 컴퓨터 부담이 크다.","샘플레이트는 <v>48</v>kHz, 비트 심도는 <v>24</v>비트를 기본으로 한다. 프로젝트 시작 후에는 바꾸지 않는다.","모니터링은 인터페이스의 다이렉트 모니터를 쓰는 편이 지연이 없다. 로직의 소프트웨어 모니터링을 쓸 때는 버퍼를 최소로 낮춘다."],"path":[{"n":"장치 설정","s":["<b>Logic Pro → 설정 → 오디오 → 장비</b>","<b>출력 장비</b>와 <b>입력 장비</b> 지정","<b>I/O 버퍼 크기</b>를 <v>128</v>으로","<b>적용</b>"]},{"n":"녹음 준비","s":["오디오 트랙 생성 <k>⌥⌘N</k> → <b>오디오</b>","인스펙터에서 <b>입력</b> 채널 선택","트랙 헤더 <b>R</b> 버튼(녹음 준비) 켜기","레벨 미터 확인하며 인터페이스 게인 조절 → 피크 <v>-12</v>dBFS","<k>R</k>로 녹음"]},{"n":"프로젝트 포맷","s":["<b>파일 → 프로젝트 설정 → 오디오</b>","<b>샘플률</b> <v>48</v>kHz","<b>녹음 파일 유형</b> 확인"]}],"drill":["오디오 트랙을 만들고 마이크를 연결해 30초를 녹음한다. 피크가 -12dBFS 근처인지 확인한다.","버퍼를 1024로 올려 지연을 체감한 뒤 128로 되돌린다.","일부러 클립시켜 소리가 어떻게 깨지는지 한 번 들어본다."],"keys":[["R","녹음"],["스페이스","재생"],["⌘S","저장"]],"chk":["적정 레벨을 안다","버퍼 크기를 상황에 따라 바꾼다","입력 채널을 지정할 수 있다"],"quiz":[{"q":"녹음 시 권장 피크 레벨은?","a":["0dBFS","-3dBFS","-12에서 -6dBFS","-40dBFS"],"c":2,"e":"여유를 두어야 클립을 피하고 이후 처리 공간이 생긴다."}]},{"d":43,"s":8,"t":"테이크와 컴핑","goal":"여러 번 부른 것 중 좋은 부분만 골라 하나로 만든다.","con":["컴핑은 여러 테이크에서 좋은 구간만 골라 이어 붙이는 작업이다. 보컬 작업의 핵심 기술이다.","사이클 녹음을 켜고 같은 구간을 반복 녹음하면 테이크 폴더가 자동으로 만들어진다. 테이크가 층층이 쌓인다.","테이크 폴더를 열면 모든 테이크가 보인다. 원하는 구간을 드래그해 선택하면 그 부분이 최종 결과에 포함된다. 로직이 경계에 자동으로 크로스페이드를 넣는다.","자르는 지점은 소리가 없거나 약한 곳으로 잡는다. 단어 중간에서 자르면 티가 난다. 숨 쉬는 자리가 가장 좋다.","컴핑이 끝나면 병합해서 하나의 오디오 리전으로 만든다. 그 뒤에 정리 작업을 한다."],"path":[{"n":"사이클 녹음","s":["구간을 사이클로 지정 <k>⌘U</k>","<b>레코드 → 오디오 레코딩 설정</b>에서 <b>테이크 폴더 생성</b> 확인","<k>R</k>로 반복 녹음"]},{"n":"컴핑","s":["테이크 폴더 왼쪽 위 <b>펼침 삼각형</b> 클릭","원하는 테이크의 좋은 구간을 드래그","경계 지점 드래그로 미세 조정","완료 후 폴더 우클릭 → <b>병합</b>"]}],"drill":["같은 8마디를 5번 녹음해 테이크 폴더를 만든다.","각 테이크에서 좋은 구간을 골라 하나로 조립한다. 자르는 지점을 숨 자리에 둔다.","완성된 컴프를 병합하고 원본 테이크 폴더는 보관한다."],"keys":[["R","녹음"],["C","사이클"],["⌘U","선택을 사이클로"]],"chk":["테이크 폴더를 만들 수 있다","자르는 지점을 숨 자리에 둔다","병합까지 마쳤다"],"quiz":[{"q":"컴핑에서 테이크를 자르기 좋은 지점은?","a":["가장 큰 소리 부분","단어 한가운데","숨 쉬는 자리","마디 첫 박"],"c":2,"e":"소리가 없거나 약한 자리에서 자르면 이음매가 들리지 않는다."}]},{"d":44,"s":8,"t":"플렉스 타임과 플렉스 피치","goal":"오디오의 타이밍과 음정을 고친다.","con":["플렉스 타임은 오디오의 타이밍을 미디처럼 옮길 수 있게 해준다. 파형에 트랜지언트 표시가 생기고 그것을 드래그하면 앞뒤가 늘어나거나 줄어든다.","모드 선택이 중요하다. 단선율 악기와 보컬은 모노포닉, 코드가 들어간 것은 폴리포닉, 드럼은 슬라이싱이 적합하다. 잘못 고르면 소리가 뭉개진다.","플렉스 피치는 보컬의 음정을 고친다. 각 음이 막대로 표시되고 위아래로 드래그하면 음정이 바뀐다. 비브라토와 음정 흔들림도 따로 조절할 수 있다.","음정 보정은 완전히 붙이지 않는 것이 자연스럽다. 완벽하게 맞추면 기계처럼 들린다. 눈에 띄게 벗어난 음만 고치는 것이 기본이다.","플렉스를 켜면 컴퓨터 부담이 커진다. 작업이 끝나면 바운스해서 새 오디오로 만드는 편이 좋다."],"path":[{"n":"플렉스 켜기","s":["<k>⌘F</k> → 트랙 영역에 플렉스 표시","트랙 헤더의 <b>플렉스</b> 버튼 클릭","모드 선택: <b>모노포닉 / 폴리포닉 / 슬라이싱 / 리듬</b>","파형의 세로선을 드래그"]},{"n":"플렉스 피치","s":["트랙 플렉스 모드를 <b>플렉스 피치</b>로","오디오 리전 더블 클릭 → 오디오 트랙 편집기","음 막대를 위아래로 드래그 → 음정","막대 위 여섯 개 핸들로 미세 조정"]}],"drill":["보컬이나 단선율 오디오에 플렉스 타임을 켜고 늦은 음을 앞으로 당긴다.","플렉스 피치로 벗어난 음 두세 개만 고치고 나머지는 그대로 둔다.","전부 완벽히 맞춘 버전과 비교해 어느 쪽이 자연스러운지 판단한다."],"keys":[["⌘F","플렉스 표시"],["E","편집기"]],"chk":["플렉스 모드를 구분해 쓴다","타이밍을 고칠 수 있다","과도한 보정을 피한다"],"quiz":[{"q":"드럼 오디오에 적합한 플렉스 모드는?","a":["모노포닉","폴리포닉","슬라이싱","속도"],"c":2,"e":"슬라이싱은 타격 지점을 기준으로 잘라 옮기기 때문에 타악기에 적합하다."}]},{"d":45,"s":8,"t":"보컬 편집 기초","goal":"녹음된 목소리를 들을 만한 상태로 정리한다.","con":["보컬 편집 순서는 정해져 있다. 컴핑 → 잡음 정리 → 타이밍 → 음정 → 이후 믹싱이다. 순서를 지키면 되돌아갈 일이 줄어든다.","잡음 정리는 노래하지 않는 구간을 지우는 일이다. 리전 사이 빈 곳을 잘라내면 방 소리와 입 소리가 사라져 훨씬 깨끗해진다. 다만 숨소리를 전부 지우면 부자연스러워지므로 크기만 줄이는 편이 낫다.","페이드는 필수다. 자른 지점마다 짧은 페이드를 넣지 않으면 딸깍 소리가 난다. <v>3~10</v>ms면 충분하다.","더블링은 같은 부분을 한 번 더 불러 좌우로 벌리는 기법이다. 코러스를 두껍게 만든다. 미디처럼 복사해서는 효과가 없고 실제로 다시 불러야 한다.","이 단계에서는 이펙트를 걸지 않는다. 정리만 한다."],"path":[{"n":"구간 정리","s":["노래 없는 구간 선택 → 가위 도구 또는 <k>⌘T</k>로 분할","해당 리전 <b>Delete</b>","남은 리전 양 끝을 잡고 페이드 만들기: 리전 좌우 <b>위쪽 모서리</b> 드래그"]},{"n":"자동 페이드","s":["리전 선택 → <k>I</k> 인스펙터 리전 영역","<b>페이드 인</b> <v>5</v>ms, <b>페이드 아웃</b> <v>5</v>ms 입력"]}],"drill":["녹음한 보컬에서 노래 없는 구간을 전부 잘라낸다. 숨소리는 남기고 크기만 줄인다.","모든 자른 지점에 5ms 페이드를 넣고 딸깍 소리가 사라졌는지 확인한다.","코러스 한 구간을 더블링으로 다시 녹음해 좌우로 벌려본다."],"keys":[["⌘T","분할"],["I","인스펙터"],["Delete","삭제"]],"chk":["편집 순서를 지킨다","페이드로 딸깍 소리를 없앴다","더블링을 시도해봤다"],"quiz":[{"q":"자른 지점에서 딸깍 소리가 나는 것을 막는 방법은?","a":["볼륨 낮추기","짧은 페이드","리버브 추가","퀀타이즈"],"c":1,"e":"3~10ms 정도의 짧은 페이드면 파형이 갑자기 끊기는 것을 막는다."}]},{"d":46,"s":9,"t":"레퍼런스와 청취 환경","goal":"내 귀를 믿을 수 있는 조건을 만든다.","con":["믹싱에서 가장 흔한 실패는 기술 부족이 아니라 판단 기준이 없는 것이다. 목표로 삼을 소리를 옆에 두고 비교하면 문제가 눈에 띄게 잘 보인다.","레퍼런스는 내가 만들려는 곡과 장르와 편성이 비슷한 완성 음원이다. 프로젝트에 오디오 트랙으로 불러와 놓고 수시로 오간다.","비교할 때 반드시 음량을 맞춘다. 레퍼런스는 마스터링이 끝나 크기 때문에 그냥 비교하면 무조건 좋게 들린다. 레퍼런스 트랙 페이더를 <v>-8</v>에서 <v>-12</v>dB 정도 내려 체감 크기를 비슷하게 맞춘 뒤 듣는다.","청취 음량이 판단을 바꾼다. 크게 들으면 저역과 고역이 강조되어 실제보다 좋게 들린다. 밸런스 판단은 작게, 세부 확인은 잠깐 크게 하는 식으로 나눈다. 한 자리에서 오래 크게 듣는 것이 가장 나쁘다.","귀는 20분에서 30분이면 지친다. 지친 귀는 고역을 덜 느껴서 자꾸 밝게 만들게 된다. 짧게 쉬는 편이 낫다.","확인은 여러 곳에서 한다. 스튜디오 모니터, 이어폰, 노트북 스피커, 휴대폰, 차 안. 모두에서 무난하면 완성이다."],"path":[{"n":"레퍼런스 트랙 만들기","s":["오디오 트랙 생성 → 완성 음원 파일 드래그","트랙 출력을 <b>Stereo Out</b> 대신 새 <b>Bus</b>로 지정하면 마스터 체인을 거치지 않음","페이더를 <v>-10</v>dB 부근으로 내려 음량 맞춤","<k>S</k>로 오가며 비교"]}],"drill":["장르가 비슷한 완성 음원 세 곡을 프로젝트에 넣고 음량을 맞춘다.","내 믹스와 레퍼런스를 번갈아 들으며 저역, 보컬 크기, 넓이 세 가지를 비교해 적는다.","같은 믹스를 아주 작은 음량과 큰 음량으로 듣고 판단이 어떻게 달라지는지 확인한다."],"keys":[["S","솔로"],["M","뮤트"],["X","믹서"]],"chk":["레퍼런스 음량을 맞춰 비교한다","작게 듣고 밸런스를 판단한다","여러 환경에서 확인한다"],"quiz":[{"q":"레퍼런스와 비교할 때 반드시 해야 하는 것은?","a":["같은 템포로 맞추기","음량을 맞추기","같은 조로 옮기기","모노로 듣기"],"c":1,"e":"크면 좋게 들리기 때문에 음량을 맞추지 않으면 비교가 성립하지 않는다."}]},{"d":47,"s":9,"t":"게인 스테이징과 밸런스","goal":"이펙트 없이 페이더만으로 곡을 들을 만하게 만든다.","con":["믹싱의 첫 단계는 이펙트가 아니라 균형이다. 페이더만 움직여서 좋게 들리지 않으면 어떤 플러그인도 해결해주지 못한다.","게인 스테이징은 각 트랙의 레벨을 적정 범위에 두는 일이다. 개별 트랙 피크를 <v>-18</v>에서 <v>-10</v>dBFS 사이에 두고, 마스터 출력이 <v>-6</v>dBFS를 넘지 않게 한다. 여유가 있어야 마스터링 단계에서 할 일이 남는다.","순서는 아래에서 위로 쌓는다. 킥 → 베이스 → 스네어 → 나머지 드럼 → 코드 악기 → 리드나 보컬. 킥을 <v>-12</v>dBFS 정도로 기준 삼고 나머지를 맞춘다.","솔로로 듣지 말고 전체로 듣는다. 솔로에서 좋은 소리가 합쳤을 때 좋다는 보장이 없다.","작게 듣는 것이 밸런스 판단에 유리하다. 크게 들으면 다 좋게 들린다. 아주 작게 틀었을 때 곡의 뼈대가 들리면 균형이 맞은 것이다."],"path":[{"n":"믹서에서 밸런스","s":["<k>X</k>로 믹서 열기","모든 트랙 페이더를 <v>-∞</v>로 내림","킥부터 하나씩 올리며 균형","마스터 채널 미터가 <v>-6</v>dBFS를 넘지 않는지 확인"]},{"n":"게인 조정","s":["트랙 이펙트 첫 슬롯에 <b>Gain</b> 플러그인","입력 레벨을 조정해 피크를 <v>-14</v>dBFS 부근으로","페이더는 0dB 근처에 두고 작업"]}],"drill":["모든 페이더를 내리고 킥부터 순서대로 올려 밸런스를 다시 잡는다. 시간을 재본다.","완성된 밸런스를 아주 작은 음량으로 들어보고 무엇이 안 들리는지 적는다.","마스터 피크가 -6dBFS를 넘지 않게 전체를 조정한다."],"keys":[["X","믹서"],["S","솔로"],["M","뮤트"],["⌥클릭","페이더 초기화"]],"chk":["페이더만으로 균형을 만들 수 있다","마스터 여유를 남긴다","작게 듣고 판단한다"],"quiz":[{"q":"믹스 중 마스터 출력 피크는 대략 어디를 넘지 않는 것이 좋은가?","a":["0dBFS","-6dBFS","-20dBFS","-40dBFS"],"c":1,"e":"-6dBFS 정도 여유를 남겨야 마스터링에서 처리할 공간이 생긴다."}]},{"d":48,"s":9,"t":"이퀄라이저","goal":"필요 없는 대역을 덜어내고 각 악기의 자리를 만든다.","con":["EQ의 첫 번째 용도는 더하기가 아니라 빼기다. 안 쓰는 저역을 걷어내는 것만으로 믹스가 훨씬 맑아진다.","하이패스 필터는 거의 모든 트랙에 건다. 기준값. 보컬 <v>80~100</v>Hz, 기타 <v>90~120</v>Hz, 스네어 <v>120</v>Hz, 하이햇 <v>300~500</v>Hz, 신스 패드 <v>150~200</v>Hz. 킥과 베이스는 하이패스를 걸더라도 <v>25~30</v>Hz 정도로 아주 낮게만 건다.","자주 문제가 되는 대역. <v>200~400</v>Hz는 뭉치고 답답한 느낌, <v>2~4</v>kHz는 귀에 거슬리는 날카로움, <v>6~8</v>kHz는 치찰음 영역이다.","찾는 방법은 부스트 스윕이다. 좁은 폭으로 크게 올린 채 주파수를 옮기며 가장 거슬리는 지점을 찾고, 그 지점을 반대로 깎는다.","밝게 하고 싶으면 <v>10</v>kHz 부근을 넓게 <v>2~3</v>dB 올린다. 큰 값은 대개 문제를 만든다.","EQ는 눈이 아니라 귀로 한다. 그래프가 예쁜 것과 소리가 좋은 것은 다르다."],"path":[{"n":"Channel EQ 쓰기","s":["채널 스트립 이펙트 슬롯 → <b>EQ → Channel EQ</b>","맨 왼쪽 밴드 = 하이패스. 켜고 주파수 입력","밴드를 클릭해 켜고, 세로 드래그로 게인, 가로 드래그로 주파수","<b>Q</b> 값은 밴드 위에서 위아래 드래그"]},{"n":"부스트 스윕","s":["밴드 게인을 <v>+12</v>dB, Q를 <v>8</v> 정도로","주파수를 좌우로 천천히 이동","가장 거슬리는 지점 찾기","게인을 <v>-3</v>에서 <v>-6</v>dB로 뒤집기"]}],"drill":["모든 트랙에 적절한 하이패스를 건다. 걸기 전후를 비교한다.","한 트랙에서 부스트 스윕으로 문제 대역을 찾아 깎아본다.","보컬 트랙에서 200~400Hz를 3dB 깎고 10kHz를 2dB 올려 차이를 듣는다."],"keys":[["X","믹서"],["⌥클릭","값 초기화"]],"chk":["하이패스를 습관적으로 건다","부스트 스윕으로 문제를 찾을 수 있다","깎기를 먼저 시도한다"],"quiz":[{"q":"답답하고 뭉친 느낌이 자주 생기는 대역은?","a":["40~60Hz","200~400Hz","2~4kHz","12kHz 이상"],"c":1,"e":"200~400Hz에 여러 악기가 겹치면 탁해진다."},{"q":"보컬 하이패스의 일반적인 시작점은?","a":["20Hz","80~100Hz","300Hz","1kHz"],"c":1,"e":"80~100Hz 아래는 보컬에 필요 없는 저역이 대부분이다."}]},{"d":49,"s":9,"t":"컴프레서","goal":"음량 편차를 줄여 소리를 앞으로 끌어낸다.","con":["컴프레서는 큰 소리만 눌러 크고 작은 차이를 줄인다. 그 뒤 전체를 올리면 작은 소리가 더 잘 들린다. 결과적으로 소리가 앞으로 나오고 단단해진다.","파라미터 다섯 개. 스레숄드는 누르기 시작하는 지점, 레이시오는 누르는 비율, 어택은 누르기 시작하는 속도, 릴리스는 놓아주는 속도, 메이크업 게인은 줄어든 만큼 보상하는 값이다.","시작값 감각. 보컬은 레이시오 <v>3:1</v>, 어택 <v>10</v>ms, 릴리스 <v>100</v>ms, 게인 리덕션 <v>3~6</v>dB. 킥과 스네어는 레이시오 <v>4:1</v>, 어택 <v>10~30</v>ms, 릴리스 <v>80~150</v>ms. 베이스는 레이시오 <v>4:1</v>, 어택 <v>20</v>ms, 릴리스 <v>120</v>ms.","어택이 짧으면 타격감이 눌린다. 드럼에서 펀치를 살리려면 어택을 <v>20~30</v>ms로 길게 둬서 첫 타격은 통과시키고 그 뒤를 누른다.","릴리스는 곡의 템포와 맞물린다. 너무 길면 다음 소리까지 눌리고, 너무 짧으면 펌핑이 생긴다. 발이 까딱거리는 느낌이 나면 대개 맞은 것이다.","게인 리덕션 미터가 <v>3~6</v>dB 정도 움직이는 것이 일반적이다. 10dB 이상 계속 눌린다면 다시 생각한다."],"path":[{"n":"Compressor 걸기","s":["채널 스트립 이펙트 슬롯 → <b>Dynamics → Compressor</b>","상단에서 모델 선택. 기본은 <b>Platinum Digital</b>, 보컬은 <b>Studio VCA</b>","<b>Threshold</b>를 내려 게인 리덕션 <v>3~6</v>dB 확보","<b>Ratio</b>, <b>Attack</b>, <b>Release</b> 순으로 조정","<b>Make Up</b>으로 음량 보상"]}],"drill":["보컬에 컴프를 걸고 스레숄드만 움직여 게인 리덕션 3dB와 10dB를 비교한다.","드럼에서 어택을 1ms와 30ms로 바꿔 타격감 차이를 듣는다.","릴리스를 30ms와 300ms로 바꿔 펌핑이 생기는 지점을 찾는다."],"keys":[["X","믹서"],["⌥클릭","값 초기화"]],"chk":["다섯 파라미터를 설명할 수 있다","어택으로 타격감을 조절할 수 있다","게인 리덕션 양을 보고 판단한다"],"quiz":[{"q":"드럼의 타격감을 살리려면 어택을?","a":["0ms에 가깝게 짧게","20~30ms로 길게","최대로 길게","조절하지 않음"],"c":1,"e":"어택을 길게 두면 첫 타격이 통과한 뒤 눌리기 때문에 펀치가 남는다."},{"q":"일반적인 게인 리덕션 목표 범위는?","a":["0~1dB","3~6dB","10~15dB","20dB 이상"],"c":1,"e":"3~6dB가 자연스러운 범위다."}]},{"d":50,"s":9,"t":"리버브와 딜레이 센드 버스","goal":"공간을 만들되 곡을 흐리지 않는다.","con":["리버브를 트랙마다 개별로 거는 것은 비효율적이고 소리도 흩어진다. 센드 버스를 만들어 여러 트랙이 같은 공간을 공유하게 하는 것이 표준이다. 같은 방에 있는 것처럼 들린다.","버스는 최소 두 개를 만든다. 짧은 공간용과 긴 공간용이다. 짧은 것은 룸이나 플레이트 <v>0.8~1.5</v>초, 긴 것은 홀 <v>2.5~4</v>초.
