며 큰 편성에서 끊김이 생기는 지점을 찾는다.","프로젝트 폴더 백업 규칙을 정해 적어둔다."],"keys":[["⌘S","저장"]],"chk":["SSD가 필요한 이유를 안다","프리로드 버퍼의 역할을 안다","라이브러리 이동 절차를 안다"],"quiz":[{"q":"샘플 재생에서 디스크 속도가 중요한 이유는?","a":["파일이 압축되어 있어서","연주 중 실시간으로 읽어오기 때문","백업이 자주 필요해서","CPU를 대신해서"],"c":1,"e":"메모리에 올린 앞부분 이후는 디스크에서 계속 읽는다. 느리면 소리가 끊긴다."}]},{"d":41,"s":7,"t":"코드 진행","goal":"기본 코드 진행을 만들고 코드 트랙에 입력한다.","con":["코드는 세 음 이상을 쌓은 것이다. 장3화음은 근음, 장3도, 완전5도. 단3화음은 근음, 단3도, 완전5도. 7화음은 여기에 7도를 얹는다.","자주 쓰는 진행 몇 개만 손에 익혀도 곡이 나온다. I - V - vi - IV, vi - IV - I - V, I - vi - IV - V, ii - V - I. 다장조로 쓰면 각각 C-G-Am-F, Am-F-C-G, C-Am-F-G, Dm-G-C다.","자리바꿈은 같은 코드의 음 순서를 바꾼 것이다. 진행할 때 각 성부가 가까운 음으로 이동하도록 자리바꿈을 고르면 부드러워진다. 이것이 성부 진행이다.","로직의 코드 트랙에 진행을 입력해두면 세션 플레이어와 아르페지에이터가 그것을 따라간다. 편곡 실험이 빨라진다.","단조는 자연단음계 기준으로 i - VI - III - VII이 흔하다. 다섯 번째 화음을 장3화음으로 바꾸면 화성단음계가 되고 긴장이 커진다."],"path":[{"n":"코드 트랙 쓰기","s":["<k>G</k> → 글로벌 트랙 헤더 우클릭 → <b>코드</b> 체크","코드 트랙 더블 클릭 → 코드 입력창","근음, 성질, 베이스음 지정"]},{"n":"미디에서 코드 만들기","s":["피아노 롤에서 근음 찍기","<k>⌥</k>+드래그로 위로 복사 후 음높이 조절","코드 전체 선택 후 위아래 드래그 → 통째 이조"]}],"drill":["네 가지 진행을 각각 4마디씩 미디로 만들어 이어 붙이고 인상 차이를 적는다.","같은 진행을 자리바꿈 없이 한 번, 성부 진행을 매끄럽게 한 번 만들어 비교한다.","코드 트랙에 진행을 입력하고 베이스 플레이어가 따라오는지 확인한다."],"keys":[["G","글로벌 트랙"],["P","피아노 롤"]],"chk":["네 가지 기본 진행을 안다","자리바꿈으로 성부 진행을 다듬을 수 있다","코드 트랙을 쓸 수 있다"],"quiz":[{"q":"C - G - Am - F는 어떤 진행인가?","a":["I - V - vi - IV","vi - IV - I - V","ii - V - I","I - IV - V - I"],"c":0,"e":"대중음악에서 가장 많이 쓰이는 진행 중 하나다."}]},{"d":42,"s":7,"t":"곡 구조 설계","goal":"표준 곡 구조와 구간별 마디 수를 설계한다.","con":["대중음악의 기본 구조는 인트로 - 벌스 - 프리코러스 - 코러스 - 벌스 - 프리코러스 - 코러스 - 브리지 - 코러스 - 아웃트로다. 이 틀에서 빼고 더하면 대부분의 곡이 나온다.","마디 수의 감각. 인트로 4~8, 벌스 8~16, 프리 4~8, 코러스 8~16, 브리지 8이 일반적이다. 홀수 마디는 의도할 때만 쓴다. 짝수가 기본인 이유는 기대다. 대중음악을 들어온 귀는 4마디와 8마디 단위로 다음 전개를 예측하며 듣고 예측이 맞을 때 편안함을 느낀다. 홀수는 그 예측을 일부러 깨는 장치다.","에너지 곡선을 그려놓고 시작하면 좋다. 곡 전체를 100으로 볼 때 첫 코러스에서 70, 두 번째 코러스에서 85, 마지막 코러스에서 100에 닿는 식이다.","절정은 곡의 62퍼센트 지점 근처에 두면 안정적으로 들린다. 62퍼센트인 이유는 황금비다. 긴장을 쌓는 시간과 푸는 시간의 비율이 이 지점에서 맞아떨어져, 너무 이르면 남은 시간이 늘어지고 너무 늦으면 쌓을 시간이 모자란다. 3분 30초 곡이면 2분 10초 부근이다. 앞뒤로 15퍼센트 안이면 충분히 자연스럽다.","구간 사이 전환이 곡의 완성도를 가른다. 코러스 직전 한 박을 비우거나, 드럼을 빼거나, 라이저를 넣는다."],"path":[{"n":"구조 먼저 세우기","s":["<k>G</k> → 어레인지먼트 트랙","마커를 인트로 4 / 벌스 8 / 프리 4 / 코러스 8 순으로 생성","마커 이름 지정","소리를 채우기 전에 구조부터 완성"]}],"drill":["3분 30초 목표 곡의 구조를 마커로 설계하고 총 마디 수와 예상 시간을 계산한다.","에너지 곡선을 종이에 그리고 각 구간의 트랙 수를 미리 정한다.","절정 지점이 62퍼센트 부근에 오는지 확인한다."],"keys":[["G","글로벌 트랙"],["⌘R","반복"]],"chk":["표준 구조를 외웠다","마디 수 감각이 생겼다","절정 위치를 계산할 수 있다"],"quiz":[{"q":"곡의 절정을 두기 좋은 위치는 대략?","a":["전체의 30퍼센트","전체의 50퍼센트","전체의 62퍼센트","전체의 90퍼센트"],"c":2,"e":"62퍼센트 근처가 황금분할에 해당해 안정적으로 들린다."}]},{"d":43,"s":7,"t":"음역 배치","goal":"악기별 주파수 대역을 파악하고 겹침을 정리한다.","con":["곡이 탁하게 들리는 가장 큰 원인은 여러 악기가 같은 음역에 몰려 있기 때문이다. 믹스로 고치기 전에 편곡에서 자리를 나누는 것이 정답이다.","음역을 네 층으로 나눠 생각한다. 저역은 <v>20~200</v>Hz로 킥과 베이스, 중저역은 <v>200~800</v>Hz로 기타 코드와 왼손 피아노, 중고역은 <v>800~4000</v>Hz로 보컬과 리드, 고역은 <v>4000</v>Hz 이상으로 하이햇과 공기감이다.","저역에는 한 번에 하나만 둔다. 하나만인 이유는 귀의 분해능이다. 두 소리를 따로 듣는 데 필요한 주파수 간격이 낮은 대역일수록 넓어져서 가까운 두 저음은 하나의 뭉개진 소리로 합쳐 들리고, 파장이 길어 위상 간섭의 골도 깊다. 킥과 베이스가 같은 음역에서 싸우면 둘 다 흐려진다. 킥을 <v>60</v>Hz 부근, 베이스를 <v>90</v>Hz 부근으로 나누는 식으로 정한다.","보컬이 있는 곡이라면 중고역은 보컬의 자리다. 다른 악기의 화려한 움직임을 그 자리에서 빼면 보컬이 저절로 들린다.","같은 코드를 두 악기가 칠 때는 옥타브를 다르게 하거나 한쪽이 일부 음만 맡는다."],"path":[{"n":"음역 확인","s":["채널 스트립 이펙트 슬롯 → <b>Channel EQ</b>","분석기 버튼 켜기 → 실시간 스펙트럼 확인","여러 트랙을 하나씩 솔로로 들으며 어디에 몰려 있는지 확인"]}],"drill":["기존 프로젝트에서 트랙별 주요 음역을 표로 적는다. 겹치는 곳을 찾는다.","겹친 두 악기 중 하나를 옥타브 올리거나 음을 덜어내고 다시 듣는다.","킥과 베이스만 솔로로 듣고 서로 다른 음역에 있는지 확인한다."],"keys":[["S","솔로"],["X","믹서"]],"chk":["네 개 음역 층을 안다","저역에 하나만 두는 원칙을 지킨다","보컬 자리를 비워둔다"],"quiz":[{"q":"곡이 탁하게 들리는 가장 흔한 원인은?","a":["리버브 부족","같은 음역에 악기가 몰림","템포가 느림","트랙 수가 적음"],"c":1,"e":"편곡 단계에서 음역을 나누는 것이 근본 해결책이다."}]},{"d":44,"s":7,"t":"리듬 레이어","goal":"기본 박, 세분, 강조 세 층으로 리듬을 구성한다.","con":["그루브는 드럼만의 일이 아니다. 어떤 악기든 짧게 끊어 치면 리듬 악기가 된다.","세 층으로 생각한다. 기본 박을 잡는 층(킥과 베이스), 세분을 채우는 층(하이햇, 셰이커, 기타 커팅), 강조하는 층(스네어, 클랩, 악센트).","세분 층이 비면 곡이 느슨해진다. 하이햇 대신 셰이커나 짧은 신스 스타카토, 또는 기타 뮤트 커팅으로 채워도 된다.","오프비트가 움직임을 만든다. 박과 박 사이에 놓인 소리가 곡을 앞으로 민다. 하우스의 오프비트 오픈 하이햇, 레게의 뒷박 기타가 대표적이다.","악센트를 한 마디에 하나씩만 다르게 줘도 여덟 마디가 지루하지 않다. 8마디 중 마지막 마디를 살짝 다르게 만드는 것이 가장 쉬운 방법이다."],"path":[{"n":"세분 층 만들기","s":["새 소프트웨어 악기 트랙 → 퍼커션 패치","16분음표로 셰이커 패턴 입력","벨로시티를 강약 번갈아","<k>Q</k> 퀀타이즈 강도 <v>85</v>퍼센트, 스윙 <v>55</v>"]}],"drill":["기존 드럼 위에 셰이커 층을 하나 얹고 있고 없고를 비교한다.","기타나 신스를 짧게 끊어 오프비트에 배치해 리듬 악기로 써본다.","8마디 반복 구간에서 마지막 마디만 다르게 만든다."],"keys":[["Q","퀀타이즈"],["M","뮤트"]],"chk":["세 층 개념을 안다","세분 층을 채워봤다","오프비트로 움직임을 만들었다"],"quiz":[{"q":"곡이 느슨하게 들릴 때 보강하면 좋은 층은?","a":["기본 박 층","세분 층","강조 층","저역 층"],"c":1,"e":"16분음표 계열의 세분 층이 비면 곡이 늘어져 들린다."}]},{"d":45,"s":7,"t":"장르별 편성","goal":"장르별 표준 편성과 템포를 안다.","con":["장르는 규칙이 아니라 재료 목록이다. 어떤 악기를 몇 개 쓰는지, 템포와 그루브가 어떤지, 무엇을 비워두는지가 장르를 만든다.","발라드. 템포 <v>62~76</v>. 피아노, 스트링, 베이스, 부드러운 드럼, 패드. 벌스는 피아노와 목소리만, 코러스에서 스트링과 드럼이 들어온다. 저역은 얕게.","팝. 템포 <v>100~120</v>. 드럼, 베이스, 기타 또는 신스 코드, 리드, 백보컬. 코러스에 훅이 반복된다. 세분 층이 항상 있다.","알앤비. 템포 <v>70~92</v>. 성긴 킥과 스네어, 촘촘한 하이햇, 일렉트릭 피아노, 낮은 베이스, 넓은 패드. 코드가 7화음과 9화음 중심이다.","하우스. 템포 <v>122~128</v>. 4분 킥, 오프비트 하이햇, 클랩, 베이스라인, 코드 스탭. 같은 구간을 반복하며 필터를 움직이는 것이 이 장르의 문법이다.","록. 템포 <v>120~160</v>. 드럼, 베이스, 리듬 기타 둘, 리드 기타, 보컬. 기타 두 대를 좌우로 벌린다.","영화 음악. 템포 자유. 스트링, 목관, 금관, 타악, 피아노, 패드. 다이내믹 폭이 크고 CC11 작업이 대부분이다. 템플릿을 저장할 때는 트랙 목록만 넣지 말고 매번 다시 만들게 되는 것들을 함께 넣는다. 짧은 리버브와 긴 리버브 센드 버스 두 개, 이름과 색을 정해 둔 트랙, 어레인지먼트 마커 뼈대, 마스터의 라우드니스 미터까지. 그리고 <b>설정 → 일반 → 프로젝트 처리</b>에서 시동 동작을 내 템플릿으로 지정하면 로직을 켜는 순간 작업 준비가 끝난 상태로 시작한다."],"path":[{"n":"템플릿 만들기","s":["장르별 트랙 구성을 만든 뒤 <b>파일 → 템플릿으로 저장</b>","다음부터 <b>파일 → 신규 → 나의 템플릿</b>에서 불러오기"]}],"drill":["세 가지 장르를 골라 각각 트랙 목록을 종이에 적는다. 트랙 수와 이름까지.","가장 자주 만들 장르 하나를 템플릿으로 저장한다.","같은 코드 진행을 두 장르로 편성해 얼마나 달라지는지 확인한다."],"keys":[["⌥⌘N","새 트랙"],["⌘S","저장"]],"chk":["장르별 템포 범위를 안다","템플릿을 하나 만들었다","같은 진행을 두 장르로 편성해봤다"],"quiz":[{"q":"하우스의 전형적인 템포 범위는?","a":["70~92","100~110","122~128","172~176"],"c":2,"e":"122~128 사이가 하우스의 표준 구간이다."}]},{"t":"오디오 인터페이스와 주변 기기","goal":"인터페이스, 케이블, 모니터, 헤드폰의 역할과 연결을 안다.","con":["마이크에서 스피커까지의 길 한가운데에 오디오 인터페이스가 있다. 인터페이스가 하는 일은 네 가지다. 마이크의 전기 신호를 숫자로 바꾸고(입력 변환), 숫자를 다시 전기로 바꿔 스피커로 보내고(출력 변환), 작은 마이크 신호를 키우고(프리앰프), 팬텀 파워를 공급한다. 맥 내장 단자로 안 되는 것이 이 네 가지라서 녹음을 하려면 인터페이스가 필요하다.","앞면부터 읽는다. 게인 노브는 입력 증폭량, <v>48V</v> 버튼은 팬텀 파워, INST 버튼은 기타와 베이스를 직접 꽂을 때 누르는 것이다. INST가 따로 있는 이유는 신호의 성질이다. 기타 픽업의 신호는 마이크와 성질이 달라서 일반 입력에 꽂으면 고음이 죽는데, INST를 누르면 입력의 특성이 기타에 맞게 바뀐다. MIX 또는 모니터 노브는 입력 소리와 컴퓨터 소리의 비율, 그 옆이 헤드폰 볼륨과 메인 아웃 볼륨이다.","케이블은 세 종류만 알면 된다. XLR은 세 핀짜리 마이크 케이블, TRS는 헤드폰 잭처럼 생겼는데 검은 줄이 두 개인 케이블, TS는 줄이 하나인 기타 케이블이다.","XLR과 TRS가 잡음에 강한 이유는 밸런스드 방식이기 때문이다. 같은 신호를 하나는 그대로, 하나는 위아래를 뒤집어 두 가닥으로 보낸다. 케이블이 도중에 잡음을 맞으면 두 가닥에 똑같이 실리는데, 받는 쪽에서 뒤집힌 가닥을 다시 뒤집어 합치면 신호는 두 배가 되고 잡음은 서로 반대가 되어 사라진다. TS는 이 장치가 없어서 길게 끌수록 잡음이 는다. 그래서 긴 거리는 XLR과 TRS로, 기타에서 인터페이스까지 짧은 구간만 TS로 쓴다.","모니터 스피커는 메인 아웃에 TRS로 연결한다. 배치가 소리의 절반이다. 두 스피커와 머리가 정삼각형을 이루게 놓고, 고음 유닛을 귀 높이에 맞추고, 좌우를 대칭으로 둔다. 정삼각형인 이유는 좌우 신호가 같은 거리에서 같은 시간에 도착해야 팬으로 만든 위치가 그대로 들리기 때문이다. 벽에서 <v>20~30</v>cm 이상 떼는 것도 잊지 않는다. 벽에 붙이면 뒷벽 반사가 저역을 부풀려 실제보다 저음이 많게 들리고, 그 상태로 믹스하면 저음이 빈 결과물이 나온다.","헤드폰은 두 갈래다. 밀폐형은 귀를 감싸 소리가 새지 않는다. 녹음용이다. 새어 나간 반주가 마이크에 다시 들어가는 것을 막아야 하기 때문이다. 개방형은 뒤가 뚫려 소리가 새는 대신 울림이 자연스럽고 오래 들어도 덜 지친다. 믹싱용이다. 하나만 산다면 밀폐형이 먼저다. 녹음은 밀폐형이 아니면 안 되지만 믹싱은 밀폐형으로도 가능하다.","전원 순서 하나만 외운다. 켤 때는 스피커를 마지막에, 끌 때는 스피커를 먼저. 다른 장비를 켜고 끌 때 나는 퍽 소리가 스피커에 도달하기 전에 스피커가 꺼져 있게 하는 순서다.","USB 마이크는 마이크와 인터페이스를 한 몸에 합친 물건이다. 시작은 간편하지만 마이크를 바꾸거나 입력을 늘릴 길이 막힌다. 계속할 생각이면 인터페이스와 XLR 마이크를 따로 사는 쪽이 결국 싸다."],"path":[{"n":"연결 전체 그리기","s":["마이크 → XLR → 인터페이스 입력","기타 → TS → INST 입력","인터페이스 메인 아웃 → TRS 두 가닥 → 모니터 좌우","인터페이스 헤드폰 단자 → 밀폐형 헤드폰","인터페이스 → USB → 맥"]},{"n":"모니터 배치 점검","s":["두 스피커 사이 거리와 스피커에서 머리까지 거리를 같게 맞춘다","고음 유닛이 앉았을 때 귀 높이에 오는지 확인한다","뒷벽에서 <v>20~30</v>cm 이상 떨어져 있는지 잰다","좌우 스피커 주변이 대칭인지 본다"]},{"n":"로직에서 확인","s":["<b>Logic Pro → 설정 → 오디오 → 장비</b>","<b>입력 장비</b>와 <b>출력 장비</b>를 인터페이스로 지정","마이크에 대고 말하며 입력 미터 확인","재생하며 모니터와 헤드폰 양쪽 출력 확인"]}],"drill":["내 연결 전체를 종이에 화살표로 그리고 각 구간의 케이블 종류를 적는다.","모니터 배치를 정삼각형 기준으로 재고, 어긋난 것을 하나 고친 뒤 같은 곡을 다시 들어 차이를 확인한다.","전원을 순서대로 켜고 꺼 본다. 일부러 순서를 어겨 퍽 소리가 나는지 아주 작은 볼륨으로 확인해 본다."],"keys":[["X","믹서"],["스페이스","재생과 정지"]],"chk":["인터페이스가 하는 네 가지 일을 말할 수 있다","XLR, TRS, TS를 구분하고 밸런스드의 원리를 안다","모니터 정삼각형 배치의 이유를 안다"],"quiz":[{"q":"밸런스드 케이블이 잡음에 강한 이유는?","a":["케이블이 두꺼워서","뒤집힌 신호를 합칠 때 잡음이 상쇄되어서","금도금이라서","신호가 두 배 빨라서"],"c":1,"e":"두 가닥에 똑같이 실린 잡음이 한쪽을 다시 뒤집어 합치는 순간 반대가 되어 사라진다."},{"q":"기타를 인터페이스에 직접 꽂을 때 누르는 버튼은?","a":["48V","INST","MIX","MONO"],"c":1,"e":"기타 픽업 신호는 성질이 달라서 INST를 눌러 입력 특성을 바꿔야 고음이 살아 있다."},{"q":"녹음용 헤드폰으로 밀폐형을 쓰는 이유는?","a":["저음이 좋아서","가벼워서","새어 나간 소리가 마이크에 들어가는 것을 막아서","선이 길어서"],"c":2,"e":"반주가 헤드폰 밖으로 새면 마이크에 함께 녹음된다."},{"q":"전원을 끌 때 가장 먼저 끄는 것은?","a":["컴퓨터","인터페이스","스피커","마이크"],"c":2,"e":"다른 장비의 퍽 소리가 도달하기 전에 스피커가 먼저 꺼져 있어야 한다."}],"d":46,"s":8},{"t":"마이크 기초 용어","goal":"마이크 종류, 지향성, 주변 장비의 용어를 안다.","con":["마이크는 공기의 떨림을 전기로 바꾸는 장치다. 바꾸는 방식에 따라 크게 두 갈래로 나뉘고, 이 구분이 마이크 선택의 출발점이다.","다이내믹 마이크는 코일과 자석으로 소리를 받는다. 튼튼하고, 큰 소리에 강하고, 전원이 필요 없다. 대신 감도가 낮아 섬세한 소리는 덜 잡는다. 공연장 보컬, 드럼, 기타 앰프에 쓰는 것이 이쪽이다. SM58 같은 손잡이형 마이크를 떠올리면 된다.","콘덴서 마이크는 얇은 막의 떨림을 전기로 읽는다. 감도가 높아 숨소리와 잔향까지 섬세하게 담는다. 대신 충격에 약하고 전원이 필요하다. 스튜디오 보컬과 어쿠스틱 악기 녹음의 기본이 이쪽이다. 홈 레코딩에서 보컬용으로 사는 마이크는 대부분 콘덴서다.","콘덴서에 공급하는 전원이 팬텀 파워다. <v>48V</v>라고 적힌 버튼이 오디오 인터페이스에 있다. 콘덴서를 꽂으면 켜고, 리본 마이크 같은 예민한 기기에는 켜기 전에 설명서를 확인한다. 다이내믹 마이크는 팬텀이 켜져 있어도 해가 없다. 콘덴서와 다이내믹을 같이 쓸 때 일일이 껐다 켰다 할 필요는 없다. 켜고 끌 때는 페이더를 내리고 한다. 퍽 하는 소리가 스피커를 상하게 할 수 있다.","지향성은 마이크가 어느 방향의 소리를 받는지다. 카디오이드는 앞만 받고 뒤를 거의 안 받는다. 심장 모양의 수음 범위라서 붙은 이름이고, 홈 레코딩의 기본값이다. 기본값인 이유는 방이다. 집 녹음의 가장 큰 적은 뒤와 옆 벽에서 되돌아오는 울림인데, 카디오이드는 바로 그 방향을 깎아 받아 마이크 자체가 흡음재 역할을 한다. 무지향성은 사방을 고르게 받아 공간 전체를 담을 때 쓴다. 8자 지향성은 앞뒤만 받고 옆을 안 받는다.","근접 효과는 지향성 마이크에 입을 가까이 댈수록 저음이 부풀어 오르는 현상이다. 라디오 진행자의 두툼한 목소리가 이것이다. 활용하면 무기가 되고 모르면 저음이 뭉개지는 원인이 된다.","주변 도구들. 팝 필터는 입과 마이크 사이에 세우는 망이다. 파열음이 만드는 바람이 마이크를 직접 때리는 것을 막는다. 쇼크 마운트는 마이크를 고무줄로 띄워 책상과 바닥의 진동이 타고 올라오는 것을 끊는다. 리플렉션 필터는 마이크 뒤에 두르는 반원형 흡음판으로, 방 울림을 줄인다.","연결은 XLR 케이블이 표준이다. 세 핀짜리 굵은 케이블로, 잡음에 강하고 팬텀 파워도 이 선으로 전달된다. USB 마이크는 인터페이스 없이 컴퓨터에 바로 꽂는 방식인데 시작하기엔 간편하지만 확장이 막힌다.","마이크 신호는 아주 작아서 증폭이 필요하다. 이 증폭기가 프리앰프이고 오디오 인터페이스에 내장되어 있다. 증폭량을 정하는 노브가 게인이다. 볼륨과 헷갈리기 쉬운데, 게인은 들어오는 신호의 크기이고 볼륨은 나가는 소리의 크기다. 녹음 품질을 결정하는 것은 게인 쪽이다."],"path":[{"n":"내 마이크 파악하기","s":["마이크의 종류(다이내믹인지 콘덴서인지)를 확인한다","콘덴서라면 인터페이스의 <v>48V</v> 버튼 위치를 확인한다","지향성 표시(카디오이드 기호 등)를 찾아본다","마이크와 인터페이스를 XLR로 연결한다"]},{"n":"팬텀 파워 안전 순서","s":["로직과 스피커의 볼륨을 내린다","마이크를 XLR로 꽂는다","<v>48V</v>를 켠다","몇 초 기다린 뒤 게인을 올리며 신호를 확인한다","끌 때는 역순: 게인 내리고 → 48V 끄고 → 뽑는다"]}],"drill":["가진 마이크 또는 사려는 마이크의 종류, 지향성, 팬텀 파워 필요 여부를 표로 적는다.","마이크에 대고 정면, 옆, 뒤에서 말해 보고 소리 크기 차이로 지향성을 몸으로 확인한다.","입을 5cm까지 붙였다가 30cm까지 떼면서 저음이 부풀었다 빠지는 근접 효과를 듣는다."],"keys":[["X","믹서"],["R","녹음"]],"chk":["다이내믹과 콘덴서의 차이를 말할 수 있다","팬텀 파워를 안전한 순서로 켜고 끈다","근접 효과를 귀로 확인했다"],"quiz":[{"q":"콘덴서 마이크에 필요한 것은?","a":["건전지","팬텀 파워 48V","USB 허브","드라이버 설치"],"c":1,"e":"콘덴서는 막을 동작시킬 전원이 필요하다. 인터페이스의 48V 버튼이 그것이다."},{"q":"앞의 소리만 받고 뒤를 거의 안 받는 지향성은?","a":["무지향성","8자","카디오이드","전지향성"],"c":2,"e":"심장 모양의 수음 범위. 홈 레코딩의 기본값이다."},{"q":"지향성 마이크에 입을 가까이 댈수록 생기는 현상은?","a":["고음이 커진다","저음이 부풀어 오른다","소리가 작아진다","잡음이 사라진다"],"c":1,"e":"근접 효과다. 알고 쓰면 두툼한 목소리를 만드는 무기가 된다."}],"d":47,"s":8},{"d":48,"s":8,"t":"오디오 녹음 세팅","goal":"입력 레벨, 버퍼, 샘플레이트를 설정한다.","con":["녹음 전에 확인할 것은 세 가지다. 오디오 인터페이스가 잡혀 있는지, 트랙의 입력이 맞는지, 레벨이 적정한지.","레벨의 기준은 피크 <v>-12</v>에서 <v>-6</v>dBFS다. 0에 닿으면 클립이라 되돌릴 수 없다. 여유를 크게 두는 편이 안전하다. 24비트로 녹음하면 작게 녹음해도 노이즈 문제가 없다.","버퍼 크기는 녹음할 때 작게, 믹스할 때 크게 둔다. 녹음 <v>64~128</v> 샘플, 믹스 <v>512~1024</v> 샘플이 일반적이다. 작을수록 지연이 적고 컴퓨터 부담이 크다.","샘플레이트는 <v>48</v>kHz, 비트 심도는 <v>24</v>비트를 기본으로 한다. 프로젝트 시작 후에는 바꾸지 않는다. <v>96</v>kHz로 올리는 것은 음악 작업에서는 대체로 의미가 없다. 청감상 이득이 거의 없는데 용량과 컴퓨터 부하는 두 배가 된다.","모니터링은 인터페이스의 다이렉트 모니터를 쓰는 편이 지연이 없다. 로직의 소프트웨어 모니터링을 쓸 때는 버퍼를 최소로 낮춘다."],"path":[{"n":"장치 설정","s":["<b>Logic Pro → 설정 → 오디오 → 장비</b>","<b>출력 장비</b>와 <b>입력 장비</b> 지정","<b>I/O 버퍼 크기</b>를 <v>128</v>으로","<b>적용</b>"]},{"n":"녹음 준비","s":["오디오 트랙 생성 <k>⌥⌘N</k> → <b>오디오</b>","인스펙터에서 <b>입력</b> 채널 선택","트랙 헤더 <b>R</b> 버튼(녹음 준비) 켜기","레벨 미터 확인하며 인터페이스 게인 조절 → 피크 <v>-12</v>dBFS","<k>R</k>로 녹음"]},{"n":"프로젝트 포맷","s":["<b>파일 → 프로젝트 설정 → 오디오</b>","<b>샘플률</b> <v>48</v>kHz","<b>녹음 파일 유형</b> 확인"]}],"drill":["오디오 트랙을 만들고 마이크를 연결해 30초를 녹음한다. 피크가 -12dBFS 근처인지 확인한다.","버퍼를 1024로 올려 지연을 체감한 뒤 128로 되돌린다.","일부러 클립시켜 소리가 어떻게 깨지는지 한 번 들어본다."],"keys":[["R","녹음"],["스페이스","재생"],["⌘S","저장"]],"chk":["적정 레벨을 안다","버퍼 크기를 상황에 따라 바꾼다","입력 채널을 지정할 수 있다"],"quiz":[{"q":"녹음 시 권장 피크 레벨은?","a":["0dBFS","-3dBFS","-12에서 -6dBFS","-40dBFS"],"c":2,"e":"여유를 두어야 클립을 피하고 이후 처리 공간이 생긴다."}]},{"t":"보컬 마이킹: 위치, 거리, 각도","goal":"보컬 녹음의 위치, 거리, 각도, 게인을 설정한다.","con":["녹음 품질의 절반은 마이크를 켜기 전에 정해진다. 방, 거리, 각도다. 비싼 마이크보다 이 셋이 먼저다.","방이 가장 큰 변수다. 맨벽의 사각 방은 소리가 벽 사이를 오가며 울린다. 이 울림은 나중에 지울 수 없다. 해결은 흡음이다. 옷이 가득한 옷장 앞, 두꺼운 커튼 앞, 이불을 두른 구석이 좋은 녹음 부스가 된다. 마이크 뒤에 리플렉션 필터를 두르는 것도 같은 원리다. 손뼉을 쳐서 울림이 짧은 자리를 찾는다.","거리는 <v>15~20cm</v>가 기준이다. 주먹 두 개 정도다. 가까우면 근접 효과로 저음이 붇고 숨소리가 커지며, 멀면 방 울림이 많이 섞인다. 곡의 성격에 따라 조절하되 한 곡 안에서는 거리를 유지한다. 팝 필터는 입과 마이크 사이, 마이크에서 <v>5~10cm</v> 앞에 세운다.","각도도 도구다. 입 정면에 정확히 맞추면 파열음과 치찰음이 직격한다. 마이크를 입 높이에서 살짝 위나 옆으로 <v>10~20</v>도 틀면 바람은 비켜 가고 목소리는 그대로 담긴다. 이렇게 축을 벗어나게 놓는 것을 오프 액시스라고 부른다.","게인은 앞에서 배운 기준 그대로다. 가장 크게 부르는 부분을 미리 불러 보며 피크가 <v>-12</v>dBFS 부근에 오도록 잡는다. 조용한 부분 기준으로 잡으면 후렴에서 클리핑이 난다.","모니터링은 반드시 헤드폰으로 한다. 스피커를 켜 둔 채 녹음하면 스피커 소리가 마이크로 다시 들어가 하울링이 나거나 반주가 녹음에 섞인다. 밀폐형 헤드폰이 소리 샘이 적다. 자기 목소리가 헤드폰으로 들리는 정도는 인터페이스의 다이렉트 모니터링으로 맞추면 지연이 없다. 이때 겹침을 조심한다. 다이렉트 모니터링을 쓰면서 로직의 입력 모니터링 버튼까지 켜 두면 같은 목소리가 두 경로로 들어와 겹쳐 울린다. 한쪽만 쓴다.","녹음 직전 점검 다섯 가지. 에어컨과 선풍기를 껐는가, 휴대폰이 무음인가, 의자가 삐걱대지 않는가, 헤드폰에서 소리가 새지 않는가, 물을 준비했는가."],"path":[{"n":"자리 잡기","s":["손뼉을 치며 방에서 울림이 가장 짧은 자리를 찾는다","옷장 앞이나 커튼 앞처럼 흡음이 되는 곳에 마이크를 세운다","쇼크 마운트에 마이크를 걸고 팝 필터를 <v>5~10cm</v> 앞에 세운다"]},{"n":"거리·각도·게인","s":["입에서 <v>15~20cm</v> 거리를 잡는다","마이크를 입 높이에서 살짝 틀어 오프 액시스로 놓는다","가장 큰 소절을 불러 보며 게인을 피크 <v>-12</v>dBFS로 맞춘다"]},{"n":"모니터링","s":["스피커를 끄고 밀폐형 헤드폰을 쓴다","인터페이스의 다이렉트 모니터링으로 내 목소리 크기를 맞춘다","반주와 목소리의 균형을 헤드폰 안에서 편하게 만든다"]}],"drill":["방의 세 자리에서 같은 문장을 녹음해 울림 차이를 비교하고 가장 좋은 자리를 정한다.","거리 10cm, 20cm, 40cm로 같은 소절을 녹음해 근접 효과와 방 울림의 변화를 듣는다.","정면과 오프 액시스로 파열음이 많은 문장을 녹음해 바람 소리 차이를 비교한다."],"keys":[["R","녹음"],["스페이스","재생과 정지"],["⌘U","선택을 사이클로"]],"chk":["울림이 짧은 자리를 찾을 수 있다","거리와 각도를 이유와 함께 정한다","헤드폰 모니터링으로 녹음한다"],"quiz":[{"q":"보컬 마이크 거리의 기준은?","a":["5cm","15~20cm","50cm","1m"],"c":1,"e":"주먹 두 개 정도. 가까우면 저음이 붇고 멀면 방 울림이 섞인다."},{"q":"녹음할 때 스피커를 꺼야 하는 이유는?","a":["전기를 아끼려고","스피커 소리가 마이크로 다시 들어가서","저작권 때문에","마이크가 상해서"],"c":1,"e":"하울링이 나거나 반주가 녹음에 섞인다. 모니터링은 헤드폰으로 한다."},{"q":"게인은 어느 부분을 기준으로 잡나?","a":["가장 조용한 부분","가장 크게 부르는 부분","중간 부분","반주만"],"c":1,"e":"제일 큰 소절에서 피크 -12dBFS 부근이면 어디서도 클리핑이 나지 않는다."}],"d":49,"s":8},{"t":"악기 마이킹","goal":"악기별 마이크 기준 위치와 다중 마이크 규칙을 안다.","con":["악기 마이킹의 원리는 하나다. 마이크가 놓인 자리의 소리가 그대로 녹음된다. 악기는 부위마다 다른 소리를 내므로, 어디를 겨누느냐가 음색을 정한다. 정답은 없고 기준점이 있다.","어쿠스틱 기타. 사운드홀을 정면으로 겨누면 저음이 과해 붕붕댄다. 기준점은 <v>12</v>프렛 부근, 거리 <v>15~30cm</v>다. 넥 쪽으로 갈수록 맑아지고 브리지 쪽으로 갈수록 두꺼워진다. 마이크를 조금씩 옮기며 헤드폰으로 듣고 정한다.","기타 앰프. 스피커 콘의 중심을 겨누면 밝고 날카롭고, 가장자리로 갈수록 어둡고 부드럽다. 기준점은 중심과 가장자리의 중간, 그릴에 바짝 붙인 거리다. 다이내믹 마이크가 큰 음압을 버텨 주므로 이쪽이 기본이다.","피아노, 현악기, 방 전체 같은 넓은 소리는 마이크 한 대로 부족할 때가 있다. 두 대로 스테레오를 만드는 가장 안전한 방법이 XY다. 두 마이크의 머리를 한 점에 모으고 <v>90</v>도로 벌려 좌우를 나눠 받는다. 한 점에 모으는 이유는 시간이다. 머리가 한 점에 있으면 소리가 두 마이크에 같은 시간에 도착해 위상 문제가 없고, 좌우 구분은 두 마이크가 받는 크기 차이로 만들어진다. 90도인 이유는 균형이다. 더 벌리면 넓어지는 대신 가운데가 비고, 좁히면 모노에 가까워진다. 머리가 한 점에 있어서 두 마이크에 소리가 같은 시간에 도착하고, 위상 문제가 생기지 않는다.","마이크를 여러 대 쓸 때의 규칙이 3대 1 법칙이다. 두 번째 마이크는 첫 마이크와 소리원 사이 거리의 세 배 이상 떨어뜨린다. 세 배인 이유는 거리 감쇠다. 소리는 거리가 두 배가 될 때마다 약 6dB씩 작아지므로, 세 배 거리에서는 새어 드는 소리가 원 신호보다 9dB 이상 작아 간섭의 굴곡이 귀에 잡히지 않는다. 소리원에서 30cm에 세웠다면 다음 마이크는 90cm 밖이다. 이 간격이 지켜지면 같은 소리가 두 마이크에 시간 차로 들어가 생기는 위상 간섭이 귀에 안 들릴 만큼 작아진다.","거리 자체도 음색이다. 가까이 대면 마르고 또렷한 소리, 멀리 두면 공간이 섞인 소리가 된다. 가까이 받은 트랙에 리버브를 더하는 것은 쉽지만, 멀리 받아 섞인 울림을 빼는 것은 불가능하다. 애매하면 가까이 받는다.","녹음 전 마지막 확인. 악기 자체의 상태다. 기타 줄이 오래됐으면 어떤 마이크로도 죽은 소리가 난다. 조율, 줄, 삐걱거리는 의자. 소리의 출발점이 좋아야 이후 단계의 결과도 좋다."],"path":[{"n":"어쿠스틱 기타 세팅","s":["마이크를 <v>12</v>프렛 높이, 거리 <v>15~30cm</v>에 세운다","연주하며 헤드폰으로 듣는다","넥 쪽과 브리지 쪽으로 조금씩 옮기며 원하는 밝기를 찾는다","자리가 정해지면 스탠드를 고정하고 위치를 사진으로 남긴다"]},{"n":"XY 스테레오","s":["오디오 트랙을 2개 만들고 입력을 각각 1번, 2번으로 지정한다","같은 마이크 두 대의 머리를 한 점에 모아 <v>90</v>도로 벌린다","믹서에서 한 트랙은 팬 왼쪽 끝, 다른 트랙은 오른쪽 끝","녹음 후 모노로 합쳐 들어 소리가 얇아지지 않는지 확인한다"]}],"drill":["어쿠스틱 기타(또는 아무 악기)를 사운드홀 정면과 12프렛 두 위치로 녹음해 저음 차이를 듣는다.","같은 연주를 거리 15cm와 1m로 녹음해 공간감 차이를 비교한다.","XY로 받은 스테레오 녹음을 모노로 합쳐 위상 문제가 없는지 확인한다."],"keys":[["R","녹음"],["X","믹서"],["S","솔로"]],"chk":["기타 12프렛 기준점을 안다","XY가 위상에 안전한 이유를 설명할 수 있다","3대 1 법칙을 안다"],"quiz":[{"q":"어쿠스틱 기타 마이크의 기준점은?","a":["사운드홀 정면","12프렛 부근","헤드 끝","브리지 뒤"],"c":1,"e":"사운드홀 정면은 저음이 과하다. 12프렛에서 시작해 취향대로 옮긴다."},{"q":"3대 1 법칙에서 첫 마이크가 소리원에서 30cm라면 두 번째 마이크는?","a":["10cm 안","30cm","90cm 이상","정확히 60cm"],"c":2,"e":"거리의 세 배 이상 떨어뜨리면 위상 간섭이 귀에 안 들릴 만큼 작아진다."},{"q":"XY 방식이 위상에 안전한 이유는?","a":["마이크가 비싸서","두 마이크에 소리가 같은 시간에 도착해서","한 대만 녹음돼서","리버브가 없어서"],"c":1,"e":"머리를 한 점에 모으기 때문에 시간 차가 없어 상쇄가 생기지 않는다."}],"d":50,"s":8},{"d":51,"s":8,"t":"테이크와 컴핑","goal":"테이크 폴더를 만들고 컴핑으로 조립한다.","con":["컴핑은 여러 테이크에서 좋은 구간만 골라 이어 붙이는 작업이다. 보컬 작업에서 가장 오래 붙잡고 있게 되는 일이다.","사이클 녹음을 켜고 같은 구간을 반복 녹음하면 테이크 폴더가 자동으로 만들어진다. 테이크가 층층이 쌓인다.","테이크 폴더를 열면 모든 테이크가 보인다. 원하는 구간을 드래그해 선택하면 그 부분이 최종 결과에 포함된다. 로직이 경계에 자동으로 크로스페이드를 넣는다.","자르는 지점은 소리가 없거나 약한 곳으로 잡는다. 단어 중간에서 자르면 티가 난다. 숨 쉬는 자리가 가장 좋다.","컴핑이 끝나면 병합해서 하나의 오디오 리전으로 만든다. 그 뒤에 정리 작업을 한다."],"path":[{"n":"사이클 녹음","s":["구간을 사이클로 지정 <k>⌘U</k>","<b>레코드 → 오디오 레코딩 설정</b>에서 <b>테이크 폴더 생성</b> 확인","<k>R</k>로 반복 녹음"]},{"n":"컴핑","s":["테이크 폴더 왼쪽 위 <b>펼침 삼각형</b> 클릭","원하는 테이크의 좋은 구간을 드래그","경계 지점 드래그로 미세 조정","완료 후 폴더 우클릭 → <b>병합</b>"]}],"drill":["같은 8마디를 5번 녹음해 테이크 폴더를 만든다.","각 테이크에서 좋은 구간을 골라 하나로 조립한다. 자르는 지점을 숨 자리에 둔다.","완성된 컴프를 병합하고 원본 테이크 폴더는 보관한다."],"keys":[["R","녹음"],["C","사이클"],["⌘U","선택을 사이클로"]],"chk":["테이크 폴더를 만들 수 있다","자르는 지점을 숨 자리에 둔다","병합까지 마쳤다"],"quiz":[{"q":"컴핑에서 테이크를 자르기 좋은 지점은?","a":["가장 큰 소리 부분","단어 한가운데","숨 쉬는 자리","마디 첫 박"],"c":2,"e":"소리가 없거나 약한 자리에서 자르면 이음매가 들리지 않는다."}]},{"d":52,"s":8,"t":"플렉스 타임과 플렉스 피치","goal":"플렉스 타임과 플렉스 피치로 타이밍과 음정을 수정한다.","con":["플렉스 타임은 오디오의 타이밍을 미디처럼 옮길 수 있게 해준다. 파형에 트랜지언트 표시가 생기고 그것을 드래그하면 앞뒤가 늘어나거나 줄어든다.","먼저 모드를 고른다. 단선율 악기와 보컬은 모노포닉, 코드가 들어간 것은 폴리포닉, 드럼은 슬라이싱이 적합하다. 잘못 고르면 소리가 뭉개진다.","플렉스 피치는 보컬의 음정을 고친다. 각 음이 막대로 표시되고 위아래로 드래그하면 음정이 바뀐다. 비브라토와 음정 흔들림도 따로 조절할 수 있다.","음정 보정은 완전히 붙이지 않는 것이 자연스럽다. 완벽하게 맞추면 기계처럼 들린다. 눈에 띄게 벗어난 음만 고치는 것이 기본이다.","플렉스를 켜면 컴퓨터 부담이 커진다. 작업이 끝나면 바운스해서 새 오디오로 만드는 편이 좋다. 되돌릴 수 없는 편집을 하기 전에는 <k>⌥⌘F</k>로 리전을 독립된 오디오 파일로 만든다. 같은 파일을 쓰는 다른 리전이 함께 바뀌는 사고를 막아준다. 특히 Apple Loops나 같은 샘플을 여러 번 복사해 쓴 경우에 필요하다."],"path":[{"n":"플렉스 켜기","s":["<k>⌘F</k> → 트랙 영역에 플렉스 표시","트랙 헤더의 <b>플렉스</b> 버튼 클릭","모드 선택: <b>모노포닉 / 폴리포닉 / 슬라이싱 / 리듬</b>","파형의 세로선을 드래그"]},{"n":"플렉스 피치","s":["트랙 플렉스 모드를 <b>플렉스 피치</b>로","오디오 리전 더블 클릭 → 오디오 트랙 편집기","음 막대를 위아래로 드래그 → 음정","막대 위 여섯 개 핸들로 미세 조정"]}],"drill":["보컬이나 단선율 오디오에 플렉스 타임을 켜고 늦은 음을 앞으로 당긴다.","플렉스 피치로 벗어난 음 두세 개만 고치고 나머지는 그대로 둔다.","전부 완벽히 맞춘 버전과 비교해 어느 쪽이 자연스러운지 판단한다."],"keys":[["⌘F","플렉스 표시"],["E","편집기"],["⌥⌘F","독립 오디오 파일로 변환"]],"chk":["플렉스 모드를 구분해 쓴다","타이밍을 고칠 수 있다","과도한 보정을 피한다"],"quiz":[{"q":"드럼 오디오에 적합한 플렉스 모드는?","a":["모노포닉","폴리포닉","슬라이싱","속도"],"c":2,"e":"슬라이싱은 타격 지점을 기준으로 잘라 옮기기 때문에 타악기에 적합하다."}]},{"d":53,"s":8,"t":"보컬 편집 기초","goal":"보컬 리전을 정리하고 페이드를 넣는다.","con":["보컬 편집 순서는 정해져 있다. 컴핑 → 잡음 정리 → 타이밍 → 음정 → 이후 믹싱이다. 순서를 지키면 되돌아갈 일이 줄어든다.","잡음 정리는 노래하지 않는 구간을 지우는 일이다. 리전 사이 빈 곳을 잘라내면 방 소리와 입 소리가 사라져 훨씬 깨끗해진다. 다만 숨소리를 전부 지우면 부자연스러워지므로 크기만 줄이는 편이 낫다. 구간이 많으면 하나씩 자르는 대신 자동으로 맡긴다. 리전을 선택하고 <k>⌃X</k>를 누르면 무음 제거 창이 열린다. 스레숄드 값을 정하면 그보다 작은 구간이 한 번에 잘려 나간다. 다만 자동에 맡긴 뒤에는 반드시 눈으로 확인한다. 스레숄드를 높게 잡으면 숨소리와 여린 어미까지 함께 잘려서 부자연스러워진다. 어미가 잘렸으면 스레숄드를 낮춰 다시 하거나 그 부분만 수동으로 되살린다.","페이드는 필수다. 자른 지점마다 짧은 페이드를 넣지 않으면 딸깍 소리가 난다. <v>3~10</v>ms면 충분하다.","더블링은 같은 부분을 한 번 더 불러 좌우로 벌리는 기법이다. 코러스를 두껍게 만든다. 미디처럼 복사해서는 효과가 없고 실제로 다시 불러야 한다.","이 단계에서는 이펙트를 걸지 않는다. 정리만 한다. 다만 정리가 끝난 뒤 이펙트를 거는 순서는 미리 알아두는 편이 낫다.","보컬 처리 순서는 하이패스 → 디에서 → EQ → 컴프레서 → 프레즌스 → 새추레이션 → 딜레이 → 리버브다. 이 순서에는 이유가 있다. 치찰음을 컴프보다 먼저 잡아야 컴프가 그 순간에 과반응해 목소리 전체를 눌러버리는 일이 없고, 공간계를 맨 뒤에 둬야 잔향까지 압축되어 뭉개지지 않는다. 순서를 바꾸면 각 처리가 서로의 결과를 건드린다.","각 단계의 시작값. 하이패스 <v>80~120</v>Hz, 디에서 탐지 <v>6</v>kHz 부근에 리덕션 <v>3~6</v>dB, EQ는 <v>250~500</v>Hz를 <v>2</v>dB 깎고 <v>10</v>kHz를 <v>2</v>dB 올리는 정도, 컴프는 레이시오 <v>3:1</v> 어택 <v>10</v>ms 릴리스 <v>80</v>ms, 딜레이는 4분음표에 믹스 <v>15</v>퍼센트, 리버브는 디케이 <v>1.8</v>초에 믹스 <v>15</v>퍼센트. 전부 시작점이고 목소리마다 다시 맞춘다.","병렬 컴프레션은 두께를 얻는 다른 방법이다. 보컬을 버스로 보내 아주 세게 누른 복사본을 만들고, 그것을 원음에 <v>20~30</v>퍼센트만 섞는다. 원음의 다이내믹은 그대로 남고 작은 소리만 끌어올려져서, 세게 누른 소리의 밀도와 여린 부분의 표정을 동시에 얻는다. 한 트랙에 강하게 컴프를 거는 것과 결과가 다른 이유가 여기 있다. 누른 소리로 대체하는 것이 아니라 더하는 것이다.","모든 단계를 다 쓸 필요는 없다. 목소리가 이미 고르면 컴프를 약하게, 치찰음이 없으면 디에서를 빼도 된다. 순서는 지키되 필요한 것만 쓴다."],"path":[{"n":"구간 정리","s":["노래 없는 구간 선택 → 가위 도구 또는 <k>⌘T</k>로 분할","해당 리전 <b>Delete</b>","남은 리전 양 끝을 잡고 페이드 만들기: 리전 좌우 <b>위쪽 모서리</b> 드래그"]},{"n":"자동 페이드","s":["리전 선택 → <k>I</k> 인스펙터 리전 영역","<b>페이드 인</b> <v>5</v>ms, <b>페이드 아웃</b> <v>5</v>ms 입력"]},{"n":"병렬 컴프 만들기","s":["보컬 채널의 <b>Sends</b> → 새 <b>Bus</b> 지정","생긴 Aux에 <b>Compressor</b> 추가","레이시오 <v>8:1</v> 이상, 게인 리덕션 <v>10</v>dB 이상으로 세게","Aux 페이더를 <v>-∞</v>에서 천천히 올려 원음 아래에서 섞이는 지점 찾기"]}],"drill":["녹음한 보컬에서 노래 없는 구간을 전부 잘라낸다. 숨소리는 남기고 크기만 줄인다.","모든 자른 지점에 5ms 페이드를 넣고 딸깍 소리가 사라졌는지 확인한다.","코러스 한 구간을 더블링으로 다시 녹음해 좌우로 벌려본다."],"keys":[["⌘T","분할"],["I","인스펙터"],["Delete","삭제"],["⌃X","무음 구간 제거"]],"chk":["편집 순서를 지킨다","페이드로 딸깍 소리를 없앴다","더블링을 시도해봤다","보컬 처리 순서와 그 이유를 안다","병렬 컴프의 원리를 설명할 수 있다"],"quiz":[{"q":"자른 지점에서 딸깍 소리가 나는 것을 막는 방법은?","a":["볼륨 낮추기","짧은 페이드","리버브 추가","퀀타이즈"],"c":1,"e":"3~10ms 정도의 짧은 페이드면 파형이 갑자기 끊기는 것을 막는다."},{"q":"디에서를 컴프레서보다 먼저 거는 이유는?","a":["CPU 절약","치찰음에 컴프가 과반응해 목소리 전체를 누르는 것을 막으려고","순서는 상관없다","리버브 때문에"],"c":1,"e":"튀는 치찰음이 컴프를 크게 작동시키면 그 순간 목소리 전체가 눌린다."},{"q":"병렬 컴프가 한 트랙에 세게 거는 것과 다른 점은?","a":["CPU를 덜 쓴다","누른 소리로 대체하지 않고 원음에 더한다","음정이 정확해진다","자동이다"],"c":1,"e":"원음의 다이내믹을 유지한 채 눌린 복사본을 섞어 밀도만 더한다."}]},{"d":54,"s":9,"t":"레퍼런스와 청취 환경","goal":"레퍼런스 트랙을 설정하고 청취 환경을 관리한다.","con":["믹싱에서 가장 흔한 실패는 기술 부족이 아니라 판단 기준이 없는 것이다. 목표로 삼을 소리를 옆에 두고 비교하면 문제가 눈에 띄게 잘 보인다.","레퍼런스는 내가 만들려는 곡과 장르와 편성이 비슷한 완성 음원이다. 프로젝트에 오디오 트랙으로 불러와 놓고 수시로 오간다.","비교할 때 반드시 음량을 맞춘다. 레퍼런스는 마스터링이 끝나 크기 때문에 그냥 비교하면 무조건 좋게 들린다. 레퍼런스 트랙 페이더를 <v>-8</v>에서 <v>-12</v>dB 정도 내려 체감 크기를 비슷하게 맞춘 뒤 듣는다.","청취 음량이 판단을 바꾼다. 크게 들으면 저역과 고역이 강조되어 실제보다 좋게 들린다. 밸런스 판단은 작게, 세부 확인은 잠깐 크게 하는 식으로 나눈다. 한 자리에서 오래 크게 듣는 것이 가장 나쁘다.","귀는 20분에서 30분이면 지친다. 지친 귀는 고역을 덜 느껴서 자꾸 밝게 만들게 된다. 짧게 쉬는 편이 낫다.","확인은 여러 곳에서 한다. 스튜디오 모니터, 이어폰, 노트북 스피커, 휴대폰, 차 안. 모두에서 무난하면 완성이다."],"path":[{"n":"레퍼런스 트랙 만들기","s":["오디오 트랙 생성 → 완성 음원 파일 드래그","트랙 출력을 <b>Stereo Out</b> 대신 새 <b>Bus</b>로 지정하면 마스터 체인을 거치지 않음","페이더를 <v>-10</v>dB 부근으로 내려 음량 맞춤","<k>S</k>로 오가며 비교"]}],"drill":["장르가 비슷한 완성 음원 세 곡을 프로젝트에 넣고 음량을 맞춘다.","내 믹스와 레퍼런스를 번갈아 들으며 저역, 보컬 크기, 넓이 세 가지를 비교해 적는다.","같은 믹스를 아주 작은 음량과 큰 음량으로 듣고 판단이 어떻게 달라지는지 확인한다."],"keys":[["S","솔로"],["M","뮤트"],["X","믹서"]],"chk":["레퍼런스 음량을 맞춰 비교한다","작게 듣고 밸런스를 판단한다","여러 환경에서 확인한다"],"quiz":[{"q":"레퍼런스와 비교할 때 반드시 해야 하는 것은?","a":["같은 템포로 맞추기","음량을 맞추기","같은 조로 옮기기","모노로 듣기"],"c":1,"e":"크면 좋게 들리기 때문에 음량을 맞추지 않으면 비교가 성립하지 않는다."}]},{"d":55,"s":9,"t":"게인 스테이징과 밸런스","goal":"페이더만으로 트랙 밸런스를 잡는다.","con":["믹싱의 첫 단계는 이펙트가 아니라 균형이다. 페이더만 움직여서 좋게 들리지 않으면 어떤 플러그인도 해결해주지 못한다.","게인 스테이징은 각 트랙의 레벨을 적정 범위에 두는 일이다. 개별 트랙 피크를 <v>-18</v>에서 <v>-10</v>dBFS 사이에 두고, 마스터 출력이 <v>-6</v>dBFS를 넘지 않게 한다. -18 부근인 이유는 내력이다. 아날로그 장비의 기준 동작 레벨을 디지털 눈금으로 옮기면 대략 이 지점이고, 아날로그를 본뜬 플러그인은 이 레벨에서 설계된 소리를 낸다. 마스터가 넘칠 때 마스터 페이더만 내려 해결하는 것도 피한다. 로직 내부 연산은 여유가 커서 소리 자체는 안 깨지지만, 각 트랙이 뜨거운 채로 남아 플러그인들이 계속 설계 레벨 밖에서 일하게 된다. 해결은 트랙 쪽에서 한다. 여유가 있어야 마스터링 단계에서 할 일이 남는다.","순서는 아래에서 위로 쌓는다. 킥 → 베이스 → 스네어 → 나머지 드럼 → 코드 악기 → 리드나 보컬. 킥을 <v>-12</v>dBFS 정도로 기준 삼고 나머지를 맞춘다.","솔로로 듣지 말고 전체로 듣는다. 솔로에서 좋은 소리가 합쳤을 때 좋다는 보장이 없다. 인터넷에 도는 악기별 권장 피크 표는 그대로 쓰지 않는다. 두 가지 이유가 있다. 첫째, 킥과 베이스와 보컬을 각각 -6dBFS에 맞추면 합쳤을 때 마스터가 반드시 넘친다. 같은 크기 두 개만 합쳐도 6dB가 오른다. 둘째, 균형은 피크가 아니라 체감 크기로 잡는 것이다. 킥은 피크가 높고 지속이 짧지만 패드는 피크가 낮아도 계속 울려서, 피크가 같아도 패드가 훨씬 크게 들린다. 여러 트랙을 한꺼번에 껐다 켜며 비교할 때는 트랙을 다중 선택하고 <k>⌥⇧M</k>을 쓴다. 드럼 전체를 빼고 나머지만 들어보는 식의 확인이 한 번에 된다.","작게 듣는 것이 밸런스 판단에 유리하다. 작게 듣는 이유는 귀의 감도가 음량에 따라 변하기 때문으로, 앞의 레퍼런스 일차에서 본 그대로다. 작게 틀면 착시가 걷혀 중역의 진짜 균형이 드러난다. 크게 들으면 다 좋게 들린다. 아주 작게 틀었을 때 곡의 뼈대가 들리면 균형이 맞은 것이다.","절대값 대신 상대 순서를 기억한다. 앞에서부터 킥, 베이스, 리드 보컬. 그다음 스네어와 클랩. 중간에 피아노와 기타와 신스 리드. 뒤에 하이햇, 심벌, 패드, 스트링, 백보컬. 가장 뒤에 효과음과 라이저. 이 순서대로 들리면 균형이 맞은 것이고, 숫자는 곡마다 다르다."],"path":[{"n":"믹서에서 밸런스","s":["<k>X</k>로 믹서 열기","모든 트랙 페이더를 <v>-∞</v>로 내림","킥부터 하나씩 올리며 균형","마스터 채널 미터가 <v>-6</v>dBFS를 넘지 않는지 확인"]},{"n":"게인 조정","s":["트랙 이펙트 첫 슬롯에 <b>Gain</b> 플러그인","입력 레벨을 조정해 피크를 <v>-14</v>dBFS 부근으로","페이더는 0dB 근처에 두고 작업"]}],"drill":["모든 페이더를 내리고 킥부터 순서대로 올려 밸런스를 다시 잡는다. 시간을 재본다.","완성된 밸런스를 아주 작은 음량으로 들어보고 무엇이 안 들리는지 적는다.","마스터 피크가 -6dBFS를 넘지 않게 전체를 조정한다."],"keys":[["X","믹서"],["S","솔로"],["M","뮤트"],["⌥클릭","페이더 초기화"],["⌥⇧M","선택 트랙 일괄 뮤트"]],"chk":["페이더만으로 균형을 만들 수 있다","마스터 여유를 남긴다","작게 듣고 판단한다","악기 앞뒤 순서를 외웠다"],"quiz":[{"q":"믹스 중 마스터 출력 피크는 대략 어디를 넘지 않는 것이 좋은가?","a":["0dBFS","-6dBFS","-20dBFS","-40dBFS"],"c":1,"e":"-6dBFS 정도 여유를 남겨야 마스터링에서 처리할 공간이 생긴다."},{"q":"악기별 권장 피크 표를 그대로 따르면 안 되는 이유는?","a":["플러그인이 달라서","각각 맞추면 합쳤을 때 마스터가 넘치고, 균형은 체감 크기로 잡기 때문","템포가 달라서","샘플레이트 때문"],"c":1,"e":"같은 크기 두 개만 합쳐도 6dB가 오른다. 그리고 피크가 같아도 지속이 긴 소리가 훨씬 크게 들린다."}]},{"d":56,"s":9,"t":"이퀄라이저","goal":"하이패스와 컷 중심으로 EQ를 사용한다.","con":["EQ의 첫 번째 용도는 더하기가 아니라 빼기다. 안 쓰는 저역을 걷어내는 것만으로 믹스가 훨씬 맑아진다.","하이패스 필터는 거의 모든 트랙에 건다. 모든 트랙에 거는 이유는 쌓임이다. 트랙 하나의 저역 잡음은 안 들리지만 스무 트랙이 겹치면 악기가 내지도 않는 대역이 큰 에너지가 되어 헤드룸을 잡아먹고 전체를 흐린다. 기준값. 보컬 <v>80~100</v>Hz, 기타 <v>90~120</v>Hz, 스네어 <v>120</v>Hz, 하이햇 <v>300~500</v>Hz, 신스 패드 <v>150~200</v>Hz. 킥과 베이스는 하이패스를 걸더라도 <v>25~30</v>Hz 정도로 아주 낮게만 건다.","자주 문제가 되는 대역은 여섯 군데다. <v>20~40</v>Hz는 귀에 안 들리고 몸으로만 느껴지는 울림이라 하이패스로 걷어낸다. <v>200~400</v>Hz는 뭉치고 답답한 느낌, <v>400~800</v>Hz는 상자 안에서 나는 것 같은 갑갑함, <v>1~2</v>kHz는 코를 막고 말하는 듯한 소리, <v>2~5</v>kHz는 귀를 찌르는 날카로움, <v>5~8</v>kHz는 치찰음이다. 잡음이 섞인 녹음이라면 <v>10</v>kHz 위를 로우패스로 정리하기도 한다.","이 표를 규칙으로 오해하지 않는다. 같은 주파수가 악기에 따라 문제가 되기도 하고 그 악기의 특징이 되기도 한다. 스네어의 <v>400</v>Hz는 몸통이고, 같은 자리가 기타에 있으면 갑갑함이다. 소리를 듣고 문제가 느껴질 때만 손댄다.","찾는 방법은 부스트 스윕이다. 좁은 폭으로 크게 올린 채 주파수를 옮기며 가장 거슬리는 지점을 찾고, 그 지점을 반대로 깎는다.","밝게 하고 싶으면 <v>10</v>kHz 부근을 넓게 <v>2~3</v>dB 올린다. 큰 값은 대개 문제를 만든다.","EQ는 눈이 아니라 귀로 한다. 그래프가 예쁜 것과 소리가 좋은 것은 다르다. 자주 쓰는 시작점은 프리셋으로 저장해 둔다. 보컬 하이패스와 뭉침 컷을 걸어 둔 상태를 플러그인 창 상단 프리셋 메뉴의 <b>별도 저장</b>으로 남기면 다음 곡에서 제로부터 시작하지 않는다. 프리셋은 시작점이지 정답이 아니므로 불러온 뒤 귀로 다시 맞춘다."],"path":[{"n":"Channel EQ 쓰기","s":["채널 스트립 이펙트 슬롯 → <b>EQ → Channel EQ</b>","맨 왼쪽 밴드 = 하이패스. 켜고 주파수 입력","밴드를 클릭해 켜고, 세로 드래그로 게인, 가로 드래그로 주파수","<b>Q</b> 값은 밴드 위에서 위아래 드래그"]},{"n":"부스트 스윕","s":["밴드 게인을 <v>+12</v>dB, Q를 <v>8</v> 정도로","주파수를 좌우로 천천히 이동","가장 거슬리는 지점 찾기","게인을 <v>-3</v>에서 <v>-6</v>dB로 뒤집기"]}],"drill":["모든 트랙에 적절한 하이패스를 건다. 걸기 전후를 비교한다.","한 트랙에서 부스트 스윕으로 문제 대역을 찾아 깎아본다.","보컬 트랙에서 200~400Hz를 3dB 깎고 10kHz를 2dB 올려 차이를 듣는다."],"keys":[["X","믹서"],["⌥클릭","값 초기화"]],"chk":["하이패스를 습관적으로 건다","부스트 스윕으로 문제를 찾을 수 있다","깎기를 먼저 시도한다","문제 대역 여섯 군데를 안다"],"quiz":[{"q":"답답하고 뭉친 느낌이 자주 생기는 대역은?","a":["40~60Hz","200~400Hz","2~4kHz","12kHz 이상"],"c":1,"e":"200~400Hz에 여러 악기가 겹치면 탁해진다."},{"q":"보컬 하이패스의 일반적인 시작점은?","a":["20Hz","80~100Hz","300Hz","1kHz"],"c":1,"e":"80~100Hz 아래는 보컬에 필요 없는 저역이 대부분이다."},{"q":"상자 안에서 나는 것 같은 갑갑한 소리의 대역은?","a":["20~40Hz","400~800Hz","2~5kHz","10kHz 이상"],"c":1,"e":"400~800Hz다. 다만 같은 자리가 스네어에서는 몸통이 되므로 악기마다 판단한다."}]},{"d":57,"s":9,"t":"컴프레서","goal":"컴프레서의 다섯 파라미터를 설정한다.","con":["컴프레서는 큰 소리만 눌러 크고 작은 차이를 줄인다. 그 뒤 전체를 올리면 작은 소리가 더 잘 들린다. 결과적으로 소리가 앞으로 나오고 단단해진다.","파라미터 다섯 개. 스레숄드는 누르기 시작하는 지점, 레이시오는 누르는 비율, 어택은 누르기 시작하는 속도, 릴리스는 놓아주는 속도, 메이크업 게인은 줄어든 만큼 보상하는 값이다.","시작값 감각. 보컬은 레이시오 <v>3:1</v>, 어택 <v>10</v>ms, 릴리스 <v>100</v>ms, 게인 리덕션 <v>3~6</v>dB. 킥과 스네어는 레이시오 <v>4:1</v>, 어택 <v>10~30</v>ms, 릴리스 <v>80~150</v>ms. 베이스는 레이시오 <v>4:1</v>, 어택 <v>20</v>ms, 릴리스 <v>120</v>ms.","어택이 짧으면 타격감이 눌린다. 드럼에서 펀치를 살리려면 어택을 <v>20~30</v>ms로 길게 둬서 첫 타격은 통과시키고 그 뒤를 누른다.","릴리스는 곡의 템포와 맞물린다. 너무 길면 다음 소리까지 눌리고, 너무 짧으면 펌핑이 생긴다. 발이 까딱거리는 느낌이 나면 대개 맞은 것이다.","게인 리덕션 미터가 <v>3~6</v>dB 정도 움직이는 것이 일반적이다. 10dB 이상 계속 눌린다면 다시 생각한다."],"path":[{"n":"Compressor 걸기","s":["채널 스트립 이펙트 슬롯 → <b>Dynamics → Compressor</b>","상단에서 모델 선택. 기본은 <b>Platinum Digital</b>, 보컬은 <b>Studio VCA</b>","<b>Threshold</b>를 내려 게인 리덕션 <v>3~6</v>dB 확보","<b>Ratio</b>, <b>Attack</b>, <b>Release</b> 순으로 조정","<b>Make Up</b>으로 음량 보상"]}],"drill":["보컬에 컴프를 걸고 스레숄드만 움직여 게인 리덕션 3dB와 10dB를 비교한다.","드럼에서 어택을 1ms와 30ms로 바꿔 타격감 차이를 듣는다.","릴리스를 30ms와 300ms로 바꿔 펌핑이 생기는 지점을 찾는다."],"keys":[["X","믹서"],["⌥클릭","값 초기화"]],"chk":["다섯 파라미터를 설명할 수 있다","어택으로 타격감을 조절할 수 있다","게인 리덕션 양을 보고 판단한다"],"quiz":[{"q":"드럼의 타격감을 살리려면 어택을?","a":["0ms에 가깝게 짧게","20~30ms로 길게","최대로 길게","조절하지 않음"],"c":1,"e":"어택을 길게 두면 첫 타격이 통과한 뒤 눌리기 때문에 펀치가 남는다."},{"q":"일반적인 게인 리덕션 목표 범위는?","a":["0~1dB","3~6dB","10~15dB","20dB 이상"],"c":1,"e":"3~6dB가 자연스러운 범위다."}]},{"t":"그룹 버스 컴프레션","goal":"같은 계열 트랙을 하나로 묶어 함께 누르고, 누적 게인 리덕션을 관리한다.","con":["개별 트랙 컴프는 트랙 하나의 음량 편차를 다듬는다. 그런데 드럼 여덟 트랙을 각각 다듬어도 여덟 개가 따로 노는 느낌은 남는다. 이때 여덟 트랙을 하나의 버스로 모아 그 버스에 컴프를 하나 더 걸면, 여덟 트랙이 같은 손에 눌려 한 덩어리로 움직인다. 이것이 그룹 버스 컴프레션이고 흔히 글루라고 부른다.","묶는 기준은 역할이다. 드럼끼리, 보컬끼리, 기타끼리, 건반과 현악 같은 배경 악기끼리 묶는다. 소리가 비슷해서가 아니라 곡에서 하는 일이 같아서 묶는 것이다.","드럼 버스. 레이시오 <v>4:1</v>, 어택 <v>20~30</v>ms, 릴리스 <v>100</v>ms 또는 자동, 게인 리덕션 <v>3~6</v>dB. 어택을 길게 두는 이유는 개별 트랙 때와 같다. 첫 타격을 통과시키고 뒤의 울림만 눌러야 펀치가 남는다. 목표는 킷 전체가 한 사람이 친 것처럼 들리는 것이다.","보컬 버스. 레이시오 <v>2:1~3:1</v>, 어택 <v>5~20</v>ms, 릴리스 <v>50~150</v>ms, 게인 리덕션 <v>2~4</v>dB. 리드와 더블링과 하모니를 묶어 함께 누르면 여러 겹이 하나의 목소리 덩어리로 들린다. 개별 보컬 컴프보다 약하게 거는 이유는 이미 각 트랙에서 한 번 눌렸기 때문이다.","기타 버스. 레이시오 <v>2:1~4:1</v>, 어택 <v>10~30</v>ms, 릴리스 <v>80~200</v>ms, 게인 리덕션 <v>2~5</v>dB. 좌우로 벌린 리듬 기타 두 대를 묶어 누르면 둘이 한 벽처럼 붙어 넓게 들린다.","배경 악기 버스. 건반, 베이스, 관악, 현악처럼 화성을 채우는 악기들. 레이시오 <v>2:1</v>, 어택 <v>10~30</v>ms, 릴리스 <v>100~250</v>ms, 게인 리덕션 <v>1~3</v>dB. 가장 약하게 건다. 이 층은 앞에 나서지 않고 자리를 지키는 것이 일이라 세게 누르면 오히려 존재가 흐려진다.","버스 단계의 게인 리덕션이 개별 트랙보다 작은 이유가 있다. 컴프는 겹쳐 걸리기 때문이다. 트랙에서 <v>5</v>dB 누르고 버스에서 <v>4</v>dB 누르고 마스터에서 <v>2</v>dB 누르면 그 소리는 합쳐서 <v>11</v>dB 눌린 것이다. 각 단계에서는 적당해 보여도 최종 결과는 납작해진다. 그래서 아래 단계로 갈수록 조금씩만 누르고, 세 단계 합이 <v>8</v>dB를 넘지 않게 관리한다.","버스 컴프의 효과를 확인하는 방법은 하나다. 켜고 끄면서 듣되, 켜면 소리가 커지므로 메이크업 게인을 낮춰 음량을 맞춘 뒤 비교한다. 음량을 안 맞추면 큰 쪽이 무조건 좋게 들려 판단이 성립하지 않는다.","버스를 만들면 그 버스에 EQ와 리버브 센드를 함께 걸 수 있다는 이점도 생긴다. 드럼 전체에 같은 룸 리버브를 보내면 킷이 한 방 안에 있는 것처럼 들린다."],"path":[{"n":"트랙 스택으로 버스 만들기","s":["묶을 트랙들을 모두 선택","<k>⌘⇧D</k> → <b>서밍 스택</b> 선택","맨 위에 생긴 스택 트랙이 그 그룹의 버스다","이름을 <b>DRUMS</b>처럼 대문자로 지정해 개별 트랙과 구분"]},{"n":"버스에 컴프 걸기","s":["스택 트랙 선택 → <k>X</k> 믹서에서 해당 채널 확인","이펙트 슬롯 → <b>Dynamics → Compressor</b>","모델은 <b>Studio VCA</b> 또는 <b>Vintage VCA</b>","레이시오와 어택, 릴리스를 계열별 값으로 설정","<b>Threshold</b>를 내려 목표 게인 리덕션 확보"]},{"n":"음량 맞춰 비교","s":["컴프를 켠 상태에서 <b>Make Up</b>을 조정해 켜기 전과 음량을 같게 맞춤","플러그인 좌상단 전원 버튼으로 껐다 켜며 비교","커진 것이 아니라 묶인 것이 느껴지는지 판단"]},{"n":"누적 확인","s":["같은 소리에 걸린 컴프를 트랙, 버스, 마스터 순으로 모두 확인","각 단계의 게인 리덕션 값을 더한다","합이 <v>8</v>dB를 넘으면 아래 단계부터 줄인다"]}],"drill":["드럼 트랙 전체를 서밍 스택으로 묶고 4:1, 어택 25ms, GR 4dB로 걸어 본다. 메이크업으로 음량을 맞춘 뒤 껐다 켜며 차이를 듣는다.","드럼 버스 어택을 1ms와 25ms로 바꿔 펀치가 어떻게 달라지는지 비교한다.","한 트랙에 걸린 컴프 세 단계(트랙·버스·마스터)의 게인 리덕션을 각각 적고 합을 계산한다."],"keys":[["⌘⇧D","트랙 스택 만들기"],["X","믹서"],["S","솔로"],["⌥클릭","값 초기화"]],"chk":["역할 기준으로 트랙을 묶는다","계열별 시작값을 안다","세 단계 누적 게인 리덕션을 관리한다"],"quiz":[{"q":"버스 컴프의 게인 리덕션이 개별 트랙보다 작아야 하는 이유는?","a":["CPU를 아끼려고","컴프가 겹쳐 걸려 누적되기 때문","버스는 소리가 작아서","리버브가 걸려 있어서"],"c":1,"e":"트랙·버스·마스터에서 각각 누른 양이 더해진다. 단계마다 적당해 보여도 합치면 납작해진다."},{"q":"드럼 버스에서 어택을 20~30ms로 두는 이유는?","a":["CPU 부담을 줄이려고","첫 타격을 통과시켜 펀치를 남기려고","릴리스를 길게 하려고","저역을 깎으려고"],"c":1,"e":"어택이 짧으면 타격의 앞부분까지 눌려 힘이 빠진다."},{"q":"버스 컴프 효과를 판단할 때 반드시 해야 하는 것은?","a":["솔로로 듣기","메이크업으로 음량을 맞추고 비교","리버브 끄기","템포 낮추기"],"c":1,"e":"켜면 소리가 커지므로 음량을 맞추지 않으면 큰 쪽이 무조건 좋게 들린다."}],"d":58,"s":9},{"d":59,"s":9,"t":"리버브와 딜레이: 센드 버스","goal":"센드 버스로 리버브와 딜레이를 구성한다.","con":["리버브를 트랙마다 개별로 거는 것은 비효율적이고 소리도 흩어진다. 센드 버스를 만들어 여러 트랙이 같은 공간을 공유하게 하는 것이 표준이다. 같은 방에 있는 것처럼 들린다.","그 전에 종류를 안다. 리버브는 어떤 공간을 흉내 내느냐로 나뉘고, 로직에서는 ChromaVerb와 Space Designer의 프리셋 이름에 이 말들이 그대로 붙어 있다.","실제 공간을 본뜬 것이 셋이다. 룸(Room)은 작은 방이라 잔향이 짧고 어둡다. 소리를 뒤로 밀지 않고 마르지 않게만 해주므로 드럼과 기타에 쓴다. 홀(Hall)은 콘서트홀이라 잔향이 길고 넓게 퍼진다. 발라드 코러스와 오케스트라의 공간이다. 챔버(Chamber)는 옛 스튜디오가 스피커와 마이크를 놓아두고 쓰던 울림방으로, 룸보다 길고 홀보다 짧아 보컬에 자주 쓰인다.","기계에서 나온 것이 둘이다. 플레이트(Plate)는 금속판을 떨게 해 만든 소리라 자연에 없는 매끈함과 밝은 잔향이 특징이다. 보컬과 스네어에 오래 쓰여 왔다. 스프링(Spring)은 용수철을 쓴 방식으로 통통 튀는 특유의 색이 있고, 기타 앰프에 들어 있는 것이 이것이다.","효과로 쓰는 것이 둘이다. 게이트 리버브(Gated)는 잔향이 자연스럽게 사라지지 않고 도중에 뚝 끊긴다. 1980년대 스네어 소리가 여기서 나왔다. 시머(Shimmer)는 잔향에 옥타브 위 음을 섞어 계속 위로 번지게 만든 것으로, 앰비언트와 영화 음악에서 배경을 채울 때 쓴다.","고르는 순서는 단순하다. 곡의 공간이 실내인지 큰 홀인지 정하고, 자연스러움이 필요하면 룸이나 홀, 매끈함이 필요하면 플레이트, 색을 넣고 싶으면 스프링이나 시머로 간다.","버스는 최소 두 개를 만든다. 짧은 공간용과 긴 공간용이다. 짧은 것은 룸이나 플레이트 <v>0.8~1.5</v>초, 긴 것은 홀 <v>2.5~4</v>초.","프리 딜레이도 함께 본다. <v>20~40</v>ms를 주면 원음이 먼저 들리고 잔향이 따라와서 명료도가 유지된다. 이 범위인 이유는 선행음 효과다. 귀는 약 30ms 안에 도착하는 반사음을 원음과 한 덩어리로 듣되 먼저 온 쪽으로 위치와 또렷함을 판단하므로, 그 경계 안의 틈은 공간감을 남기고 명료도만 올린다.","리버브에 하이패스와 로우패스를 건다. 리버브 입력에 <v>200</v>Hz 하이패스, <v>8</v>kHz 로우패스를 걸면 저역이 뭉치지 않고 치찰음이 번지지 않는다.","딜레이와 에코는 다른 장치가 아니다. 에코는 반복이 또렷하게 떨어져 들리는 딜레이를 부르는 말이다. 갈리는 것은 반복 간격 하나다. <v>30</v>ms 아래는 원음과 한 덩어리로 들려 소리가 두꺼워지고, <v>30~100</v>ms는 두께와 넓이가 되고, <v>100</v>ms를 넘어서면 별개의 반복으로 들리기 시작해 에코가 된다. 이 경계는 선행음 효과에서 배운 값과 같다. 딜레이는 곡의 템포에 맞춘다. 점8분음표 딜레이가 넓은 느낌을 만들고, 4분음표 딜레이는 리듬을 강조한다. 피드백은 <v>15~30</v>퍼센트가 무난하다.","실전 시작값. 두께와 그루브용 짧은 딜레이는 시간 <v>80~140</v>ms, 피드백 <v>25~35</v>퍼센트, 믹스 <v>20~30</v>퍼센트. 또렷한 반복으로 공간을 만드는 에코는 시간 <v>250</v>ms 이상, 피드백 <v>40~50</v>퍼센트, 믹스 <v>15~25</v>퍼센트. 피드백은 반복이 몇 번 이어지는지를 정하는 값이라 높을수록 꼬리가 길어지고, 70퍼센트를 넘기면 소리가 스스로 쌓여 무한히 늘어난다.","저역 악기에는 리버브를 거의 걸지 않는다. 킥과 베이스는 마른 채로 두는 것이 기본이다. 완성한 리버브 Aux는 채널 스트립 설정으로 저장해 둔다. Aux 채널 스트립 맨 위의 <b>설정</b> 버튼 → <b>채널 스트립 설정을 별도 저장</b>. EQ와 리버브가 포함된 공간 하나가 통째로 저장되어 다음 곡에서 한 번에 불러온다."],"path":[{"n":"센드 버스 만들기","s":["<k>X</k> 믹서 → 트랙 채널 스트립의 <b>Sends</b> 슬롯 클릭","<b>Bus → Bus 1</b> 선택 → 오른쪽에 Aux 채널 자동 생성","Aux 채널 이펙트 슬롯 → <b>Reverb → ChromaVerb</b> 또는 <b>Space Designer</b>","Aux의 <b>Mix</b>를 <v>100</v>퍼센트로 설정","각 트랙의 센드 노브로 보내는 양 조절"]},{"n":"리버브 다듬기","s":["Aux 채널 이펙트 첫 슬롯에 <b>Channel EQ</b>","하이패스 <v>200</v>Hz, 로우패스 <v>8</v>kHz","리버브 <b>프리 딜레이</b> <v>25</v>ms","<b>디케이</b> 시간 설정"]},{"n":"리버브 종류 골라 듣기","s":["리버브 Aux의 <b>ChromaVerb</b> 열기","프리셋 분류에서 <b>Room</b>, <b>Hall</b>, <b>Plate</b>, <b>Chamber</b>를 차례로 재생","같은 보컬 구간으로 네 가지를 비교하고 하나를 고름","디케이와 프리 딜레이를 곡에 맞게 다시 조정"]}],"drill":["짧은 버스와 긴 버스 두 개를 만들고 악기별로 보내는 양을 다르게 준다.","리버브에 EQ를 걸기 전과 후를 비교한다.","템포에 맞춘 점8분음표 딜레이를 리드에 걸어본다."],"keys":[["X","믹서"],["⌥클릭","초기화"]],"chk":["센드 버스를 만들 수 있다","리버브에 EQ를 건다","저역 악기는 마르게 둔다","딜레이와 에코의 경계 수치를 안다","리버브 종류를 구분하고 용도에 맞게 고른다"],"quiz":[{"q":"원음의 명료도를 지키면서 잔향을 주는 설정은?","a":["프리 딜레이 0ms","프리 딜레이 20~40ms","디케이 10초","믹스 100퍼센트"],"c":1,"e":"프리 딜레이가 있으면 원음이 먼저 도달해 또렷하게 들린다."},{"q":"딜레이가 에코로 들리기 시작하는 대략적인 경계는?","a":["10ms","30ms","100ms","1초"],"c":2,"e":"100ms를 넘어서면 반복이 원음과 분리되어 별개의 소리로 들린다. 그 아래는 두께와 넓이가 된다."},{"q":"금속판의 떨림으로 만든, 보컬과 스네어에 오래 쓰여 온 리버브는?","a":["룸","홀","플레이트","스프링"],"c":2,"e":"플레이트는 자연에 없는 매끈하고 밝은 잔향이라 보컬에 잘 붙는다."},{"q":"잔향이 도중에 뚝 끊기는 리버브는?","a":["챔버","게이트","시머","홀"],"c":1,"e":"게이트 리버브다. 1980년대 스네어 소리가 여기서 나왔다."}]},{"d":60,"s":9,"t":"팬, 깊이, 오토메이션","goal":"팬 배치, 깊이 조절, 오토메이션을 한다.","con":["입체감은 세 축으로 만든다. 좌우는 팬, 앞뒤는 음량과 리버브 양, 위아래는 주파수다.","팬 배치의 기본. 킥, 베이스, 스네어, 리드 보컬은 가운데. 가운데인 이유는 배분이다. 에너지가 큰 요소를 가운데 두면 좌우 스피커가 일을 반씩 나눠 맡고, 저역은 어차피 방향이 지각되지 않으며, 모노로 합쳐도 균형이 유지된다. 나머지는 좌우로 벌린다. 같은 역할의 악기 두 개가 있으면 좌우 대칭으로 둔다. 기타 두 대를 <v>L60</v>과 <v>R60</v>에 두는 식이다. 폭은 네 구간으로 나눠 생각하면 결정이 빨라진다. 가운데 <v>0</v>도는 킥, 스네어, 베이스, 리드 보컬. 좁게 <v>±10~30</v>도는 백보컬, 톰, 오버헤드처럼 중심을 도우면서 폭을 조금 넓히는 것들. 넓게 <v>±30~70</v>도는 기타, 건반, 패드처럼 배경을 채우는 층. 극단 <v>±70~100</v>도는 효과음과 라이저처럼 사라져도 곡이 유지되는 것들이다. 중요한 것일수록 가운데에 두고, 없어도 되는 것일수록 바깥에 둔다.","뒤로 보내려면 음량을 줄이고 리버브를 늘리고 고역을 약간 깎는다. 세 가지를 함께 해야 실제로 뒤에 있는 것처럼 들린다.","오토메이션은 시간에 따라 값이 변하게 하는 기능이다. 벌스보다 코러스에서 기타를 <v>1.5</v>dB 올리는 정도의 미세한 조정이 곡을 살아 있게 만든다.","쓰는 방식은 두 가지다. 선을 직접 그리거나, 재생하면서 페이더를 움직여 기록하는 것이다. 기록 모드는 Touch, Latch, Write가 있고 보통 Touch를 쓴다.","오토메이션 우선 대상은 음량, 팬, 센드 양, 필터 컷오프다."],"path":[{"n":"오토메이션 그리기","s":["<k>A</k> → 트랙에 오토메이션 표시","트랙 헤더의 파라미터 메뉴에서 <b>Volume</b> 선택","선 위를 클릭 → 포인트 생성","포인트를 드래그해 값 조절"]},{"n":"기록하기","s":["트랙 헤더 오토메이션 모드를 <b>Touch</b>로","재생하며 페이더 조작 → 움직인 동안만 기록","모드를 <b>Read</b>로 되돌리기"]}],"drill":["기타 두 대를 L60, R60에 두고 가운데 악기와의 관계를 확인한다.","패드를 뒤로 보내기 위해 음량, 리버브, 고역 세 가지를 함께 조정한다.","코러스 구간에서 특정 트랙을 1.5dB 올리는 오토메이션을 그린다."],"keys":[["A","오토메이션 표시"],["X","믹서"],["⌃⌘A","오토메이션 켜기와 끄기"]],"chk":["팬 배치 원칙을 안다","깊이를 세 가지로 만든다","오토메이션을 그리고 기록할 수 있다","네 개 패닝 구간을 안다"],"quiz":[{"q":"악기를 뒤로 보내기 위해 함께 해야 하는 것은?","a":["음량만 줄이기","리버브만 늘리기","음량 줄이고 리버브 늘리고 고역 깎기","팬을 끝으로"],"c":2,"e":"거리감은 세 가지가 함께 작동할 때 만들어진다."},{"q":"효과음과 라이저를 극단까지 벌려도 되는 이유는?","a":["소리가 작아서","사라져도 곡이 유지되기 때문","저역이 없어서","리버브가 걸려서"],"c":1,"e":"모노에서 상쇄되거나 한쪽에서만 들려도 곡의 뼈대가 무너지지 않는 요소들이다."}]},{"d":61,"s":10,"t":"사이드체인 덕킹","goal":"사이드체인 컴프레션을 설정한다.","con":["사이드체인은 컴프레서에게 다른 트랙의 소리를 듣고 반응하라고 시키는 것이다. 킥 소리를 듣고 베이스를 누르게 하면, 킥이 칠 때마다 베이스가 잠깐 물러난다. 저역에서 둘이 싸우지 않게 된다.","두 가지 목적이 있다. 하나는 자리 만들기다. 이때는 효과가 들리지 않을 정도로 약하게 건다. 킥이 뚫고 나오는데 무엇이 달라졌는지는 모르겠는 상태가 이상적이다.","다른 하나는 효과다. 하우스와 일렉트로닉에서 패드 전체가 킥에 맞춰 크게 숨쉬는 소리가 여기서 나온다. 이때는 일부러 크게 건다.","설정값의 감각. 어택은 <v>0.1~5</v>ms로 아주 짧게 둔다. 킥이 시작하는 순간 바로 눌러야 하기 때문이다. 릴리스가 곡의 인상을 정한다. <v>50~100</v>ms면 짧게 툭 비켰다 돌아오고, <v>150~300</v>ms면 길게 숨쉰다. 템포에 맞춰 다음 킥 직전에 회복되는 값을 찾는다.","덕킹을 크게 걸수록 킥은 뚫고 나오지만 곡 전체 음량이 출렁인다. 게인 리덕션 <v>2~4</v>dB면 자리 만들기, <v>6</v>dB 이상이면 효과다.","저역 정리를 사이드체인으로만 해결하려 들면 안 된다. 편곡과 EQ로 먼저 나누고 마지막 손질로 쓴다."],"path":[{"n":"사이드체인 걸기","s":["눌릴 트랙(베이스)에 <b>Compressor</b> 추가","플러그인 창 오른쪽 위 <b>Side Chain</b> 메뉴 클릭","소스로 킥 트랙 선택","<b>Attack</b> <v>1</v>ms, <b>Release</b> <v>80</v>ms, <b>Ratio</b> <v>4:1</v>로 시작","<b>Threshold</b>를 내려 리덕션 <v>3</v>dB 확보"]},{"n":"킥이 안 잡힐 때","s":["킥 트랙 출력이 사이드체인 목록에 없으면 킥에 <b>Bus</b> 센드를 하나 추가","센드를 <b>프리 페이더</b>로 두면 킥 음량과 무관하게 신호 전달"]}],"drill":["킥과 베이스만 놓고 사이드체인 없이, 3dB 리덕션, 8dB 리덕션 세 가지를 비교한다.","릴리스를 40, 100, 250ms로 바꿔가며 곡이 숨쉬는 속도가 어떻게 달라지는지 듣는다.","패드에 사이드체인을 걸어 하우스 느낌을 만들어 본다."],"keys":[["X","믹서"],["S","솔로"]],"chk":["자리 만들기와 효과를 구분해 쓴다","릴리스로 숨쉬는 속도를 조절한다","리덕션 양으로 강도를 판단한다"],"quiz":[{"q":"사이드체인 덕킹에서 어택을 아주 짧게 두는 이유는?","a":["소리를 부드럽게 하려고","킥이 시작하는 순간 바로 비켜야 해서","CPU를 아끼려고","릴리스를 길게 하려고"],"c":1,"e":"어택이 길면 킥의 앞부분이 이미 부딪친 뒤에 눌리기 때문에 효과가 없다."},{"q":"자리 만들기 목적일 때 적절한 게인 리덕션은?","a":["2~4dB","8~12dB","15dB 이상","0dB"],"c":0,"e":"들리지 않을 정도로 약하게 거는 것이 자리 만들기다."}]},{"d":62,"s":10,"t":"디에서, 게이트, 멀티밴드","goal":"디에서, 게이트, 멀티밴드 컴프레서를 사용한다.","con":["컴프레서는 크기 전체에 반응한다. 그런데 문제가 특정 주파수나 특정 구간에만 있을 때가 있다. 그때 쓰는 도구가 따로 있다.","디에서는 치찰음을 잡는다. 시옷과 치읓 발음에서 <v>5~9</v>kHz가 튀어 귀를 찌를 때 그 대역만 순간적으로 누른다. 여성 보컬은 <v>6~8</v>kHz, 남성 보컬은 <v>5~7</v>kHz 부근인 경우가 많다. 너무 강하게 걸면 발음이 뭉개져 웅얼거리게 되므로, 튀는 순간에만 <v>3~6</v>dB 눌리는 정도가 적당하다.","게이트는 설정한 레벨보다 작은 소리를 아예 막는다. 드럼 마이크에 새어 들어온 다른 악기 소리를 걷어내거나, 기타 앰프의 잡음을 없앨 때 쓴다. 릴리스가 짧으면 소리 꼬리가 잘려 부자연스럽고, 길면 잡음이 남는다. 홀드 값을 <v>10~50</v>ms 정도 주면 문이 덜 떨린다.","멀티밴드 컴프레서는 주파수를 여러 구간으로 나눠 각각 따로 누른다. 저역만 출렁일 때 저역 구간만 잡을 수 있다. 강력하지만 과하게 쓰면 소리가 납작해진다. 문제가 명확할 때만 쓴다.","순서가 있다. 먼저 편곡으로, 다음 EQ로, 그다음 이런 도구로 간다. 도구부터 꺼내면 원인을 못 찾는다."],"path":[{"n":"디에서","s":["보컬 채널 → <b>Dynamics → DeEsser 2</b>","<b>Detection</b> 주파수를 <v>7000</v>Hz 부근으로","<b>Monitor</b>를 켜서 치찰음만 들리는 지점 찾기","<b>Threshold</b>를 내려 리덕션 <v>3~6</v>dB","Monitor 끄고 확인"]},{"n":"게이트","s":["채널 → <b>Dynamics → Noise Gate</b>","<b>Threshold</b>를 올려 원하는 소리만 통과","<b>Hold</b> <v>20</v>ms, <b>Release</b> <v>100</v>ms","<b>Hysteresis</b>로 문 떨림 방지"]}],"drill":["보컬에 디에서를 걸고 Monitor로 치찰음만 들어 정확한 주파수를 찾는다.","일부러 강하게 걸어 발음이 뭉개지는 지점을 확인하고 되돌린다.","드럼 톰 트랙에 게이트를 걸어 다른 소리가 새어 들어오는 것을 막아본다."],"keys":[["X","믹서"],["S","솔로"]],"chk":["디에서 주파수를 귀로 찾을 수 있다","게이트의 홀드 역할을 안다","도구를 꺼내기 전에 원인을 먼저 본다"],"quiz":[{"q":"디에서가 다루는 대역은?","a":["60~120Hz","200~400Hz","5~9kHz","15kHz 이상"],"c":2,"e":"치찰음은 대체로 5~9kHz에 몰려 있다."}]},{"d":63,"s":10,"t":"위상과 스테레오 이미지","goal":"위상을 점검하고 모노 호환성을 확보한다.","con":["두 신호가 합쳐질 때 파형이 서로 반대면 상쇄된다. 이것이 위상 문제다. 스테레오로 들을 때는 넓고 좋았는데 모노로 합치면 소리가 사라지는 일이 여기서 생긴다.","모노는 여전히 쓰인다. 휴대폰 스피커, 카페 천장 스피커, 클럽 시스템이 모노에 가깝게 재생한다. 스테레오에서만 좋은 믹스는 절반의 상황에서 무너진다.","코렐레이션 미터로 확인한다. <v>+1</v>이면 좌우가 같아 완전한 모노, <v>0</v>이면 넓게 퍼진 상태, <v>-1</v>이면 완전히 반대라 모노에서 사라진다. 대부분의 시간을 <v>0</v>에서 <v>+1</v> 사이에 두고, 순간적으로 <v>0</v> 아래로 내려가는 정도는 괜찮다.","저역은 가운데 두는 것이 원칙이다. 이유는 두 가지다. 저역은 파장이 수 미터로 길어 좌우가 조금만 어긋나도 상쇄의 골이 깊고, 귀는 대략 100Hz 아래의 방향을 구분하지 못해 넓혀도 얻는 것이 없다. 킥과 베이스를 넓히면 재생 환경마다 다르게 들리고 마스터링에서 문제가 된다. <v>120</v>Hz 아래를 모노로 만드는 처리를 흔히 쓴다.","넓히는 방법 중 안전한 것은 실제로 두 번 연주해 좌우에 두는 더블링이다. 위상 문제가 생기지 않는다. 반대로 한쪽을 몇 ms 늦추는 방식은 넓어 보이지만 모노에서 빗질하듯 대역이 깎인다.","마이크를 여러 개 세워 녹음했다면 위상 정렬이 먼저다. 파형을 확대해 첫 타격 지점을 맞추거나 한쪽 극성을 뒤집어 저역이 가장 두꺼워지는 쪽을 고른다.","믹싱 심화가 여기서 끝난다. 마스터링으로 넘기기 전에 흩어져 있던 것들을 한 번에 훑는다. 아래 열두 가지는 지금까지 배운 것을 순서대로 다시 세운 것이고, 막히는 항목이 있으면 괄호 안의 일차로 돌아간다.","먼저 레벨이다. 개별 트랙 피크가 <v>-18</v>에서 <v>-10</v>dBFS 사이에 있는가(55일차). 어느 트랙에서도 미터가 빨갛게 되지 않는가(46일차). 마스터 출력에 <v>-6</v>dBFS 여유가 남아 있는가(55일차). 이 셋이 안 되면 아래를 볼 필요가 없다.","다음은 저역이다. 킥과 베이스가 서로 다른 자리에 있는가(41일차). 사이드체인을 걸었다면 킥이 칠 때 실제로 비켜서는가(61일차). 저역이 가운데 모여 있는가(63일차).","그다음 처리다. EQ에서 남긴 것이 부스트보다 컷 위주인가(56일차). 찾을 때는 크게 올려도 되지만 최종적으로 남기는 값은 <v>±2~3</v>dB 안이다. 리버브가 곡을 흐리지 않는가. 리버브 버스에 하이패스와 로우패스를 걸었는지 확인한다(59일차).","마지막은 확인이다. 모노로 합쳐 사라지는 소리가 없는가(63일차). 레퍼런스와 음량을 맞춰 비교했는가(54일차). 스피커, 이어폰, 휴대폰 세 곳에서 들었는가(54일차). 여기까지 통과하면 마스터링으로 넘긴다. 넘길 파일은 <v>24</v>비트 WAV다(67일차).","한 가지만 덧붙인다. 이 목록은 통과 여부를 세는 것이지 점수를 매기는 것이 아니다. 하나라도 걸리면 마스터링에서 고치려 들지 말고 믹스로 돌아간다."],"path":[{"n":"모노 점검","s":["<b>Stereo Out</b> 이펙트 슬롯 → <b>Metering → Correlation Meter</b>","다른 슬롯에 <b>Gain</b> 추가 → <b>Mono</b> 버튼으로 합쳐 듣기","사라지는 악기가 있는지 확인"]},{"n":"폭 조절","s":["채널 → <b>Imaging → Direction Mixer</b>","<b>Spread</b> 값으로 폭 조절","저역 모노: <b>Imaging → Stereo Spread</b> 또는 EQ로 저역 분리 후 처리"]},{"n":"극성 뒤집기","s":["채널 → <b>Gain</b> 플러그인","<b>Phase Invert</b> 버튼(∅) 클릭","저역이 두꺼워지는 쪽으로 선택"]},{"n":"마무리 점검 순서","s":["레벨: 개별 트랙 피크, 클리핑, 마스터 여유","저역: 킥과 베이스 분리, 사이드체인 동작, 저역 가운데","처리: EQ 컷 위주, 리버브 통제","확인: 모노, 레퍼런스 비교, 세 환경 청취","통과하면 <v>24</v>비트 WAV로 넘김"]}],"drill":["완성 믹스를 모노로 합쳐 듣고 사라지거나 약해지는 악기를 찾는다.","코렐레이션 미터를 보며 곡 전체에서 -1에 가까워지는 구간이 있는지 확인한다.","드럼 오버헤드와 스네어 마이크의 극성을 뒤집어 보고 저역 차이를 듣는다."],"keys":[["X","믹서"],["S","솔로"]],"chk":["코렐레이션 값을 읽을 수 있다","저역을 가운데 둔다","모노 점검을 습관화했다","믹스 마무리 열두 항목을 훑을 수 있다"],"quiz":[{"q":"코렐레이션 미터가 -1을 가리키면?","a":["완전한 모노","적당히 넓음","모노에서 상쇄됨","음량이 최대"],"c":2,"e":"좌우가 완전히 반대 위상이라 합치면 사라진다."},{"q":"마무리 점검에서 레벨 세 가지를 가장 먼저 보는 이유는?","a":["가장 쉬워서","여기가 안 되면 아래 항목의 판단이 성립하지 않아서","순서는 상관없어서","미터가 잘 보여서"],"c":1,"e":"클리핑이 있거나 여유가 없으면 EQ와 공간계를 아무리 다듬어도 결과가 달라지지 않는다."},{"q":"점검에서 걸린 항목이 있으면?","a":["마스터링에서 보정한다","믹스로 돌아간다","그대로 넘긴다","리미터를 세게 건다"],"c":1,"e":"믹스의 문제는 마스터링으로 해결되지 않는다."}]},{"d":64,"s":11,"t":"마스터 버스 체인","goal":"마스터 버스 체인을 순서대로 구성한다.","con":["마스터링은 믹스가 끝난 곡 전체에 마지막 손질을 하는 단계다. 믹스가 좋지 않으면 마스터링으로 해결되지 않는다. 순서를 지킨다.","기본 체인 순서. EQ → 컴프레서(글루) → 새추레이션 → 리미터. 이 순서를 크게 벗어나지 않는다.","마스터 EQ는 아주 작게 쓴다. <v>1~2</v>dB 안에서. 전체가 어둡다면 <v>10</v>kHz를 넓게 <v>1.5</v>dB, 저역이 과하면 <v>200</v>Hz 부근을 <v>1</v>dB 정도 깎는다.","글루 컴프레서는 레이시오 <v>2:1</v>, 어택 <v>30</v>ms, 릴리스 <v>auto</v> 또는 <v>300</v>ms, 게인 리덕션 <v>1~2</v>dB로 아주 살짝만 건다. 살짝만인 이유는 이 단계에 오면 트랙 사이 균형이 이미 완성되어 있기 때문이다. 마스터에서 세게 누르면 큰 소리와 작은 소리의 관계가 바뀌어 애써 잡은 믹스 밸런스를 되돌리는 셈이 된다. 곡이 하나로 묶인 느낌을 만드는 것이 목적이지 음량을 키우는 것이 아니다.","새추레이션은 배음을 더해 따뜻하게 만든다. 로직 11의 ChromaGlow가 이 역할을 한다. 아주 조금만 쓴다.","믹스를 마스터링할 때는 마스터 채널의 여유가 <v>-6</v>dBFS 정도 있어야 한다. 없다면 믹스로 돌아간다. 완성된 마스터 체인은 채널 스트립 설정으로 저장한다. Stereo Out의 <b>설정</b> 버튼 → <b>채널 스트립 설정을 별도 저장</b>. 다음 곡에서 같은 체인을 불러와 값만 곡에 맞게 다시 잡으면 된다.","마무리 전 점검 목록. 체인의 각 단계마다 클리핑이 없는지 확인했는가. 플러그인을 켜고 껐을 때 실제로 나아지는가. 레퍼런스와 음량을 맞춰 비교했는가. 큰 음량과 작은 음량 양쪽에서 들었는가. 모노로 합쳐 확인했는가. 미터의 피크와 라우드니스와 다이내믹을 모두 봤는가.","가장 흔한 실수 세 가지는 따로 기억해둔다. 첫째, 믹스의 문제를 마스터링으로 고치려는 것이다. 보컬이 묻히거나 저역이 뭉쳤다면 믹스로 돌아간다. 둘째, 헤드폰에서 좋다고 저역과 고역을 크게 올리는 것이다. 다른 스피커에서 무너진다. 셋째, 개선이 들리지 않는데도 플러그인을 남겨두는 것이다. 확신이 없으면 빼는 쪽이 낫다.","마스터링의 목적은 곡을 크게 만드는 것이 아니라 어느 재생 환경에서도 무너지지 않게 만드는 것이다."],"path":[{"n":"마스터 체인 구성","s":["<k>X</k> 믹서 → 맨 오른쪽 <b>Stereo Out</b> 채널","이펙트 슬롯 1: <b>EQ → Linear Phase EQ</b>","슬롯 2: <b>Dynamics → Compressor</b> (Ratio <v>2:1</v>, GR <v>1~2</v>dB)","슬롯 3: <b>Distortion → ChromaGlow</b> 약하게","슬롯 4: <b>Dynamics → Limiter</b>"]}],"drill":["완성된 믹스에 마스터 체인 네 개를 순서대로 걸고 각 단계마다 켜고 끄며 차이를 확인한다.","글루 컴프의 게인 리덕션을 1dB와 6dB로 비교해 어느 쪽이 자연스러운지 판단한다."],"keys":[["X","믹서"],["⌘S","저장"]],"chk":["체인 순서를 안다","각 단계를 작게 쓴다","믹스 여유를 확보하고 시작한다","마무리 점검 목록을 실행한다"],"quiz":[{"q":"마스터 글루 컴프레서의 적절한 게인 리덕션은?","a":["1~2dB","5~8dB","10dB 이상","리덕션 없음"],"c":0,"e":"묶는 것이 목적이므로 아주 살짝만 건다."},{"q":"마스터링 단계에서 플러그인의 개선이 들리지 않으면?","a":["값을 더 크게 준다","빼는 쪽이 낫다","하나 더 추가한다","그대로 둔다"],"c":1,"e":"들리지 않는 처리는 헤드룸과 다이내믹만 소모한다."}]},{"t":"마스터링 어시스턴트와 자동 도구","goal":"마스터링 어시스턴트와 스템 스플리터를 사용한다.","con":["로직 11에는 곡을 분석해서 알아서 처리해 주는 도구가 몇 개 들어 있다. 쓸 줄 알면 좋은 출발점이 되고, 원리를 모르고 쓰면 판단력이 늘지 않는다. 앞에서 수동 체인을 먼저 배운 이유가 그것이다.","마스터링 어시스턴트는 곡 전체를 듣고 EQ, 다이내믹, 라우드니스를 자동으로 맞춰 준다. 스테레오 아웃에 얹으면 재생하면서 분석하고, 끝나면 결과를 적용한다. 목표 라우드니스도 스트리밍 기준으로 맞춰 준다.","캐릭터를 고를 수 있다. 깨끗한 쪽과 색이 붙는 쪽이 있고, 일부 캐릭터는 애플 실리콘 맥에서만 열린다. 자동 결과가 마음에 안 들면 EQ 커브와 세기를 직접 손볼 수 있다.","가장 좋은 사용법은 비교다. 내가 만든 수동 체인과 어시스턴트 결과를 번갈아 들으며 무엇이 다른지 찾는 것이다. 어시스턴트가 저역을 깎았다면 내 믹스의 저역이 과했다는 뜻이다. 자동 도구를 채점자로 쓰는 셈이다. 비교가 끝나면 반드시 한쪽만 남긴다. 어시스턴트와 수동 체인을 둘 다 켜 두면 EQ와 리미팅이 이중으로 걸린다.","스템 스플리터는 반대 방향의 도구다. 이미 섞여 있는 오디오 하나를 보컬, 드럼, 베이스, 나머지 네 갈래로 분리한다. 옛날 데모나 연습 녹음에서 보컬만 꺼내 새 반주를 붙이는 일이 가능해진다. 이것도 애플 실리콘이 필요하다.","분리 품질에는 한계가 있다. 소리가 겹친 부분에서는 뭉개짐이 남는다. 공부와 스케치, 리믹스 연습에는 충분하지만 남의 음원을 분리해 쓰는 것은 저작권 문제가 된다. 자기 소재에 쓴다.","자동 도구의 자리를 정리하면 이렇다. 시작을 빠르게 해주고 내 판단을 채점해 준다. 마지막 결정은 항상 귀가 한다."],"path":[{"n":"마스터링 어시스턴트","s":["<k>X</k> 믹서 → <b>Stereo Out</b> 채널","이펙트 슬롯에서 <b>Mastering Assistant</b>를 추가한다","곡을 처음부터 재생하면 분석이 진행된다","분석이 끝나면 <b>캐릭터</b>를 골라 비교한다","<b>Custom EQ</b>와 세기 조절로 결과를 다듬는다"]},{"n":"수동 체인과 비교","s":["앞에서 만든 수동 마스터 체인을 함께 걸어 둔다","한쪽씩 켜고 끄며 번갈아 듣는다","라우드니스 미터로 두 결과의 통합 수치를 비교한다"]},{"n":"스템 스플리터","s":["분리할 오디오 리전을 선택한다","리전을 <b>우클릭 → 스템 분리</b>","보컬, 드럼, 베이스, 그 외 네 트랙이 새로 생긴다","필요 없는 갈래는 지우고 쓸 것만 남긴다"]}],"drill":["완성 곡에 마스터링 어시스턴트를 걸어 분석 결과를 보고, 어시스턴트가 올리거나 깎은 대역이 내 믹스의 어떤 문제를 가리키는지 적는다.","수동 체인 결과와 어시스턴트 결과의 통합 라우드니스를 각각 재서 비교한다.","직접 만든 옛 데모 하나를 스템으로 분리해 보컬만 남기고 새 반주를 깔아 본다."],"keys":[["X","믹서"],["스페이스","재생과 정지"]],"chk":["어시스턴트를 채점자로 쓰는 법을 안다","수동 체인과 비교해 봤다","스템 분리의 한계와 용도를 안다"],"quiz":[{"q":"마스터링 어시스턴트의 가장 좋은 사용법은?","a":["결과를 그대로 발매","수동 체인과 비교하며 내 믹스의 문제를 찾는 채점자로","믹싱 전에 먼저 걸기","모든 트랙에 하나씩 걸기"],"c":1,"e":"자동 결과가 손댄 부분이 곧 내 믹스의 약점을 가리킨다."},{"q":"스템 스플리터가 오디오를 나누는 네 갈래는?","a":["좌·우·중앙·잔향","보컬·드럼·베이스·그 외","고역·중역·저역·초저역","마디별 네 구간"],"c":1,"e":"섞인 오디오를 보컬, 드럼, 베이스, 나머지로 분리한다."}],"d":65,"s":11},{"d":66,"s":11,"t":"라우드니스와 리미터","goal":"라우드니스를 측정하고 리미터를 설정한다.","con":["음량의 기준은 피크가 아니라 라우드니스다. 사람이 느끼는 크기를 측정한 값이고 단위는 LUFS다. 스트리밍 서비스는 이 값을 기준으로 자동 음량 조절을 한다.","목표값. 스트리밍 일반은 통합 라우드니스 <v>-14</v>LUFS 부근, 트루 피크 <v>-1</v>dBTP다. 애플 뮤직 계열은 <v>-16</v>LUFS를 기준으로 삼는다. 지나치게 크게 만들면 서비스에서 깎여서 다이내믹만 잃는다. 다만 -14가 모든 음악의 정답은 아니다. 장르마다 관행이 다르다. 클럽과 EDM은 <v>-9</v>에서 <v>-6</v>LUFS로 크게 만들고, 현대 팝은 <v>-11</v>에서 <v>-9</v>LUFS, 스트리밍 기준을 그대로 따르는 곡은 <v>-14</v>에서 <v>-11</v>LUFS, 어쿠스틱과 재즈는 <v>-18</v>에서 <v>-16</v>LUFS, 클래식과 오케스트라는 <v>-23</v>에서 <v>-18</v>LUFS다. 아래로 갈수록 다이내믹이 넓다.","장르 관행과 스트리밍 기준이 어긋날 때 어느 쪽을 따를지가 문제가 된다. 서비스는 기준보다 큰 곡을 재생 시점에 깎아 내리므로, -8로 만들어 올려도 듣는 사람에게는 -14로 들린다. 남는 것은 눌려서 사라진 다이내믹뿐이다. 그래서 스트리밍이 주 무대라면 기준에 맞추는 쪽이 유리하다. 반대로 클럽 재생이나 물리 매체처럼 자동 조절이 없는 곳이 목적지라면 장르 관행을 따른다. 어느 쪽이든 트루 피크 <v>-1</v>dBTP는 공통이다.","세 가지 측정값을 본다. 통합은 곡 전체 평균, 순간은 지금 값, 레인지는 다이내믹 폭이다. 레인지가 <v>4</v>LU 아래로 내려가면 답답하게 들린다. 대중음악에서 <v>5~9</v>LU가 무난하다.","트루 피크는 디지털 신호를 아날로그로 바꿀 때 생기는 실제 최대값이다. 0dBFS를 넘지 않아도 트루 피크는 넘을 수 있다. 그래서 <v>-1</v>dBTP로 여유를 둔다.","리미터는 마지막에 하나만 건다. 라우드니스 미터는 그 리미터보다도 뒤, 체인의 맨 끝에 둔다. 미터는 소리를 읽기만 하고 바꾸지 않으므로 어디에 두어도 소리는 같지만, 최종 결과를 읽으려면 리미터를 지난 자리여야 한다. 실링을 <v>-1.0</v>dB로, 게인을 서서히 올려 목표 라우드니스에 닿게 한다. 리덕션이 계속 <v>3</v>dB 이상 걸리면 너무 밀어붙인 것이다."],"path":[{"n":"측정하기","s":["<b>Stereo Out</b> 이펙트 슬롯 → <b>Metering → Loudness Meter</b>","<k>Return</k>으로 처음으로 → 곡 전체 재생","<b>Integrated</b> 값 확인","<b>True Peak</b> 확인"]},{"n":"리미터 설정","s":["<b>Stereo Out</b> 마지막 슬롯 → <b>Dynamics → Limiter</b>","<b>Output Level</b>(실링) <v>-1.0</v>dB","<b>Gain</b>을 <v>0</v>부터 천천히 올림","리덕션이 순간 <v>2~3</v>dB를 넘지 않게"]}],"drill":["완성 곡의 통합 라우드니스를 측정하고 값을 적는다.","리미터 게인을 올려 -14LUFS에 맞추고 그 과정에서 소리가 어떻게 변하는지 듣는다.","일부러 -8LUFS까지 밀어붙인 버전을 만들어 다이내믹이 얼마나 사라지는지 비교한다.","같은 곡을 -14LUFS와 -9LUFS로 두 번 만들고, 두 파일의 음량을 똑같이 맞춰 비교한다. 다이내믹 차이를 적는다."],"keys":[["Return","처음으로"],["X","믹서"]],"chk":["LUFS와 dBFS의 차이를 안다","목표값을 기억한다","트루 피크에 여유를 둔다","장르별 라우드니스 관행을 안다"],"quiz":[{"q":"스트리밍 기준으로 흔히 쓰는 목표 라우드니스는?","a":["-6LUFS","-14LUFS 부근","-30LUFS","0LUFS"],"c":1,"e":"-14LUFS 부근이 일반적인 기준이고 애플 계열은 -16LUFS를 쓴다."},{"q":"트루 피크 여유는 보통 얼마로 두나?","a":["0dBTP","-1dBTP","-6dBTP","-20dBTP"],"c":1,"e":"-1dBTP를 두면 인코딩 과정에서 왜곡이 생기지 않는다."},{"q":"스트리밍용 곡을 -8LUFS로 만들어 올리면?","a":["더 크게 들린다","서비스가 깎아 내려 다이내믹만 잃는다","재생이 거부된다","음질이 좋아진다"],"c":1,"e":"자동 음량 조절이 기준으로 낮추므로 크기는 같아지고 눌린 다이내믹만 남는다."}]},{"d":67,"s":11,"t":"바운스와 파일 포맷","goal":"바운스 설정과 파일 포맷을 선택한다.","con":["바운스는 프로젝트를 오디오 파일로 만드는 작업이다. 설정 창의 항목이 많아 보이지만 실제로 정하는 것은 몇 개뿐이다.","발매용 마스터는 WAV, <v>24</v>비트, 프로젝트와 같은 샘플레이트로 뽑는다. 스트리밍 서비스가 알아서 압축하므로 압축 포맷을 직접 만들 필요가 없다.","들려주기용은 MP3 <v>320</v>kbps나 AAC면 충분하다. 로직은 한 번에 여러 포맷을 동시에 뽑을 수 있다.","바운스 구간은 곡의 시작과 끝을 정확히 잡는다. 잔향이 끝날 때까지 여유를 두지 않으면 마지막이 뚝 끊긴다. 마지막 음 이후 <v>2~3</v>초를 더 잡는다.","실시간과 오프라인 중 오프라인이 빠르다. 외부 하드웨어를 쓰는 경우에만 실시간을 고른다.","노멀라이즈는 끄고 뽑는다. 이미 리미터로 정한 라우드니스가 흐트러진다.","디더는 비트 심도를 줄일 때만 쓴다. 24비트를 16비트로 내릴 때 생기는 미세한 왜곡을 아주 작은 잡음으로 가려주는 처리다. 24비트로 그대로 낼 거라면 <b>없음</b>으로 둔다. 습관적으로 켜두면 오히려 손해다.","트랙별로 따로 뽑는 것이 스템이다. 다른 사람에게 믹스를 넘기거나 라이브에 쓸 때 필요하다."],"path":[{"n":"프로젝트 바운스","s":["사이클 또는 선택으로 바운스 구간 지정","<k>⌘B</k> → 바운스 창","<b>대상</b>에서 PCM과 MP3 등 체크","PCM: <b>파일 형식</b> WAVE, <b>해상도</b> <v>24</v>비트","<b>모드</b> 오프라인, <b>노멀라이즈</b> 끄기","<b>바운스</b> → 위치와 이름 지정"]},{"n":"스템 뽑기","s":["<b>파일 → 내보내기 → 모든 트랙을 오디오 파일로</b>","형식과 해상도 지정","<b>바이패스 이펙트 플러그인</b> 여부 선택","저장 위치 지정"]}],"drill":["완성 곡을 WAV 24비트와 MP3 320kbps로 동시에 바운스한다.","바운스 구간을 잔향 끝까지 잡았는지 결과 파일 마지막을 들어 확인한다.","모든 트랙을 스템으로 내보내고 폴더 구조를 확인한다."],"keys":[["⌘B","바운스"],["⌘U","선택을 사이클로"]],"chk":["발매용 포맷을 안다","노멀라이즈를 끄고 뽑는다","잔향 끝까지 구간을 잡는다"],"quiz":[{"q":"발매용 마스터 파일의 일반적인 형식은?","a":["MP3 128kbps","WAV 24비트","AAC","MIDI"],"c":1,"e":"압축하지 않은 WAV 24비트로 넘기면 서비스가 각자 포맷으로 변환한다."}]},{"d":68,"s":11,"t":"메타데이터와 발매","goal":"발매에 필요한 파일과 메타데이터를 준비한다.","con":["발매에 필요한 것은 음원, 커버 이미지, 메타데이터 세 가지다. 음악이 끝나도 이 셋이 준비되지 않으면 나갈 수 없다.","커버 이미지는 정사각형이고 최소 <v>3000</v>×<v>3000</v> 픽셀, RGB, JPG나 PNG로 준비한다. 작게 만들면 나중에 다시 만들어야 한다.","메타데이터에는 곡 제목, 아티스트명, 앨범명, 장르, 발매일, 작사가, 작곡가, 편곡자, 저작권 표기가 들어간다. 아티스트명은 한 번 정하면 바꾸기 번거로우니 신중히 정한다.","ISRC는 녹음물마다 붙는 국제 표준 코드다. 배급사가 발급해주는 경우가 많다. 저작권 관리와 정산 추적에 쓰인다.","배급은 배급 대행사를 통한다. 음원을 올리면 여러 스트리밍 서비스에 동시에 등록해준다. 심사와 반영에 보통 <v>1~3</v>주가 걸리므로 발매일을 여유 있게 잡는다.","국내에서 저작권료를 정산받으려면 저작권 신탁 단체에 가입하고 곡을 등록해야 한다. 창작자 등록과 곡 등록은 별개 절차다.","발매 전 마지막 점검. 다른 스피커와 이어폰에서 들어보고, 휴대폰 스피커로도 들어보고, 곡 시작과 끝의 무음 길이를 확인한다."],"path":[{"n":"파일 준비","s":["마스터 WAV 24비트 파일","커버 이미지 <v>3000</v>×<v>3000</v> 이상 정사각형","메타데이터 목록을 문서로 정리"]},{"n":"최종 점검","s":["다른 재생 환경 3곳 이상에서 청취","모노로 합쳐 들어보기: <b>Stereo Out</b>에 <b>Gain</b> 플러그인 → 모노 버튼","곡 시작 무음 <v>0.2~0.5</v>초, 끝 잔향 여유 확인"]}],"drill":["완성 곡의 메타데이터 목록을 전부 작성한다. 빈칸이 없어야 한다.","모노로 합쳐 들었을 때 사라지는 소리가 있는지 확인한다.","휴대폰 스피커, 이어폰, 스피커 세 환경에서 듣고 문제를 적는다."],"keys":[["⌘B","바운스"],["X","믹서"]],"chk":["필요한 세 가지를 준비했다","모노 호환성을 확인했다","발매 일정을 여유 있게 잡았다"],"quiz":[{"q":"커버 이미지의 권장 최소 크기는?","a":["500×500","1000×1000","3000×3000","300×300"],"c":2,"e":"3000×3000 픽셀 정사각형이면 대부분의 서비스 요구를 만족한다."},{"q":"모노로 합쳐 들었을 때 소리가 사라진다면 원인은?","a":["리버브 부족","위상 문제","템포 오류","비트 심도"],"c":1,"e":"좌우 신호의 위상이 반대인 부분은 모노에서 상쇄된다."}]},{"d":69,"s":12,"t":"레이턴시와 지연 보상","goal":"레이턴시의 원인을 알고 버퍼와 보상을 설정한다.","con":["레이턴시는 소리가 들어와서 나가기까지 걸리는 시간이다. 두 가지에서 생긴다. 하나는 오디오 버퍼, 다른 하나는 플러그인 처리 시간이다.","버퍼는 한 번에 처리하는 오디오 덩어리 크기다. 크면 컴퓨터가 편하고 지연이 길다. 작으면 반대다. 그래서 녹음할 때 작게, 믹스할 때 크게 두는 것이다. 값 자체는 앞의 녹음 세팅 일차에서 쓴 것과 같다. 이 일차에서 더하는 것은 값이 아니라 그 값이 몇 ms의 지연이 되는지의 계산이다. <v>128</v> 샘플이면 <v>48</v>kHz 기준 약 <v>2.7</v>ms, <v>1024</v> 샘플이면 약 <v>21</v>ms다. 왕복이므로 실제 체감은 두 배에 가깝다.","연주에 지장이 생기는 지점은 대략 <v>10</v>ms 부근이다. 그 아래면 대부분 느끼지 못하고, <v>20</v>ms를 넘으면 확실히 어긋난다고 느낀다.","플러그인마다 처리 지연이 다르다. 특히 선형 위상 EQ와 룩어헤드 리미터는 지연이 크다. 로직은 이것을 자동으로 계산해 다른 트랙을 그만큼 늦춰 맞춘다. 이것이 플러그인 지연 보상이다.","보상 범위를 모두로 두면 정확하지만 전체 지연이 커진다. 녹음할 때 걸리적거리면 저지연 모드를 쓴다. 저지연 모드는 지연이 큰 플러그인을 잠시 우회한다. 소리가 달라지므로 녹음이 끝나면 끈다."],"path":[{"n":"버퍼와 보상 설정","s":["<b>Logic Pro → 설정 → 오디오 → 장비</b>","<b>I/O 버퍼 크기</b>: 녹음 <v>64~128</v>, 믹스 <v>512~1024</v>","<b>플러그인 지연 보상</b>: <b>모든 것</b>","<b>적용</b>"]},{"n":"저지연 모드","s":["<b>Logic Pro → 설정 → 오디오 → 일반</b>","<b>저지연 모드</b> 한계값 확인","컨트롤 막대 우클릭 → <b>컨트롤 막대 및 디스플레이 사용자화</b>에서 저지연 버튼 추가","녹음 시 켜고 끝나면 끄기"]}],"drill":["버퍼를 64와 1024로 바꿔가며 건반을 쳐서 지연을 체감한다.","마스터에 선형 위상 EQ를 걸고 지연 보상이 켜졌을 때와 꺼졌을 때 트랙 간 어긋남을 확인한다.","저지연 모드를 켜서 어떤 플러그인이 우회되는지 확인한다."],"keys":[["R","녹음"],["⌘S","저장"]],"chk":["버퍼와 지연의 관계를 안다","지연 보상 설정 위치를 안다","저지연 모드를 상황에 맞게 쓴다"],"quiz":[{"q":"연주에 지장을 느끼기 시작하는 지연은 대략?","a":["1ms","10ms","100ms","500ms"],"c":1,"e":"10ms 부근부터 체감되고 20ms를 넘으면 확실히 어긋난다고 느낀다."},{"q":"녹음할 때 버퍼를 작게 두는 이유는?","a":["음질이 좋아져서","지연을 줄이려고","용량을 아끼려고","플러그인이 많아서"],"c":1,"e":"버퍼가 작을수록 지연이 짧지만 컴퓨터 부담은 커진다."}]},{"d":70,"s":12,"t":"프리즈와 바운스 인 플레이스","goal":"프리즈와 바운스 인 플레이스로 부하를 줄인다.","con":["곡이 커지면 컴퓨터가 버거워진다. 소리가 끊기거나 시스템 과부하 경고가 뜬다. 해결책은 처리를 미리 해두고 그 결과만 재생하는 것이다.","프리즈는 트랙을 임시로 오디오로 만들어 재생한다. 언제든 해제해서 다시 편집할 수 있다. 되돌릴 여지를 남기므로 작업 중에는 프리즈가 편하다. 프리즈 모드가 두 가지인데, 소스만 얼리면 이후 이펙트는 계속 조절할 수 있고, 사전 페이더까지 얼리면 자원이 더 많이 절약되는 대신 이펙트도 고정된다.","바운스 인 플레이스는 아예 오디오 리전으로 바꾼다. 되돌리려면 원본 트랙을 보관해야 한다. 미디 이펙트 결과를 확정하거나 다른 사람에게 넘길 때 쓴다.","자원이 새는 흔한 원인들. 쓰지 않는 플러그인이 켜진 채 남아 있는 경우, 리버브를 트랙마다 개별로 건 경우, 샘플 라이브러리를 회전식 하드디스크에 둔 경우, 프리로드 버퍼가 과하게 큰 경우.","CPU 미터를 보고 판단한다. 코어 하나만 치솟는다면 그 트랙의 플러그인 사슬이 길기 때문이다. 그 트랙을 프리즈하면 해결된다.","작업 순서를 정해두면 좋다. 편곡이 끝난 트랙은 프리즈한다. 손댈 일이 없는 트랙까지 실시간으로 계산할 이유가 없다."],"path":[{"n":"프리즈 켜기","s":["트랙 헤더 우클릭 → <b>트랙 헤더 구성요소</b> → <b>프리즈</b> 체크","트랙 헤더의 눈송이 버튼 클릭","재생하면 얼기 시작","<k>I</k> 인스펙터에서 <b>프리즈 모드</b>를 <b>소스만</b> 또는 <b>사전 페이더</b>로"]},{"n":"바운스 인 플레이스","s":["리전 선택 → <k>⌃B</k>","트랙 전체는 <k>⌃⌥B</k>","<b>원본 남기기</b> 체크 여부 확인","<b>확인</b>"]},{"n":"부하 확인","s":["<b>보기 → CPU/HD 미터 사용자화</b> 또는 컨트롤 막대의 성능 미터","코어별 사용량 확인"]}],"drill":["플러그인이 많은 트랙을 프리즈하고 CPU 미터 변화를 확인한다.","프리즈 모드 두 가지를 각각 걸어보고 무엇이 조절 가능한지 비교한다.","아르페지에이터가 걸린 트랙을 바운스 인 플레이스로 확정한다."],"keys":[["⌃B","리전 바운스 인 플레이스"],["⌃⌥B","트랙 바운스 인 플레이스"],["⌘S","저장"]],"chk":["프리즈와 바운스 인 플레이스를 구분한다","프리즈 모드를 선택할 수 있다","CPU 미터로 원인을 찾는다"],"quiz":[{"q":"언제든 해제해 다시 편집할 수 있는 쪽은?","a":["프리즈","바운스 인 플레이스","스템 내보내기","프로젝트 정리"],"c":0,"e":"프리즈는 임시라서 해제하면 원래대로 돌아온다."}]},{"d":71,"s":12,"t":"스마트 템포와 오디오 가져오기","goal":"외부 오디오를 프로젝트 템포에 맞춰 가져온다.","con":["바깥에서 받은 오디오는 대개 프로젝트와 템포가 다르다. 그냥 넣으면 어긋난다. 로직은 세 가지 방식으로 처리한다.","프로젝트 템포 모드가 세 가지다. 유지는 프로젝트 템포를 지키고 오디오를 그에 맞춘다. 조정은 반대로 들어온 오디오의 템포를 프로젝트가 따라간다. 자동은 상황에 따라 판단한다. 대부분의 경우 유지가 맞다.","리전 단위로도 정한다. 리전 인스펙터의 플렉스와 팔로우 항목을 켜면 그 리전이 프로젝트 템포를 따라간다. 루프 소재를 넣을 때 편하다. 샘플 하나를 즉석에서 맞출 때는 더 직접적인 방법이 있다. 샘플의 원래 길이만큼 사이클 구간을 잡고 리전을 선택한 뒤 <k>⌥⌘L</k>을 누르면, 리전이 사이클 길이에 맞춰 늘어나거나 줄어든다. 템포를 모르는 샘플이라면 리전을 선택하고 <k>⌥⌘T</k>로 먼저 분석시킨다. 매번 손으로 맞추는 것이 번거롭다면 <k>⌥P</k>로 스마트 템포 설정을 열어 <b>가져온 파일</b>을 <b>켬 + 마디 및 비트 정렬</b>로 바꿔 둔다. 그 뒤로는 파일을 끌어다 놓는 순간 로직이 알아서 분석해 맞춘다.","템포를 크게 바꾸면 소리가 상한다. 원본에서 <v>10</v>퍼센트 안쪽이면 대체로 티가 안 나고, <v>20</v>퍼센트를 넘으면 늘어지거나 떨리는 소리가 들린다. 그럴 때는 다른 소재를 찾는 편이 낫다.","샘플레이트가 다른 파일은 로직이 변환해 넣는다. 프로젝트와 같은 샘플레이트의 파일을 쓰는 것이 가장 깨끗하다.","오디오를 가져오는 방법은 셋이다. 파인더에서 드래그, 브라우저에서 드래그, 파일 메뉴에서 가져오기. 어느 쪽이든 프로젝트 폴더로 복사할지 묻는데, 복사해두는 편이 안전하다."],"path":[{"n":"템포 모드 설정","s":["LCD 왼쪽의 <b>프로젝트 템포 모드</b> 표시 클릭","<b>유지 / 조정 / 자동</b> 중 선택","확신이 없으면 <b>유지</b>"]},{"n":"리전이 템포를 따르게","s":["오디오 리전 선택 → <k>I</k> 인스펙터","<b>플렉스와 팔로우</b> 항목을 <b>켬</b> 또는 <b>켬 + 리전 시작에 맞춤</b>","템포를 바꿔 리전이 따라오는지 확인"]}],"drill":["템포가 다른 드럼 루프를 가져와 프로젝트 템포에 맞춘다.","원본에서 10퍼센트, 25퍼센트 벌어지게 템포를 바꿔 소리가 상하는 지점을 찾는다.","같은 파일을 프로젝트 폴더로 복사한 경우와 아닌 경우를 만들어 폴더 구조를 비교한다."],"keys":[["I","인스펙터"],["⌘F","플렉스 표시"],["⌥⌘L","사이클 길이에 맞추기"],["⌥⌘T","리전 템포 분석"],["⌥P","스마트 템포 설정"]],"chk":["세 가지 템포 모드를 안다","리전이 템포를 따르게 만들 수 있다","템포 변경 한계를 안다"],"quiz":[{"q":"오디오 템포를 원본에서 몇 퍼센트 넘게 바꾸면 소리가 상하기 시작하나?","a":["2퍼센트","20퍼센트 부근","50퍼센트","100퍼센트"],"c":1,"e":"10퍼센트 안쪽은 대체로 무난하고 20퍼센트를 넘으면 티가 나기 시작한다."}]},{"d":72,"s":12,"t":"스크린셋, 키 커맨드, 템플릿","goal":"스크린셋, 키 커맨드, 템플릿을 설정한다.","con":["작업 속도는 지식이 아니라 반복 횟수에서 나온다. 매번 같은 창을 열고 같은 트랙을 만든다면 그것부터 줄인다.","스크린셋은 창 배치를 통째로 저장한 것이다. 숫자 키 하나로 불러온다. 1번은 편곡 화면, 2번은 믹서, 3번은 피아노 롤 크게, 이런 식으로 정해두면 화면 정리에 쓰는 시간이 사라진다. 별도의 저장 동작이 없고 바꾸면 그대로 기억된다. 고정하고 싶으면 잠글 수 있다.","키 커맨드는 원하는 기능에 원하는 키를 붙이는 것이다. 로직에는 기본 단축키가 없는 기능이 아주 많다. 자주 쓰는데 메뉴를 뒤져야 하는 기능이 있다면 그것부터 붙인다. 만든 키 커맨드는 <b>키 명령 → 프리셋 저장</b>으로 내보내 둔다. 컴퓨터를 바꾸거나 로직을 재설치해도 파일 하나로 그대로 되살릴 수 있다. 이 창은 <k>⌥K</k>로 바로 열린다. 검색만 해도 쓸모가 있다. 하고 싶은 일의 이름을 넣으면 그 기능에 이미 붙어 있는 단축키가 나오므로, 메뉴를 뒤지지 않고도 찾을 수 있다.","템플릿은 트랙 구성과 이펙트 설정까지 저장한 시작점이다. 장르별로 하나씩 만들어두면 새 곡을 만들 때 곧바로 소리부터 낼 수 있다. 트랙 이름, 색, 센드 버스, 마스터 체인까지 미리 넣어둔다.","과하게 만들면 오히려 부담이 된다. 실제로 매번 쓰는 것만 넣는다. 처음에는 트랙 여덟 개 정도로 시작해 필요할 때 늘리는 편이 낫다.","여기까지가 이 과정의 마지막 일차다."],"path":[{"n":"스크린셋","s":["원하는 창 배치를 만듦","숫자 키 <k>1</k>~<k>9</k> 중 하나를 누름 → 그 번호에 저장","다른 배치를 만들고 다른 숫자","고정: <b>스크린셋 → 잠그기</b>"]},{"n":"키 커맨드","s":["<b>Logic Pro → 키 명령 → 편집</b>","검색창에 기능 이름 입력","항목 선택 → <b>키 명령 학습</b> 클릭 → 원하는 키 누름","<b>저장</b>"]},{"n":"템플릿 저장","s":["트랙, 센드 버스, 마스터 체인을 구성","<b>파일 → 템플릿으로 저장</b> → 이름 지정","다음부터 <b>파일 → 신규</b> → <b>나의 템플릿</b>"]}],"drill":["스크린셋 세 개를 만들어 숫자 키로 오간다.","자주 쓰는데 단축키가 없는 기능 세 개를 찾아 키를 붙인다.","가장 많이 만들 장르의 템플릿을 완성해 저장하고 새 프로젝트로 열어본다."],"keys":[["1~9","스크린셋 전환"],["⌘S","저장"],["⌥⌘N","새 트랙"],["⌥K","키 명령 창"]],"chk":["스크린셋을 만들고 오갈 수 있다","키 커맨드를 하나 이상 지정했다","나만의 템플릿을 저장했다"],"quiz":[{"q":"스크린셋을 저장하는 방법은?","a":["파일 메뉴에서 저장","숫자 키를 누르면 자동 저장","우클릭 후 저장","템플릿으로 저장"],"c":1,"e":"별도 저장 동작 없이 숫자 키에 현재 배치가 기억된다."}]}];
const KEYS=[{"g":"재생과 이동","k":[["스페이스","재생 · 정지"],["Return","프로젝트 처음으로"],["R","녹음"],["C","사이클 켜기 · 끄기"],["⌘U","선택 영역을 사이클로"],["⇧Return","사이클 시작점부터 재생"],["Z","선택 영역 확대 · 복귀"],["⌘←","줌 아웃"],["⌘→","줌 인"],["⌘↑","트랙 높이 줄이기"],["⌘↓","트랙 높이 키우기"],["K","메트로놈"],["&lt; &gt;","한 마디 앞뒤 이동"],["⌥'","마커 추가"]]},{"g":"창 열고 닫기","k":[["I","인스펙터"],["Y","라이브러리"],["E","편집기"],["P","피아노 롤"],["X","믹서"],["B","스마트 컨트롤"],["F","브라우저"],["O","루프 브라우저"],["N","스코어 편집기"],["G","글로벌 트랙"],["A","오토메이션 표시"],["⌘K","뮤지컬 타이핑"],["⌥K","키 명령 창"],["⌘2","믹서 별도 창"]]},{"g":"편집","k":[["⌘T","재생 헤드에서 분할"],["⌘R","반복 횟수 지정"],["⌘D","트랙 복제"],["⌥드래그","리전 복사"],["⌥⇧드래그","알리아스 만들기"],["⌃드래그","스냅 무시 미세 이동"],["⌘A","전체 선택"],["Delete","삭제"],["⌘Z","실행 취소"],["⇧⌘Z","다시 실행"],["T","도구 팝업"],["L","리전 루프 켜기 · 끄기"],["⌃L","루프를 리전으로 변환"],["F1","겹침 제거"],["F2","포스 레가토"],["⌥⌘Z","실행 취소 기록"]]},{"g":"미디","k":[["⌘클릭","피아노 롤에서 음 추가"],["⌃드래그","벨로시티 조절"],["Q","퀀타이즈 적용"],["⌥클릭","플러그인 값 초기화"],["⌥↑ ↓","음 반음 올리고 내리기"],["⇧⌥↑ ↓","음 옥타브 올리고 내리기"]]},{"g":"트랙과 파일","k":[["⌥⌘N","새 트랙"],["M","뮤트"],["S","솔로"],["⌘S","저장"],["⇧⌘S","다른 이름으로 저장"],["⌘B","바운스"],["⌘F","플렉스 표시"],["⌘⇧D","트랙 스택 만들기"],["⌃B","리전 바운스 인 플레이스"],["⌃⌥B","트랙 바운스 인 플레이스"],["1~9","스크린셋 전환"],["⇧R","캡처 녹음"],["⌃X","무음 구간 제거"],["⌃E","리전을 샘플러 트랙으로"],["⌥⌘F","독립 오디오 파일로 변환"],["⌥⌘L","사이클 길이에 맞추기"],["⌥⌘T","리전 템포 분석"],["⌥⇧M","선택 트랙 일괄 뮤트"],["⌥P","스마트 템포 설정"]]}];
const GLOSS=[["3대 1 법칙","두 번째 마이크를 첫 마이크와 소리원 거리의 세 배 이상 떨어뜨리는 규칙.","3:1 Rule"],["808","킥이 낮게 길게 울리는 드럼머신 계열. 킥이 베이스를 겸하는 힙합의 문법.","TR-808"],["909","단단하고 딱딱 끊어지는 드럼머신 계열. 하우스와 테크노의 표준.","TR-909"],["가상악기","미디 지시를 받아 실제 소리를 내주는 프로그램 안의 악기.","Software Instrument"],["개방형 헤드폰","뒤가 뚫려 울림이 자연스러운 헤드폰. 믹싱용.","Open-back"],["게이트","설정한 레벨보다 작은 소리를 막는 도구. 잡음과 새어든 소리를 걷어낸다.","Noise Gate"],["게이트 리버브","잔향이 도중에 끊기는 효과. 1980년대 스네어 소리.","Gated Reverb"],["게인","들어오는 신호를 얼마나 증폭할지 정하는 값. 나가는 크기인 볼륨과 구분한다.","Gain"],["게인 리덕션","컴프레서가 실제로 누른 양. 3~6dB가 일반적.","Gain Reduction"],["게인 스테이징","각 단계의 레벨을 적정 범위에 두는 작업. 개별 트랙 피크 -18~-10dBFS.","Gain Staging"],["격자","리전과 음이 달라붙는 눈에 보이지 않는 눈금.","Grid"],["겹침 제거","겹친 음의 앞 음을 다음 음 직전까지 줄이는 정리 명령. F1.","Remove Overlaps"],["고역","높은 주파수 구간. 하이햇과 공기감이 사는 자리.","High"],["그룹 버스","같은 역할의 트랙을 하나로 모은 버스. 여기에 컴프를 걸면 한 덩어리로 움직인다.","Group Bus"],["극성 반전","파형의 위아래를 뒤집는 처리. 다중 마이크 녹음의 위상 정렬에 쓴다.","Phase Invert"],["근접 효과","지향성 마이크에 가까이 댈수록 저음이 부풀어 오르는 현상.","Proximity Effect"],["글루 컴프레서","마스터에 살짝 걸어 곡을 하나로 묶는 컴프레서. 게인 리덕션 1~2dB.","Glue Compressor"],["글루 컴프레션","묶인 트랙을 함께 살짝 눌러 한 덩어리로 들리게 하는 처리.","Glue Compression"],["누적 게인 리덕션","트랙, 버스, 마스터에서 각각 누른 양의 합. 8dB를 넘지 않게 관리한다.","Cumulative GR"],["눈금자","화면 위쪽의 마디 번호가 적힌 막대. 클릭하면 재생 헤드가 그 자리로 간다.","Ruler"],["다이내믹 마이크","코일과 자석으로 소리를 받는 마이크. 튼튼하고 큰 소리에 강하며 전원이 필요 없다.","Dynamic Mic"],["다이렉트 모니터링","인터페이스가 입력 소리를 지연 없이 바로 헤드폰으로 들려주는 기능.","Direct Monitoring"],["덕킹","특정 소리가 날 때 다른 소리를 잠깐 낮추는 처리.","Ducking"],["데시벨","소리 크기를 재는 단위. 절대값이 아니라 무엇과 비교한 값이다.","dB"],["독립 오디오 파일로 변환","리전을 별도 파일로 떼어내 다른 리전에 영향을 주지 않게 하는 명령. ⌥⌘F.","Convert to New Audio Files"],["드러머","로직이 연주해주는 가상 드러머 트랙. XY 패드로 복잡도와 세기를 조절한다.","Drummer"],["드로우바 오르간","막대를 밀고 당겨 배음을 섞는 오르간. 어택 없이 크게 지속되어 두껍고 힘있게 들린다. 가스펠과 록의 표준 재료.","Drawbar Organ"],["디더","비트 심도를 줄일 때 생기는 왜곡을 아주 작은 잡음으로 가리는 처리. 24비트로 낼 때는 쓰지 않는다.","Dither"],["디에서","치찰음 대역만 순간적으로 누르는 도구. 5~9kHz를 다룬다.","De-esser"],["라우드니스 레인지","곡의 다이내믹 폭. 5~9LU가 무난하다.","Loudness Range"],["라운드 로빈","같은 음을 연달아 칠 때 매번 다른 녹음을 돌려 쓰는 장치. 없으면 연타가 기계처럼 들린다.","Round Robin"],["라이브러리","그 트랙에 얹을 소리를 고르는 목록.","Library"],["라이저","구간 전환 직전의 상승 효과음.","Riser"],["레이시오","컴프레서가 누르는 비율. 3:1이면 초과분이 3분의 1로 줄어든다.","Ratio"],["레이턴시","소리가 들어와 나가기까지의 지연. 버퍼와 플러그인 처리에서 생긴다.","Latency"],["레조넌스","필터 컷오프 지점을 강조하는 정도.","Resonance"],["레퍼런스 트랙","목표로 삼는 완성 음원. 음량을 맞춰 비교해야 의미가 있다.","Reference Track"],["로컬 오프","신디사이저에서 건반과 자체 음원의 연결을 끊는 설정. 순수한 입력 장치가 된다.","Local Off"],["루프","같은 구간을 반복해 재생하는 것.","Loop"],["루프 브라우저","Apple Loops를 검색하고 미리 듣는 창. O로 연다.","Loop Browser"],["룸 리버브","작은 방을 흉내 낸 짧고 어두운 잔향. 드럼과 기타에 쓴다.","Room"],["리드","선율을 맡는 전면의 신스 소리.","Lead"],["리미터","설정한 실링을 절대 넘지 않게 막는 최종 단계 처리기.","Limiter"],["리본 마이크","얇은 금속 리본으로 소리를 받는 예민한 마이크. 팬텀 파워를 켜기 전에 설명서를 확인한다.","Ribbon Mic"],["리전","트랙 위의 소리 덩어리. 미디 리전은 음표 정보를, 오디오 리전은 파형을 담는다.","Region"],["리플렉션 필터","마이크 뒤에 두르는 반원형 흡음판. 방 울림을 줄인다.","Reflection Filter"],["마디","박이 몇 개 모인 한 덩어리. 눈금자의 숫자가 마디 번호다.","Bar"],["마스터","모든 신호가 마지막에 모이는 곳. 로직에서는 스테레오 아웃이라고 표시된다.","Stereo Out"],["마스터 키보드","입력 전용으로 쓰는 건반. 신디사이저도 로컬 오프를 켜면 마스터 키보드가 된다.","Master Keyboard"],["마스터링 어시스턴트","곡을 분석해 EQ와 다이내믹, 라우드니스를 자동으로 맞춰 주는 로직 11 도구.","Mastering Assistant"],["말렛","마림바, 비브라폰, 글로켄처럼 채로 때리는 악기 계열.","Mallet"],["매핑","어떤 건반과 어떤 벨로시티에 어떤 샘플을 배치할지 정한 표.","Mapping"],["멀티 아웃풋","악기 안의 소리를 믹서에서 여러 채널로 나눠 뽑는 방식.","Multi-Output"],["멀티밴드 컴프레서","주파수 구간별로 따로 누르는 컴프레서. 문제가 명확할 때만 쓴다.","Multiband Compressor"],["멀티팀버","악기 하나의 인스턴스 안에 여러 악기를 담는 방식. 컨탁은 16개까지.","Multitimbral"],["메이크업 게인","컴프레서로 줄어든 음량을 보상하는 값.","Make-up Gain"],["메트로놈","박에 맞춰 딸깍 소리를 내주는 기능. 녹음할 때 켠다. K로 켜고 끈다.","Metronome"],["멜로트론","테이프를 재생하는 옛 건반 악기. 흔들리는 복고적 목소리와 플루트.","Mellotron"],["모노 호환성","좌우를 합쳐 들었을 때 소리가 사라지지 않는지의 여부. 위상 문제를 확인한다.","Mono Compatibility"],["모니터","있는 그대로 들려주는 것이 목표인 작업용 스피커.","Monitor"],["모듈레이션 휠","CC1을 보내는 휠. 음색의 세기와 떨림을 조절한다.","Mod Wheel"],["무음 제거","설정한 레벨보다 작은 구간을 한 번에 잘라내는 기능. ⌃X.","Strip Silence"],["무지향성","사방을 고르게 받는 지향성. 공간 전체를 담을 때 쓴다.","Omni"],["물리 모델링","악기의 물리 과정을 계산해 소리를 만드는 방식. 로직의 Sculpture가 이쪽이다.","Physical Modeling"],["뮤트","그 트랙을 잠시 꺼두는 기능.","Mute"],["미디","소리가 아니라 연주 지시서. 어떤 건반을 언제 얼마나 세게 눌렀는지의 기록이다.","MIDI"],["미디 이펙트","악기에 도달하기 전의 음표 정보를 가공하는 플러그인. 아르페지에이터 등.","MIDI FX"],["미디 컨트롤러","노브, 페이더, 패드 등으로 미디 신호를 보내는 장치. 무엇을 움직일지는 할당으로 정한다.","MIDI Controller"],["미디 키보드","건반 모양의 입력 장치. 스스로 소리를 내지 않고 연주 정보만 컴퓨터로 보낸다.","MIDI Keyboard"],["믹서","모든 트랙의 채널 스트립을 한 화면에 모아 보는 창.","Mixer"],["밀리초","1000분의 1초. 소리의 시간을 다루는 값은 거의 전부 이 단위로 적는다.","ms"],["밀폐형 헤드폰","귀를 감싸 소리가 새지 않는 헤드폰. 녹음용.","Closed-back"],["바운스 인 플레이스","리전이나 트랙을 오디오 리전으로 확정하는 기능.","Bounce in Place"],["박","발로 까딱거리는 시간의 한 단위.","Beat"],["박자","한 마디에 어떤 음표가 몇 개 들어가는지를 두 숫자로 나타낸 것.","Time Signature"],["밸런스드","같은 신호를 정상과 반전 두 가닥으로 보내 잡음을 상쇄하는 방식. XLR과 TRS가 쓴다.","Balanced"],["버스","여러 트랙이 함께 쓰는 옆길. 센드로 보낸 신호가 모이는 곳.","Bus"],["벨로시티","건반을 누른 세기. 1~127. 대개 음량과 음색이 함께 바뀐다.","Velocity"],["벨로시티 레이어","세기별로 따로 녹음해 쌓아둔 샘플 층. 많을수록 자연스럽고 용량이 크다.","Velocity Layer"],["병렬 컴프레션","세게 누른 복사본을 원음에 섞어 다이내믹을 유지한 채 밀도를 더하는 기법.","Parallel Compression"],["부스트 스윕","좁은 폭으로 크게 올린 채 주파수를 옮겨 문제 대역을 찾는 방법.","Boost Sweep"],["비트 심도","한 조각의 크기를 몇 단계로 나눠 적을지 정하는 값. 작업 기본은 24비트.","Bit Depth"],["사이드체인","다른 트랙의 소리를 듣고 반응하게 만드는 입력. 킥에 맞춰 베이스를 덕킹할 때 쓴다.","Side Chain"],["상대값 스냅","격자에서 어긋난 정도를 유지한 채 옮기는 스냅 방식.","Relative Snap"],["새추레이션","배음을 더해 두께와 따뜻함을 만드는 처리.","Saturation"],["샘플레이트","1초를 몇 조각으로 나눠 기록할지 정하는 값. 작업 기본은 48킬로헤르츠.","Sample Rate"],["서밍 스택","여러 트랙의 출력을 하나로 모으는 트랙 스택. 그룹 버스를 만드는 방법.","Summing Stack"],["서스테인 페달","밟는 동안 소리를 이어 주는 페달. 꽂으면 CC64로 잡힌다.","Sustain Pedal"],["세션 플레이어","로직이 대신 연주해 주는 가상 연주자. 드러머와 베이스 플레이어 등이 있다.","Session Player"],["센드","신호를 복사해 옆길로 보내는 방식. 원래 소리는 그대로 간다. 리버브가 여기 속한다.","Send"],["센드 버스","여러 트랙이 같은 이펙트를 공유하도록 신호를 보내는 경로.","Send Bus"],["솔로","그 트랙만 남기고 나머지를 모두 끄는 기능.","Solo"],["솔로 스트링","한 명의 현악. 가깝고 감정이 진한 선율용.","Solo Strings"],["쇼크 마운트","마이크를 고무줄로 띄워 바닥 진동이 타고 오르는 것을 끊는 거치대.","Shock Mount"],["스냅","리전을 옮길 때 붙는 격자 단위. 마디, 비트, 디비전, 틱, 스마트 중에서 고른다.","Snap"],["스레숄드","컴프레서가 누르기 시작하는 레벨.","Threshold"],["스마트 템포","프로젝트와 오디오의 템포 관계를 처리하는 로직의 방식. 유지·조정·자동.","Smart Tempo"],["스윙","짝수 번째 음을 뒤로 미는 비율. 50이 스트레이트, 58~67이 재즈 계열.","Swing"],["스크린셋","창 배치를 숫자 키에 저장해 즉시 불러오는 기능.","Screenset"],["스탭","짧게 끊어 치는 코드 타격 소리.","Stab"],["스템","트랙별로 따로 뽑은 오디오 파일 묶음.","Stem"],["스템 스플리터","섞인 오디오를 보컬, 드럼, 베이스, 그 외로 분리하는 로직 11 도구. 애플 실리콘 필요.","Stem Splitter"],["스프링 리버브","용수철로 만든 통통 튀는 잔향. 기타 앰프에 내장되어 있다.","Spring"],["시머 리버브","잔향에 옥타브 위 음을 섞어 위로 번지게 만든 효과.","Shimmer"],["아르페지에이터","누른 코드의 음을 순서대로 연주해주는 미디 이펙트.","Arpeggiator"],["아르프 음색","아르페지오 반복에 맞게 만들어진 짧은 신스 소리.","Arp"],["아티큘레이션","연주 주법. 레가토, 스타카토, 피치카토, 트레몰로 등.","Articulation"],["알리아스","미디 리전의 분신. 원본을 고치면 모두 바뀌지만 위치와 트랙은 따로 둘 수 있다.","Alias"],["앙상블 스트링","여러 명이 함께 켜는 현악. 넓고 매끈한 배경용.","Ensemble Strings"],["어레인지먼트 마커","곡 구간에 이름을 붙이는 글로벌 트랙 요소. 드래그하면 구간 전체가 이동한다.","Arrangement Marker"],["언밸런스드","한 가닥으로 보내는 방식. 길게 끌수록 잡음이 는다. TS가 이쪽이다.","Unbalanced"],["에코","반복이 또렷하게 분리되어 들리는 딜레이. 대략 100ms 이상에서 나타난다.","Echo"],["오디오","소리 그 자체를 담은 데이터. 마이크로 녹음한 것과 음원 파일이 여기 속한다.","Audio"],["오디오 인터페이스","컴퓨터와 소리를 주고받는 장치. 마이크를 넣고 스피커로 내보낸다.","Audio Interface"],["오실레이터","신스에서 원재료 파형을 만드는 부분. 톱니, 사각, 삼각, 사인, 노이즈.","Oscillator"],["오토메이션","시간에 따라 값이 변하도록 기록하는 기능. Touch, Latch, Write 모드가 있다.","Automation"],["오프 액시스","마이크의 정면 축에서 비켜난 방향. 살짝 틀어 세우면 파열음이 줄어든다.","Off-Axis"],["웨이브테이블","파형 자체가 시간에 따라 변하는 합성 방식. 현대 일렉트로닉의 중심.","Wavetable"],["인서트","신호가 그 장치를 통과해 지나가는 방식. 원래 소리가 바뀐다. EQ와 컴프레서가 여기 속한다.","Insert"],["인스펙터","지금 선택한 대상의 속성을 보여주는 왼쪽 패널. 선택이 바뀌면 내용이 바뀐다.","Inspector"],["자동 음량 조절","스트리밍 서비스가 재생 시점에 곡의 라우드니스를 기준으로 맞추는 기능.","Loudness Normalization"],["재생 헤드","지금 어디를 읽고 있는지 알려주는 세로줄.","Playhead"],["저역","낮은 주파수 구간. 킥과 베이스가 사는 자리.","Low"],["저지연 모드","지연이 큰 플러그인을 잠시 우회해 녹음을 편하게 하는 모드.","Low Latency Mode"],["정삼각형 배치","두 스피커와 머리가 정삼각형을 이루는 배치. 좌우 소리가 같은 시간에 도착한다.","Equilateral Setup"],["존","샘플 하나가 놓인 건반 범위와 벨로시티 범위.","Zone"],["주파수","소리가 떨리는 빠르기. 헤르츠로 잰다. 높낮이를 결정한다.","Frequency"],["중역","가운데 주파수 구간. 목소리와 대부분의 악기가 사는 자리.","Mid"],["지향성","마이크가 어느 방향의 소리를 받는지. 카디오이드, 무지향성, 8자 등이 있다.","Polar Pattern"],["채널 스트립","한 트랙의 신호 흐름 전체. 악기, 이펙트, 센드, 팬, 페이더로 이루어진다.","Channel Strip"],["챔버 리버브","울림방을 본뜬 잔향. 룸보다 길고 홀보다 짧다.","Chamber"],["체감 속도","숫자상 템포와 별개로 귀가 느끼는 빠르기. 단위 시간에 일어나는 사건의 수가 정한다.","Perceived Tempo"],["카디오이드","앞의 소리만 받고 뒤를 거의 안 받는 지향성. 홈 레코딩의 기본값.","Cardioid"],["카운트인","녹음이 시작되기 전에 한두 마디를 미리 세어 주는 기능.","Count-in"],["캡처 녹음","녹음 버튼을 누르지 않고 친 연주를 나중에 가져오는 로직 기능. ⇧R.","Capture Recording"],["컨탁","샘플 라이브러리를 재생하는 대표적인 샘플러. 그릇이고 라이브러리가 내용물이다.","Kontakt"],["컨트롤러 할당","기기의 노브나 페이더를 로직의 파라미터에 연결하는 것. 학습으로 가르친다.","Controller Assignments"],["컴핑","여러 테이크에서 좋은 구간만 골라 하나로 조립하는 작업.","Comping"],["컷오프","필터가 깎기 시작하는 주파수.","Cutoff"],["코렐레이션 미터","좌우 신호의 위상 관계를 보여주는 미터. +1은 모노, -1은 상쇄.","Correlation Meter"],["콘덴서 마이크","얇은 막의 떨림으로 소리를 받는 마이크. 섬세하지만 팬텀 파워가 필요하다. 스튜디오 보컬의 기본.","Condenser Mic"],["콰이어","다수의 목소리가 합쳐진 지속음이라 장엄하게 들린다. 큰 편성의 화성을 만들며 종교적·서사적 장면의 관습적 재료.","Choir"],["퀀타이즈","음을 격자에 붙이는 기능. 강도 값으로 붙이는 정도를 조절한다.","Quantize"],["클라비넷","타악기 성격의 건반. 펑크 리듬의 재료.","Clavinet"],["클리핑","소리가 최대치를 넘어 깨지는 현상. 되돌릴 수 없다.","Clipping"],["키스위치","연주에 쓰지 않는 낮은 건반으로 주법을 전환하는 방식.","Key Switch"],["킬로헤르츠","헤르츠의 1000배. 2킬로헤르츠는 2000헤르츠다.","kHz"],["테이크 폴더","사이클 녹음으로 쌓인 여러 테이크를 담은 리전.","Take Folder"],["템포","1분에 박이 몇 개 지나가는지. 단위는 BPM.","Tempo"],["트랙","화면의 가로줄 하나. 악기 하나가 한 줄을 쓴다.","Track"],["트랙 지연","트랙 전체의 재생 시점을 앞뒤로 미는 값. 레가토 샘플 보정에 쓴다.","Track Delay"],["트랙 헤더","트랙 왼쪽의 이름과 버튼이 모인 부분.","Track Header"],["트루 피크","디지털을 아날로그로 변환할 때 생기는 실제 최대값. -1dBTP로 여유를 둔다.","True Peak"],["틴 일렉트릭 피아노","금속 막대를 때리는 건반. 어택이 둥글어 부드럽게 들린다. 알앤비와 발라드의 기본 재료.","Tine EP"],["팝 필터","입과 마이크 사이에 세우는 망. 파열음의 바람이 마이크를 때리는 것을 막는다.","Pop Filter"],["패드","뒤에 깔리는 지속음 계열. 어택이 느리고 릴리스가 길다. 검색어는 Pad.","Pad"],["패치","악기와 이펙트, 볼륨까지 포함한 채널 스트립 전체 설정. 라이브러리에서 고른다.","Patch"],["팬","소리를 왼쪽이나 오른쪽으로 보내는 조절기.","Pan"],["팬텀 파워","콘덴서 마이크에 XLR 케이블로 공급하는 48V 전원.","Phantom Power"],["퍼지","연주에 쓰이지 않는 샘플을 메모리에서 걷어내는 기능.","Purge"],["페이더","소리 크기를 조절하는 세로 막대.","Fader"],["포스 레가토","각 음을 다음 음이 시작할 때까지 늘려 빈틈을 없애는 명령. F2.","Force Legato"],["프레즌스","10kHz 부근을 살짝 올려 소리가 앞으로 나오게 하는 처리.","Presence"],["프리 딜레이","원음이 울린 뒤 잔향이 시작되기까지의 시간. 20~40ms면 명료도가 유지된다.","Pre-Delay"],["프리로드 버퍼","각 샘플의 앞부분을 미리 메모리에 올려두는 양. 디스크가 느리면 키운다.","Preload Buffer"],["프리셋","플러그인 하나의 설정값.","Preset"],["프리앰프","마이크의 작은 신호를 쓸 수 있는 크기로 키우는 증폭기. 인터페이스에 내장되어 있다.","Preamp"],["프리즈","트랙을 임시로 오디오화해 자원을 아끼는 기능. 언제든 해제할 수 있다.","Freeze"],["플러그인","DAW 안에 끼워 쓰는 작은 프로그램. 소리를 만드는 악기용과 소리를 바꾸는 이펙트용이 있다.","Plug-in"],["플러그인 검증","로직이 새 플러그인을 검사해 쓸 수 있는지 판단하는 과정. 실패하면 목록에 안 뜬다.","Plug-in Validation"],["플러그인 지연 보상","플러그인마다 다른 처리 지연을 로직이 계산해 트랙 간 어긋남을 맞추는 기능.","Plug-in Latency Compensation"],["플럭","짧게 튕기는 신스 소리. 어택이 즉각적이고 꼬리가 짧다.","Pluck"],["플레이트 리버브","금속판의 떨림으로 만든 매끈하고 밝은 잔향. 보컬과 스네어에 쓴다.","Plate"],["플렉스 타임","오디오의 타이밍을 늘이고 줄이는 기능. 모노포닉, 폴리포닉, 슬라이싱 모드.","Flex Time"],["플렉스 피치","오디오의 음정을 고치는 기능.","Flex Pitch"],["피드백","딜레이의 반복이 몇 번 이어지는지 정하는 값. 높을수록 꼬리가 길다.","Feedback"],["피치 벤드","음정을 위아래로 부드럽게 구부리는 휠. 건반 왼쪽에 있다.","Pitch Bend"],["하울링","스피커 소리가 마이크로 되돌아 들어가며 커지는 삑 소리. 녹음은 헤드폰으로 모니터링한다.","Feedback"],["하이패스 필터","지정 주파수 아래를 깎는 필터. 거의 모든 트랙에 건다.","High-Pass Filter"],["학습","할당을 만드는 방법. 학습을 켜고 기기의 조작부 하나를 움직이면 연결된다.","Learn"],["해머 터치","피아노처럼 무게가 실린 건반 감촉. 가벼운 쪽은 신스 터치라고 부른다.","Hammer Action"],["헤드룸","지금 소리와 최대치 사이에 남은 여유.","Headroom"],["헤르츠","소리의 높낮이를 재는 단위. 1초에 공기가 몇 번 떨리는지를 센 숫자다. 많이 떨리면 높은 소리.","Hz"],["홀 리버브","콘서트홀을 흉내 낸 길고 넓은 잔향.","Hall"],["ADSR","어택, 디케이, 서스테인, 릴리스. 소리의 음량 곡선을 정하는 네 값.","Attack Decay Sustain Release"],["Apple Loops","로직에 내장된 연주 소재 모음. 프로젝트의 템포와 조를 자동으로 따라온다.","Apple Loops"],["AU","오디오 유닛. 맥용 로직이 읽는 유일한 플러그인 형식. VST는 쓸 수 없다.","Audio Units"],["Aux 채널","센드로 들어온 신호를 처리하는 보조 채널.","Aux Channel"],["BPM","1분당 박의 수. 숫자가 크면 빠르다.","Beats Per Minute"],["CC1 모듈레이션","음색의 세기와 밝기를 시간에 따라 바꾸는 미디 컨트롤 체인지.","CC1 Modulation"],["CC11 익스프레션","연주 표현용 음량을 시간에 따라 바꾸는 미디 컨트롤 체인지.","CC11 Expression"],["CC64 서스테인","피아노 페달. 127이 밟음, 0이 뗌.","CC64 Sustain"],["DAW","녹음, 편집, 믹싱을 한 곳에서 하는 프로그램. 로직도 여기 속한다.","Digital Audio Workstation"],["dBFS","디지털 최대치를 0으로 놓은 레벨 단위. 0을 넘으면 클립.","dB Full Scale"],["FM 합성","파형끼리 서로를 흔들어 금속성 배음을 만드는 방식. 벨과 반짝이는 소리가 특기.","FM Synthesis"],["I/O 버퍼","오디오 처리 단위. 녹음 때 작게, 믹스 때 크게 둔다.","I/O Buffer"],["INST 입력","기타와 베이스를 직접 꽂기 위한 고임피던스 입력. 이걸 안 누르면 고음이 죽는다.","Instrument (Hi-Z)"],["ISRC","녹음물마다 붙는 국제 표준 코드. 정산 추적에 쓰인다.","ISRC"],["LFO","저주파 발진기. 소리를 주기적으로 흔들어 비브라토나 트레몰로를 만든다.","Low Frequency Oscillator"],["LUFS","사람이 느끼는 음량을 측정한 단위. 스트리밍 기준은 -14LUFS 부근.","Loudness Units Full Scale"],["MIDI 체이스","재생 시작점 이전에 눌린 음을 로직이 찾아 소리 내주는 기능. 긴 음 작업에 필수.","Chase Events"],["MP3","압축한 오디오 파일 형식. 용량이 작지만 정보가 줄어 있다.","MP3"],["NKI","컨탁 인스트루먼트 파일. 여러 개를 묶은 것은 NKM이다.","Kontakt Instrument"],["Q-강도","퀀타이즈를 얼마나 적용할지의 비율. 80퍼센트 근처가 자연스럽다.","Q-Strength"],["Quick Sampler","오디오 하나를 즉시 연주 가능한 악기로 만드는 로직 도구.","Quick Sampler"],["TRS","검은 줄 두 개짜리 밸런스드 케이블. 인터페이스와 모니터 연결의 표준.","TRS"],["TS","줄 하나짜리 언밸런스드 케이블. 기타에서 인터페이스까지 짧은 구간에 쓴다.","TS"],["WAV","압축하지 않은 오디오 파일 형식. 작업과 발매용 마스터에 쓴다.","WAV"],["XLR","세 핀짜리 마이크 표준 케이블. 잡음에 강하고 팬텀 파워를 전달한다.","XLR"],["XY","두 마이크의 머리를 한 점에 모아 90도로 벌리는 스테레오 방식. 위상에 안전하다.","X/Y"]];
const NUM=[{"g":"주파수","v":"20~60Hz","w":"초저역","f":"귀로 듣는다기보다 가슴과 배로 느껴지는 대역. 킥의 묵직한 무게와 808 베이스의 울림이 여기 있다. 작은 스피커에서는 아예 안 들린다.","m":"많으면 큰 시스템에서만 부풀고 헤드룸을 잡아먹는다. 없으면 곡이 가볍고 얄팍하다.","d":[43,56]},{"g":"주파수","v":"25~30Hz","w":"킥·베이스 하이패스","f":"들리지도 않는 초저역만 걷어낸다. 소리는 그대로인데 미터의 여유가 생긴다.","m":"40Hz 위로 올리면 킥의 무게가 눈에 띄게 빠진다.","d":[56]},{"g":"주파수","v":"60Hz","w":"킥의 몸통","f":"킥의 무게 중심. 여기가 살아 있으면 곡이 바닥에 붙어 있다는 느낌이 든다.","m":"과하면 웅웅거리고 다른 저역이 다 묻힌다.","d":[43,56]},{"g":"주파수","v":"80~100Hz","w":"보컬 하이패스","f":"목소리에 필요 없는 저역 웅웅거림과 마이크 진동을 걷어낸다. 보컬이 갑자기 앞으로 나오고 믹스가 맑아진다.","m":"150Hz 위로 올리면 목소리가 얇아지고 가슴 울림이 사라져 전화 통화처럼 들린다.","d":[56]},{"g":"주파수","v":"90Hz","w":"베이스의 심","f":"베이스가 '들리는' 자리. 작은 스피커에서 베이스 음정이 파악되는 지점.","m":"부족하면 휴대폰에서 베이스가 통째로 사라진다.","d":[43]},{"g":"주파수","v":"90~120Hz","w":"기타 하이패스","f":"기타의 통 울림을 정리한다. 걸고 나면 베이스 자리가 비어 저역이 또렷해진다.","m":"200Hz까지 올리면 기타가 얄팍하고 장난감 같아진다.","d":[56]},{"g":"주파수","v":"120Hz","w":"저역 모노 기준선","f":"이 아래를 가운데로 모으면 저역이 단단해지고 어느 재생 환경에서든 같게 들린다.","m":"기준을 너무 높이면(300Hz 이상) 믹스가 좁고 답답해진다.","d":[63]},{"g":"주파수","v":"120Hz","w":"스네어 하이패스","f":"스네어에 새어 들어온 킥 소리를 걷어낸다. 스네어의 탁 치는 성격만 남는다.","m":"200Hz를 넘기면 스네어의 몸통이 사라져 종잇장 소리가 된다.","d":[56]},{"g":"주파수","v":"200~400Hz","w":"뭉침·박스 소리","f":"여러 악기가 겹쳐 답답해지는 대표 구간. 여기서 2~4dB를 덜어내면 믹스에 갑자기 공간이 생긴다.","m":"너무 깎으면 소리가 속이 빈 듯 가늘어지고 따뜻함이 사라진다.","d":[43,56]},{"g":"주파수","v":"200Hz","w":"리버브 하이패스","f":"잔향의 저역을 잘라낸다. 공간감은 그대로인데 믹스가 흐려지지 않는다.","m":"안 걸면 리버브가 저역을 흐려 곡이 안개 낀 듯 들린다.","d":[59]},{"g":"주파수","v":"400~800Hz","w":"중저역","f":"악기의 몸통과 두께. 기타 코드와 왼손 피아노가 사는 자리.","m":"많으면 눅눅하고 둔하다. 없으면 소리가 얇고 힘이 없다.","d":[43]},{"g":"주파수","v":"800~2kHz","w":"명료도","f":"말이 알아들리는 대역. 여기를 살짝 올리면 보컬이 앞으로 나온다.","m":"과하면 코맹맹이 소리가 나고 귀가 피곤해진다.","d":[43,56]},{"g":"주파수","v":"2~4kHz","w":"날카로움·존재감","f":"귀가 가장 민감한 구간. 조금만 올려도 확 앞으로 나오지만 오래 들으면 귀가 아프다.","m":"3dB 이상 올리면 대부분 거슬린다. 깎으면 뒤로 물러나 부드러워진다.","d":[56]},{"g":"주파수","v":"5~7kHz","w":"남성 보컬 치찰음","f":"시옷과 치읓이 튀는 자리. 디에서의 탐지 주파수를 여기 맞춘다.","m":"낮게 잡으면 발음 전체가 눌려 웅얼거린다.","d":[62]},{"g":"주파수","v":"6~8kHz","w":"여성 보컬 치찰음","f":"같은 치찰음이지만 조금 위에 있다. 모니터 기능으로 들어보면 정확한 지점을 찾을 수 있다.","m":"너무 위로 잡으면 치찰음은 그대로고 공기감만 사라진다.","d":[62]},{"g":"주파수","v":"8kHz","w":"리버브 로우패스","f":"잔향의 고역을 눌러 치찰음이 공간에 번지는 것을 막는다. 잔향이 뒤로 물러나 자연스러워진다.","m":"5kHz 아래로 내리면 리버브가 담요 덮은 듯 답답해진다.","d":[59]},{"g":"주파수","v":"10kHz","w":"광택·공기감","f":"넓게 1.5~3dB 올리면 소리가 열리고 고급스러워진다. 무엇이 달라졌는지 콕 집기 어려운 종류의 변화다.","m":"6dB 넘게 올리면 얇고 쨍하며 잡음까지 같이 커진다.","d":[56,64]},{"g":"주파수","v":"300~500Hz","w":"하이햇 하이패스","f":"하이햇에 새어든 다른 소리를 걷어낸다. 하이햇이 위쪽에만 존재하게 되어 자리가 명확해진다.","m":"1kHz까지 올리면 하이햇이 얇은 지직 소리만 남는다.","d":[56]},{"g":"시간","v":"0.1~5ms","w":"사이드체인 어택","f":"킥이 시작하는 그 순간 바로 비켜선다. 킥이 깨끗하게 뚫고 나온다.","m":"20ms 넘게 두면 이미 부딪친 뒤에 눌려서 덕킹 효과가 거의 없다.","d":[61]},{"g":"시간","v":"1~5ms","w":"짧은 컴프 어택","f":"소리의 첫 타격까지 눌린다. 둥글고 부드러워지지만 펀치가 사라진다. 베이스를 얌전하게 만들 때 유용하다.","m":"드럼에 쓰면 힘이 빠져 밋밋해진다.","d":[57]},{"g":"시간","v":"10ms","w":"보컬 컴프 어택","f":"자음의 첫 순간은 통과시키고 뒤를 잡는다. 발음이 살아 있으면서 음량이 고르다.","m":"1ms로 줄이면 발음이 뭉개지고, 50ms로 늘리면 큰 부분이 여전히 튄다.","d":[57]},{"g":"시간","v":"20~30ms","w":"드럼 컴프 어택","f":"타격의 앞부분을 통과시키고 그 뒤 울림만 누른다. 펀치가 오히려 강조되어 앞으로 튀어나온다.","m":"짧게 하면 타격이 눌려 물먹은 소리가 된다.","d":[57]},{"g":"시간","v":"3~10ms","w":"편집 페이드","f":"자른 지점의 딸깍 소리를 없앤다. 귀에는 들리지 않을 만큼 짧다.","m":"없으면 딸깍 소리가 나고, 50ms를 넘기면 발음의 첫 순간이 잘려나간다.","d":[53]},{"g":"시간","v":"20~40ms","w":"리버브 프리 딜레이","f":"원음이 먼저 도착하고 잔향이 뒤따른다. 공간은 넓은데 소리는 또렷한 상태가 만들어진다.","m":"0이면 잔향이 원음에 달라붙어 흐려진다. 100ms를 넘으면 별도의 메아리로 들린다.","d":[59]},{"g":"시간","v":"20~60ms","w":"레가토 트랙 지연","f":"음수로 주면 트랙 전체가 앞당겨져 늦게 나오던 스트링이 박에 맞는다.","m":"과하게 당기면 이번엔 먼저 들려서 서두르는 느낌이 난다.","d":[24]},{"g":"시간","v":"8~20ms","w":"기타 스트럼 시차","f":"피크가 줄을 차례로 훑는 느낌이 난다. 미디가 갑자기 사람이 친 것처럼 들린다.","m":"40ms를 넘기면 아르페지오처럼 들려 스트럼이 아니게 된다.","d":[35]},{"g":"시간","v":"50~100ms","w":"짧은 사이드체인 릴리스","f":"툭 비켰다 바로 돌아온다. 빠른 곡에서 촘촘하고 단단한 그루브를 만든다.","m":"너무 짧으면 지직거리는 왜곡이 생긴다.","d":[61]},{"g":"시간","v":"150~300ms","w":"긴 사이드체인 릴리스","f":"곡 전체가 크게 숨쉬는 하우스 특유의 파도가 만들어진다.","m":"다음 킥까지 회복되지 않으면 소리가 계속 눌린 채로 답답해진다.","d":[61]},{"g":"시간","v":"80~150ms","w":"드럼 컴프 릴리스","f":"다음 타격 전에 풀려서 그루브가 살아난다. 발이 까딱거리면 맞은 것이다.","m":"길면 곡이 눌린 채 늘어지고, 짧으면 출렁이는 펌핑이 들린다.","d":[57]},{"g":"시간","v":"0.8~1.5초","w":"짧은 리버브 디케이","f":"방 안이나 작은 홀. 악기를 뒤로 밀지 않으면서 마르지 않게 해준다. 드럼과 보컬 기본값.","m":"짧으면 효과가 거의 없고, 길면 리듬이 뭉개진다.","d":[59]},{"g":"시간","v":"2.5~4초","w":"긴 리버브 디케이","f":"큰 홀. 발라드 코러스나 영화 음악의 넓은 공간. 곡이 커지고 멀어진다.","m":"빠른 곡에 쓰면 잔향이 겹쳐 진흙탕이 된다.","d":[59]},{"g":"시간","v":"400~1200ms","w":"패드 어택","f":"소리가 천천히 밀려 들어온다. 시작점이 흐려져 배경처럼 깔린다.","m":"짧으면 패드가 아니라 오르간처럼 앞으로 튀어나온다.","d":[33]},{"g":"시간","v":"800~2000ms","w":"패드 릴리스","f":"건반을 떼도 소리가 남아 코드가 서로 겹치며 이어진다.","m":"길면 코드가 바뀌어도 이전 화음이 남아 탁해진다.","d":[33]},{"g":"시간","v":"0~5ms","w":"플럭 어택","f":"뜯거나 때린 것처럼 즉시 튀어나온다. 리듬 악기의 성격이 된다.","m":"이 값에서는 길게 둘 이유가 거의 없다.","d":[33]},{"g":"시간","v":"10~50ms","w":"게이트 홀드","f":"문이 열린 뒤 최소한 이만큼은 열어둔다. 소리가 파르르 떨리는 현상이 사라진다.","m":"없으면 문이 덜덜 떨리고, 길면 잡음까지 통과한다.","d":[62]},{"g":"레벨","v":"-18~-10dBFS","w":"개별 트랙 피크","f":"플러그인이 설계된 범위에서 동작한다. 뒤에 무엇을 붙여도 여유가 있다.","m":"높으면 합쳤을 때 마스터가 넘치고, 너무 낮으면 잡음이 상대적으로 커진다.","d":[55]},{"g":"레벨","v":"-12~-6dBFS","w":"녹음 피크","f":"클립 걱정 없이 충분한 신호를 담는 지점. 24비트에서는 이 정도로도 잡음 문제가 전혀 없다.","m":"0에 닿으면 되돌릴 수 없는 왜곡이 남는다.","d":[48]},{"g":"레벨","v":"-6dBFS","w":"믹스 마스터 피크","f":"마스터링에서 손댈 공간이 남아 있는 상태. 컴프와 리미터가 제 역할을 할 수 있다.","m":"여유가 없으면 마스터링 단계에서 할 수 있는 일이 사라진다.","d":[55,64]},{"g":"레벨","v":"-14LUFS","w":"스트리밍 목표 라우드니스","f":"대부분의 서비스가 이 근처로 맞춘다. 다이내믹을 지키면서 남의 곡과 비슷한 크기로 들린다.","m":"-8까지 밀면 서비스가 깎아버려서 다이내믹만 잃고 크기는 그대로다.","d":[66]},{"g":"레벨","v":"-16LUFS","w":"애플 계열 기준","f":"조금 더 여유 있는 기준. 어쿠스틱이나 클래식 계열에 잘 맞는다.","m":"장르에 비해 너무 조용하면 상대적으로 힘없게 들릴 수 있다.","d":[66]},{"g":"레벨","v":"-1dBTP","w":"트루 피크 실링","f":"압축 변환 과정에서 넘치지 않을 여유. 스트리밍에서 왜곡이 생기지 않는다.","m":"0dBTP로 두면 변환 후 왜곡이 생길 수 있다.","d":[66]},{"g":"레벨","v":"5~9LU","w":"라우드니스 레인지","f":"대중음악에서 자연스러운 다이내믹 폭. 조용한 부분과 큰 부분의 차이가 들린다.","m":"4LU 아래면 처음부터 끝까지 같은 크기라 답답하고 지친다.","d":[66]},{"g":"레벨","v":"-8~-12dB","w":"레퍼런스 페이더","f":"완성된 남의 곡을 내 믹스와 비슷한 크기로 낮춘 값. 이래야 비교가 성립한다.","m":"안 낮추면 레퍼런스가 무조건 좋게 들려 판단이 왜곡된다.","d":[54]},{"g":"레벨","v":"1.5dB","w":"코러스 오토메이션","f":"벌스보다 이만큼만 올려도 코러스가 확 열리는 느낌이 난다. 아주 작은 값이 큰 인상을 만든다.","m":"3dB 이상 올리면 음량 차이로 들려서 부자연스럽다.","d":[60]},{"g":"다이내믹","v":"2:1","w":"글루 컴프 레이시오","f":"거의 안 누르는 수준. 트랙들이 하나의 덩어리로 묶인 느낌만 생긴다.","m":"4:1 이상이면 마스터에서 소리가 납작해진다.","d":[64]},{"g":"다이내믹","v":"3:1","w":"보컬 컴프 레이시오","f":"자연스럽게 음량을 고르게 만든다. 컴프를 걸었다는 티가 안 난다.","m":"8:1을 넘기면 목소리가 눌린 채 앞으로만 붙어 있게 된다.","d":[57]},{"g":"다이내믹","v":"4:1","w":"드럼·베이스 레이시오","f":"단단하게 잡아준다. 타격이 고르게 정리되고 힘이 생긴다.","m":"10:1을 넘으면 사실상 리미터가 되어 다이내믹이 사라진다.","d":[57]},{"g":"다이내믹","v":"3~6dB","w":"일반 게인 리덕션","f":"소리가 앞으로 나오면서도 자연스럽다. 대부분의 상황에서 목표로 삼는 값.","m":"10dB 이상 계속 눌리면 악기가 숨을 못 쉬고 뒤에서 헐떡인다.","d":[57]},{"g":"다이내믹","v":"1~2dB","w":"마스터 글루 리덕션","f":"거의 안 들리는 변화지만 곡이 하나로 뭉쳐 들린다.","m":"5dB 이상 누르면 곡 전체가 출렁이고 답답해진다.","d":[64]},{"g":"다이내믹","v":"2~4dB","w":"사이드체인 자리 만들기","f":"무엇이 달라졌는지는 모르겠는데 킥이 또렷하게 들린다. 가장 좋은 상태.","m":"6dB를 넘기면 효과로 들리기 시작한다.","d":[61]},{"g":"다이내믹","v":"3~6dB","w":"디에서 리덕션","f":"치찰음이 튀는 순간에만 눌린다. 다른 발음은 그대로 살아 있다.","m":"10dB 넘게 누르면 발음이 웅얼거리고 답답해진다.","d":[62]},{"g":"다이내믹","v":"2~3dB","w":"리미터 순간 리덕션","f":"가장 큰 지점만 살짝 잡는다. 다이내믹은 유지된 채 음량이 올라간다.","m":"계속 5dB 이상 걸리면 다이내믹이 눌리고 소리가 지친다.","d":[66]},{"g":"연주","v":"40~55","w":"여린 벨로시티","f":"부드럽고 어둡다. 샘플 악기에서는 아예 다른 녹음이 재생되어 음색이 순해진다.","m":"20 아래면 소리가 거의 안 들리거나 이상한 샘플이 나온다.","d":[20]},{"g":"연주","v":"64~80","w":"보통 벨로시티","f":"기준이 되는 세기. 여기를 중심으로 위아래로 흔들어 표정을 만든다.","m":"전부 같은 값이면 기계가 친 것처럼 들린다.","d":[20]},{"g":"연주","v":"95~110","w":"강조 벨로시티","f":"밝고 앞으로 나온다. 프레이즈의 정점이나 박의 첫 음에 쓴다.","m":"남발하면 강조가 강조로 안 들린다.","d":[20]},{"g":"연주","v":"20 이상","w":"프레이즈 내 벨로시티 편차","f":"한 프레이즈 안에서 이만큼 차이가 나면 사람이 연주한 느낌이 든다. 가장 비용 대비 효과가 큰 작업.","m":"편차가 5 이하면 미디 티가 확실히 난다.","d":[20]},{"g":"연주","v":"25~45","w":"고스트 노트 벨로시티","f":"스네어의 아주 약한 타격. 들릴 듯 말 듯하지만 있으면 그루브가 살아난다.","m":"60을 넘으면 정식 타격으로 들려 리듬이 복잡해진다.","d":[30]},{"g":"연주","v":"100%","w":"퀀타이즈 강도","f":"격자에 완전히 붙는다. 정확하지만 생기가 사라지고 기계처럼 들린다.","m":"전자음악의 정확한 패턴에는 오히려 이쪽이 맞다.","d":[21]},{"g":"연주","v":"70~85%","w":"실전 퀀타이즈 강도","f":"박은 맞는데 사람 냄새가 남는다. 대부분
