의 연주에서 이 범위가 정답이다.","m":"50% 아래면 정리가 덜 되어 흔들리게 들린다.","d":[21]},{"g":"연주","v":"50","w":"스윙 없음","f":"8분음표가 정확히 반반. 록, 팝, 하우스의 기본.","m":"장르에 따라서는 밋밋하게 들린다.","d":[21]},{"g":"연주","v":"54~58","w":"약한 스윙","f":"미묘하게 뒤로 끌린다. 힙합과 알앤비 특유의 느긋한 그루브가 여기서 나온다.","m":"드럼과 다른 악기의 스윙 값이 다르면 서로 어긋나 들린다.","d":[21]},{"g":"연주","v":"58~67","w":"재즈 스윙","f":"확실히 튀는 셋잇단 느낌. 스윙이 곡의 성격을 지배한다.","m":"70을 넘으면 부자연스럽게 절뚝인다.","d":[21]},{"g":"템포","v":"62~76","w":"발라드","f":"한 박이 길어 여백이 생긴다. 가사와 목소리가 주인공이 되는 속도.","m":"85를 넘으면 발라드보다 미디엄 팝에 가까워진다.","d":[16,45]},{"g":"템포","v":"70~92","w":"알앤비","f":"느리지만 16분음표가 촘촘해 몸이 흔들린다. 반박자 개념이 살아 있는 구간.","m":"너무 느리면 늘어지고 빨라지면 그루브가 사라진다.","d":[16,45]},{"g":"템포","v":"100~120","w":"팝","f":"걷는 속도. 가장 많은 사람이 편하게 느끼는 구간.","m":"이 안에서는 5 정도 차이만 나도 곡의 인상이 달라진다.","d":[16,45]},{"g":"템포","v":"122~128","w":"하우스","f":"심장 박동보다 조금 빠르다. 계속 앞으로 미는 느낌이 생긴다.","m":"130을 넘으면 테크노 쪽 성격으로 넘어간다.","d":[16,45]},{"g":"템포","v":"172~176","w":"드럼앤베이스","f":"실제로는 절반 속도로 느껴진다. 빠른 하이햇 위에 느긋한 베이스가 얹힌다.","m":"체감 템포와 실제 값이 다르다는 것을 염두에 둔다.","d":[16]},{"g":"음역","v":"E1~G3","w":"베이스 기타","f":"E1이 가장 낮은 줄. 이 범위 안에서 써야 실제 악기 소리가 난다.","m":"아래로 내려가면 음정이 안 들리고 웅웅거리기만 한다.","d":[31]},{"g":"음역","v":"C2~A4","w":"첼로","f":"사람 목소리와 겹치는 음역. 선율을 두면 노래처럼 자연스럽게 들린다.","m":"위로 올라가면 현의 장력이 드러나 긴장감이 커진다. 아래로 벗어나면 연주가 불가능하다.","d":[34]},{"g":"음역","v":"C3~E5","w":"비올라","f":"바이올린보다 어둡고 두툼하다. 화성의 속을 채우는 자리.","m":"바이올린과 같은 음역에 두면 존재가 사라진다.","d":[34]},{"g":"음역","v":"G3~E6","w":"바이올린","f":"가장 밝고 멀리 나간다. 선율을 맡기면 자연스럽게 앞에 선다.","m":"낮은 쪽에 두면 힘이 없고 비올라와 겹친다.","d":[34]},{"g":"음역","v":"C3 아래","w":"저역 겹침 한계","f":"이 아래에서 두 음 이상을 좁게 쌓으면 탁해진다. 옥타브나 5도로 벌린다.","m":"3도를 쌓으면 진흙탕이 된다.","d":[32,34]},{"g":"음역","v":"6음","w":"기타 최대 동시음","f":"줄이 여섯 개다. 이 안에서 쓰면 실제로 칠 수 있는 코드가 된다.","m":"7음 이상 쌓으면 즉시 가짜 티가 난다.","d":[35]},{"g":"컴퓨터","v":"64~128 샘플","w":"녹음 버퍼","f":"지연이 3ms 안팎이라 연주할 때 어긋남을 못 느낀다.","m":"트랙이 많으면 이 값에서 소리가 끊기기 시작한다.","d":[48,69]},{"g":"컴퓨터","v":"512~1024 샘플","w":"믹스 버퍼","f":"플러그인을 많이 걸어도 안정적이다. 지연은 커지지만 연주하지 않으니 상관없다.","m":"이 상태로 녹음하면 20ms 넘게 늦어 연주가 불가능하다.","d":[48,69]},{"g":"컴퓨터","v":"10ms","w":"체감 지연 한계","f":"이 아래면 대부분 못 느낀다. 넘어가면 손과 소리가 어긋난다고 느끼기 시작한다.","m":"20ms를 넘으면 확실히 연주가 불가능해진다.","d":[69]},{"g":"컴퓨터","v":"48kHz / 24비트","w":"프로젝트 기본 포맷","f":"충분한 품질과 현실적인 용량의 균형점. 영상 작업과도 잘 맞는다.","m":"프로젝트 시작 후 바꾸면 기존 파일이 어긋난다.","d":[48]},{"g":"컴퓨터","v":"10% 이내","w":"오디오 템포 변경 폭","f":"티가 나지 않게 늘리거나 줄일 수 있는 범위.","m":"20%를 넘으면 늘어지거나 떨리는 인공적인 소리가 들린다.","d":[71]},{"g":"컴퓨터","v":"3000×3000px","w":"커버 이미지","f":"모든 서비스의 요구를 만족하는 크기. 나중에 다시 만들 일이 없다.","m":"작게 만들면 반려되거나 확대되어 흐려진다.","d":[68]},{"g":"컴퓨터","v":"⇧R","w":"캡처 녹음","f":"녹음 버튼을 안 눌렀어도 방금 친 연주를 그대로 가져온다. 즉흥에서 나온 좋은 순간을 잃지 않는다.","m":"로직을 재실행하면 기억이 비워지므로 마음에 들었으면 바로 캡처한다.","d":[19]},{"g":"컴퓨터","v":"49~61건반","w":"마스터 키보드 크기","f":"49건반이면 코드와 멜로디를 함께 다룰 수 있고 61건반부터 두 손이 편하다. 책상과 이동을 생각하면 이 구간이 균형점이다.","m":"25건반은 두 손 연주가 어렵고, 88은 자리를 크게 차지한다. 용도가 분명할 때 고른다.","d":[18]},{"g":"녹음","v":"48V","w":"팬텀 파워","f":"콘덴서 마이크를 깨우는 전원. 켜는 순간 마이크가 숨소리까지 잡기 시작한다.","m":"켜고 끌 때 페이더를 안 내리면 퍽 소리가 스피커를 상하게 할 수 있다. 리본 마이크에는 켜기 전에 설명서 확인.","d":[47]},{"g":"녹음","v":"15~20cm","w":"보컬 마이크 거리","f":"주먹 두 개. 목소리가 또렷하고 방 울림이 적게 섞이는 균형점이다.","m":"5cm까지 붙으면 저음이 붇고 숨소리가 커진다. 40cm를 넘으면 방 울림이 목소리만큼 들어온다.","d":[49]},{"g":"녹음","v":"10~20도","w":"오프 액시스 각도","f":"입 정면에서 살짝 비켜 세우면 파열음의 바람은 비켜 가고 목소리는 그대로 담긴다.","m":"정면 직격이면 팝 필터가 있어도 퍽퍽대는 소리가 남는다.","d":[49]},{"g":"녹음","v":"12프렛","w":"어쿠스틱 기타 기준점","f":"맑음과 두께의 균형이 잡히는 출발점. 넥 쪽은 맑아지고 브리지 쪽은 두꺼워진다.","m":"사운드홀 정면을 겨누면 저음이 과해 붕붕댄다.","d":[50]},{"g":"녹음","v":"3:1","w":"마이크 두 대의 거리 법칙","f":"두 번째 마이크를 첫 마이크 거리의 세 배 밖에 두면 위상 간섭이 귀에 안 들릴 만큼 작아진다.","m":"어기면 두 트랙을 합쳤을 때 빗질하듯 대역이 깎이는 소리가 난다.","d":[50]},{"g":"녹음","v":"90도","w":"XY 스테레오 각도","f":"머리를 한 점에 모아 90도로 벌리면 좌우가 나뉘면서도 모노로 합쳐 안전하다.","m":"머리가 떨어지면 시간 차가 생겨 모노에서 위상 문제가 나타난다.","d":[50]},{"g":"녹음","v":"20~30cm","w":"모니터와 뒷벽 거리","f":"뒷벽 반사가 저역을 부풀리지 않는 최소 거리. 이만큼 떼면 스피커가 내는 저음을 비교적 그대로 듣는다.","m":"벽에 붙이면 저음이 실제보다 많게 들려서, 그 상태로 맞춘 믹스는 다른 곳에서 저음이 빈다.","d":[46]},{"g":"다이내믹","v":"3~6dB","w":"드럼 버스 게인 리덕션","f":"킷 전체가 한 사람이 친 것처럼 묶여 들린다. 개별 타격은 그대로고 덩어리감만 생긴다.","m":"10dB를 넘으면 드럼이 숨을 못 쉬고 곡 전체가 출렁인다.","d":[58]},{"g":"다이내믹","v":"8dB","w":"누적 게인 리덕션 상한","f":"트랙과 버스와 마스터에서 누른 양의 합. 이 안이면 다이내믹이 살아 있다.","m":"넘으면 각 단계에서는 적당해 보여도 최종 결과가 납작해진다.","d":[58]},{"g":"다이내믹","v":"1~3dB","w":"배경 악기 버스 리덕션","f":"건반과 현악처럼 자리를 지키는 층은 아주 약하게만 묶는다.","m":"세게 누르면 앞으로 나오는 대신 존재가 흐려진다.","d":[58]},{"g":"시간","v":"30ms","w":"딜레이의 첫 경계","f":"이 아래의 반복은 원음과 한 덩어리로 들려 소리가 두꺼워진다. 별도의 반복으로는 안 들린다.","m":"넘어서면 두께가 아니라 넓이와 공간으로 성격이 바뀐다.","d":[59]},{"g":"시간","v":"100ms","w":"에코가 되는 경계","f":"이 위부터 반복이 원음과 분리되어 또렷한 메아리로 들린다.","m":"아래는 두께와 그루브, 위는 공간과 극적 효과로 쓰임이 갈린다.","d":[59]},{"g":"시간","v":"25~35%","w":"짧은 딜레이 피드백","f":"두세 번 반복하고 자연스럽게 사라진다. 그루브를 만들되 곡을 흐리지 않는다.","m":"70퍼센트를 넘기면 소리가 스스로 쌓여 무한히 늘어난다.","d":[59]},{"g":"레벨","v":"-9~-6LUFS","w":"클럽·EDM 관행","f":"자동 음량 조절이 없는 환경에서 큰 에너지를 유지한다.","m":"스트리밍에 올리면 기준까지 깎여 다이내믹만 잃는다.","d":[66]},{"g":"레벨","v":"-23~-18LUFS","w":"클래식·오케스트라 관행","f":"여린 부분과 큰 부분의 차이가 그대로 살아 있다.","m":"대중음악과 나란히 재생하면 상대적으로 작게 들린다.","d":[66]},{"g":"다이내믹","v":"20~30%","w":"병렬 컴프 혼합량","f":"원음의 표정은 그대로고 여린 부분만 끌어올려져 밀도가 생긴다.","m":"50퍼센트를 넘기면 눌린 소리가 주가 되어 다이내믹이 사라진다.","d":[53]},{"g":"주파수","v":"±10~30도","w":"좁은 패닝","f":"중심을 도우면서 폭을 조금 넓힌다. 백보컬, 톰, 오버헤드의 자리.","m":"더 벌리면 중심의 지지가 약해진다.","d":[60]},{"g":"주파수","v":"±30~70도","w":"넓은 패닝","f":"배경을 채우는 층의 자리. 기타, 건반, 패드가 좌우를 메운다.","m":"이 범위 안이면 모노에서도 대체로 버틴다.","d":[60]},{"g":"주파수","v":"±70~100도","w":"극단 패닝","f":"사라져도 곡이 유지되는 요소만 여기 둔다. 효과음과 라이저.","m":"중요한 소리를 두면 모노나 한쪽 스피커 환경에서 곡이 무너진다.","d":[60]},{"g":"레벨","v":"±2~3dB","w":"EQ 최종 조정 폭","f":"이 안에서 남기면 원래 소리의 성격을 지키면서 자리만 정리된다.","m":"찾을 때는 크게 올려도 되지만 이 폭을 넘겨 남기면 악기가 다른 소리로 바뀐다.","d":[63,56]},{"g":"주파수","v":"400~800Hz","w":"상자 속 소리","f":"이 대역이 과하면 소리가 작은 상자 안에 갇힌 듯 갑갑해진다.","m":"깎으면 뚫리지만 과하면 악기의 몸통까지 사라진다. 스네어에서는 이 자리가 몸통이다.","d":[56]},{"g":"주파수","v":"1~2kHz","w":"코맹맹이 소리","f":"코를 막고 말하는 듯한 느낌. 여기가 튀면 소리가 앞으로 나오면서도 거슬린다.","m":"보컬에서는 명료도를 담당하는 자리이기도 해서 무작정 깎으면 말이 흐려진다.","d":[56]},{"g":"주파수","v":"10kHz 이상","w":"히스 잡음","f":"녹음에 섞인 지직거리는 잡음이 사는 자리. 로우패스로 정리한다.","m":"과하게 깎으면 공기감이 함께 사라져 소리가 답답해진다.","d":[56]}];
</script>

<script>
"use strict";
/* ─── 저장소: localStorage 우선, 실패 시 메모리 ─── */
var MEM={},HAS_LS=(function(){try{var k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);return true;}catch(e){return false;}})();
var SK="logicTrainer.v1";
function load(){try{if(HAS_LS){var r=localStorage.getItem(SK);return r?JSON.parse(r):null;}return MEM[SK]||null;}catch(e){return null;}}
function save(){try{if(HAS_LS)localStorage.setItem(SK,JSON.stringify(S));else MEM[SK]=JSON.parse(JSON.stringify(S));}catch(e){}}
var S=load()||{cur:1,chk:{},quiz:{},dates:{}};
if(!S.chk)S.chk={};if(!S.quiz)S.quiz={};if(!S.dates)S.dates={};if(!S.cur)S.cur=1;

function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function stamp(){S.dates[today()]=1;save();}
function streak(){
  var n=0,d=new Date();
  function key(x){return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
  if(!S.dates[key(d)]){d.setDate(d.getDate()-1);if(!S.dates[key(d)])return 0;}
  while(S.dates[key(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function dayDone(n){var day=DAYS[n-1];if(!day)return false;var c=S.chk[n]||[];
  for(var i=0;i<day.chk.length;i++)if(!c[i])return false;return true;}
function totalDone(){var n=0;for(var i=1;i<=DAYS.length;i++)if(dayDone(i))n++;return n;}
function firstOpen(){for(var i=1;i<=DAYS.length;i++)if(!dayDone(i))return i;return DAYS.length;}

/* ─── 용어 엔진 ─── */
var GMAP={},EMAP={};
for(var gi=0;gi<GLOSS.length;gi++){GMAP[GLOSS[gi][0]]=GLOSS[gi][1];if(GLOSS[gi][2])EMAP[GLOSS[gi][0]]=GLOSS[gi][2];}
function engTag(w){return EMAP[w]?'<span class="eng">'+EMAP[w]+'</span>':'';}
var TERMS=GLOSS.map(function(g){return g[0];}).filter(function(w){return w.length>=2;})
               .sort(function(a,b){return b.length-a.length;});
function dayText(d){
  var a=[d.t,d.goal].concat(d.con);
  for(var i=0;i<d.path.length;i++)a.push(d.path[i].n+" "+d.path[i].s.join(" "));
  return a.concat(d.drill).concat(d.chk).join(" ");
}
var NEWT=(function(){
  var seen={},out=[];
  for(var i=0;i<DAYS.length;i++){
    var t=dayText(DAYS[i]),list=[];
    for(var j=0;j<TERMS.length;j++){
      var w=TERMS[j],pos=t.indexOf(w);
      if(pos>=0&&!seen[w]){list.push([w,pos]);seen[w]=1;}
    }
    list.sort(function(a,b){return a[1]-b[1];});
    out.push(list.map(function(x){return x[0];}));
  }
  return out;
})();
/* 렌더된 카드 안에서 용어 첫 등장에 표시를 붙인다 */
function markTerms(root,used){
  var skip={K:1,V:1,T:1,BUTTON:1,INPUT:1};
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  var nodes=[],n;
  while((n=walker.nextNode()))if(!skip[n.parentNode.nodeName])nodes.push(n);
  for(var i=0;i<nodes.length;i++){
    var node=nodes[i];
    for(var j=0;j<TERMS.length;j++){
      var w=TERMS[j];if(used[w])continue;
      var txt=node.nodeValue,at=txt.indexOf(w);
      if(at<0)continue;
      used[w]=1;
      var after=node.splitText(at),rest=after.splitText(w.length);
      var el=document.createElement("t");el.dataset.w=w;el.textContent=w;
      after.parentNode.replaceChild(el,after);
      node=rest;
    }
  }
}
function openTerm(w){
  document.getElementById("sw").innerHTML=w+engTag(w);
  document.getElementById("sd").textContent=GMAP[w]||"";
  document.getElementById("sheet").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function closeTerm(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}
document.getElementById("scrim").addEventListener("click",closeTerm);
document.getElementById("sx").addEventListener("click",closeTerm);
document.addEventListener("click",function(e){
  var t=e.target.closest("t");if(t&&t.dataset.w)openTerm(t.dataset.w);
});

/* ─── 글자 크기 ─── */
function applyFs(){
  document.body.className=S.fs?("fs"+S.fs):"";
  document.getElementById("fsb").textContent=["가","가+","가++"][S.fs||0];
}
document.getElementById("fsb").addEventListener("click",function(){
  S.fs=((S.fs||0)+1)%3;save();applyFs();
});

/* ─── 새로고침 ─── */
document.getElementById("rfb").addEventListener("click",function(){
  var b=this;
  b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");
  save();
  var fresh=load();
  if(fresh){S=fresh;if(!S.chk)S.chk={};if(!S.quiz)S.quiz={};if(!S.dates)S.dates={};if(!S.cur)S.cur=1;}
  applyFs();today_();course();keys();gloss();num();prog();header();
  window.scrollTo({top:0,behavior:"smooth"});
});

/* ─── 헤더 ─── */
function header(){
  var done=totalDone(),pct=Math.round(done/DAYS.length*100),day=DAYS[S.cur-1];
  document.getElementById("lDay").textContent=String(S.cur).padStart(2,"0");
  document.getElementById("lPct").textContent=pct+"%";
  document.getElementById("lStk").textContent=streak();
  document.getElementById("lStg").textContent=day.s+"/"+STAGES.length;
  document.getElementById("bar").style.width=pct+"%";
}

/* ─── 오늘 ─── */
function today_(){
  var d=DAYS[S.cur-1],st=STAGES[d.s-1],h="";
  h+='<div class="h1">'+d.d+'일차 · 스테이지 '+st.n+' '+st.t+'</div>';
  h+='<div class="h2">'+d.t+'</div>';
  h+='<div class="goal"><b>오늘의 목표</b><br>'+d.goal+'</div>';

  var nt=NEWT[d.d-1];
  if(nt.length){
    h+='<div class="card"><div class="ct">오늘의 용어</div>';
    for(var i=0;i<nt.length;i++)
      h+='<div class="tmi"><div class="tmw">'+nt[i]+engTag(nt[i])+'</div><div class="tmd">'+GMAP[nt[i]]+'</div></div>';
    h+='</div>';
  }

  h+='<div class="card"><div class="ct">개념</div>';
  for(var i=0;i<d.con.length;i++)h+='<p>'+d.con[i]+'</p>';
  h+='</div>';

  h+='<div class="card"><div class="ct">로직 조작 순서</div>';
  for(var i=0;i<d.path.length;i++){
    h+='<div class="step"><div class="sn">'+d.path[i].n+'</div><ol>';
    for(var j=0;j<d.path[i].s.length;j++)h+='<li>'+d.path[i].s[j]+'</li>';
    h+='</ol></div>';
  }
  h+='</div>';

  h+='<div class="card"><div class="ct">실습</div><ul class="dot">';
  for(var i=0;i<d.drill.length;i++)h+='<li>'+d.drill[i]+'</li>';
  h+='</ul></div>';

  var nz=NUM.filter(function(x){return x.d.indexOf(d.d)>=0;});
  if(nz.length){
    h+='<div class="card"><div class="ct">기준 수치</div>';
    for(var i=0;i<nz.length;i++){
      h+='<div class="nitem"><span class="nv">'+nz[i].v+'</span><span class="nw">'+nz[i].w+'</span>';
      h+='<div class="nf">'+nz[i].f+'</div><div class="nm"><b>벗어나면</b> '+nz[i].m+'</div></div>';
    }
    h+='</div>';
  }

  h+='<div class="card"><div class="ct">오늘의 단축키</div><div class="krow">';
  for(var i=0;i<d.keys.length;i++)h+='<div class="kitem"><k>'+d.keys[i][0]+'</k>'+d.keys[i][1]+'</div>';
  h+='</div></div>';

  var c=S.chk[d.d]||[];
  h+='<div class="card"><div class="ct">체크</div>';
  for(var i=0;i<d.chk.length;i++)
    h+='<div class="chk'+(c[i]?' on':'')+'" data-c="'+i+'"><div class="box"></div><span>'+d.chk[i]+'</span></div>';
  h+='</div>';

  var qs=S.quiz[d.d]||{};
  h+='<div class="card"><div class="ct">확인 문제</div>';
  for(var i=0;i<d.quiz.length;i++){
    var q=d.quiz[i],picked=(qs[i]!==undefined)?qs[i]:-1;
    h+='<div class="q" data-q="'+i+'"><div class="qq">'+(i+1)+'. '+q.q+'</div>';
    for(var j=0;j<q.a.length;j++){
      var cls="opt";
      if(picked>=0){ if(j===q.c)cls+=" right"; else if(j===picked)cls+=" wrong"; }
      h+='<button class="'+cls+'" data-a="'+j+'">'+q.a[j]+'</button>';
    }
    h+='<div class="exp'+(picked>=0?' on':'')+'">'+q.e+'</div></div>';
  }
  h+='</div>';

  h+='<div class="nav">';
  h+='<button id="prev"'+(S.cur<=1?' disabled':'')+'>이전 일차</button>';
  h+='<button id="next" class="pri"'+(S.cur>=DAYS.length?' disabled':'')+'>다음 일차</button>';
  h+='</div>';

  var el=document.getElementById("p-today");
  el.innerHTML=h;
  var used={};
  el.querySelectorAll(".card").forEach(function(c){
    if(!c.querySelector(".tmi"))markTerms(c,used);
  });

  el.querySelectorAll(".chk").forEach(function(n){
    n.addEventListener("click",function(){
      var i=+n.dataset.c,a=S.chk[d.d]||[];
      a[i]=!a[i];S.chk[d.d]=a;stamp();save();
      n.classList.toggle("on",!!a[i]);header();course();prog();
    });
  });
  el.querySelectorAll(".q").forEach(function(n){
    n.addEventListener("click",function(e){
      var b=e.target.closest(".opt");if(!b)return;
      var qi=+n.dataset.q,ai=+b.dataset.a;
      if(!S.quiz[d.d])S.quiz[d.d]={};
      if(S.quiz[d.d][qi]!==undefined)return;
      S.quiz[d.d][qi]=ai;stamp();save();
      var q=d.quiz[qi];
      n.querySelectorAll(".opt").forEach(function(o,j){
        if(j===q.c)o.classList.add("right");else if(j===ai)o.classList.add("wrong");
      });
      n.querySelector(".exp").classList.add("on");
    });
  });
  document.getElementById("prev").addEventListener("click",function(){go(S.cur-1);});
  document.getElementById("next").addEventListener("click",function(){go(S.cur+1);});
}
function go(n){
  if(n<1||n>DAYS.length)return;
  S.cur=n;save();today_();header();course();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ─── 과정 ─── */
function course(){
  var h="";
  for(var s=0;s<STAGES.length;s++){
    var st=STAGES[s];
    h+='<div class="sg"><div class="sgh"><span class="sgn">'+String(st.n).padStart(2,"0")+'</span>';
    h+='<span class="sgt">'+st.t+'</span></div><div class="sgs">'+st.sub+'</div><div style="height:8px"></div>';
    for(var i=st.d[0];i<=st.d[1];i++){
      var d=DAYS[i-1],cls="di"+(dayDone(i)?" done":"")+(i===S.cur?" cur":"");
      h+='<div class="'+cls+'" data-d="'+i+'"><div class="dn">'+i+'</div><div class="dt">'+d.t+'</div></div>';
    }
    h+='</div>';
  }
  var el=document.getElementById("p-course");
  el.innerHTML=h;
  el.querySelectorAll(".di").forEach(function(n){
    n.addEventListener("click",function(){go(+n.dataset.d);tab("today");});
  });
}

/* ─── 단축키 ─── */
function keys(){
  var el=document.getElementById("p-keys");
  el.innerHTML='<input class="srch" id="ks" placeholder="단축키나 기능으로 검색" autocomplete="off"><div id="kl"></div>';
  function draw(q){
    q=(q||"").trim().toLowerCase();var h="";
    for(var i=0;i<KEYS.length;i++){
      var g=KEYS[i],rows=g.k.filter(function(r){
        return !q||r[0].toLowerCase().indexOf(q)>=0||r[1].toLowerCase().indexOf(q)>=0;});
      if(!rows.length)continue;
      h+='<div class="card"><div class="ct">'+g.g+'</div>';
      for(var j=0;j<rows.length;j++)h+='<div class="grow"><k>'+rows[j][0]+'</k><span>'+rows[j][1]+'</span></div>';
      h+='</div>';
    }
    document.getElementById("kl").innerHTML=h||'<div class="empty">일치하는 단축키가 없습니다.</div>';
  }
  draw("");
  document.getElementById("ks").addEventListener("input",function(e){draw(e.target.value);});
}

/* ─── 사전 ─── */
function gloss(){
  var el=document.getElementById("p-gloss");
  el.innerHTML='<input class="srch" id="gs" placeholder="용어 검색" autocomplete="off"><div id="gl"></div>';
  function draw(q){
    q=(q||"").trim().toLowerCase();
    var rows=GLOSS.filter(function(r){
      return !q||r[0].toLowerCase().indexOf(q)>=0||r[1].toLowerCase().indexOf(q)>=0||(r[2]&&r[2].toLowerCase().indexOf(q)>=0);});
    if(!rows.length){document.getElementById("gl").innerHTML='<div class="empty">일치하는 용어가 없습니다.</div>';return;}
    var h='<div class="card">';
    for(var i=0;i<rows.length;i++)
      h+='<div class="gitem"><div class="gl">'+rows[i][0]+(rows[i][2]?'<span class="eng">'+rows[i][2]+'</span>':'')+'</div><div class="gd">'+rows[i][1]+'</div></div>';
    h+='</div>';
    document.getElementById("gl").innerHTML=h;
  }
  draw("");
  document.getElementById("gs").addEventListener("input",function(e){draw(e.target.value);});
}

/* ─── 수치 감각 ─── */
var NG=["전체"].concat(NUM.map(function(n){return n.g;}).filter(function(v,i,a){return a.indexOf(v)===i;}));
var ngCur="전체";
function num(){
  var el=document.getElementById("p-num");
  var t='<input class="srch" id="ns" placeholder="값이나 이름으로 검색 (예: 80Hz, 어택, 스윙)" autocomplete="off">';
  t+='<div class="tagr" id="ntag">';
  for(var i=0;i<NG.length;i++)t+='<button class="tag'+(NG[i]===ngCur?" on":"")+'" data-g="'+NG[i]+'">'+NG[i]+'</button>';
  t+='</div><div id="nl"></div>';
  el.innerHTML=t;
  function draw(){
    var q=(document.getElementById("ns").value||"").trim().toLowerCase();
    var rows=NUM.filter(function(n){
      if(ngCur!=="전체"&&n.g!==ngCur)return false;
      if(!q)return true;
      return (n.v+" "+n.w+" "+n.f+" "+n.m).toLowerCase().indexOf(q)>=0;
    });
    if(!rows.length){document.getElementById("nl").innerHTML='<div class="empty">일치하는 수치가 없습니다.</div>';return;}
    var h='<div class="card">';
    for(var i=0;i<rows.length;i++){
      h+='<div class="nitem"><span class="nv">'+rows[i].v+'</span><span class="nw">'+rows[i].w+'</span>';
      h+='<div class="nf">'+rows[i].f+'</div><div class="nm"><b>벗어나면</b> '+rows[i].m+'</div></div>';
    }
    h+='</div>';
    document.getElementById("nl").innerHTML=h;
  }
  draw();
  document.getElementById("ns").addEventListener("input",draw);
  document.getElementById("ntag").addEventListener("click",function(e){
    var b=e.target.closest(".tag");if(!b)return;
    ngCur=b.dataset.g;
    el.querySelectorAll(".tag").forEach(function(x){x.classList.toggle("on",x.dataset.g===ngCur);});
    draw();
  });
}

/* ─── 진도: 채널 스트립 랙 ─── */
function prog(){
  var h='<div class="stat">';
  h+='<div><div class="n">'+totalDone()+'</div><div class="l">완료 일차</div></div>';
  h+='<div><div class="n">'+(DAYS.length-totalDone())+'</div><div class="l">남은 일차</div></div>';
  h+='<div><div class="n">'+streak()+'</div><div class="l">연속 학습일</div></div>';
  h+='</div>';

  h+='<div class="rack">';
  for(var s=0;s<STAGES.length;s++){
    var st=STAGES[s],tot=st.d[1]-st.d[0]+1,dn=0;
    for(var i=st.d[0];i<=st.d[1];i++)if(dayDone(i))dn++;
    var p=Math.round(dn/tot*100),full=(p===100);
    h+='<div class="strip'+(full?" full":"")+'">';
    h+='<div class="pct">'+p+'</div>';
    h+='<div class="slot"><div class="fill" style="height:'+p+'%"></div>';
    h+='<div class="cap" style="bottom:calc('+p+'% - '+(p*0.13)+'px)"></div></div>';
    h+='<div class="sno">'+st.n+'</div>';
    h+='<div class="sl">'+st.t+'</div>';
    h+='</div>';
  }
  h+='</div>';

  var qt=0,qc=0;
  for(var i=1;i<=DAYS.length;i++){
    var qs=S.quiz[i]||{},d=DAYS[i-1];
    for(var j in qs){qt++;if(+qs[j]===d.quiz[j].c)qc++;}
  }
  h+='<div class="card"><div class="ct">확인 문제</div>';
  h+='<p>푼 문제 <v>'+qt+'</v> / 전체 <v>'+DAYS.reduce(function(a,d){return a+d.quiz.length;},0)+'</v></p>';
  h+='<p>정답 <v>'+qc+'</v>'+(qt?' · 정답률 <v>'+Math.round(qc/qt*100)+'%</v>':'')+'</p></div>';

  h+='<div class="mini">진도는 이 기기에만 저장됩니다.<br><button class="rst" id="rst">진도 초기화</button></div>';

  var el=document.getElementById("p-prog");
  el.innerHTML=h;
  document.getElementById("rst").addEventListener("click",function(){
    if(!confirm("모든 진도와 문제 기록을 지웁니다. 계속할까요?"))return;
    S={cur:1,chk:{},quiz:{},dates:{}};save();today_();course();prog();header();
  });
}

/* ─── 탭 ─── */
function tab(name){
  document.querySelectorAll(".pane").forEach(function(p){p.classList.toggle("on",p.id==="p-"+name);});
  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.p===name);});
  if(name==="prog")prog();
  window.scrollTo({top:0,behavior:"instant"});
}
document.getElementById("tabs").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;tab(b.dataset.p);
});

/* ─── 시작 ─── */
if(!S.chk[S.cur]&&totalDone()>0)S.cur=firstOpen();
applyFs();today_();course();keys();gloss();num();prog();header();
</script>
</body>
</html>
