","프리 딜레이가 중요하다. <v>20~40</v>ms를 주면 원음이 먼저 들리고 잔향이 따라와서 명료도가 유지된다.","리버브에 하이패스와 로우패스를 건다. 리버브 입력에 <v>200</v>Hz 하이패스, <v>8</v>kHz 로우패스를 걸면 저역이 뭉치지 않고 치찰음이 번지지 않는다.","딜레이는 곡의 템포에 맞춘다. 점8분음표 딜레이가 넓은 느낌을 만들고, 4분음표 딜레이는 리듬을 강조한다. 피드백은 <v>15~30</v>퍼센트가 무난하다.","저역 악기에는 리버브를 거의 걸지 않는다. 킥과 베이스는 마른 채로 두는 것이 기본이다."],"path":[{"n":"센드 버스 만들기","s":["<k>X</k> 믹서 → 트랙 채널 스트립의 <b>Sends</b> 슬롯 클릭","<b>Bus → Bus 1</b> 선택 → 오른쪽에 Aux 채널 자동 생성","Aux 채널 이펙트 슬롯 → <b>Reverb → ChromaVerb</b> 또는 <b>Space Designer</b>","Aux의 <b>Mix</b>를 <v>100</v>퍼센트로 설정","각 트랙의 센드 노브로 보내는 양 조절"]},{"n":"리버브 다듬기","s":["Aux 채널 이펙트 첫 슬롯에 <b>Channel EQ</b>","하이패스 <v>200</v>Hz, 로우패스 <v>8</v>kHz","리버브 <b>프리 딜레이</b> <v>25</v>ms","<b>디케이</b> 시간 설정"]}],"drill":["짧은 버스와 긴 버스 두 개를 만들고 악기별로 보내는 양을 다르게 준다.","리버브에 EQ를 걸기 전과 후를 비교한다.","템포에 맞춘 점8분음표 딜레이를 리드에 걸어본다."],"keys":[["X","믹서"],["⌥클릭","초기화"]],"chk":["센드 버스를 만들 수 있다","리버브에 EQ를 건다","저역 악기는 마르게 둔다"],"quiz":[{"q":"원음의 명료도를 지키면서 잔향을 주는 설정은?","a":["프리 딜레이 0ms","프리 딜레이 20~40ms","디케이 10초","믹스 100퍼센트"],"c":1,"e":"프리 딜레이가 있으면 원음이 먼저 도달해 또렷하게 들린다."}]},{"d":51,"s":9,"t":"팬, 깊이, 오토메이션","goal":"평면적인 믹스에 좌우와 앞뒤를 만든다.","con":["입체감은 세 축으로 만든다. 좌우는 팬, 앞뒤는 음량과 리버브 양, 위아래는 주파수다.","팬 배치의 기본. 킥, 베이스, 스네어, 리드 보컬은 가운데. 나머지는 좌우로 벌린다. 같은 역할의 악기 두 개가 있으면 좌우 대칭으로 둔다. 기타 두 대를 <v>L60</v>과 <v>R60</v>에 두는 식이다.","뒤로 보내려면 음량을 줄이고 리버브를 늘리고 고역을 약간 깎는다. 세 가지를 함께 해야 실제로 뒤에 있는 것처럼 들린다.","오토메이션은 시간에 따라 값이 변하게 하는 기능이다. 벌스보다 코러스에서 기타를 <v>1.5</v>dB 올리는 정도의 미세한 조정이 곡을 살아 있게 만든다.","쓰는 방식은 두 가지다. 선을 직접 그리거나, 재생하면서 페이더를 움직여 기록하는 것이다. 기록 모드는 Touch, Latch, Write가 있고 보통 Touch를 쓴다.","오토메이션 우선 대상은 음량, 팬, 센드 양, 필터 컷오프다."],"path":[{"n":"오토메이션 그리기","s":["<k>A</k> → 트랙에 오토메이션 표시","트랙 헤더의 파라미터 메뉴에서 <b>Volume</b> 선택","선 위를 클릭 → 포인트 생성","포인트를 드래그해 값 조절"]},{"n":"기록하기","s":["트랙 헤더 오토메이션 모드를 <b>Touch</b>로","재생하며 페이더 조작 → 움직인 동안만 기록","모드를 <b>Read</b>로 되돌리기"]}],"drill":["기타 두 대를 L60, R60에 두고 가운데 악기와의 관계를 확인한다.","패드를 뒤로 보내기 위해 음량, 리버브, 고역 세 가지를 함께 조정한다.","코러스 구간에서 특정 트랙을 1.5dB 올리는 오토메이션을 그린다."],"keys":[["A","오토메이션 표시"],["X","믹서"],["⌃⌘A","오토메이션 켜기와 끄기"]],"chk":["팬 배치 원칙을 안다","깊이를 세 가지로 만든다","오토메이션을 그리고 기록할 수 있다"],"quiz":[{"q":"악기를 뒤로 보내기 위해 함께 해야 하는 것은?","a":["음량만 줄이기","리버브만 늘리기","음량 줄이고 리버브 늘리고 고역 깎기","팬을 끝으로"],"c":2,"e":"거리감은 세 가지가 함께 작동할 때 만들어진다."}]},{"d":52,"s":10,"t":"사이드체인 덕킹","goal":"킥이 칠 때마다 다른 소리를 잠깐 비켜서게 만든다.","con":["사이드체인은 컴프레서에게 다른 트랙의 소리를 듣고 반응하라고 시키는 것이다. 킥 소리를 듣고 베이스를 누르게 하면, 킥이 칠 때마다 베이스가 잠깐 물러난다. 저역에서 둘이 싸우지 않게 된다.","두 가지 목적이 있다. 하나는 자리 만들기다. 이때는 효과가 들리지 않을 정도로 약하게 건다. 킥이 뚫고 나오는데 무엇이 달라졌는지는 모르겠는 상태가 이상적이다.","다른 하나는 효과다. 하우스와 일렉트로닉에서 패드 전체가 킥에 맞춰 크게 숨쉬는 소리가 여기서 나온다. 이때는 일부러 크게 건다.","설정값의 감각. 어택은 <v>0.1~5</v>ms로 아주 짧게 둔다. 킥이 시작하는 순간 바로 눌러야 하기 때문이다. 릴리스가 곡의 인상을 정한다. <v>50~100</v>ms면 짧게 툭 비켰다 돌아오고, <v>150~300</v>ms면 길게 숨쉰다. 템포에 맞춰 다음 킥 직전에 회복되는 값을 찾는다.","덕킹을 크게 걸수록 킥은 뚫고 나오지만 곡 전체 음량이 출렁인다. 게인 리덕션 <v>2~4</v>dB면 자리 만들기, <v>6</v>dB 이상이면 효과다.","저역 정리를 사이드체인으로만 해결하려 들면 안 된다. 편곡과 EQ로 먼저 나누고 마지막 손질로 쓴다."],"path":[{"n":"사이드체인 걸기","s":["눌릴 트랙(베이스)에 <b>Compressor</b> 추가","플러그인 창 오른쪽 위 <b>Side Chain</b> 메뉴 클릭","소스로 킥 트랙 선택","<b>Attack</b> <v>1</v>ms, <b>Release</b> <v>80</v>ms, <b>Ratio</b> <v>4:1</v>로 시작","<b>Threshold</b>를 내려 리덕션 <v>3</v>dB 확보"]},{"n":"킥이 안 잡힐 때","s":["킥 트랙 출력이 사이드체인 목록에 없으면 킥에 <b>Bus</b> 센드를 하나 추가","센드를 <b>프리 페이더</b>로 두면 킥 음량과 무관하게 신호 전달"]}],"drill":["킥과 베이스만 놓고 사이드체인 없이, 3dB 리덕션, 8dB 리덕션 세 가지를 비교한다.","릴리스를 40, 100, 250ms로 바꿔가며 곡이 숨쉬는 속도가 어떻게 달라지는지 듣는다.","패드에 사이드체인을 걸어 하우스 느낌을 만들어 본다."],"keys":[["X","믹서"],["S","솔로"]],"chk":["자리 만들기와 효과를 구분해 쓴다","릴리스로 숨쉬는 속도를 조절한다","리덕션 양으로 강도를 판단한다"],"quiz":[{"q":"사이드체인 덕킹에서 어택을 아주 짧게 두는 이유는?","a":["소리를 부드럽게 하려고","킥이 시작하는 순간 바로 비켜야 해서","CPU를 아끼려고","릴리스를 길게 하려고"],"c":1,"e":"어택이 길면 킥의 앞부분이 이미 부딪친 뒤에 눌리기 때문에 효과가 없다."},{"q":"자리 만들기 목적일 때 적절한 게인 리덕션은?","a":["2~4dB","8~12dB","15dB 이상","0dB"],"c":0,"e":"들리지 않을 정도로 약하게 거는 것이 자리 만들기다."}]},{"d":53,"s":10,"t":"디에서, 게이트, 멀티밴드","goal":"특정 문제만 골라 잡는 도구를 익힌다.","con":["컴프레서는 크기 전체에 반응한다. 그런데 문제가 특정 주파수나 특정 구간에만 있을 때가 있다. 그때 쓰는 도구가 따로 있다.","디에서는 치찰음을 잡는다. 시옷과 치읓 발음에서 <v>5~9</v>kHz가 튀어 귀를 찌를 때 그 대역만 순간적으로 누른다. 여성 보컬은 <v>6~8</v>kHz, 남성 보컬은 <v>5~7</v>kHz 부근인 경우가 많다. 너무 강하게 걸면 발음이 뭉개져 웅얼거리게 되므로, 튀는 순간에만 <v>3~6</v>dB 눌리는 정도가 적당하다.","게이트는 설정한 레벨보다 작은 소리를 아예 막는다. 드럼 마이크에 새어 들어온 다른 악기 소리를 걷어내거나, 기타 앰프의 잡음을 없앨 때 쓴다. 릴리스가 짧으면 소리 꼬리가 잘려 부자연스럽고, 길면 잡음이 남는다. 홀드 값을 <v>10~50</v>ms 정도 주면 문이 덜 떨린다.","멀티밴드 컴프레서는 주파수를 여러 구간으로 나눠 각각 따로 누른다. 저역만 출렁일 때 저역 구간만 잡을 수 있다. 강력하지만 과하게 쓰면 소리가 납작해진다. 문제가 명확할 때만 쓴다.","순서가 있다. 먼저 편곡으로, 다음 EQ로, 그다음 이런 도구로 간다. 도구부터 꺼내면 원인을 못 찾는다."],"path":[{"n":"디에서","s":["보컬 채널 → <b>Dynamics → DeEsser 2</b>","<b>Detection</b> 주파수를 <v>7000</v>Hz 부근으로","<b>Monitor</b>를 켜서 치찰음만 들리는 지점 찾기","<b>Threshold</b>를 내려 리덕션 <v>3~6</v>dB","Monitor 끄고 확인"]},{"n":"게이트","s":["채널 → <b>Dynamics → Noise Gate</b>","<b>Threshold</b>를 올려 원하는 소리만 통과","<b>Hold</b> <v>20</v>ms, <b>Release</b> <v>100</v>ms","<b>Hysteresis</b>로 문 떨림 방지"]}],"drill":["보컬에 디에서를 걸고 Monitor로 치찰음만 들어 정확한 주파수를 찾는다.","일부러 강하게 걸어 발음이 뭉개지는 지점을 확인하고 되돌린다.","드럼 톰 트랙에 게이트를 걸어 다른 소리가 새어 들어오는 것을 막아본다."],"keys":[["X","믹서"],["S","솔로"]],"chk":["디에서 주파수를 귀로 찾을 수 있다","게이트의 홀드 역할을 안다","도구를 꺼내기 전에 원인을 먼저 본다"],"quiz":[{"q":"디에서가 다루는 대역은?","a":["60~120Hz","200~400Hz","5~9kHz","15kHz 이상"],"c":2,"e":"치찰음은 대체로 5~9kHz에 몰려 있다."}]},{"d":54,"s":10,"t":"위상과 스테레오 이미지","goal":"넓게 만들되 모노에서 무너지지 않게 한다.","con":["두 신호가 합쳐질 때 파형이 서로 반대면 상쇄된다. 이것이 위상 문제다. 스테레오로 들을 때는 넓고 좋았는데 모노로 합치면 소리가 사라지는 일이 여기서 생긴다.","모노는 여전히 중요하다. 휴대폰 스피커, 카페 천장 스피커, 클럽 시스템이 모노에 가깝게 재생한다. 스테레오에서만 좋은 믹스는 절반의 상황에서 무너진다.","코렐레이션 미터로 확인한다. <v>+1</v>이면 좌우가 같아 완전한 모노, <v>0</v>이면 넓게 퍼진 상태, <v>-1</v>이면 완전히 반대라 모노에서 사라진다. 대부분의 시간을 <v>0</v>에서 <v>+1</v> 사이에 두고, 순간적으로 <v>0</v> 아래로 내려가는 정도는 괜찮다.","저역은 가운데 두는 것이 원칙이다. 킥과 베이스를 넓히면 재생 환경마다 다르게 들리고 마스터링에서 문제가 된다. <v>120</v>Hz 아래를 모노로 만드는 처리를 흔히 쓴다.","넓히는 방법 중 안전한 것은 실제로 두 번 연주해 좌우에 두는 더블링이다. 위상 문제가 생기지 않는다. 반대로 한쪽을 몇 ms 늦추는 방식은 넓어 보이지만 모노에서 빗질하듯 대역이 깎인다.","마이크를 여러 개 세워 녹음했다면 위상 정렬이 먼저다. 파형을 확대해 첫 타격 지점을 맞추거나 한쪽 극성을 뒤집어 저역이 가장 두꺼워지는 쪽을 고른다."],"path":[{"n":"모노 점검","s":["<b>Stereo Out</b> 이펙트 슬롯 → <b>Metering → Correlation Meter</b>","다른 슬롯에 <b>Gain</b> 추가 → <b>Mono</b> 버튼으로 합쳐 듣기","사라지는 악기가 있는지 확인"]},{"n":"폭 조절","s":["채널 → <b>Imaging → Direction Mixer</b>","<b>Spread</b> 값으로 폭 조절","저역 모노: <b>Imaging → Stereo Spread</b> 또는 EQ로 저역 분리 후 처리"]},{"n":"극성 뒤집기","s":["채널 → <b>Gain</b> 플러그인","<b>Phase Invert</b> 버튼(∅) 클릭","저역이 두꺼워지는 쪽으로 선택"]}],"drill":["완성 믹스를 모노로 합쳐 듣고 사라지거나 약해지는 악기를 찾는다.","코렐레이션 미터를 보며 곡 전체에서 -1에 가까워지는 구간이 있는지 확인한다.","드럼 오버헤드와 스네어 마이크의 극성을 뒤집어 보고 저역 차이를 듣는다."],"keys":[["X","믹서"],["S","솔로"]],"chk":["코렐레이션 값을 읽을 수 있다","저역을 가운데 둔다","모노 점검을 습관화했다"],"quiz":[{"q":"코렐레이션 미터가 -1을 가리키면?","a":["완전한 모노","적당히 넓음","모노에서 상쇄됨","음량이 최대"],"c":2,"e":"좌우가 완전히 반대 위상이라 합치면 사라진다."}]},{"d":55,"s":11,"t":"마스터 버스 체인","goal":"곡 전체를 하나로 묶어 다듬는다.","con":["마스터링은 믹스가 끝난 곡 전체에 마지막 손질을 하는 단계다. 믹스가 좋지 않으면 마스터링으로 해결되지 않는다. 순서를 지킨다.","기본 체인 순서. EQ → 컴프레서(글루) → 새추레이션 → 리미터. 이 순서를 크게 벗어나지 않는다.","마스터 EQ는 아주 작게 쓴다. <v>1~2</v>dB 안에서. 전체가 어둡다면 <v>10</v>kHz를 넓게 <v>1.5</v>dB, 저역이 과하면 <v>200</v>Hz 부근을 <v>1</v>dB 정도 깎는다.","글루 컴프레서는 레이시오 <v>2:1</v>, 어택 <v>30</v>ms, 릴리스 <v>auto</v> 또는 <v>300</v>ms, 게인 리덕션 <v>1~2</v>dB로 아주 살짝만 건다. 곡이 하나로 묶인 느낌을 만드는 것이 목적이지 음량을 키우는 것이 아니다.","새추레이션은 배음을 더해 따뜻하게 만든다. 로직 11의 ChromaGlow가 이 역할을 한다. 아주 조금만 쓴다.","믹스를 마스터링할 때는 마스터 채널의 여유가 <v>-6</v>dBFS 정도 있어야 한다. 없다면 믹스로 돌아간다."],"path":[{"n":"마스터 체인 구성","s":["<k>X</k> 믹서 → 맨 오른쪽 <b>Stereo Out</b> 채널","이펙트 슬롯 1: <b>EQ → Linear Phase EQ</b>","슬롯 2: <b>Dynamics → Compressor</b> (Ratio <v>2:1</v>, GR <v>1~2</v>dB)","슬롯 3: <b>Distortion → ChromaGlow</b> 약하게","슬롯 4: <b>Dynamics → Limiter</b>"]}],"drill":["완성된 믹스에 마스터 체인 네 개를 순서대로 걸고 각 단계마다 켜고 끄며 차이를 확인한다.","글루 컴프의 게인 리덕션을 1dB와 6dB로 비교해 어느 쪽이 자연스러운지 판단한다."],"keys":[["X","믹서"],["⌘S","저장"]],"chk":["체인 순서를 안다","각 단계를 작게 쓴다","믹스 여유를 확보하고 시작한다"],"quiz":[{"q":"마스터 글루 컴프레서의 적절한 게인 리덕션은?","a":["1~2dB","5~8dB","10dB 이상","리덕션 없음"],"c":0,"e":"묶는 것이 목적이므로 아주 살짝만 건다."}]},{"t":"마스터링 어시스턴트와 로직 11의 자동 도구","goal":"자동 도구를 기준점으로 쓰되 판단은 직접 한다.","con":["로직 11에는 곡을 분석해서 알아서 처리해 주는 도구가 몇 개 들어 있다. 쓸 줄 알면 좋은 출발점이 되고, 원리를 모르고 쓰면 판단력이 늘지 않는다. 앞에서 수동 체인을 먼저 배운 이유가 그것이다.","마스터링 어시스턴트는 곡 전체를 듣고 EQ, 다이내믹, 라우드니스를 자동으로 맞춰 준다. 스테레오 아웃에 얹으면 재생하면서 분석하고, 끝나면 결과를 적용한다. 목표 라우드니스도 스트리밍 기준으로 맞춰 준다.","캐릭터를 고를 수 있다. 깨끗한 쪽과 색이 붙는 쪽이 있고, 일부 캐릭터는 애플 실리콘 맥에서만 열린다. 자동 결과가 마음에 안 들면 EQ 커브와 세기를 직접 손볼 수 있다.","가장 좋은 사용법은 비교다. 내가 만든 수동 체인과 어시스턴트 결과를 번갈아 들으며 무엇이 다른지 찾는 것이다. 어시스턴트가 저역을 깎았다면 내 믹스의 저역이 과했다는 뜻이다. 자동 도구를 채점자로 쓰는 셈이다.","스템 스플리터는 반대 방향의 도구다. 이미 섞여 있는 오디오 하나를 보컬, 드럼, 베이스, 나머지 네 갈래로 분리한다. 옛날 데모나 연습 녹음에서 보컬만 꺼내 새 반주를 붙이는 일이 가능해진다. 이것도 애플 실리콘이 필요하다.","분리 품질에는 한계가 있다. 소리가 겹친 부분에서는 뭉개짐이 남는다. 공부와 스케치, 리믹스 연습에는 충분하지만 남의 음원을 분리해 쓰는 것은 저작권 문제가 된다. 자기 소재에 쓴다.","자동 도구의 자리를 정리하면 이렇다. 시작을 빠르게 해주고 내 판단을 채점해 준다. 마지막 결정은 항상 귀가 한다."],"path":[{"n":"마스터링 어시스턴트","s":["<k>X</k> 믹서 → <b>Stereo Out</b> 채널","이펙트 슬롯에서 <b>Mastering Assistant</b>를 추가한다","곡을 처음부터 재생하면 분석이 진행된다","분석이 끝나면 <b>캐릭터</b>를 골라 비교한다","<b>Custom EQ</b>와 세기 조절로 결과를 다듬는다"]},{"n":"수동 체인과 비교","s":["앞에서 만든 수동 마스터 체인을 함께 걸어 둔다","한쪽씩 켜고 끄며 번갈아 듣는다","라우드니스 미터로 두 결과의 통합 수치를 비교한다"]},{"n":"스템 스플리터","s":["분리할 오디오 리전을 선택한다","리전을 <b>우클릭 → 스템 분리</b>","보컬, 드럼, 베이스, 그 외 네 트랙이 새로 생긴다","필요 없는 갈래는 지우고 쓸 것만 남긴다"]}],"drill":["완성 곡에 마스터링 어시스턴트를 걸어 분석 결과를 보고, 어시스턴트가 올리거나 깎은 대역이 내 믹스의 어떤 문제를 가리키는지 적는다.","수동 체인 결과와 어시스턴트 결과의 통합 라우드니스를 각각 재서 비교한다.","직접 만든 옛 데모 하나를 스템으로 분리해 보컬만 남기고 새 반주를 깔아 본다."],"keys":[["X","믹서"],["스페이스","재생과 정지"]],"chk":["어시스턴트를 채점자로 쓰는 법을 안다","수동 체인과 비교해 봤다","스템 분리의 한계와 용도를 안다"],"quiz":[{"q":"마스터링 어시스턴트의 가장 좋은 사용법은?","a":["결과를 그대로 발매","수동 체인과 비교하며 내 믹스의 문제를 찾는 채점자로","믹싱 전에 먼저 걸기","모든 트랙에 하나씩 걸기"],"c":1,"e":"자동 결과가 손댄 부분이 곧 내 믹스의 약점을 가리킨다."},{"q":"스템 스플리터가 오디오를 나누는 네 갈래는?","a":["좌·우·중앙·잔향","보컬·드럼·베이스·그 외","고역·중역·저역·초저역","마디별 네 구간"],"c":1,"e":"섞인 오디오를 보컬, 드럼, 베이스, 나머지로 분리한다."}],"d":56,"s":11},{"d":57,"s":11,"t":"라우드니스와 리미터","goal":"스트리밍 기준에 맞는 음량으로 마무리한다.","con":["음량의 기준은 피크가 아니라 라우드니스다. 사람이 느끼는 크기를 측정한 값이고 단위는 LUFS다. 스트리밍 서비스는 이 값을 기준으로 자동 음량 조절을 한다.","목표값. 스트리밍 일반은 통합 라우드니스 <v>-14</v>LUFS 부근, 트루 피크 <v>-1</v>dBTP다. 애플 뮤직 계열은 <v>-16</v>LUFS를 기준으로 삼는다. 지나치게 크게 만들면 서비스에서 깎여서 다이내믹만 잃는다.","세 가지 측정값을 본다. 통합은 곡 전체 평균, 순간은 지금 값, 레인지는 다이내믹 폭이다. 레인지가 <v>4</v>LU 아래로 내려가면 답답하게 들린다. 대중음악에서 <v>5~9</v>LU가 무난하다.","트루 피크는 디지털 신호를 아날로그로 바꿀 때 생기는 실제 최대값이다. 0dBFS를 넘지 않아도 트루 피크는 넘을 수 있다. 그래서 <v>-1</v>dBTP로 여유를 둔다.","리미터는 마지막에 하나만 건다. 실링을 <v>-1.0</v>dB로, 게인을 서서히 올려 목표 라우드니스에 닿게 한다. 리덕션이 계속 <v>3</v>dB 이상 걸리면 너무 밀어붙인 것이다."],"path":[{"n":"측정하기","s":["<b>Stereo Out</b> 이펙트 슬롯 → <b>Metering → Loudness Meter</b>","<k>Return</k>으로 처음으로 → 곡 전체 재생","<b>Integrated</b> 값 확인","<b>True Peak</b> 확인"]},{"n":"리미터 설정","s":["<b>Stereo Out</b> 마지막 슬롯 → <b>Dynamics → Limiter</b>","<b>Output Level</b>(실링) <v>-1.0</v>dB","<b>Gain</b>을 <v>0</v>부터 천천히 올림","리덕션이 순간 <v>2~3</v>dB를 넘지 않게"]}],"drill":["완성 곡의 통합 라우드니스를 측정하고 값을 적는다.","리미터 게인을 올려 -14LUFS에 맞추고 그 과정에서 소리가 어떻게 변하는지 듣는다.","일부러 -8LUFS까지 밀어붙인 버전을 만들어 다이내믹이 얼마나 사라지는지 비교한다."],"keys":[["Return","처음으로"],["X","믹서"]],"chk":["LUFS와 dBFS의 차이를 안다","목표값을 기억한다","트루 피크에 여유를 둔다"],"quiz":[{"q":"스트리밍 기준으로 흔히 쓰는 목표 라우드니스는?","a":["-6LUFS","-14LUFS 부근","-30LUFS","0LUFS"],"c":1,"e":"-14LUFS 부근이 일반적인 기준이고 애플 계열은 -16LUFS를 쓴다."},{"q":"트루 피크 여유는 보통 얼마로 두나?","a":["0dBTP","-1dBTP","-6dBTP","-20dBTP"],"c":1,"e":"-1dBTP를 두면 인코딩 과정에서 왜곡이 생기지 않는다."}]},{"d":58,"s":11,"t":"바운스와 파일 포맷","goal":"용도에 맞는 파일을 정확한 설정으로 뽑는다.","con":["바운스는 프로젝트를 오디오 파일로 만드는 작업이다. 설정 창의 항목이 많아 보이지만 실제로 정하는 것은 몇 개뿐이다.","발매용 마스터는 WAV, <v>24</v>비트, 프로젝트와 같은 샘플레이트로 뽑는다. 스트리밍 서비스가 알아서 압축하므로 압축 포맷을 직접 만들 필요가 없다.","들려주기용은 MP3 <v>320</v>kbps나 AAC면 충분하다. 로직은 한 번에 여러 포맷을 동시에 뽑을 수 있다.","바운스 구간은 곡의 시작과 끝을 정확히 잡는다. 잔향이 끝날 때까지 여유를 두지 않으면 마지막이 뚝 끊긴다. 마지막 음 이후 <v>2~3</v>초를 더 잡는다.","실시간과 오프라인 중 오프라인이 빠르다. 외부 하드웨어를 쓰는 경우에만 실시간을 고른다.","노멀라이즈는 끄고 뽑는다. 이미 리미터로 정한 라우드니스가 흐트러진다.","디더는 비트 심도를 줄일 때만 쓴다. 24비트를 16비트로 내릴 때 생기는 미세한 왜곡을 아주 작은 잡음으로 가려주는 처리다. 24비트로 그대로 낼 거라면 <b>없음</b>으로 둔다. 습관적으로 켜두면 오히려 손해다.","트랙별로 따로 뽑는 것이 스템이다. 다른 사람에게 믹스를 넘기거나 라이브에 쓸 때 필요하다."],"path":[{"n":"프로젝트 바운스","s":["사이클 또는 선택으로 바운스 구간 지정","<k>⌘B</k> → 바운스 창","<b>대상</b>에서 PCM과 MP3 등 체크","PCM: <b>파일 형식</b> WAVE, <b>해상도</b> <v>24</v>비트","<b>모드</b> 오프라인, <b>노멀라이즈</b> 끄기","<b>바운스</b> → 위치와 이름 지정"]},{"n":"스템 뽑기","s":["<b>파일 → 내보내기 → 모든 트랙을 오디오 파일로</b>","형식과 해상도 지정","<b>바이패스 이펙트 플러그인</b> 여부 선택","저장 위치 지정"]}],"drill":["완성 곡을 WAV 24비트와 MP3 320kbps로 동시에 바운스한다.","바운스 구간을 잔향 끝까지 잡았는지 결과 파일 마지막을 들어 확인한다.","모든 트랙을 스템으로 내보내고 폴더 구조를 확인한다."],"keys":[["⌘B","바운스"],["⌘U","선택을 사이클로"]],"chk":["발매용 포맷을 안다","노멀라이즈를 끄고 뽑는다","잔향 끝까지 구간을 잡는다"],"quiz":[{"q":"발매용 마스터 파일의 일반적인 형식은?","a":["MP3 128kbps","WAV 24비트","AAC","MIDI"],"c":1,"e":"압축하지 않은 WAV 24비트로 넘기면 서비스가 각자 포맷으로 변환한다."}]},{"d":59,"s":11,"t":"메타데이터와 발매","goal":"곡을 세상에 내보내는 절차를 끝까지 밟는다.","con":["발매에 필요한 것은 음원, 커버 이미지, 메타데이터 세 가지다. 음악이 끝나도 이 셋이 준비되지 않으면 나갈 수 없다.","커버 이미지는 정사각형이고 최소 <v>3000</v>×<v>3000</v> 픽셀, RGB, JPG나 PNG로 준비한다. 작게 만들면 나중에 다시 만들어야 한다.","메타데이터에는 곡 제목, 아티스트명, 앨범명, 장르, 발매일, 작사가, 작곡가, 편곡자, 저작권 표기가 들어간다. 아티스트명은 한 번 정하면 바꾸기 번거로우니 신중히 정한다.","ISRC는 녹음물마다 붙는 국제 표준 코드다. 배급사가 발급해주는 경우가 많다. 저작권 관리와 정산 추적에 쓰인다.","배급은 배급 대행사를 통한다. 음원을 올리면 여러 스트리밍 서비스에 동시에 등록해준다. 심사와 반영에 보통 <v>1~3</v>주가 걸리므로 발매일을 여유 있게 잡는다.","국내에서 저작권료를 정산받으려면 저작권 신탁 단체에 가입하고 곡을 등록해야 한다. 창작자 등록과 곡 등록은 별개 절차다.","발매 전 마지막 점검. 다른 스피커와 이어폰에서 들어보고, 휴대폰 스피커로도 들어보고, 곡 시작과 끝의 무음 길이를 확인한다."],"path":[{"n":"파일 준비","s":["마스터 WAV 24비트 파일","커버 이미지 <v>3000</v>×<v>3000</v> 이상 정사각형","메타데이터 목록을 문서로 정리"]},{"n":"최종 점검","s":["다른 재생 환경 3곳 이상에서 청취","모노로 합쳐 들어보기: <b>Stereo Out</b>에 <b>Gain</b> 플러그인 → 모노 버튼","곡 시작 무음 <v>0.2~0.5</v>초, 끝 잔향 여유 확인"]}],"drill":["완성 곡의 메타데이터 목록을 전부 작성한다. 빈칸이 없어야 한다.","모노로 합쳐 들었을 때 사라지는 소리가 있는지 확인한다.","휴대폰 스피커, 이어폰, 스피커 세 환경에서 듣고 문제를 적는다."],"keys":[["⌘B","바운스"],["X","믹서"]],"chk":["필요한 세 가지를 준비했다","모노 호환성을 확인했다","발매 일정을 여유 있게 잡았다"],"quiz":[{"q":"커버 이미지의 권장 최소 크기는?","a":["500×500","1000×1000","3000×3000","300×300"],"c":2,"e":"3000×3000 픽셀 정사각형이면 대부분의 서비스 요구를 만족한다."},{"q":"모노로 합쳐 들었을 때 소리가 사라진다면 원인은?","a":["리버브 부족","위상 문제","템포 오류","비트 심도"],"c":1,"e":"좌우 신호의 위상이 반대인 부분은 모노에서 상쇄된다."}]},{"d":60,"s":12,"t":"레이턴시와 지연 보상","goal":"소리가 늦게 나는 이유를 알고 상황에 맞게 조절한다.","con":["레이턴시는 소리가 들어와서 나가기까지 걸리는 시간이다. 두 가지에서 생긴다. 하나는 오디오 버퍼, 다른 하나는 플러그인 처리 시간이다.","버퍼는 한 번에 처리하는 오디오 덩어리 크기다. 크면 컴퓨터가 편하고 지연이 길다. 작으면 반대다. 그래서 녹음할 때 작게, 믹스할 때 크게 두는 것이다. <v>128</v> 샘플이면 <v>48</v>kHz 기준 약 <v>2.7</v>ms, <v>1024</v> 샘플이면 약 <v>21</v>ms다. 왕복이므로 실제 체감은 두 배에 가깝다.","연주에 지장이 생기는 지점은 대략 <v>10</v>ms 부근이다. 그 아래면 대부분 느끼지 못하고, <v>20</v>ms를 넘으면 확실히 어긋난다고 느낀다.","플러그인마다 처리 지연이 다르다. 특히 선형 위상 EQ와 룩어헤드 리미터는 지연이 크다. 로직은 이것을 자동으로 계산해 다른 트랙을 그만큼 늦춰 맞춘다. 이것이 플러그인 지연 보상이다.","보상 범위를 모두로 두면 정확하지만 전체 지연이 커진다. 녹음할 때 걸리적거리면 저지연 모드를 쓴다. 저지연 모드는 지연이 큰 플러그인을 잠시 우회한다. 소리가 달라지므로 녹음이 끝나면 끈다."],"path":[{"n":"버퍼와 보상 설정","s":["<b>Logic Pro → 설정 → 오디오 → 장비</b>","<b>I/O 버퍼 크기</b>: 녹음 <v>64~128</v>, 믹스 <v>512~1024</v>","<b>플러그인 지연 보상</b>: <b>모든 것</b>","<b>적용</b>"]},{"n":"저지연 모드","s":["<b>Logic Pro → 설정 → 오디오 → 일반</b>","<b>저지연 모드</b> 한계값 확인","컨트롤 막대 우클릭 → <b>컨트롤 막대 및 디스플레이 사용자화</b>에서 저지연 버튼 추가","녹음 시 켜고 끝나면 끄기"]}],"drill":["버퍼를 64와 1024로 바꿔가며 건반을 쳐서 지연을 체감한다.","마스터에 선형 위상 EQ를 걸고 지연 보상이 켜졌을 때와 꺼졌을 때 트랙 간 어긋남을 확인한다.","저지연 모드를 켜서 어떤 플러그인이 우회되는지 확인한다."],"keys":[["R","녹음"],["⌘S","저장"]],"chk":["버퍼와 지연의 관계를 안다","지연 보상 설정 위치를 안다","저지연 모드를 상황에 맞게 쓴다"],"quiz":[{"q":"연주에 지장을 느끼기 시작하는 지연은 대략?","a":["1ms","10ms","100ms","500ms"],"c":1,"e":"10ms 부근부터 체감되고 20ms를 넘으면 확실히 어긋난다고 느낀다."},{"q":"녹음할 때 버퍼를 작게 두는 이유는?","a":["음질이 좋아져서","지연을 줄이려고","용량을 아끼려고","플러그인이 많아서"],"c":1,"e":"버퍼가 작을수록 지연이 짧지만 컴퓨터 부담은 커진다."}]},{"d":61,"s":12,"t":"프리즈, 바운스 인 플레이스, 자원 관리","goal":"트랙이 늘어나도 끊기지 않게 만든다.","con":["곡이 커지면 컴퓨터가 버거워진다. 소리가 끊기거나 시스템 과부하 경고가 뜬다. 해결책은 처리를 미리 해두고 그 결과만 재생하는 것이다.","프리즈는 트랙을 임시로 오디오로 만들어 재생한다. 언제든 해제해서 다시 편집할 수 있다. 되돌릴 여지를 남기므로 작업 중에는 프리즈가 편하다. 프리즈 모드가 두 가지인데, 소스만 얼리면 이후 이펙트는 계속 조절할 수 있고, 사전 페이더까지 얼리면 자원이 더 많이 절약되는 대신 이펙트도 고정된다.","바운스 인 플레이스는 아예 오디오 리전으로 바꾼다. 되돌리려면 원본 트랙을 보관해야 한다. 미디 이펙트 결과를 확정하거나 다른 사람에게 넘길 때 쓴다.","자원이 새는 흔한 원인들. 쓰지 않는 플러그인이 켜진 채 남아 있는 경우, 리버브를 트랙마다 개별로 건 경우, 샘플 라이브러리를 회전식 하드디스크에 둔 경우, 프리로드 버퍼가 과하게 큰 경우.","CPU 미터를 보고 판단한다. 코어 하나만 치솟는다면 그 트랙의 플러그인 사슬이 길기 때문이다. 그 트랙을 프리즈하면 해결된다.","작업 순서를 정해두면 좋다. 편곡이 끝난 트랙은 프리즈한다. 손댈 일이 없는 트랙까지 실시간으로 계산할 이유가 없다."],"path":[{"n":"프리즈 켜기","s":["트랙 헤더 우클릭 → <b>트랙 헤더 구성요소</b> → <b>프리즈</b> 체크","트랙 헤더의 눈송이 버튼 클릭","재생하면 얼기 시작","<k>I</k> 인스펙터에서 <b>프리즈 모드</b>를 <b>소스만</b> 또는 <b>사전 페이더</b>로"]},{"n":"바운스 인 플레이스","s":["리전 선택 → <k>⌃B</k>","트랙 전체는 <k>⌃⌥B</k>","<b>원본 남기기</b> 체크 여부 확인","<b>확인</b>"]},{"n":"부하 확인","s":["<b>보기 → CPU/HD 미터 사용자화</b> 또는 컨트롤 막대의 성능 미터","코어별 사용량 확인"]}],"drill":["플러그인이 많은 트랙을 프리즈하고 CPU 미터 변화를 확인한다.","프리즈 모드 두 가지를 각각 걸어보고 무엇이 조절 가능한지 비교한다.","아르페지에이터가 걸린 트랙을 바운스 인 플레이스로 확정한다."],"keys":[["⌃B","리전 바운스 인 플레이스"],["⌃⌥B","트랙 바운스 인 플레이스"],["⌘S","저장"]],"chk":["프리즈와 바운스 인 플레이스를 구분한다","프리즈 모드를 선택할 수 있다","CPU 미터로 원인을 찾는다"],"quiz":[{"q":"언제든 해제해 다시 편집할 수 있는 쪽은?","a":["프리즈","바운스 인 플레이스","스템 내보내기","프로젝트 정리"],"c":0,"e":"프리즈는 임시라서 해제하면 원래대로 돌아온다."}]},{"d":62,"s":12,"t":"스마트 템포와 오디오 가져오기","goal":"바깥에서 온 오디오를 프로젝트 템포에 맞춘다.","con":["바깥에서 받은 오디오는 대개 프로젝트와 템포가 다르다. 그냥 넣으면 어긋난다. 로직은 세 가지 방식으로 처리한다.","프로젝트 템포 모드가 세 가지다. 유지는 프로젝트 템포를 지키고 오디오를 그에 맞춘다. 조정은 반대로 들어온 오디오의 템포를 프로젝트가 따라간다. 자동은 상황에 따라 판단한다. 대부분의 경우 유지가 맞다.","리전 단위로도 정한다. 리전 인스펙터의 플렉스와 팔로우 항목을 켜면 그 리전이 프로젝트 템포를 따라간다. 루프 소재를 넣을 때 편하다.","템포를 크게 바꾸면 소리가 상한다. 원본에서 <v>10</v>퍼센트 안쪽이면 대체로 티가 안 나고, <v>20</v>퍼센트를 넘으면 늘어지거나 떨리는 소리가 들린다. 그럴 때는 다른 소재를 찾는 편이 낫다.","샘플레이트가 다른 파일은 로직이 변환해 넣는다. 프로젝트와 같은 샘플레이트의 파일을 쓰는 것이 가장 깨끗하다.","오디오를 가져오는 방법은 셋이다. 파인더에서 드래그, 브라우저에서 드래그, 파일 메뉴에서 가져오기. 어느 쪽이든 프로젝트 폴더로 복사할지 묻는데, 복사해두는 편이 안전하다."],"path":[{"n":"템포 모드 설정","s":["LCD 왼쪽의 <b>프로젝트 템포 모드</b> 표시 클릭","<b>유지 / 조정 / 자동</b> 중 선택","확신이 없으면 <b>유지</b>"]},{"n":"리전이 템포를 따르게","s":["오디오 리전 선택 → <k>I</k> 인스펙터","<b>플렉스와 팔로우</b> 항목을 <b>켬</b> 또는 <b>켬 + 리전 시작에 맞춤</b>","템포를 바꿔 리전이 따라오는지 확인"]}],"drill":["템포가 다른 드럼 루프를 가져와 프로젝트 템포에 맞춘다.","원본에서 10퍼센트, 25퍼센트 벌어지게 템포를 바꿔 소리가 상하는 지점을 찾는다.","같은 파일을 프로젝트 폴더로 복사한 경우와 아닌 경우를 만들어 폴더 구조를 비교한다."],"keys":[["I","인스펙터"],["⌘F","플렉스 표시"]],"chk":["세 가지 템포 모드를 안다","리전이 템포를 따르게 만들 수 있다","템포 변경 한계를 안다"],"quiz":[{"q":"오디오 템포를 원본에서 몇 퍼센트 넘게 바꾸면 소리가 상하기 시작하나?","a":["2퍼센트","20퍼센트 부근","50퍼센트","100퍼센트"],"c":1,"e":"10퍼센트 안쪽은 대체로 무난하고 20퍼센트를 넘으면 티가 나기 시작한다."}]},{"d":63,"s":12,"t":"스크린셋, 키 커맨드, 나만의 템플릿","goal":"자주 하는 일을 한 번의 동작으로 줄인다.","con":["작업 속도는 지식이 아니라 반복 횟수에서 나온다. 매번 같은 창을 열고 같은 트랙을 만든다면 그것부터 줄인다.","스크린셋은 창 배치를 통째로 저장한 것이다. 숫자 키 하나로 불러온다. 1번은 편곡 화면, 2번은 믹서, 3번은 피아노 롤 크게, 이런 식으로 정해두면 화면 정리에 쓰는 시간이 사라진다. 별도의 저장 동작이 없고 바꾸면 그대로 기억된다. 고정하고 싶으면 잠글 수 있다.","키 커맨드는 원하는 기능에 원하는 키를 붙이는 것이다. 로직에는 기본 단축키가 없는 기능이 아주 많다. 자주 쓰는데 메뉴를 뒤져야 하는 기능이 있다면 그것부터 붙인다.","템플릿은 트랙 구성과 이펙트 설정까지 저장한 시작점이다. 장르별로 하나씩 만들어두면 새 곡을 만들 때 곧바로 소리부터 낼 수 있다. 트랙 이름, 색, 센드 버스, 마스터 체인까지 미리 넣어둔다.","과하게 만들면 오히려 부담이 된다. 실제로 매번 쓰는 것만 넣는다. 처음에는 트랙 여덟 개 정도로 시작해 필요할 때 늘리는 편이 낫다.","여기까지 오면 로직은 도구가 된다. 남은 것은 만드는 일이다."],"path":[{"n":"스크린셋","s":["원하는 창 배치를 만듦","숫자 키 <k>1</k>~<k>9</k> 중 하나를 누름 → 그 번호에 저장","다른 배치를 만들고 다른 숫자","고정: <b>스크린셋 → 잠그기</b>"]},{"n":"키 커맨드","s":["<b>Logic Pro → 키 명령 → 편집</b>","검색창에 기능 이름 입력","항목 선택 → <b>키 명령 학습</b> 클릭 → 원하는 키 누름","<b>저장</b>"]},{"n":"템플릿 저장","s":["트랙, 센드 버스, 마스터 체인을 구성","<b>파일 → 템플릿으로 저장</b> → 이름 지정","다음부터 <b>파일 → 신규</b> → <b>나의 템플릿</b>"]}],"drill":["스크린셋 세 개를 만들어 숫자 키로 오간다.","자주 쓰는데 단축키가 없는 기능 세 개를 찾아 키를 붙인다.","가장 많이 만들 장르의 템플릿을 완성해 저장하고 새 프로젝트로 열어본다."],"keys":[["1~9","스크린셋 전환"],["⌘S","저장"],["⌥⌘N","새 트랙"]],"chk":["스크린셋을 만들고 오갈 수 있다","키 커맨드를 하나 이상 지정했다","나만의 템플릿을 저장했다"],"quiz":[{"q":"스크린셋을 저장하는 방법은?","a":["파일 메뉴에서 저장","숫자 키를 누르면 자동 저장","우클릭 후 저장","템플릿으로 저장"],"c":1,"e":"별도 저장 동작 없이 숫자 키에 현재 배치가 기억된다."}]}];
const KEYS=[{"g":"재생과 이동","k":[["스페이스","재생 · 정지"],["Return","프로젝트 처음으로"],["R","녹음"],["C","사이클 켜기 · 끄기"],["⌘U","선택 영역을 사이클로"],["⇧Return","사이클 시작점부터 재생"],["Z","선택 영역 확대 · 복귀"],["⌘←","줌 아웃"],["⌘→","줌 인"],["⌘↑","트랙 높이 줄이기"],["⌘↓","트랙 높이 키우기"],["K","메트로놈"]]},{"g":"창 열고 닫기","k":[["I","인스펙터"],["Y","라이브러리"],["E","편집기"],["P","피아노 롤"],["X","믹서"],["B","스마트 컨트롤"],["F","브라우저"],["O","루프 브라우저"],["N","스코어 편집기"],["G","글로벌 트랙"],["A","오토메이션 표시"],["⌘K","뮤지컬 타이핑"]]},{"g":"편집","k":[["⌘T","재생 헤드에서 분할"],["⌘R","반복 횟수 지정"],["⌘D","트랙 복제"],["⌥드래그","리전 복사"],["⌥⇧드래그","알리아스 만들기"],["⌃드래그","스냅 무시 미세 이동"],["⌘A","전체 선택"],["Delete","삭제"],["⌘Z","실행 취소"],["⇧⌘Z","다시 실행"],["T","도구 팝업"],["L","리전 루프 켜기 · 끄기"]]},{"g":"미디","k":[["⌘클릭","피아노 롤에서 음 추가"],["⌃드래그","벨로시티 조절"],["Q","퀀타이즈 적용"],["⌥클릭","플러그인 값 초기화"]]},{"g":"트랙과 파일","k":[["⌥⌘N","새 트랙"],["M","뮤트"],["S","솔로"],["⌘S","저장"],["⇧⌘S","다른 이름으로 저장"],["⌘B","바운스"],["⌘F","플렉스 표시"],["⌘⇧D","트랙 스택 만들기"],["⌃B","리전 바운스 인 플레이스"],["⌃⌥B","트랙 바운스 인 플레이스"],["1~9","스크린셋 전환"],["⇧R","캡처 녹음"]]}];
const GLOSS=[["가상악기","미디 지시를 받아 실제 소리를 내주는 프로그램 안의 악기."],["게이트","설정한 레벨보다 작은 소리를 막는 도구. 잡음과 새어든 소리를 걷어낸다."],["게인 리덕션","컴프레서가 실제로 누른 양. 3~6dB가 일반적."],["게인 스테이징","각 단계의 레벨을 적정 범위에 두는 작업. 개별 트랙 피크 -18~-10dBFS."],["격자","리전과 음이 달라붙는 눈에 보이지 않는 눈금."],["고역","높은 주파수 구간. 하이햇과 공기감이 사는 자리."],["극성 반전","파형의 위아래를 뒤집는 처리. 다중 마이크 녹음의 위상 정렬에 쓴다."],["글루 컴프레서","마스터에 살짝 걸어 곡을 하나로 묶는 컴프레서. 게인 리덕션 1~2dB."],["눈금자","화면 위쪽의 마디 번호가 적힌 막대. 클릭하면 재생 헤드가 그 자리로 간다."],["덕킹","특정 소리가 날 때 다른 소리를 잠깐 낮추는 처리."],["데시벨","소리 크기를 재는 단위. 절대값이 아니라 무엇과 비교한 값이다."],["드러머","로직이 연주해주는 가상 드러머 트랙. XY 패드로 복잡도와 세기를 조절한다."],["디더","비트 심도를 줄일 때 생기는 왜곡을 아주 작은 잡음으로 가리는 처리. 24비트로 낼 때는 쓰지 않는다."],["디에서","치찰음 대역만 순간적으로 누르는 도구. 5~9kHz를 다룬다."],["라우드니스 레인지","곡의 다이내믹 폭. 5~9LU가 무난하다."],["라운드 로빈","같은 음을 연달아 칠 때 매번 다른 녹음을 돌려 쓰는 장치. 없으면 연타가 기계처럼 들린다."],["라이브러리","그 트랙에 얹을 소리를 고르는 목록."],["레이시오","컴프레서가 누르는 비율. 3:1이면 초과분이 3분의 1로 줄어든다."],["레이턴시","소리가 들어와 나가기까지의 지연. 버퍼와 플러그인 처리에서 생긴다."],["레조넌스","필터 컷오프 지점을 강조하는 정도."],["레퍼런스 트랙","목표로 삼는 완성 음원. 음량을 맞춰 비교해야 의미가 있다."],["루프","같은 구간을 반복해 재생하는 것."],["루프 브라우저","Apple Loops를 검색하고 미리 듣는 창. O로 연다."],["리미터","설정한 실링을 절대 넘지 않게 막는 최종 단계 처리기."],["리전","트랙 위의 소리 덩어리. 미디 리전은 음표 정보를, 오디오 리전은 파형을 담는다."],["마디","박이 몇 개 모인 한 덩어리. 눈금자의 숫자가 마디 번호다."],["마스터","모든 신호가 마지막에 모이는 곳. 로직에서는 스테레오 아웃이라고 표시된다."],["마스터링 어시스턴트","곡을 분석해 EQ와 다이내믹, 라우드니스를 자동으로 맞춰 주는 로직 11 도구."],["매핑","어떤 건반과 어떤 벨로시티에 어떤 샘플을 배치할지 정한 표."],["멀티 아웃풋","악기 안의 소리를 믹서에서 여러 채널로 나눠 뽑는 방식."],["멀티밴드 컴프레서","주파수 구간별로 따로 누르는 컴프레서. 문제가 명확할 때만 쓴다."],["멀티팀버","악기 하나의 인스턴스 안에 여러 악기를 담는 방식. 컨탁은 16개까지."],["메이크업 게인","컴프레서로 줄어든 음량을 보상하는 값."],["메트로놈","박에 맞춰 딸깍 소리를 내주는 기능. 녹음할 때 켠다. K로 켜고 끈다."],["모노 호환성","좌우를 합쳐 들었을 때 소리가 사라지지 않는지의 여부. 위상 문제를 확인한다."],["모니터","있는 그대로 들려주는 것이 목표인 작업용 스피커."],["뮤트","그 트랙을 잠시 꺼두는 기능."],["미디","소리가 아니라 연주 지시서. 어떤 건반을 언제 얼마나 세게 눌렀는지의 기록이다."],["미디 이펙트","악기에 도달하기 전의 음표 정보를 가공하는 플러그인. 아르페지에이터 등."],["믹서","모든 트랙의 채널 스트립을 한 화면에 모아 보는 창."],["밀리초","1000분의 1초. 소리의 시간을 다루는 값은 거의 전부 이 단위로 적는다."],["바운스 인 플레이스","리전이나 트랙을 오디오 리전으로 확정하는 기능."],["박","발로 까딱거리는 시간의 한 단위."],["박자","한 마디에 어떤 음표가 몇 개 들어가는지를 두 숫자로 나타낸 것."],["버스","여러 트랙이 함께 쓰는 옆길. 센드로 보낸 신호가 모이는 곳."],["벨로시티","건반을 누른 세기. 1~127. 대개 음량과 음색이 함께 바뀐다."],["벨로시티 레이어","세기별로 따로 녹음해 쌓아둔 샘플 층. 많을수록 자연스럽고 용량이 크다."],["부스트 스윕","좁은 폭으로 크게 올린 채 주파수를 옮겨 문제 대역을 찾는 방법."],["비트 심도","한 조각의 크기를 몇 단계로 나눠 적을지 정하는 값. 작업 기본은 24비트."],["사이드체인","다른 트랙의 소리를 듣고 반응하게 만드는 입력. 킥에 맞춰 베이스를 덕킹할 때 쓴다."],["상대값 스냅","격자에서 어긋난 정도를 유지한 채 옮기는 스냅 방식."],["샘플레이트","1초를 몇 조각으로 나눠 기록할지 정하는 값. 작업 기본은 48킬로헤르츠."],["세션 플레이어","로직이 대신 연주해 주는 가상 연주자. 드러머와 베이스 플레이어 등이 있다."],["센드","신호를 복사해 옆길로 보내는 방식. 원래 소리는 그대로 간다. 리버브가 여기 속한다."],["센드 버스","여러 트랙이 같은 이펙트를 공유하도록 신호를 보내는 경로."],["솔로","그 트랙만 남기고 나머지를 모두 끄는 기능."],["스냅","리전을 옮길 때 붙는 격자 단위. 마디, 비트, 디비전, 틱, 스마트 중에서 고른다."],["스레숄드","컴프레서가 누르기 시작하는 레벨."],["스마트 템포","프로젝트와 오디오의 템포 관계를 처리하는 로직의 방식. 유지·조정·자동."],["스윙","짝수 번째 음을 뒤로 미는 비율. 50이 스트레이트, 58~67이 재즈 계열."],["스크린셋","창 배치를 숫자 키에 저장해 즉시 불러오는 기능."],["스템","트랙별로 따로 뽑은 오디오 파일 묶음."],["스템 스플리터","섞인 오디오를 보컬, 드럼, 베이스, 그 외로 분리하는 로직 11 도구. 애플 실리콘 필요."],["아르페지에이터","누른 코드의 음을 순서대로 연주해주는 미디 이펙트."],["아티큘레이션","연주 주법. 레가토, 스타카토, 피치카토, 트레몰로 등."],["알리아스","미디 리전의 분신. 원본을 고치면 모두 바뀌지만 위치와 트랙은 따로 둘 수 있다."],["어레인지먼트 마커","곡 구간에 이름을 붙이는 글로벌 트랙 요소. 드래그하면 구간 전체가 이동한다."],["오디오","소리 그 자체를 담은 데이터. 마이크로 녹음한 것과 음원 파일이 여기 속한다."],["오디오 인터페이스","컴퓨터와 소리를 주고받는 장치. 마이크를 넣고 스피커로 내보낸다."],["오실레이터","신스에서 원재료 파형을 만드는 부분. 톱니, 사각, 삼각, 사인, 노이즈."],["오토메이션","시간에 따라 값이 변하도록 기록하는 기능. Touch, Latch, Write 모드가 있다."],["인서트","신호가 그 장치를 통과해 지나가는 방식. 원래 소리가 바뀐다. EQ와 컴프레서가 여기 속한다."],["인스펙터","지금 선택한 대상의 속성을 보여주는 왼쪽 패널. 선택이 바뀌면 내용이 바뀐다."],["재생 헤드","지금 어디를 읽고 있는지 알려주는 세로줄."],["저역","낮은 주파수 구간. 킥과 베이스가 사는 자리."],["저지연 모드","지연이 큰 플러그인을 잠시 우회해 녹음을 편하게 하는 모드."],["존","샘플 하나가 놓인 건반 범위와 벨로시티 범위."],["주파수","소리가 떨리는 빠르기. 헤르츠로 잰다. 높낮이를 결정한다."],["중역","가운데 주파수 구간. 목소리와 대부분의 악기가 사는 자리."],["채널 스트립","한 트랙의 신호 흐름 전체. 악기, 이펙트, 센드, 팬, 페이더로 이루어진다."],["카운트인","녹음이 시작되기 전에 한두 마디를 미리 세어 주는 기능."],["캡처 녹음","녹음 버튼을 누르지 않고 친 연주를 나중에 가져오는 로직 기능. ⇧R."],["컨탁","샘플 라이브러리를 재생하는 대표적인 샘플러. 그릇이고 라이브러리가 내용물이다."],["컴핑","여러 테이크에서 좋은 구간만 골라 하나로 조립하는 작업."],["컷오프","필터가 깎기 시작하는 주파수."],["코렐레이션 미터","좌우 신호의 위상 관계를 보여주는 미터. +1은 모노, -1은 상쇄."],["퀀타이즈","음을 격자에 붙이는 기능. 강도 값으로 붙이는 정도를 조절한다."],["클리핑","소리가 최대치를 넘어 깨지는 현상. 되돌릴 수 없다."],["키스위치","연주에 쓰지 않는 낮은 건반으로 주법을 전환하는 방식."],["킬로헤르츠","헤르츠의 1000배. 2킬로헤르츠는 2000헤르츠다."],["테이크 폴더","사이클 녹음으로 쌓인 여러 테이크를 담은 리전."],["템포","1분에 박이 몇 개 지나가는지. 단위는 BPM."],["트랙","화면의 가로줄 하나. 악기 하나가 한 줄을 쓴다."],["트랙 지연","트랙 전체의 재생 시점을 앞뒤로 미는 값. 레가토 샘플 보정에 쓴다."],["트랙 헤더","트랙 왼쪽의 이름과 버튼이 모인 부분."],["트루 피크","디지털을 아날로그로 변환할 때 생기는 실제 최대값. -1dBTP로 여유를 둔다."],["패치","악기와 이펙트, 볼륨까지 포함한 채널 스트립 전체 설정. 라이브러리에서 고른다."],["팬","소리를 왼쪽이나 오른쪽으로 보내는 조절기."],["퍼지","연주에 쓰이지 않는 샘플을 메모리에서 걷어내는 기능."],["페이더","소리 크기를 조절하는 세로 막대."],["프리 딜레이","원음이 울린 뒤 잔향이 시작되기까지의 시간. 20~40ms면 명료도가 유지된다."],["프리로드 버퍼","각 샘플의 앞부분을 미리 메모리에 올려두는 양. 디스크가 느리면 키운다."],["프리셋","플러그인 하나의 설정값."],["프리즈","트랙을 임시로 오디오화해 자원을 아끼는 기능. 언제든 해제할 수 있다."],["플러그인","DAW 안에 끼워 쓰는 작은 프로그램. 소리를 만드는 악기용과 소리를 바꾸는 이펙트용이 있다."],["플러그인 검증","로직이 새 플러그인을 검사해 쓸 수 있는지 판단하는 과정. 실패하면 목록에 안 뜬다."],["플러그인 지연 보상","플러그인마다 다른 처리 지연을 로직이 계산해 트랙 간 어긋남을 맞추는 기능."],["플렉스 타임","오디오의 타이밍을 늘이고 줄이는 기능. 모노포닉, 폴리포닉, 슬라이싱 모드."],["플렉스 피치","오디오의 음정을 고치는 기능."],["하이패스 필터","지정 주파수 아래를 깎는 필터. 거의 모든 트랙에 건다."],["헤드룸","지금 소리와 최대치 사이에 남은 여유."],["헤르츠","소리의 높낮이를 재는 단위. 1초에 공기가 몇 번 떨리는지를 센 숫자다. 많이 떨리면 높은 소리."],["ADSR","어택, 디케이, 서스테인, 릴리스. 소리의 음량 곡선을 정하는 네 값."],["Apple Loops","로직에 내장된 연주 소재 모음. 프로젝트의 템포와 조를 자동으로 따라온다."],["AU","오디오 유닛. 맥용 로직이 읽는 유일한 플러그인 형식. VST는 쓸 수 없다."],["Aux 채널","센드로 들어온 신호를 처리하는 보조 채널."],["BPM","1분당 박의 수. 숫자가 크면 빠르다."],["CC1 모듈레이션","음색의 세기와 밝기를 시간에 따라 바꾸는 미디 컨트롤 체인지."],["CC11 익스프레션","연주 표현용 음량을 시간에 따라 바꾸는 미디 컨트롤 체인지."],["CC64 서스테인","피아노 페달. 127이 밟음, 0이 뗌."],["DAW","녹음, 편집, 믹싱을 한 곳에서 하는 프로그램. 로직도 여기 속한다."],["dBFS","디지털 최대치를 0으로 놓은 레벨 단위. 0을 넘으면 클립."],["I/O 버퍼","오디오 처리 단위. 녹음 때 작게, 믹스 때 크게 둔다."],["ISRC","녹음물마다 붙는 국제 표준 코드. 정산 추적에 쓰인다."],["LFO","저주파 발진기. 소리를 주기적으로 흔들어 비브라토나 트레몰로를 만든다."],["LUFS","사람이 느끼는 음량을 측정한 단위. 스트리밍 기준은 -14LUFS 부근."],["MP3","압축한 오디오 파일 형식. 용량이 작지만 정보가 줄어 있다."],["NKI","컨탁 인스트루먼트 파일. 여러 개를 묶은 것은 NKM이다."],["Q-강도","퀀타이즈를 얼마나 적용할지의 비율. 80퍼센트 근처가 자연스럽다."],["Quick Sampler","오디오 하나를 즉시 연주 가능한 악기로 만드는 로직 도구."],["WAV","압축하지 않은 오디오 파일 형식. 작업과 발매용 마스터에 쓴다."]];
const NUM=[{"g":"주파수","v":"20~60Hz","w":"초저역","f":"귀로 듣는다기보다 가슴과 배로 느껴지는 대역. 킥의 묵직한 무게와 808 베이스의 울림이 여기 있다. 작은 스피커에서는 아예 안 들린다.","m":"많으면 큰 시스템에서만 부풀고 헤드룸을 잡아먹는다. 없으면 곡이 가볍고 얄팍하다.","d":[39,48]},{"g":"주파수","v":"25~30Hz","w":"킥·베이스 하이패스","f":"들리지도 않는 초저역만 걷어낸다. 소리는 그대로인데 미터의 여유가 생긴다.","m":"40Hz 위로 올리면 킥의 무게가 눈에 띄게 빠진다.","d":[48]},{"g":"주파수","v":"60Hz","w":"킥의 몸통","f":"킥의 무게 중심. 여기가 살아 있으면 곡이 바닥에 붙어 있다는 느낌이 든다.","m":"과하면 웅웅거리고 다른 저역이 다 묻힌다.","d":[39,48]},{"g":"주파수","v":"80~100Hz","w":"보컬 하이패스","f":"목소리에 필요 없는 저역 웅웅거림과 마이크 진동을 걷어낸다. 보컬이 갑자기 앞으로 나오고 믹스가 맑아진다.","m":"150Hz 위로 올리면 목소리가 얇아지고 가슴 울림이 사라져 전화 통화처럼 들린다.","d":[48]},{"g":"주파수","v":"90Hz","w":"베이스의 심","f":"베이스가 '들리는' 자리. 작은 스피커에서 베이스 음정이 파악되는 지점.","m":"부족하면 휴대폰에서 베이스가 통째로 사라진다.","d":[39]},{"g":"주파수","v":"90~120Hz","w":"기타 하이패스","f":"기타의 통 울림을 정리한다. 걸고 나면 베이스 자리가 비어 저역이 또렷해진다.","m":"200Hz까지 올리면 기타가 얄팍하고 장난감 같아진다.","d":[48]},{"g":"주파수","v":"120Hz","w":"저역 모노 기준선","f":"이 아래를 가운데로 모으면 저역이 단단해지고 어느 재생 환경에서든 같게 들린다.","m":"기준을 너무 높이면(300Hz 이상) 믹스가 좁고 답답해진다.","d":[54]},{"g":"주파수","v":"120Hz","w":"스네어 하이패스","f":"스네어에 새어 들어온 킥 소리를 걷어낸다. 스네어의 탁 치는 성격만 남는다.","m":"200Hz를 넘기면 스네어의 몸통이 사라져 종잇장 소리가 된다.","d":[48]},{"g":"주파수","v":"200~400Hz","w":"뭉침·박스 소리","f":"여러 악기가 겹쳐 답답해지는 대표 구간. 여기서 2~4dB를 덜어내면 믹스에 갑자기 공간이 생긴다.","m":"너무 깎으면 소리가 속이 빈 듯 가늘어지고 따뜻함이 사라진다.","d":[39,48]},{"g":"주파수","v":"200Hz","w":"리버브 하이패스","f":"잔향의 저역을 잘라낸다. 공간감은 그대로인데 믹스가 흐려지지 않는다.","m":"안 걸면 리버브가 저역을 흐려 곡이 안개 낀 듯 들린다.","d":[50]},{"g":"주파수","v":"400~800Hz","w":"중저역","f":"악기의 몸통과 두께. 기타 코드와 왼손 피아노가 사는 자리.","m":"많으면 눅눅하고 둔하다. 없으면 소리가 얇고 힘이 없다.","d":[39]},{"g":"주파수","v":"800~2kHz","w":"명료도","f":"말이 알아들리는 대역. 여기를 살짝 올리면 보컬이 앞으로 나온다.","m":"과하면 코맹맹이 소리가 나고 귀가 피곤해진다.","d":[39,48]},{"g":"주파수","v":"2~4kHz","w":"날카로움·존재감","f":"귀가 가장 민감한 구간. 조금만 올려도 확 앞으로 나오지만 오래 들으면 귀가 아프다.","m":"3dB 이상 올리면 대부분 거슬린다. 깎으면 뒤로 물러나 부드러워진다.","d":[48]},{"g":"주파수","v":"5~7kHz","w":"남성 보컬 치찰음","f":"시옷과 치읓이 튀는 자리. 디에서의 탐지 주파수를 여기 맞춘다.","m":"낮게 잡으면 발음 전체가 눌려 웅얼거린다.","d":[53]},{"g":"주파수","v":"6~8kHz","w":"여성 보컬 치찰음","f":"같은 치찰음이지만 조금 위에 있다. 모니터 기능으로 들어보면 정확한 지점을 찾을 수 있다.","m":"너무 위로 잡으면 치찰음은 그대로고 공기감만 사라진다.","d":[53]},{"g":"주파수","v":"8kHz","w":"리버브 로우패스","f":"잔향의 고역을 눌러 치찰음이 공간에 번지는 것을 막는다. 잔향이 뒤로 물러나 자연스러워진다.","m":"5kHz 아래로 내리면 리버브가 담요 덮은 듯 답답해진다.","d":[50]},{"g":"주파수","v":"10kHz","w":"광택·공기감","f":"넓게 1.5~3dB 올리면 소리가 열리고 고급스러워진다. 무엇이 달라졌는지 콕 집기 어려운 종류의 변화다.","m":"6dB 넘게 올리면 얇고 쨍하며 잡음까지 같이 커진다.","d":[48,55]},{"g":"주파수","v":"300~500Hz","w":"하이햇 하이패스","f":"하이햇에 새어든 다른 소리를 걷어낸다. 하이햇이 위쪽에만 존재하게 되어 자리가 명확해진다.","m":"1kHz까지 올리면 하이햇이 얇은 지직 소리만 남는다.","d":[48]},{"g":"시간","v":"0.1~5ms","w":"사이드체인 어택","f":"킥이 시작하는 그 순간 바로 비켜선다. 킥이 깨끗하게 뚫고 나온다.","m":"20ms 넘게 두면 이미 부딪친 뒤에 눌려서 덕킹 효과가 거의 없다.","d":[52]},{"g":"시간","v":"1~5ms","w":"짧은 컴프 어택","f":"소리의 첫 타격까지 눌린다. 둥글고 부드러워지지만 펀치가 사라진다. 베이스를 얌전하게 만들 때 유용하다.","m":"드럼에 쓰면 힘이 빠져 밋밋해진다.","d":[49]},{"g":"시간","v":"10ms","w":"보컬 컴프 어택","f":"자음의 첫 순간은 통과시키고 뒤를 잡는다. 발음이 살아 있으면서 음량이 고르다.","m":"1ms로 줄이면 발음이 뭉개지고, 50ms로 늘리면 큰 부분이 여전히 튄다.","d":[49]},{"g":"시간","v":"20~30ms","w":"드럼 컴프 어택","f":"타격의 앞부분을 통과시키고 그 뒤 울림만 누른다. 펀치가 오히려 강조되어 앞으로 튀어나온다.","m":"짧게 하면 타격이 눌려 물먹은 소리가 된다.","d":[49]},{"g":"시간","v":"3~10ms","w":"편집 페이드","f":"자른 지점의 딸깍 소리를 없앤다. 귀에는 들리지 않을 만큼 짧다.","m":"없으면 딸깍 소리가 나고, 50ms를 넘기면 발음의 첫 순간이 잘려나간다.","d":[45]},{"g":"시간","v":"20~40ms","w":"리버브 프리 딜레이","f":"원음이 먼저 도착하고 잔향이 뒤따른다. 공간은 넓은데 소리는 또렷한 상태가 만들어진다.","m":"0이면 잔향이 원음에 달라붙어 흐려진다. 100ms를 넘으면 별도의 메아리로 들린다.","d":[50]},{"g":"시간","v":"20~60ms","w":"레가토 트랙 지연","f":"음수로 주면 트랙 전체가 앞당겨져 늦게 나오던 스트링이 박에 맞는다.","m":"과하게 당기면 이번엔 먼저 들려서 서두르는 느낌이 난다.","d":[23]},{"g":"시간","v":"8~20ms","w":"기타 스트럼 시차","f":"피크가 줄을 차례로 훑는 느낌이 난다. 미디가 갑자기 사람이 친 것처럼 들린다.","m":"40ms를 넘기면 아르페지오처럼 들려 스트럼이 아니게 된다.","d":[31]},{"g":"시간","v":"50~100ms","w":"짧은 사이드체인 릴리스","f":"툭 비켰다 바로 돌아온다. 빠른 곡에서 촘촘하고 단단한 그루브를 만든다.","m":"너무 짧으면 지직거리는 왜곡이 생긴다.","d":[52]},{"g":"시간","v":"150~300ms","w":"긴 사이드체인 릴리스","f":"곡 전체가 크게 숨쉬는 하우스 특유의 파도가 만들어진다.","m":"다음 킥까지 회복되지 않으면 소리가 계속 눌린 채로 답답해진다.","d":[52]},{"g":"시간","v":"80~150ms","w":"드럼 컴프 릴리스","f":"다음 타격 전에 풀려서 그루브가 살아난다. 발이 까딱거리면 맞은 것이다.","m":"길면 곡이 눌린 채 늘어지고, 짧으면 출렁이는 펌핑이 들린다.","d":[49]},{"g":"시간","v":"0.8~1.5초","w":"짧은 리버브 디케이","f":"방 안이나 작은 홀. 악기를 뒤로 밀지 않으면서 마르지 않게 해준다. 드럼과 보컬 기본값.","m":"짧으면 효과가 거의 없고, 길면 리듬이 뭉개진다.","d":[50]},{"g":"시간","v":"2.5~4초","w":"긴 리버브 디케이","f":"큰 홀. 발라드 코러스나 영화 음악의 넓은 공간. 곡이 커지고 멀어진다.","m":"빠른 곡에 쓰면 잔향이 겹쳐 진흙탕이 된다.","d":[50]},{"g":"시간","v":"400~1200ms","w":"패드 어택","f":"소리가 천천히 밀려 들어온다. 시작점이 흐려져 배경처럼 깔린다.","m":"짧으면 패드가 아니라 오르간처럼 앞으로 튀어나온다.","d":[29]},{"g":"시간","v":"800~2000ms","w":"패드 릴리스","f":"건반을 떼도 소리가 남아 코드가 서로 겹치며 이어진다.","m":"길면 코드가 바뀌어도 이전 화음이 남아 탁해진다.","d":[29]},{"g":"시간","v":"0~5ms","w":"플럭 어택","f":"뜯거나 때린 것처럼 즉시 튀어나온다. 리듬 악기의 성격이 된다.","m":"이 값에서는 길게 둘 이유가 거의 없다.","d":[29]},{"g":"시간","v":"10~50ms","w":"게이트 홀드","f":"문이 열린 뒤 최소한 이만큼은 열어둔다. 소리가 파르르 떨리는 현상이 사라진다.","m":"없으면 문이 덜덜 떨리고, 길면 잡음까지 통과한다.","d":[53]},{"g":"레벨","v":"-18~-10dBFS","w":"개별 트랙 피크","f":"플러그인이 설계된 범위에서 동작한다. 뒤에 무엇을 붙여도 여유가 있다.","m":"높으면 합쳤을 때 마스터가 넘치고, 너무 낮으면 잡음이 상대적으로 커진다.","d":[47]},{"g":"레벨","v":"-12~-6dBFS","w":"녹음 피크","f":"클립 걱정 없이 충분한 신호를 담는 지점. 24비트에서는 이 정도로도 잡음 문제가 전혀 없다.","m":"0에 닿으면 되돌릴 수 없는 왜곡이 남는다.","d":[42]},{"g":"레벨","v":"-6dBFS","w":"믹스 마스터 피크","f":"마스터링에서 손댈 공간이 남아 있는 상태. 컴프와 리미터가 제 역할을 할 수 있다.","m":"여유가 없으면 마스터링 단계에서 할 수 있는 일이 사라진다.","d":[47,55]},{"g":"레벨","v":"-14LUFS","w":"스트리밍 목표 라우드니스","f":"대부분의 서비스가 이 근처로 맞춘다. 다이내믹을 지키면서 남의 곡과 비슷한 크기로 들린다.","m":"-8까지 밀면 서비스가 깎아버려서 다이내믹만 잃고 크기는 그대로다.","d":[57]},{"g":"레벨","v":"-16LUFS","w":"애플 계열 기준","f":"조금 더 여유 있는 기준. 어쿠스틱이나 클래식 계열에 잘 맞는다.","m":"장르에 비해 너무 조용하면 상대적으로 힘없게 들릴 수 있다.","d":[57]},{"g":"레벨","v":"-1dBTP","w":"트루 피크 실링","f":"압축 변환 과정에서 넘치지 않을 여유. 스트리밍에서 왜곡이 생기지 않는다.","m":"0dBTP로 두면 변환 후 왜곡이 생길 수 있다.","d":[57]},{"g":"레벨","v":"5~9LU","w":"라우드니스 레인지","f":"대중음악에서 자연스러운 다이내믹 폭. 조용한 부분과 큰 부분의 차이가 들린다.","m":"4LU 아래면 처음부터 끝까지 같은 크기라 답답하고 지친다.","d":[57]},{"g":"레벨","v":"-8~-12dB","w":"레퍼런스 페이더","f":"완성된 남의 곡을 내 믹스와 비슷한 크기로 낮춘 값. 이래야 비교가 성립한다.","m":"안 낮추면 레퍼런스가 무조건 좋게 들려 판단이 왜곡된다.","d":[46]},{"g":"레벨","v":"1.5dB","w":"코러스 오토메이션","f":"벌스보다 이만큼만 올려도 코러스가 확 열리는 느낌이 난다. 아주 작은 값이 큰 인상을 만든다.","m":"3dB 이상 올리면 음량 차이로 들려서 부자연스럽다.","d":[51]},{"g":"다이내믹","v":"2:1","w":"글루 컴프 레이시오","f":"거의 안 누르는 수준. 트랙들이 하나의 덩어리로 묶인 느낌만 생긴다.","m":"4:1 이상이면 마스터에서 소리가 납작해진다.","d":[55]},{"g":"다이내믹","v":"3:1","w":"보컬 컴프 레이시오","f":"자연스럽게 음량을 고르게 만든다. 컴프를 걸었다는 티가 안 난다.","m":"8:1을 넘기면 목소리가 눌린 채 앞으로만 붙어 있게 된다.","d":[49]},{"g":"다이내믹","v":"4:1","w":"드럼·베이스 레이시오","f":"단단하게 잡아준다. 타격이 고르게 정리되고 힘이 생긴다.","m":"10:1을 넘으면 사실상 리미터가 되어 다이내믹이 사라진다.","d":[49]},{"g":"다이내믹","v":"3~6dB","w":"일반 게인 리덕션","f":"소리가 앞으로 나오면서도 자연스럽다. 대부분의 상황에서 목표로 삼는 값.","m":"10dB 이상 계속 눌리면 악기가 숨을 못 쉬고 뒤에서 헐떡인다.","d":[49]},{"g":"다이내믹","v":"1~2dB","w":"마스터 글루 리덕션","f":"거의 안 들리는 변화지만 곡이 하나로 뭉쳐 들린다.","m":"5dB 이상 누르면 곡 전체가 출렁이고 답답해진다.","d":[55]},{"g":"다이내믹","v":"2~4dB","w":"사이드체인 자리 만들기","f":"무엇이 달라졌는지는 모르겠는데 킥이 또렷하게 들린다. 가장 좋은 상태.","m":"6dB를 넘기면 효과로 들리기 시작한다.","d":[52]},{"g":"다이내믹","v":"3~6dB","w":"디에서 리덕션","f":"치찰음이 튀는 순간에만 눌린다. 다른 발음은 그대로 살아 있다.","m":"10dB 넘게 누르면 발음이 웅얼거리고 답답해진다.","d":[53]},{"g":"다이내믹","v":"2~3dB","w":"리미터 순간 리덕션","f":"가장 큰 지점만 살짝 잡는다. 다이내믹은 유지된 채 음량이 올라간다.","m":"계속 5dB 이상 걸리면 다이내믹이 눌리고 소리가 지친다.","d":[57]},{"g":"연주","v":"40~55","w":"여린 벨로시티","f":"부드럽고 어둡다. 샘플 악기에서는 아예 다른 녹음이 재생되어 음색이 순해진다.","m":"20 아래면 소리가 거의 안 들리거나 이상한 샘플이 나온다.","d":[19]},{"g":"연주","v":"64~80","w":"보통 벨로시티","f":"기준이 되는 세기. 여기를 중심으로 위아래로 흔들어 표정을 만든다.","m":"전부 같은 값이면 기계가 친 것처럼 들린다.","d":[19]},{"g":"연주","v":"95~110","w":"강조 벨로시티","f":"밝고 앞으로 나온다. 프레이즈의 정점이나 박의 첫 음에 쓴다.","m":"남발하면 강조가 강조로 안 들린다.","d":[19]},{"g":"연주","v":"20 이상","w":"프레이즈 내 벨로시티 편차","f":"한 프레이즈 안에서 이만큼 차이가 나면 사람이 연주한 느낌이 든다. 가장 비용 대비 효과가 큰 작업.","m":"편차가 5 이하면 미디 티가 확실히 난다.","d":[19]},{"g":"연주","v":"25~45","w":"고스트 노트 벨로시티","f":"스네어의 아주 약한 타격. 들릴 듯 말 듯하지만 있으면 그루브가 살아난다.","m":"60을 넘으면 정식 타격으로 들려 리듬이 복잡해진다.","d":[26]},{"g":"연주","v":"100%","w":"퀀타이즈 강도","f":"격자에 완전히 붙는다. 정확하지만 생기가 사라지고 기계처럼 들린다.","m":"전자음악의 정확한 패턴에는 오히려 이쪽이 맞다.","d":[20]},{"g":"연주","v":"70~85%","w":"실전 퀀타이즈 강도","f":"박은 맞는데 사람 냄새가 남는다. 대부분의 연주에서 이 범위가 정답이다.","m":"50% 아래면 정리가 덜 되어 흔들리게 들린다.","d":[20]},{"g":"연주","v":"50","w":"스윙 없음","f":"8분음표가 정확히 반반. 록, 팝, 하우스의 기본.","m":"장르에 따라서는 밋밋하게 들린다.","d":[20]},{"g":"연주","v":"54~58","w":"약한 스윙","f":"미묘하게 뒤로 끌린다. 힙합과 알앤비 특유의 느긋한 그루브가 여기서 나온다.","m":"드럼과 다른 악기의 스윙 값이 다르면 서로 어긋나 들린다.","d":[20]},{"g":"연주","v":"58~67","w":"재즈 스윙","f":"확실히 튀는 셋잇단 느낌. 스윙이 곡의 성격을 지배한다.","m":"70을 넘으면 부자연스럽게 절뚝인다.","d":[20]},{"g":"템포","v":"62~76","w":"발라드","f":"한 박이 길어 여백이 생긴다. 가사와 목소리가 주인공이 되는 속도.","m":"85를 넘으면 발라드보다 미디엄 팝에 가까워진다.","d":[16,41]},{"g":"템포","v":"70~92","w":"알앤비","f":"느리지만 16분음표가 촘촘해 몸이 흔들린다. 반박자 개념이 살아 있는 구간.","m":"너무 느리면 늘어지고 빨라지면 그루브가 사라진다.","d":[16,41]},{"g":"템포","v":"100~120","w":"팝","f":"걷는 속도. 가장 많은 사람이 편하게 느끼는 구간.","m":"이 안에서는 5 정도 차이만 나도 곡의 인상이 달라진다.","d":[16,41]},{"g":"템포","v":"122~128","w":"하우스","f":"심장 박동보다 조금 빠르다. 계속 앞으로 미는 느낌이 생긴다.","m":"130을 넘으면 테크노 쪽 성격으로 넘어간다.","d":[16,41]},{"g":"템포","v":"172~176","w":"드럼앤베이스","f":"실제로는 절반 속도로 느껴진다. 빠른 하이햇 위에 느긋한 베이스가 얹힌다.","m":"체감 템포와 실제 값이 다르다는 것을 염두에 둔다.","d":[16]},{"g":"음역","v":"E1~G3","w":"베이스 기타","f":"E1이 가장 낮은 줄. 이 범위 안에서 써야 실제 악기 소리가 난다.","m":"아래로 내려가면 음정이 안 들리고 웅웅거리기만 한다.","d":[27]},{"g":"음역","v":"C2~A4","w":"첼로","f":"사람 목소리와 가장 닮은 음역. 여기서 쓰면 저절로 노래하는 선율이 된다.","m":"위로 올라가면 긴장되고 애절해진다. 아래로 벗어나면 연주가 불가능하다.","d":[30]},{"g":"음역","v":"C3~E5","w":"비올라","f":"바이올린보다 어둡고 두툼하다. 화성의 속을 채우는 자리.","m":"바이올린과 같은 음역에 두면 존재가 사라진다.","d":[30]},{"g":"음역","v":"G3~E6","w":"바이올린","f":"가장 밝고 멀리 나간다. 선율을 맡기면 자연스럽게 앞에 선다.","m":"낮은 쪽에 두면 힘이 없고 비올라와 겹친다.","d":[30]},{"g":"음역","v":"C3 아래","w":"저역 겹침 한계","f":"이 아래에서 두 음 이상을 좁게 쌓으면 탁해진다. 옥타브나 5도로 벌린다.","m":"3도를 쌓으면 진흙탕이 된다.","d":[28,30]},{"g":"음역","v":"6음","w":"기타 최대 동시음","f":"줄이 여섯 개다. 이 안에서 쓰면 실제로 칠 수 있는 코드가 된다.","m":"7음 이상 쌓으면 즉시 가짜 티가 난다.","d":[31]},{"g":"컴퓨터","v":"64~128 샘플","w":"녹음 버퍼","f":"지연이 3ms 안팎이라 연주할 때 어긋남을 못 느낀다.","m":"트랙이 많으면 이 값에서 소리가 끊기기 시작한다.","d":[42,60]},{"g":"컴퓨터","v":"512~1024 샘플","w":"믹스 버퍼","f":"플러그인을 많이 걸어도 안정적이다. 지연은 커지지만 연주하지 않으니 상관없다.","m":"이 상태로 녹음하면 20ms 넘게 늦어 연주가 불가능하다.","d":[42,60]},{"g":"컴퓨터","v":"10ms","w":"체감 지연 한계","f":"이 아래면 대부분 못 느낀다. 넘어가면 손과 소리가 어긋난다고 느끼기 시작한다.","m":"20ms를 넘으면 확실히 연주가 불가능해진다.","d":[60]},{"g":"컴퓨터","v":"48kHz / 24비트","w":"프로젝트 기본 포맷","f":"충분한 품질과 현실적인 용량의 균형점. 영상 작업과도 잘 맞는다.","m":"프로젝트 시작 후 바꾸면 기존 파일이 어긋난다.","d":[42]},{"g":"컴퓨터","v":"10% 이내","w":"오디오 템포 변경 폭","f":"티가 나지 않게 늘리거나 줄일 수 있는 범위.","m":"20%를 넘으면 늘어지거나 떨리는 인공적인 소리가 들린다.","d":[62]},{"g":"컴퓨터","v":"3000×3000px","w":"커버 이미지","f":"모든 서비스의 요구를 만족하는 크기. 나중에 다시 만들 일이 없다.","m":"작게 만들면 반려되거나 확대되어 흐려진다.","d":[59]},{"g":"컴퓨터","v":"⇧R","w":"캡처 녹음","f":"녹음 버튼을 안 눌렀어도 방금 친 연주를 그대로 가져온다. 즉흥에서 나온 좋은 순간을 잃지 않는다.","m":"로직을 재실행하면 기억이 비워지므로 마음에 들었으면 바로 캡처한다.","d":[18]}];

</script>

<script>
"use strict";
/* ─── 저장소: localStorage 우선, 실패 시 메모리 ─── */
var MEM={},HAS_LS=(function(){try{var k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);return true;}catch(e){return false;}})();
var SK="logicTrainer.v1";
function load(){try{if(HAS_LS){var r=localStorage.getItem(SK);return r?JSON.parse(r):null;}return MEM[SK]||null;}catch(e){return null;}}
function save(){try{if(HAS_LS)localStorage.setItem(SK,JSON.stringify(S));else MEM[SK]=JSON.parse(JSON.stringify(S));}catch(e){}}
var S=load()||{cur:1,chk:{},quiz:{},dates:{}};
if(!S.chk)S.chk={};if(!S.quiz)S.quiz={};if(!S.dates)S.dates={};if(!S.cur)S.cur=1;

function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function stamp(){S.dates[today()]=1;save();}
function streak(){
  var n=0,d=new Date();
  function key(x){return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
  if(!S.dates[key(d)]){d.setDate(d.getDate()-1);if(!S.dates[key(d)])return 0;}
  while(S.dates[key(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function dayDone(n){var day=DAYS[n-1];if(!day)return false;var c=S.chk[n]||[];
  for(var i=0;i<day.chk.length;i++)if(!c[i])return false;return true;}
function totalDone(){var n=0;for(var i=1;i<=DAYS.length;i++)if(dayDone(i))n++;return n;}
function firstOpen(){for(var i=1;i<=DAYS.length;i++)if(!dayDone(i))return i;return DAYS.length;}

/* ─── 용어 엔진 ─── */
var GMAP={};for(var gi=0;gi<GLOSS.length;gi++)GMAP[GLOSS[gi][0]]=GLOSS[gi][1];
var TERMS=GLOSS.map(function(g){return g[0];}).filter(function(w){return w.length>=2;})
               .sort(function(a,b){return b.length-a.length;});
function dayText(d){
  var a=[d.t,d.goal].concat(d.con);
  for(var i=0;i<d.path.length;i++)a.push(d.path[i].n+" "+d.path[i].s.join(" "));
  return a.concat(d.drill).concat(d.chk).join(" ");
}
var NEWT=(function(){
  var seen={},out=[];
  for(var i=0;i<DAYS.length;i++){
    var t=dayText(DAYS[i]),list=[];
    for(var j=0;j<TERMS.length;j++){
      var w=TERMS[j],pos=t.indexOf(w);
      if(pos>=0&&!seen[w]){list.push([w,pos]);seen[w]=1;}
    }
    list.sort(function(a,b){return a[1]-b[1];});
    out.push(list.map(function(x){return x[0];}));
  }
  return out;
})();
/* 렌더된 카드 안에서 용어 첫 등장에 표시를 붙인다 */
function markTerms(root,used){
  var skip={K:1,V:1,T:1,BUTTON:1,INPUT:1};
  var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  var nodes=[],n;
  while((n=walker.nextNode()))if(!skip[n.parentNode.nodeName])nodes.push(n);
  for(var i=0;i<nodes.length;i++){
    var node=nodes[i];
    for(var j=0;j<TERMS.length;j++){
      var w=TERMS[j];if(used[w])continue;
      var txt=node.nodeValue,at=txt.indexOf(w);
      if(at<0)continue;
      used[w]=1;
      var after=node.splitText(at),rest=after.splitText(w.length);
      var el=document.createElement("t");el.dataset.w=w;el.textContent=w;
      after.parentNode.replaceChild(el,after);
      node=rest;
    }
  }
}
function openTerm(w){
  document.getElementById("sw").textContent=w;
  document.getElementById("sd").textContent=GMAP[w]||"";
  document.getElementById("sheet").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
function closeTerm(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}
document.getElementById("scrim").addEventListener("click",closeTerm);
document.getElementById("sx").addEventListener("click",closeTerm);
document.addEventListener("click",function(e){
  var t=e.target.closest("t");if(t&&t.dataset.w)openTerm(t.dataset.w);
});

/* ─── 글자 크기 ─── */
function applyFs(){
  document.body.className=S.fs?("fs"+S.fs):"";
  document.getElementById("fsb").textContent=["가","가+","가++"][S.fs||0];
}
document.getElementById("fsb").addEventListener("click",function(){
  S.fs=((S.fs||0)+1)%3;save();applyFs();
});

/* ─── 헤더 ─── */
function header(){
  var done=totalDone(),pct=Math.round(done/DAYS.length*100),day=DAYS[S.cur-1];
  document.getElementById("lDay").textContent=String(S.cur).padStart(2,"0");
  document.getElementById("lPct").textContent=pct+"%";
  document.getElementById("lStk").textContent=streak();
  document.getElementById("lStg").textContent=day.s+"/"+STAGES.length;
  document.getElementById("bar").style.width=pct+"%";
}

/* ─── 오늘 ─── */
function today_(){
  var d=DAYS[S.cur-1],st=STAGES[d.s-1],h="";
  h+='<div class="h1">'+d.d+'일차 · 스테이지 '+st.n+' '+st.t+'</div>';
  h+='<div class="h2">'+d.t+'</div>';
  h+='<div class="goal"><b>오늘의 목표</b><br>'+d.goal+'</div>';

  var nt=NEWT[d.d-1];
  if(nt.length){
    h+='<div class="card"><div class="ct">먼저 알아야 할 말</div>';
    for(var i=0;i<nt.length;i++)
      h+='<div class="tmi"><div class="tmw">'+nt[i]+'</div><div class="tmd">'+GMAP[nt[i]]+'</div></div>';
    h+='</div>';
  }

  h+='<div class="card"><div class="ct">개념</div>';
  for(var i=0;i<d.con.length;i++)h+='<p>'+d.con[i]+'</p>';
  h+='</div>';

  h+='<div class="card"><div class="ct">로직에서 하는 법</div>';
  for(var i=0;i<d.path.length;i++){
    h+='<div class="step"><div class="sn">'+d.path[i].n+'</div><ol>';
    for(var j=0;j<d.path[i].s.length;j++)h+='<li>'+d.path[i].s[j]+'</li>';
    h+='</ol></div>';
  }
  h+='</div>';

  h+='<div class="card"><div class="ct">실습</div><ul class="dot">';
  for(var i=0;i<d.drill.length;i++)h+='<li>'+d.drill[i]+'</li>';
  h+='</ul></div>';

  var nz=NUM.filter(function(x){return x.d.indexOf(d.d)>=0;});
  if(nz.length){
    h+='<div class="card"><div class="ct">이 수치가 내는 느낌</div>';
    for(var i=0;i<nz.length;i++){
      h+='<div class="nitem"><span class="nv">'+nz[i].v+'</span><span class="nw">'+nz[i].w+'</span>';
      h+='<div class="nf">'+nz[i].f+'</div><div class="nm"><b>벗어나면</b> '+nz[i].m+'</div></div>';
    }
    h+='</div>';
  }

  h+='<div class="card"><div class="ct">오늘의 단축키</div><div class="krow">';
  for(var i=0;i<d.keys.length;i++)h+='<div class="kitem"><k>'+d.keys[i][0]+'</k>'+d.keys[i][1]+'</div>';
  h+='</div></div>';

  var c=S.chk[d.d]||[];
  h+='<div class="card"><div class="ct">체크</div>';
  for(var i=0;i<d.chk.length;i++)
    h+='<div class="chk'+(c[i]?' on':'')+'" data-c="'+i+'"><div class="box"></div><span>'+d.chk[i]+'</span></div>';
  h+='</div>';

  var qs=S.quiz[d.d]||{};
  h+='<div class="card"><div class="ct">확인 문제</div>';
  for(var i=0;i<d.quiz.length;i++){
    var q=d.quiz[i],picked=(qs[i]!==undefined)?qs[i]:-1;
    h+='<div class="q" data-q="'+i+'"><div class="qq">'+(i+1)+'. '+q.q+'</div>';
    for(var j=0;j<q.a.length;j++){
      var cls="opt";
      if(picked>=0){ if(j===q.c)cls+=" right"; else if(j===picked)cls+=" wrong"; }
      h+='<button class="'+cls+'" data-a="'+j+'">'+q.a[j]+'</button>';
    }
    h+='<div class="exp'+(picked>=0?' on':'')+'">'+q.e+'</div></div>';
  }
  h+='</div>';

  h+='<div class="nav">';
  h+='<button id="prev"'+(S.cur<=1?' disabled':'')+'>이전 일차</button>';
  h+='<button id="next" class="pri"'+(S.cur>=DAYS.length?' disabled':'')+'>다음 일차</button>';
  h+='</div>';

  var el=document.getElementById("p-today");
  el.innerHTML=h;
  var used={};
  el.querySelectorAll(".card").forEach(function(c){
    if(!c.querySelector(".tmi"))markTerms(c,used);
  });

  el.querySelectorAll(".chk").forEach(function(n){
    n.addEventListener("click",function(){
      var i=+n.dataset.c,a=S.chk[d.d]||[];
      a[i]=!a[i];S.chk[d.d]=a;stamp();save();
      n.classList.toggle("on",!!a[i]);header();course();prog();
    });
  });
  el.querySelectorAll(".q").forEach(function(n){
    n.addEventListener("click",function(e){
      var b=e.target.closest(".opt");if(!b)return;
      var qi=+n.dataset.q,ai=+b.dataset.a;
      if(!S.quiz[d.d])S.quiz[d.d]={};
      if(S.quiz[d.d][qi]!==undefined)return;
      S.quiz[d.d][qi]=ai;stamp();save();
      var q=d.quiz[qi];
      n.querySelectorAll(".opt").forEach(function(o,j){
        if(j===q.c)o.classList.add("right");else if(j===ai)o.classList.add("wrong");
      });
      n.querySelector(".exp").classList.add("on");
    });
  });
  document.getElementById("prev").addEventListener("click",function(){go(S.cur-1);});
  document.getElementById("next").addEventListener("click",function(){go(S.cur+1);});
}
function go(n){
  if(n<1||n>DAYS.length)return;
  S.cur=n;save();today_();header();course();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ─── 과정 ─── */
function course(){
  var h="";
  for(var s=0;s<STAGES.length;s++){
    var st=STAGES[s];
    h+='<div class="sg"><div class="sgh"><span class="sgn">'+String(st.n).padStart(2,"0")+'</span>';
    h+='<span class="sgt">'+st.t+'</span></div><div class="sgs">'+st.sub+'</div><div style="height:8px"></div>';
    for(var i=st.d[0];i<=st.d[1];i++){
      var d=DAYS[i-1],cls="di"+(dayDone(i)?" done":"")+(i===S.cur?" cur":"");
      h+='<div class="'+cls+'" data-d="'+i+'"><div class="dn">'+i+'</div><div class="dt">'+d.t+'</div></div>';
    }
    h+='</div>';
  }
  var el=document.getElementById("p-course");
  el.innerHTML=h;
  el.querySelectorAll(".di").forEach(function(n){
    n.addEventListener("click",function(){go(+n.dataset.d);tab("today");});
  });
}

/* ─── 단축키 ─── */
function keys(){
  var el=document.getElementById("p-keys");
  el.innerHTML='<input class="srch" id="ks" placeholder="단축키나 기능으로 검색" autocomplete="off"><div id="kl"></div>';
  function draw(q){
    q=(q||"").trim().toLowerCase();var h="";
    for(var i=0;i<KEYS.length;i++){
      var g=KEYS[i],rows=g.k.filter(function(r){
        return !q||r[0].toLowerCase().indexOf(q)>=0||r[1].toLowerCase().indexOf(q)>=0;});
      if(!rows.length)continue;
      h+='<div class="card"><div class="ct">'+g.g+'</div>';
      for(var j=0;j<rows.length;j++)h+='<div class="grow"><k>'+rows[j][0]+'</k><span>'+rows[j][1]+'</span></div>';
      h+='</div>';
    }
    document.getElementById("kl").innerHTML=h||'<div class="empty">일치하는 단축키가 없습니다.</div>';
  }
  draw("");
  document.getElementById("ks").addEventListener("input",function(e){draw(e.target.value);});
}

/* ─── 사전 ─── */
function gloss(){
  var el=document.getElementById("p-gloss");
  el.innerHTML='<input class="srch" id="gs" placeholder="용어 검색" autocomplete="off"><div id="gl"></div>';
  function draw(q){
    q=(q||"").trim().toLowerCase();
    var rows=GLOSS.filter(function(r){
      return !q||r[0].toLowerCase().indexOf(q)>=0||r[1].toLowerCase().indexOf(q)>=0;});
    if(!rows.length){document.getElementById("gl").innerHTML='<div class="empty">일치하는 용어가 없습니다.</div>';return;}
    var h='<div class="card">';
    for(var i=0;i<rows.length;i++)
      h+='<div class="gitem"><div class="gl">'+rows[i][0]+'</div><div class="gd">'+rows[i][1]+'</div></div>';
    h+='</div>';
    document.getElementById("gl").innerHTML=h;
  }
  draw("");
  document.getElementById("gs").addEventListener("input",function(e){draw(e.target.value);});
}

/* ─── 수치 감각 ─── */
var NG=["전체"].concat(NUM.map(function(n){return n.g;}).filter(function(v,i,a){return a.indexOf(v)===i;}));
var ngCur="전체";
function num(){
  var el=document.getElementById("p-num");
  var t='<input class="srch" id="ns" placeholder="값이나 이름으로 검색 (예: 80Hz, 어택, 스윙)" autocomplete="off">';
  t+='<div class="tagr" id="ntag">';
  for(var i=0;i<NG.length;i++)t+='<button class="tag'+(NG[i]===ngCur?" on":"")+'" data-g="'+NG[i]+'">'+NG[i]+'</button>';
  t+='</div><div id="nl"></div>';
  el.innerHTML=t;
  function draw(){
    var q=(document.getElementById("ns").value||"").trim().toLowerCase();
    var rows=NUM.filter(function(n){
      if(ngCur!=="전체"&&n.g!==ngCur)return false;
      if(!q)return true;
      return (n.v+" "+n.w+" "+n.f+" "+n.m).toLowerCase().indexOf(q)>=0;
    });
    if(!rows.length){document.getElementById("nl").innerHTML='<div class="empty">일치하는 수치가 없습니다.</div>';return;}
    var h='<div class="card">';
    for(var i=0;i<rows.length;i++){
      h+='<div class="nitem"><span class="nv">'+rows[i].v+'</span><span class="nw">'+rows[i].w+'</span>';
      h+='<div class="nf">'+rows[i].f+'</div><div class="nm"><b>벗어나면</b> '+rows[i].m+'</div></div>';
    }
    h+='</div>';
    document.getElementById("nl").innerHTML=h;
  }
  draw();
  document.getElementById("ns").addEventListener("input",draw);
  document.getElementById("ntag").addEventListener("click",function(e){
    var b=e.target.closest(".tag");if(!b)return;
    ngCur=b.dataset.g;
    el.querySelectorAll(".tag").forEach(function(x){x.classList.toggle("on",x.dataset.g===ngCur);});
    draw();
  });
}

/* ─── 진도: 채널 스트립 랙 ─── */
function prog(){
  var h='<div class="stat">';
  h+='<div><div class="n">'+totalDone()+'</div><div class="l">완료 일차</div></div>';
  h+='<div><div class="n">'+(DAYS.length-totalDone())+'</div><div class="l">남은 일차</div></div>';
  h+='<div><div class="n">'+streak()+'</div><div class="l">연속 학습일</div></div>';
  h+='</div>';

  h+='<div class="rack">';
  for(var s=0;s<STAGES.length;s++){
    var st=STAGES[s],tot=st.d[1]-st.d[0]+1,dn=0;
    for(var i=st.d[0];i<=st.d[1];i++)if(dayDone(i))dn++;
    var p=Math.round(dn/tot*100),full=(p===100);
    h+='<div class="strip'+(full?" full":"")+'">';
    h+='<div class="pct">'+p+'</div>';
    h+='<div class="slot"><div class="fill" style="height:'+p+'%"></div>';
    h+='<div class="cap" style="bottom:calc('+p+'% - '+(p*0.13)+'px)"></div></div>';
    h+='<div class="sno">'+st.n+'</div>';
    h+='<div class="sl">'+st.t+'</div>';
    h+='</div>';
  }
  h+='</div>';

  var qt=0,qc=0;
  for(var i=1;i<=DAYS.length;i++){
    var qs=S.quiz[i]||{},d=DAYS[i-1];
    for(var j in qs){qt++;if(+qs[j]===d.quiz[j].c)qc++;}
  }
  h+='<div class="card"><div class="ct">확인 문제</div>';
  h+='<p>푼 문제 <v>'+qt+'</v> / 전체 <v>'+DAYS.reduce(function(a,d){return a+d.quiz.length;},0)+'</v></p>';
  h+='<p>정답 <v>'+qc+'</v>'+(qt?' · 정답률 <v>'+Math.round(qc/qt*100)+'%</v>':'')+'</p></div>';

  h+='<div class="mini">진도는 이 기기에만 저장됩니다.<br><button class="rst" id="rst">진도 초기화</button></div>';

  var el=document.getElementById("p-prog");
  el.innerHTML=h;
  document.getElementById("rst").addEventListener("click",function(){
    if(!confirm("모든 진도와 문제 기록을 지웁니다. 계속할까요?"))return;
    S={cur:1,chk:{},quiz:{},dates:{}};save();today_();course();prog();header();
  });
}

/* ─── 탭 ─── */
function tab(name){
  document.querySelectorAll(".pane").forEach(function(p){p.classList.toggle("on",p.id==="p-"+name);});
  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.p===name);});
  if(name==="prog")prog();
  window.scrollTo({top:0,behavior:"instant"});
}
document.getElementById("tabs").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;tab(b.dataset.p);
});

/* ─── 시작 ─── */
if(!S.chk[S.cur]&&totalDone()>0)S.cur=firstOpen();
applyFs();today_();course();keys();gloss();num();prog();header();
</script>
</body>
</html>
